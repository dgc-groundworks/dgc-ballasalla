name: Pull IoM Planning Register

on:
  # Automatic — keeps the data reasonably fresh without anyone touching
  # anything. Mondays at 7am Isle of Man time, summer and winter: GitHub
  # only knows UTC, so both times are scheduled and the "when" job below
  # lets through whichever one is 7am on the Island that day.
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 7 * * 1'
  # Manual — this is the "click it whenever" button: go to this repo's
  # Actions tab → "Pull IoM Planning Register" → Run workflow.
  workflow_dispatch:
    inputs:
      months:
        description: 'How many recent months to pull (1-6)'
        required: false
        default: '3'
      pricing_only:
        description: 'Only price applications (skip the slow register pull)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # +0100 in summer time, +0000 in winter.
          if [ "$(TZ=Europe/London date +%z)" = "+0100" ]; then want='0 6 * * 1'; else want='0 7 * * 1'; fi
          if [ "${{ github.event.schedule }}" = "$want" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

  pull:
    needs: when
    if: ${{ needs.when.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    # Once the SUPABASE_SERVICE_KEY secret is added, the data is kept in the
    # private Supabase file store instead of being committed to this public repo.
    env:
      SUPABASE_URL: https://vigdtpcgeqenznuakdwz.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr
          pip install requests beautifulsoup4 anthropic pymupdf pytesseract pillow

      - name: Fetch current data from the private store
        if: ${{ env.SUPABASE_SERVICE_KEY != '' }}
        run: python3 silverdale-canvassing/scripts/sync_storage.py download

      - name: Pull register
        if: ${{ github.event.inputs.pricing_only != 'true' }}
        run: |
          if [ -f silverdale-canvassing/register-data/latest.json ]; then
            cp silverdale-canvassing/register-data/latest.json silverdale-canvassing/register-data/latest.previous.json
          fi
          python3 silverdale-canvassing/scripts/pull_register.py \
            --months "${{ github.event.inputs.months || '3' }}" \
            --out silverdale-canvassing/register-data/latest.json

      # The pull only covers the last few months; this keeps every earlier
      # application on the list until Ash has decided what to do with it.
      - name: Keep earlier applications on the list
        if: ${{ github.event.inputs.pricing_only != 'true' }}
        working-directory: silverdale-canvassing/scripts
        run: python3 merge_register.py ../register-data/latest.previous.json ../register-data/latest.json

      - name: Update decision-time history, forecasts and accuracy
        if: ${{ github.event.inputs.pricing_only != 'true' }}
        run: python3 silverdale-canvassing/scripts/planning_history.py --update silverdale-canvassing/register-data/latest.json

      # Only does anything once an ANTHROPIC_API_KEY repository secret exists.
      - name: Claude reads new applications (type, complexity, homes)
        if: ${{ github.event.inputs.pricing_only != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 silverdale-canvassing/scripts/ai_classify.py --max 150

      # Prices applications for the Market tab (value range, grade, sources).
      # Only runs once ANTHROPIC_API_KEY exists and the prompt and rate book
      # have been saved in the app. --max keeps each run's cost in check.
      - name: Claude estimates job values
        if: ${{ env.SUPABASE_SERVICE_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 silverdale-canvassing/scripts/estimate_values.py --max 40

      - name: Save to the private store
        if: ${{ env.SUPABASE_SERVICE_KEY != '' }}
        run: python3 silverdale-canvassing/scripts/sync_storage.py upload

      # Old behaviour, only used until the secret exists.
      - name: Commit result
        if: ${{ env.SUPABASE_SERVICE_KEY == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add silverdale-canvassing/register-data/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Pull planning register data ($(date -u +%Y-%m-%d))"
            git push
          fi
