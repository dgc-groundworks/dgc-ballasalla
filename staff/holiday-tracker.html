<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holiday Tracker</title>
<script src="../planner/theme.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<style>
:root {
  --bg:#0f1117;--surf:#1a1d27;--surf2:#222636;--bord:#2e3347;
  --accent:#f59e0b;--text:#e2e8f0;--muted:#64748b;
  --green:#22c55e;--red:#ef4444;--blue:#3b82f6;--amber:#f97316;
}
[data-theme="light"] {
  --bg:#f0f4f8;--surf:#ffffff;--surf2:#e4ecf4;--bord:#b8ccd8;
  --accent:#e08a00;--text:#1a2b3c;--muted:#5c7a94;
  --green:#16a34a;--red:#dc2626;--blue:#2563eb;--amber:#ea580c;
}
[data-theme="light"] .topbar{background:#1b2a3b;border-bottom-color:#0d1a26}
[data-theme="light"] .topbar h1{color:#f59e0b}
[data-theme="light"] .back-btn{color:#8ab0cc;border-color:rgba(255,255,255,.2)}
[data-theme="light"] .back-btn:hover{color:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}

.topbar{background:#1b2a3b;border-bottom:1px solid #0d1a26;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.topbar h1{font-size:1rem;font-weight:700;color:var(--accent);flex:1}
.back-btn{background:none;border:1px solid rgba(255,255,255,.2);color:#8ab0cc;padding:5px 12px;border-radius:6px;font-size:0.8rem;cursor:pointer;font-family:inherit}
.back-btn:hover{color:#ffffff}

.content{max-width:800px;margin:0 auto;padding:20px 16px}
.section-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:10px;font-weight:700}

/* Leave list */
.leave-list{background:var(--surf);border:1px solid var(--bord);border-radius:10px;overflow:hidden}
.leave-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--bord)}
.leave-row:last-child{border-bottom:none}
.leave-row--past{opacity:.5}
.lv-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.lv-info{flex:1;min-width:0}
.lv-name{font-weight:700;font-size:0.95rem;margin-bottom:2px}
.lv-dates{font-size:0.82rem;color:var(--muted)}
.lv-days{font-size:0.85rem;font-weight:700;white-space:nowrap;padding:3px 8px;border-radius:5px;background:var(--surf2);color:var(--text)}
.lv-type-paid{font-size:0.75rem;font-weight:700;color:var(--green);white-space:nowrap}
.lv-type-unpaid{font-size:0.75rem;font-weight:700;color:var(--amber);white-space:nowrap}
.lv-del{background:none;border:1px solid var(--bord);color:var(--muted);font-size:16px;cursor:pointer;padding:2px 8px;line-height:1;border-radius:5px;flex-shrink:0}
.lv-del:hover{color:var(--red);border-color:var(--red)}
.lv-current{background:rgba(34,197,94,.06);border-left:3px solid var(--green)}

/* Balance chips (compact) */
.bal-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bord);font-size:0.85rem}
.bal-row:last-child{border-bottom:none}
.bal-name{flex:1;font-weight:600}
.bal-chip{padding:2px 8px;border-radius:4px;font-size:0.75rem;font-weight:700;white-space:nowrap}
.bal-ok{background:rgba(34,197,94,.15);color:var(--green)}
.bal-low{background:rgba(249,115,22,.15);color:var(--amber)}
.bal-neg{background:rgba(239,68,68,.15);color:var(--red)}
.bal-na{color:var(--muted);font-size:0.75rem;font-style:italic}

/* Book form */
.book-box{background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:16px}
.book-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:12px}
.book-row label{font-size:0.72rem;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.book-row select,.book-row input[type=date]{background:var(--surf2);border:1px solid var(--bord);color:var(--text);padding:8px 10px;border-radius:6px;font-size:0.85rem;font-family:inherit;min-width:0}
.book-row select:focus,.book-row input[type=date]:focus{outline:none;border-color:var(--accent)}
.book-preview{background:var(--surf2);border-radius:7px;padding:10px 14px;margin-bottom:12px;font-size:0.85rem;display:none}
.book-preview.show{display:block}
.split-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:0.85rem}
.split-row input[type=range]{flex:1;accent-color:var(--accent)}
.split-row input[type=number]{width:50px;background:var(--surf2);border:1px solid var(--bord);color:var(--text);padding:4px 6px;border-radius:5px;font-size:0.85rem;font-family:inherit;text-align:center}
.primary-btn{background:var(--accent);color:#000;border:none;padding:8px 18px;border-radius:6px;font-weight:700;font-size:0.85rem;cursor:pointer;font-family:inherit}
.primary-btn:disabled{opacity:.35;cursor:default}
.form-status{font-size:0.8rem;margin-top:8px;min-height:1em}
.form-status.ok{color:var(--green)}.form-status.err{color:var(--red)}
.loading{color:var(--muted);padding:24px;text-align:center}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<header class="topbar">
  <h1>Holidays — <span id="yearLabel"></span></h1>
  <button class="back-btn" onclick="history.back()">Back</button>
</header>
<div class="content" id="content">
  <p class="loading" id="loadMsg">Loading…</p>
</div>

<script>
const REST = SUPABASE_URL + '/rest/v1';
let session = null;
let _staff = [], _leave = [];

const IOM_BH = new Set([
  '2025-01-01','2025-04-18','2025-04-21','2025-05-05','2025-05-26','2025-06-06',
  '2025-07-07','2025-08-25','2025-12-25','2025-12-26',
  '2026-01-01','2026-04-03','2026-04-06','2026-05-04','2026-05-25','2026-06-12',
  '2026-07-06','2026-08-31','2026-12-25','2026-12-28',
  '2027-01-01','2027-03-26','2027-03-29','2027-05-03','2027-05-31',
  '2027-07-05','2027-08-30','2027-12-27','2027-12-28',
]);

const FORCED = {
  2026: ['2026-06-08','2026-06-09','2026-06-10','2026-06-11','2026-12-29','2026-12-30','2026-12-31'],
};

const ENTITLEMENT = 22;
const PALETTE = ['#f59e0b','#3b82f6','#22c55e','#ef4444','#a855f7','#06b6d4','#f97316','#ec4899','#84cc16','#14b8a6','#fb923c','#8b5cf6'];

function staffColor(id) {
  let h = 0;
  for (let i = 0; i < (id||'').length; i++) h = (h * 31 + (id||'').charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function initials(name) {
  const p = (name||'').split(' ').filter(Boolean);
  return p.length === 1 ? p[0].slice(0,2).toUpperCase() : (p[0][0]+p[p.length-1][0]).toUpperCase();
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function isWD(ds) { const d = new Date(ds+'T12:00:00'); return d.getDay()!==0&&d.getDay()!==6&&!IOM_BH.has(ds); }
function wdRange(a, b) {
  let n=0, d=new Date(a+'T12:00:00'), e=new Date(b+'T12:00:00');
  while(d<=e){if(isWD(d.toISOString().slice(0,10)))n++;d.setDate(d.getDate()+1);}
  return n;
}
function leaveWD(l, year) {
  const f = l.from_date < `${year}-01-01` ? `${year}-01-01` : l.from_date;
  const t = l.to_date   > `${year}-12-31` ? `${year}-12-31` : l.to_date;
  return f > t ? 0 : wdRange(f, t);
}
function accrued(startDate, targetDate) {
  if (!startDate) return null;
  const sy = parseInt(startDate.slice(0,4));
  const ty = parseInt(targetDate.slice(0,4));
  if (sy > ty) return 0;
  const yearStart = sy < ty ? `${ty}-01-01` : startDate;
  const ent = sy < ty ? ENTITLEMENT : Math.ceil(ENTITLEMENT * wdRange(startDate, `${ty}-12-31`) / wdRange(`${ty}-01-01`, `${ty}-12-31`) * 2) / 2;
  const wdSoFar = wdRange(yearStart, targetDate);
  const wdFull  = wdRange(yearStart, `${ty}-12-31`);
  return Math.min(Math.round(ent * wdSoFar / wdFull * 10) / 10, ent);
}
function forcedPassed(startDate, asOf, year) {
  return (FORCED[year]||[]).filter(d => d <= asOf && d >= (startDate||'0000')).length;
}
function forcedUpcoming(startDate, asOf, year) {
  return (FORCED[year]||[]).filter(d => d > asOf && d >= (startDate||'0000')).length;
}
function holidaysTaken(staffId, year) {
  return _leave.filter(l => l.staff_id === staffId && l.leave_type === 'Holiday').reduce((s,l) => s + leaveWD(l, year), 0);
}

function fmtDate(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
}
function fmtRange(from, to) {
  if (from === to) return fmtDate(from);
  return fmtDate(from) + ' – ' + fmtDate(to);
}

function renderAll() {
  const today = new Date().toISOString().slice(0,10);
  const year  = parseInt(today.slice(0,4));
  document.getElementById('yearLabel').textContent = year;

  const active = _staff.filter(s => s.active);

  // Enrich leave records with staff name and working day count
  const enriched = _leave.map(l => {
    const s = _staff.find(x => x.id === l.staff_id);
    return { ...l, staffName: s?.name || 'Unknown', wdays: wdRange(l.from_date, l.to_date) };
  }).sort((a, b) => a.from_date.localeCompare(b.from_date));

  const upcoming = enriched.filter(l => l.to_date >= today);
  const past     = enriched.filter(l => l.to_date < today && l.from_date >= `${year}-01-01`);

  function leaveRow(l, showDel) {
    const color = staffColor(l.staff_id);
    const isCurrent = l.from_date <= today && l.to_date >= today;
    const typeCls = l.leave_type === 'Holiday' ? 'lv-type-paid' : 'lv-type-unpaid';
    const typeLabel = l.leave_type === 'Holiday' ? 'Paid' : 'Unpaid';
    return `<div class="leave-row${isCurrent ? ' lv-current' : ''}">
      <span class="lv-avatar" style="background:${color}">${esc(initials(l.staffName))}</span>
      <div class="lv-info">
        <div class="lv-name">${esc(l.staffName)}</div>
        <div class="lv-dates">${fmtRange(l.from_date, l.to_date)}</div>
      </div>
      <span class="lv-days">${l.wdays}d</span>
      <span class="${typeCls}">${typeLabel}</span>
      ${showDel ? `<button class="lv-del" data-leaveid="${l.id}" title="Delete">×</button>` : ''}
    </div>`;
  }

  // Balance section (compact)
  const balRows = active.map(s => {
    const acc = accrued(s.start_date, today);
    if (acc === null) {
      return `<div class="bal-row"><span class="bal-name">${esc(s.name)}</span><span class="bal-na">No start date</span></div>`;
    }
    const taken  = holidaysTaken(s.id, year);
    const fp     = forcedPassed(s.start_date, today, year);
    const fup    = forcedUpcoming(s.start_date, today, year);
    const remain = Math.round((acc - taken - fp - fup) * 10) / 10;
    const cls    = remain <= 0 ? 'bal-neg' : remain <= 3 ? 'bal-low' : 'bal-ok';
    const label  = remain <= 0 ? `${remain}d left` : `${remain}d left`;
    return `<div class="bal-row">
      <span class="lv-avatar" style="background:${staffColor(s.id)};width:28px;height:28px;font-size:10px;flex-shrink:0">${esc(initials(s.name))}</span>
      <span class="bal-name">${esc(s.name)}</span>
      <span class="bal-chip ${cls}">${label}</span>
    </div>`;
  }).join('');

  const staffOpts = active.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');

  document.getElementById('content').innerHTML = `

    <div class="section-label">Upcoming Leave</div>
    <div class="leave-list" style="margin-bottom:24px">
      ${upcoming.length
        ? upcoming.map(l => leaveRow(l, true)).join('')
        : '<div style="padding:20px 16px;color:var(--muted)">No leave booked.</div>'}
    </div>

    <div class="section-label">Book Holiday</div>
    <div class="book-box" style="margin-bottom:24px">
      <div class="book-row">
        <div>
          <label>Staff member</label>
          <select id="bkStaff"><option value="">Select…</option>${staffOpts}</select>
        </div>
        <div>
          <label>From</label>
          <input type="date" id="bkFrom">
        </div>
        <div>
          <label>To</label>
          <input type="date" id="bkTo">
        </div>
      </div>
      <div class="book-preview" id="bkPreview"></div>
      <div class="split-row" id="bkSplitRow" style="display:none">
        <span>Paid days:</span>
        <input type="number" id="bkPaidDays" min="0" value="0">
        <input type="range" id="bkPaidSlider" min="0" value="0">
        <span id="bkUnpaidLabel" style="color:var(--muted)"></span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="primary-btn" id="bkSavePaid" disabled>Book paid holiday</button>
        <button class="primary-btn" id="bkSaveSplit" disabled style="background:var(--surf2);color:var(--text);border:1px solid var(--bord)">Book split (paid + unpaid)</button>
      </div>
      <p class="form-status" id="bkStatus"></p>
    </div>

    <details>
      <summary style="cursor:pointer;margin-bottom:12px">
        <span class="section-label" style="display:inline">Holiday Balance — ${year}</span>
        <span style="font-size:0.75rem;color:var(--muted);margin-left:8px">click to expand</span>
      </summary>
      <div class="leave-list" style="margin-bottom:24px">${balRows}</div>
    </details>

    ${past.length ? `
    <details style="margin-top:16px">
      <summary style="cursor:pointer;margin-bottom:12px">
        <span class="section-label" style="display:inline">Past Leave — ${year}</span>
        <span style="font-size:0.75rem;color:var(--muted);margin-left:8px">${past.length} records</span>
      </summary>
      <div class="leave-list">${past.map(l => leaveRow(l, false)).join('')}</div>
    </details>` : ''}
  `;

  wireBookingForm(year);
  wireDeleteButtons();
}

function wireDeleteButtons() {
  document.querySelectorAll('.lv-del').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Remove this holiday booking?')) return;
      btn.disabled = true;
      const id = btn.dataset.leaveid;
      const ah = authedHeaders(session);
      try {
        const r = await fetch(REST + '/dgc_staff_leave?id=eq.' + id, { method: 'DELETE', headers: ah });
        if (!r.ok) throw new Error(await r.text());
        _leave = _leave.filter(l => String(l.id) !== String(id));
        renderAll();
      } catch(e) {
        alert('Error: ' + e.message);
        btn.disabled = false;
      }
    });
  });
}

function wireBookingForm(year) {
  const staffSel = document.getElementById('bkStaff');
  const fromEl   = document.getElementById('bkFrom');
  const toEl     = document.getElementById('bkTo');
  const preview  = document.getElementById('bkPreview');
  const splitRow = document.getElementById('bkSplitRow');
  const slider   = document.getElementById('bkPaidSlider');
  const paidNum  = document.getElementById('bkPaidDays');
  const unpaidLbl= document.getElementById('bkUnpaidLabel');
  const btnPaid  = document.getElementById('bkSavePaid');
  const btnSplit = document.getElementById('bkSaveSplit');
  const status   = document.getElementById('bkStatus');
  let bkDays = 0;

  function updatePreview() {
    const sid = staffSel.value, f = fromEl.value, t = toEl.value;
    if (!sid || !f || !t || f > t) { preview.classList.remove('show'); btnPaid.disabled=btnSplit.disabled=true; splitRow.style.display='none'; return; }
    const staff = _staff.find(s => String(s.id) === sid);
    const today = new Date().toISOString().slice(0,10);
    bkDays = wdRange(f, t);
    const checkDate = f > today ? f : today;
    const acc = accrued(staff?.start_date, checkDate) ?? 0;
    const taken = holidaysTaken(sid, year);
    const fp = forcedPassed(staff?.start_date, checkDate, year);
    const fup = forcedUpcoming(staff?.start_date, checkDate, year);
    const remaining = Math.round((acc - taken - fp - fup) * 10) / 10;
    const canAfford = remaining >= bkDays;
    let html = `<strong>${bkDays}</strong> working day${bkDays!==1?'s':''} selected. `;
    if (!staff?.start_date) html += '<span style="color:var(--amber)">No start date — balance unknown.</span>';
    else if (canAfford) html += `<strong style="color:var(--green)">${remaining}</strong> days remaining — can book all as paid.`;
    else if (remaining > 0) html += `Only <strong style="color:var(--amber)">${remaining}</strong> paid day${remaining!==1?'s':''} remaining — <strong>${bkDays - remaining}</strong> would be unpaid.`;
    else html += `<strong style="color:var(--red)">No paid days left</strong> — all ${bkDays} would be unpaid.`;
    preview.innerHTML = html;
    preview.classList.add('show');
    const maxPaid = Math.min(bkDays, Math.max(0, remaining));
    slider.max=bkDays; slider.min=0; slider.value=maxPaid;
    paidNum.max=bkDays; paidNum.min=0; paidNum.value=maxPaid;
    updateUnpaidLabel();
    splitRow.style.display = bkDays > 1 ? 'flex' : 'none';
    btnPaid.disabled = bkDays === 0;
    btnSplit.disabled = bkDays < 2;
  }
  function updateUnpaidLabel() { unpaidLbl.textContent = `+ ${bkDays - (parseInt(paidNum.value)||0)} unpaid`; }
  slider.addEventListener('input', () => { paidNum.value=slider.value; updateUnpaidLabel(); });
  paidNum.addEventListener('input', () => { slider.value=paidNum.value; updateUnpaidLabel(); });
  [staffSel,fromEl,toEl].forEach(el => el.addEventListener('change', updatePreview));

  async function save(paidDays, unpaidDays) {
    const sid=staffSel.value, f=fromEl.value, t=toEl.value;
    if (!sid||!f||!t) return;
    status.textContent='Saving…'; status.className='form-status';
    btnPaid.disabled=btnSplit.disabled=true;
    const ah = authedHeaders(session);
    try {
      const records = [];
      if (paidDays > 0)   records.push({ staff_id:sid, leave_type:'Holiday',      from_date:f, to_date:t, notes: paidDays < bkDays ? `${paidDays} paid days of ${bkDays} total` : '' });
      if (unpaidDays > 0) records.push({ staff_id:sid, leave_type:'Unpaid Leave', from_date:f, to_date:t, notes:`${unpaidDays} unpaid days of ${bkDays} total` });
      for (const rec of records) {
        const r = await fetch(REST + '/dgc_staff_leave', { method:'POST', headers:{...ah,'Content-Type':'application/json','Prefer':'return=minimal'}, body:JSON.stringify(rec) });
        if (!r.ok) throw new Error(await r.text());
      }
      const lR = await fetch(REST + '/dgc_staff_leave?order=from_date.asc', { headers: ah });
      _leave = lR.ok ? await lR.json() : _leave;
      status.textContent='Booked.'; status.className='form-status ok';
      fromEl.value=toEl.value=''; staffSel.value='';
      preview.classList.remove('show'); splitRow.style.display='none';
      renderAll();
    } catch(e) {
      status.textContent='Error: '+e.message; status.className='form-status err';
      btnPaid.disabled=btnSplit.disabled=false;
    }
  }
  btnPaid.addEventListener('click', () => save(bkDays, 0));
  btnSplit.addEventListener('click', () => { const p=Math.min(bkDays,Math.max(0,parseInt(paidNum.value)||0)); save(p, bkDays-p); });
}

(async () => {
  session = await ensureLoggedIn();
  if (!session) { window.location.replace('./'); return; }
  const ah = authedHeaders(session);
  try {
    const [sR, lR] = await Promise.all([
      fetch(REST + '/dgc_staff?order=name.asc', { headers: ah }),
      fetch(REST + '/dgc_staff_leave?order=from_date.asc', { headers: ah }),
    ]);
    _staff = sR.ok ? await sR.json() : [];
    _leave = lR.ok ? await lR.json() : [];
    renderAll();
  } catch(e) {
    document.getElementById('loadMsg').textContent = 'Error: ' + e.message;
  }
})();
</script>
</body>
</html>
