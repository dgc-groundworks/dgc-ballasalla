<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dayworks — Client View (PREVIEW)</title>
<script src="../staff/config.js"></script>
<style>
:root{--bg:#f4f6f9;--surf:#fff;--surf2:#eef2f7;--bord:#d6dfe8;--accent:#1a2a3f;--text:#1a2b3c;--muted:#64748b;--green:#16a34a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}
.preview-banner{background:#7c2d12;color:#fff;font-size:0.78rem;font-weight:700;text-align:center;padding:8px 16px}
.topbar{background:var(--accent);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:1.1rem;font-weight:800}
.topbar .sub{font-size:0.78rem;opacity:.75;margin-left:auto}
.main{padding:24px;max-width:1000px;margin:0 auto}
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:18px;font-size:0.85rem;color:var(--muted)}
.crumb button{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;font-family:inherit;font-size:0.85rem;padding:0}
.crumb .sep{color:var(--muted)}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted)}
.job-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.job-card{background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:18px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.job-card:hover{border-color:var(--accent)}
.job-card .jc-name{font-weight:800;font-size:1.05rem}
.job-card .jc-meta{font-size:0.8rem;color:var(--muted);margin-top:6px}
.name-list{display:flex;flex-direction:column;gap:8px;background:var(--surf);border:1px solid var(--bord);border-radius:10px;overflow:hidden}
.name-row{padding:14px 18px;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid var(--bord)}
.name-row:last-child{border-bottom:none}
.name-row:hover{background:var(--surf2)}
.name-row .nr-name{font-weight:700;flex:1}
.name-row .nr-hours{color:var(--accent);font-weight:800}
.name-row .nr-arrow{color:var(--muted)}
.list-total{padding:16px 18px;background:var(--accent);color:#fff;font-weight:800;display:flex;justify-content:space-between;border-radius:0 0 10px 10px}
.week-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.week-nav button{background:var(--surf);border:1px solid var(--bord);border-radius:7px;color:var(--text);padding:7px 14px;cursor:pointer;font-family:inherit;font-weight:700}
.week-nav button:disabled{opacity:.35;cursor:default}
.week-nav .wn-label{font-weight:800;flex:1;text-align:center}
.week-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:800px){.week-grid{grid-template-columns:1fr}}
.week-photos img{width:100%;border-radius:8px;border:1px solid var(--bord)}
.hrs-table{width:100%;border-collapse:collapse;background:var(--surf);border:1px solid var(--bord);border-radius:8px;overflow:hidden}
.hrs-table th,.hrs-table td{padding:9px 12px;text-align:left;font-size:0.85rem;border-bottom:1px solid var(--bord)}
.hrs-table th{background:var(--surf2);font-size:0.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.hrs-table tr:last-child td{border-bottom:none}
.running-total{margin-top:12px;text-align:right;font-weight:800;color:var(--accent)}
</style>
</head>
<body>
<div class="preview-banner">PREVIEW ONLY — for Ash to review. Not yet the isolated client deployment (own repo/database) the build spec calls for before this goes to Dandara for real.</div>
<header class="topbar">
  <h1>Dayworks — Hours &amp; Evidence</h1>
  <span class="sub">Drainage &amp; Groundwork Contractors Ltd</span>
</header>
<main class="main" id="mainArea"><p class="empty-state">Loading…</p></main>

<script>
// Read-only client-facing preview per Phase 2 of the Dayworks spec:
// Job -> staff (name + total hours) -> click name -> Week1/Week2 nav
// with hours table + photo evidence + running total; bottom of the
// staff list shows total hours across everyone for that job.
// Shows only confirmed, non-flagged entries — a client should never
// see an internal draft/unchecked row.
const REST = SUPABASE_URL + '/rest/v1/dgc_dayworks_entries';
const STORAGE_PUBLIC = SUPABASE_URL + '/storage/v1/object/public/dayworks-timesheets/';
function sbHeaders(){ return { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(iso){ return iso ? iso.split('-').reverse().join('/') : '—'; }
function getMonday(iso){ const d=new Date(iso+'T12:00:00'); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.toISOString().slice(0,10); }
function baseJob(site){ const s=(site||'').trim(); if(!s) return '(No job set)'; if(/ballasalla/i.test(s)) return 'Ballasalla'; if(/quay west/i.test(s)) return 'Quay West'; return s; }

let entries = [];
let state = { job: null, name: null, weekIndex: 0 };

function rowToEntry(r){
  return {
    image: STORAGE_PUBLIC + encodeURIComponent(r.image_path),
    name: r.staff_name || '', date: r.work_date || '', site: r.site || '',
    start: r.start_time || '', finish: r.finish_time || '',
    hours: r.hours == null ? null : Number(r.hours),
    confirmed: !!r.confirmed, flagged: !!r.flagged
  };
}
function clientReady(){ return entries.filter(e => e.confirmed && !e.flagged && e.date); }

function render(){
  const main = document.getElementById('mainArea');
  if (!state.job) return renderJobs(main);
  if (!state.name) return renderNames(main);
  renderWeeks(main);
}
function renderJobs(main){
  const pool = clientReady();
  const byJob = {};
  pool.forEach(e => (byJob[baseJob(e.site)] = byJob[baseJob(e.site)] || []).push(e));
  const jobs = Object.keys(byJob).sort();
  if (!jobs.length){ main.innerHTML = '<p class="empty-state">No confirmed hours to show yet.</p>'; return; }
  main.innerHTML = '<div class="job-grid">' + jobs.map(j => {
    const rows = byJob[j];
    const hrs = rows.reduce((s,r)=>s+(r.hours||0),0);
    const people = new Set(rows.map(r=>r.name)).size;
    return `<div class="job-card" data-job="${esc(j)}"><div class="jc-name">${esc(j)}</div><div class="jc-meta">${people} ${people===1?'person':'people'} &middot; ${hrs} hours total</div></div>`;
  }).join('') + '</div>';
  main.querySelectorAll('.job-card').forEach(c => c.addEventListener('click', () => { state.job = c.dataset.job; render(); }));
}
function renderNames(main){
  const rows = clientReady().filter(e => baseJob(e.site) === state.job);
  const byName = {};
  rows.forEach(e => (byName[e.name || '(Unnamed)'] = byName[e.name || '(Unnamed)'] || []).push(e));
  const names = Object.keys(byName).sort();
  const grand = rows.reduce((s,r)=>s+(r.hours||0),0);
  let html = `<div class="crumb"><button id="crumbJobs">Jobs</button><span class="sep">/</span><span>${esc(state.job)}</span></div><div class="name-list">`;
  html += names.map(n => {
    const hrs = byName[n].reduce((s,r)=>s+(r.hours||0),0);
    return `<div class="name-row" data-name="${esc(n)}"><span class="nr-name">${esc(n)}</span><span class="nr-hours">${hrs}h</span><span class="nr-arrow">&rsaquo;</span></div>`;
  }).join('');
  html += `</div><div class="list-total"><span>Total hours, everyone, this job</span><span>${grand}h</span></div>`;
  main.innerHTML = html;
  document.getElementById('crumbJobs').addEventListener('click', () => { state.job = null; render(); });
  main.querySelectorAll('.name-row').forEach(r => r.addEventListener('click', () => { state.name = r.dataset.name; state.weekIndex = 0; render(); }));
}
function renderWeeks(main){
  const rows = clientReady().filter(e => baseJob(e.site) === state.job && (e.name || '(Unnamed)') === state.name);
  const byWeek = {};
  rows.forEach(e => (byWeek[getMonday(e.date)] = byWeek[getMonday(e.date)] || []).push(e));
  const weekKeys = Object.keys(byWeek).sort();
  if (state.weekIndex >= weekKeys.length) state.weekIndex = weekKeys.length - 1;
  if (state.weekIndex < 0) state.weekIndex = 0;
  const wk = weekKeys[state.weekIndex];
  const weekRows = (byWeek[wk] || []).sort((a,b) => a.date.localeCompare(b.date));
  const weekTotal = weekRows.reduce((s,r)=>s+(r.hours||0),0);
  const runningTotal = weekKeys.slice(0, state.weekIndex + 1).reduce((s,w) => s + byWeek[w].reduce((s2,r)=>s2+(r.hours||0),0), 0);
  const images = [...new Set(weekRows.map(r => r.image))];

  let html = `
    <div class="crumb"><button id="crumbJobs">Jobs</button><span class="sep">/</span><button id="crumbNames">${esc(state.job)}</button><span class="sep">/</span><span>${esc(state.name)}</span></div>
    <div class="week-nav">
      <button id="wkPrev" ${state.weekIndex<=0?'disabled':''}>&lsaquo; Previous week</button>
      <div class="wn-label">Week of ${fmtDate(wk)} (${state.weekIndex+1} of ${weekKeys.length})</div>
      <button id="wkNext" ${state.weekIndex>=weekKeys.length-1?'disabled':''}>Next week &rsaquo;</button>
    </div>
    <div class="week-grid">
      <div>
        <table class="hrs-table"><thead><tr><th>Date</th><th>Start</th><th>Finish</th><th>Hours</th></tr></thead><tbody>
        ${weekRows.map(r => `<tr><td>${fmtDate(r.date)}</td><td>${esc(r.start)}</td><td>${esc(r.finish)}</td><td>${r.hours}</td></tr>`).join('')}
        <tr><td colspan="3" style="font-weight:800">Week total</td><td style="font-weight:800">${weekTotal}</td></tr>
        </tbody></table>
        <div class="running-total">Running total to this week: ${runningTotal}h</div>
      </div>
      <div class="week-photos">${images.map(img => `<img src="${img}" alt="Timesheet photo">`).join('')}</div>
    </div>`;
  main.innerHTML = html;
  document.getElementById('crumbJobs').addEventListener('click', () => { state.job = null; state.name = null; render(); });
  document.getElementById('crumbNames').addEventListener('click', () => { state.name = null; render(); });
  document.getElementById('wkPrev').addEventListener('click', () => { state.weekIndex--; render(); });
  document.getElementById('wkNext').addEventListener('click', () => { state.weekIndex++; render(); });
}

(async function boot(){
  try {
    const r = await fetch(REST + '?select=*&order=work_date.desc.nullslast', { headers: sbHeaders() });
    if (!r.ok) throw new Error(await r.text());
    entries = (await r.json()).map(rowToEntry);
    render();
  } catch (err) {
    document.getElementById('mainArea').innerHTML = `<p class="empty-state">Couldn't load hours data.<br><span style="font-size:0.75rem;color:#b91c1c">${esc(err.message)}</span></p>`;
  }
})();
</script>
</body>
</html>
