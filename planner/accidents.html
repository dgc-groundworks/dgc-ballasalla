<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accident Reports</title>
<script src="../staff/config.js"></script>
<script src="../staff/auth.js?v=5"></script>
<script src="theme.js"></script>
<style>
:root {
  --bg:#0f1117;--surf:#1a1d27;--surf2:#222636;--bord:#2e3347;
  --accent:#f59e0b;--text:#e2e8f0;--muted:#64748b;
  --green:#22c55e;--red:#ef4444;--blue:#3b82f6;
}
[data-theme="light"] {
  --bg:#f0f4f8;--surf:#ffffff;--surf2:#e4ecf4;--bord:#b8ccd8;
  --accent:#e08a00;--text:#1a2b3c;--muted:#5c7a94;
  --green:#16a34a;--red:#dc2626;--blue:#2563eb;
}
[data-theme="light"] .topbar{background:#1b2a3b;border-bottom-color:#0d1a26}
[data-theme="light"] .topbar h1{color:#f59e0b}
[data-theme="light"] .back-btn{color:#8ab0cc;border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.08)}
[data-theme="light"] .new-btn{background:#f59e0b}
[data-theme="light"] .theme-toggle-btn{color:#cde0f5;border-color:rgba(255,255,255,.2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}

.topbar{background:var(--surf);border-bottom:1px solid var(--bord);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.topbar h1{font-size:1rem;font-weight:700;color:var(--accent);flex:1}
.back-btn{display:flex;align-items:center;gap:6px;background:var(--surf2);border:1px solid var(--bord);border-radius:7px;padding:6px 12px;color:var(--muted);font-size:0.82rem;font-weight:600;text-decoration:none;white-space:nowrap;transition:all .15s;font-family:inherit}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}

.layout{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 49px)}
@media(max-width:700px){.layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}}

/* ── Left panel: entry list ── */
.list-panel{border-right:1px solid var(--bord);display:flex;flex-direction:column}
.list-header{padding:12px 14px;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.list-header input,.list-header select{background:var(--surf2);border:1px solid var(--bord);border-radius:6px;padding:6px 10px;color:var(--text);font-size:0.82rem;font-family:inherit}
.list-header input{flex:1;min-width:120px}
.list-scroll{overflow-y:auto;flex:1}

.entry-card{padding:12px 14px;border-bottom:1px solid var(--bord);cursor:pointer;transition:background .1s}
.entry-card:hover,.entry-card.selected{background:var(--surf2)}
.entry-card .ec-date{font-size:0.78rem;color:var(--muted)}
.entry-card .ec-site{font-weight:700;font-size:0.95rem;margin:2px 0}
.entry-card .ec-preview{font-size:0.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-card .ec-author{font-size:0.75rem;color:var(--muted);margin-top:4px}

/* ── Right panel: form / view ── */
.form-panel{padding:20px 24px;overflow-y:auto}

.new-btn{background:var(--accent);color:#1a1d27;border:none;padding:8px 18px;border-radius:6px;font-size:0.85rem;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.new-btn:hover{background:#fbbf24}

.section-title{font-size:0.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:10px;margin-top:20px}
.section-title:first-child{margin-top:0}

label{display:flex;flex-direction:column;gap:4px;font-size:0.82rem;color:var(--muted);margin-bottom:10px}
input[type=text],input[type=date],textarea,select{background:var(--surf);border:1px solid var(--bord);border-radius:6px;padding:10px 12px;color:var(--text);font-size:0.9rem;font-family:inherit;outline:none;transition:border-color .15s;width:100%;display:block}
input[type=text]:focus,input[type=date]:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;line-height:1.5}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.grid2{grid-template-columns:1fr}}

/* Weather chips */
.weather-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.wx-chip{background:var(--surf);border:1px solid var(--bord);border-radius:20px;padding:5px 12px;font-size:0.82rem;cursor:pointer;color:var(--muted);transition:all .15s;font-family:inherit}
.wx-chip:hover{border-color:var(--accent);color:var(--text)}
.wx-chip.sel{background:var(--accent);border-color:var(--accent);color:#1a1d27;font-weight:700}

.form-btns{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.btn-save{background:var(--green);color:#fff;border:none;padding:9px 24px;border-radius:6px;font-size:0.9rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn-save:hover{background:#16a34a}
.btn-save:disabled{opacity:.5;cursor:default}
.btn-cancel{background:var(--surf2);color:var(--muted);border:1px solid var(--bord);padding:9px 18px;border-radius:6px;font-size:0.9rem;cursor:pointer;font-family:inherit}
.btn-cancel:hover{color:var(--text)}
.btn-del{background:none;border:1px solid rgba(239,68,68,.4);color:var(--red);padding:9px 14px;border-radius:6px;font-size:0.85rem;cursor:pointer;font-family:inherit;margin-left:auto}
.btn-del:hover{background:rgba(239,68,68,.1)}

.form-status{font-size:0.85rem;color:var(--muted);margin-top:8px;min-height:1.2em}
.form-status.ok{color:var(--green)}
.form-status.err{color:var(--red)}

.empty-state{padding:40px 20px;text-align:center;color:var(--muted);font-size:0.9rem}

/* Staff picker */
.staff-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px;margin-bottom:6px}
.sp-item{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:5px 8px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .15s;user-select:none}
.sp-item:hover{background:rgba(255,255,255,.11);border-color:var(--accent)}
.sp-item.checked{background:rgba(245,158,11,.15);border-color:var(--accent)}
.sp-cb{accent-color:var(--accent);width:13px;height:13px;cursor:pointer;flex-shrink:0}
.sp-name{font-size:0.76rem;font-weight:600;color:var(--text);line-height:1.2}
.sp-role{font-size:0.65rem;color:var(--muted);display:block;margin-top:1px}

/* ── Report / document view ── */
.report-doc{background:#fff;color:#1a2a3f;border-radius:10px;padding:36px 40px;max-width:820px;box-shadow:0 4px 32px rgba(0,0,0,.45);font-family:'Segoe UI',Calibri,Arial,sans-serif}

/* Letterhead */
.lh-bar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:16px}
.lh-logo{height:62px;width:auto}
.lh-right{text-align:right}
.lh-company{font-size:1rem;font-weight:800;color:#1a2a3f;letter-spacing:-.2px;line-height:1.2}
.lh-addr{font-size:0.76rem;color:#4a6080;margin-top:3px;line-height:1.5}
.lh-rule{border:none;border-top:3px solid #1a2a3f;margin-bottom:18px}
.lh-rule2{border:none;border-top:1px solid #c8d4e0;margin:14px 0}

/* Doc title row */
.report-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.report-title h2{font-size:1.45rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#1a2a3f}
.report-ref{font-size:0.75rem;color:#4a6080;font-weight:600;letter-spacing:.3px}

/* Meta grid */
.report-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1.5px solid #1a2a3f;border-radius:6px;overflow:hidden;margin-bottom:22px}
.rm-cell{padding:10px 14px;border-right:1px solid #c8d4e0}
.rm-cell:last-child{border-right:none}
.rm-cell .rmc-label{font-size:0.63rem;text-transform:uppercase;letter-spacing:.08em;color:#4a6080;margin-bottom:3px;font-weight:700}
.rm-cell .rmc-val{font-size:0.9rem;font-weight:700;color:#1a2a3f;line-height:1.3}

/* Report sections */
.rs{margin-bottom:0;border:1px solid #c8d4e0;border-radius:6px;overflow:hidden;margin-bottom:10px}
.rs-hdr{background:#1a2a3f;color:#fff;font-size:0.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:8px 14px}
.rs-body{padding:14px;font-size:0.9rem;line-height:1.65;color:#1a2a3f;min-height:52px;white-space:pre-wrap}
.rs-body.rs-empty{color:#8a9ab0;font-style:italic}

/* Signature row */
.sig-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}
.sig-box{border-top:1.5px solid #1a2a3f;padding-top:8px}
.sig-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:.08em;color:#4a6080;font-weight:700}
.sig-name{font-size:0.88rem;color:#1a2a3f;margin-top:24px;font-weight:600}
.sig-date{font-size:0.78rem;color:#4a6080;margin-top:2px}

/* Footer disclaimer */
.report-footer{margin-top:18px;padding-top:14px;border-top:1px solid #c8d4e0;font-size:0.7rem;color:#8a9ab0;line-height:1.5;text-align:center}

/* Action bar outside document */
.report-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn-print{background:#1a2a3f;color:#fff;border:none;padding:9px 20px;border-radius:6px;font-size:0.88rem;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.btn-print:hover{background:#243552}
.btn-savepdf{background:#0f766e}
.btn-savepdf:hover{background:#115e59}
.btn-print:disabled{opacity:.6;cursor:default}
.save-note{font-size:0.78rem;color:var(--muted,#64748b);margin:8px 0 0;min-height:1em}
.save-note.err{color:var(--red,#ef4444)}

/* Print */
@media print {
  .topbar,.list-panel,.report-actions,.save-note,#newEntryBtn{display:none!important}
  body{background:#fff}
  .layout{display:block}
  .form-panel{padding:0;overflow:visible}
  .report-doc{box-shadow:none;border-radius:0;padding:20mm 18mm;max-width:100%;margin:0}
  @page{margin:0}
}
</style>
<style>
.warn-999{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.45);color:var(--text);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.88rem}
.warn-999 b{color:var(--red)}
.new-btn.red{background:var(--red);color:#fff}
.new-btn.red:hover{background:#dc2626}
.src-tag{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--bord);border-radius:4px;padding:1px 5px;margin-left:6px;color:var(--muted)}
.photo-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.photo-row img{width:96px;height:96px;object-fit:cover;border-radius:6px;border:1px solid var(--bord)}
.report-photos{display:flex;gap:10px;flex-wrap:wrap;padding:14px}
.report-photos img{width:180px;height:140px;object-fit:cover;border-radius:6px;border:1px solid #c8d4e0}
.sig-pad{background:#fff;border:1px solid var(--bord);border-radius:6px;width:100%;max-width:420px;height:120px;touch-action:none;display:block}
.sig-img{max-height:70px}
input[type=datetime-local]{background:var(--surf);border:1px solid var(--bord);border-radius:6px;padding:10px 12px;color:var(--text);font-size:.9rem;font-family:inherit;width:100%}
</style>
</head>
<body>
<header class="topbar">
  <a class="back-btn" href="index.html" target="_top">&#8592; Planner</a>
  <h1>Accident Reports</h1>
  <button class="new-btn red" id="newBtn">+ Report an accident</button>
</header>
<div class="layout">
  <aside class="list-panel">
    <div class="list-header">
      <input type="text" id="searchInput" placeholder="Search name, job or what happened">
      <select id="jobFilter"><option value="">All jobs</option></select>
    </div>
    <div class="list-scroll" id="list"><p class="empty-state">Loading…</p></div>
  </aside>
  <main class="form-panel" id="panel">
    <p class="empty-state">Pick a report to view it, or press <strong>+ Report an accident</strong>.<br><br>Accidents reported here and on the site tablets all end up in this one list, and are filed in each job's Accidents folder.</p>
  </main>
</div>
<script>
const REST = SUPABASE_URL + '/rest/v1';
let session = null, rows = [], jobs = [], staff = [], selectedId = null, photos = [];
const EMAIL_NAME_MAP = { 'ash@dgc.im': 'Ash', 'ash@silverdale.im': 'Ash', 'harry@dgc.im': 'Andrew Harrison', 'andrew@dgc.im': 'Andrew Harrison', 'andy@dgc.im': 'Andy W-Smythe', 'john@dgc.im': 'John McLoughlin', 'john.mcloughlin@dgc.im': 'John McLoughlin', 'india.christian@silverdale.im': 'India Christian' };
function myName() { const e = (session && session.user && session.user.email || '').toLowerCase(); return EMAIL_NAME_MAP[e] || e.split('@')[0] || ''; }
const ah = (x = {}) => ({ ...authedHeaders(session), ...x });
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function load() {
  const r = await fetch(REST + '/dgc_accidents?order=accident_at.desc&limit=500', { headers: ah() });
  if (!r.ok) throw new Error(await r.text());
  rows = await r.json();
}
async function loadJobs() { try { const r = await fetch(REST + '/dgc_planner_jobs?archived=eq.false&select=id,name&order=name.asc', { headers: ah() }); if (r.ok) jobs = await r.json(); } catch {} }
async function loadStaff() { try { const r = await fetch(REST + '/dgc_staff?active=eq.true&order=name.asc&select=name', { headers: ah() }); if (r.ok) staff = await r.json(); } catch {} }

function fmtWhen(iso) { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }

function renderList() {
  const q = document.getElementById('searchInput').value.toLowerCase(), jf = document.getElementById('jobFilter').value;
  const sel = document.getElementById('jobFilter'), cur = sel.value;
  const allJobs = [...new Set([...jobs.map(j => j.name), ...rows.map(r => r.job)])].filter(Boolean).sort();
  sel.innerHTML = '<option value="">All jobs</option>' + allJobs.map(n => `<option${n === cur ? ' selected' : ''}>${esc(n)}</option>`).join('');
  const list = rows.filter(r => (!jf || r.job === jf) && (!q || [r.injured, r.job, r.what, r.injury, r.location].join(' ').toLowerCase().includes(q)));
  document.getElementById('list').innerHTML = list.length ? list.map(r => `<div class="entry-card${r.id === selectedId ? ' selected' : ''}" data-id="${r.id}">
    <div class="ec-date">${esc(fmtWhen(r.accident_at))}<span class="src-tag">${r.source === 'dgcos' ? 'Tablet' : 'Planner'}</span></div>
    <div class="ec-site">${esc(r.injured)}</div>
    <div class="ec-preview">${esc(r.job)}: ${esc(r.injury || r.what || '')}</div>
    <div class="ec-author">${r.filed_at ? 'Filed to job folder' : 'Waiting to be filed'}</div></div>`).join('') : '<p class="empty-state">No accidents reported. Good.</p>';
}

function showReport(r) {
  const p = (r.photos || []).map(src => `<img src="${esc(src)}" alt="Accident photo">`).join('');
  document.getElementById('panel').innerHTML = `<div class="report-doc">
    <div class="report-title"><h2>Accident Report</h2><span class="report-ref">${r.source === 'dgcos' ? 'Reported on site tablet' : 'Reported in Job Planner'}</span></div>
    <div class="report-meta">
      <div class="rm-cell"><div class="rmc-label">Job</div><div class="rmc-val">${esc(r.job)}</div></div>
      <div class="rm-cell"><div class="rmc-label">Date &amp; time</div><div class="rmc-val">${esc(fmtWhen(r.accident_at))}</div></div>
      <div class="rm-cell"><div class="rmc-label">Injured person</div><div class="rmc-val">${esc(r.injured)}</div></div>
      <div class="rm-cell"><div class="rmc-label">Location on site</div><div class="rmc-val">${esc(r.location || '')}</div></div>
    </div>
    ${[['Nature of injury', r.injury], ['What happened', r.what], ['Immediate action taken', r.action], ['Witnesses', r.witnesses], ['Gang', r.gang]].map(([h, v]) => `<div class="rs"><div class="rs-hdr">${h}</div><div class="rs-body${v ? '' : ' rs-empty'}">${esc(v || 'None recorded')}</div></div>`).join('')}
    ${p ? `<div class="rs"><div class="rs-hdr">Photos</div><div class="report-photos">${p}</div></div>` : ''}
    <div class="sig-row"><div class="sig-box"><div class="sig-label">Reported by</div>${r.signature ? `<img class="sig-img" src="${esc(r.signature)}" alt="Signature">` : ''}<div class="sig-name">${esc(r.reported_by || '')}</div><div class="sig-date">${esc(fmtWhen(r.created_at))}</div></div></div>
  </div>
  <div class="report-actions"><button class="btn-print" onclick="window.print()">Print</button></div>`;
}

function showForm() {
  const now = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  photos = [];
  document.getElementById('panel').innerHTML = `
    <div class="warn-999"><b>If anyone is seriously injured call 999 immediately.</b> Complete this form as soon as it is safe to do so.</div>
    <div class="section-title">Accident report</div>
    <label>Job<select id="fJob"><option value="">Choose the job…</option>${jobs.map(j => `<option>${esc(j.name)}</option>`).join('')}</select></label>
    <label>Date &amp; Time of Accident<input type="datetime-local" id="fDT" value="${now}"></label>
    <label>Name of Injured Person<input type="text" id="fInjured" list="staffNames" placeholder="Full name"></label>
    <datalist id="staffNames">${staff.map(s => `<option value="${esc(s.name)}">`).join('')}</datalist>
    <label>Location on Site<input type="text" id="fLoc" placeholder="Where did it happen?"></label>
    <label>Nature of Injury<textarea id="fInjury" rows="3" placeholder="Describe the injury…"></textarea></label>
    <label>What happened?<textarea id="fWhat" rows="4" placeholder="Describe what happened in detail…"></textarea></label>
    <label>Immediate action taken<textarea id="fAction" rows="3" placeholder="First aid, 999, etc…"></textarea></label>
    <label>Witnesses<input type="text" id="fWitnesses" placeholder="Names of anyone who witnessed the accident"></label>
    <label>Photos<input type="file" id="fPhotos" accept="image/*" multiple></label>
    <div class="photo-row" id="photoRow"></div>
    <div class="section-title">Reported by</div>
    <label>Name<input type="text" id="fBy" value="${esc(myName())}"></label>
    <label>Signature (sign with your finger or mouse)<canvas class="sig-pad" id="sigPad" width="420" height="120"></canvas></label>
    <button type="button" class="btn-cancel" id="sigClear" style="margin-bottom:10px">Clear signature</button>
    <div class="form-btns"><button class="btn-save" id="saveBtn" style="background:var(--red)">Submit Accident Report</button><button class="btn-cancel" id="cancelBtn">Cancel</button></div>
    <div class="form-status" id="formStatus"></div>`;
  setupSig();
  document.getElementById('fPhotos').addEventListener('change', async e => {
    for (const f of [...e.target.files].slice(0, 6 - photos.length)) photos.push(await shrink(f));
    document.getElementById('photoRow').innerHTML = photos.map(s => `<img src="${s}" alt="">`).join('');
  });
  document.getElementById('saveBtn').addEventListener('click', submit);
  document.getElementById('cancelBtn').addEventListener('click', () => { document.getElementById('panel').innerHTML = '<p class="empty-state">Cancelled.</p>'; });
}

function shrink(file) {
  return new Promise(res => { const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const m = 1200, k = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.7)); };
    img.src = url; });
}
let sigDirty = false;
function setupSig() {
  const c = document.getElementById('sigPad'), x = c.getContext('2d'); let down = false;
  x.lineWidth = 2; x.lineCap = 'round'; x.strokeStyle = '#1a2a3f';
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.addEventListener('pointerdown', e => { down = true; sigDirty = true; x.beginPath(); x.moveTo(...pos(e)); });
  c.addEventListener('pointermove', e => { if (down) { x.lineTo(...pos(e)); x.stroke(); } });
  ['pointerup', 'pointerleave'].forEach(t => c.addEventListener(t, () => { down = false; }));
  document.getElementById('sigClear').addEventListener('click', () => { x.clearRect(0, 0, c.width, c.height); sigDirty = false; });
}

async function submit() {
  const v = id => document.getElementById(id).value.trim();
  const errs = [];
  if (!v('fJob')) errs.push('Choose the job');
  if (!v('fInjured')) errs.push('Name of injured person is required');
  if (!v('fWhat')) errs.push('Say what happened');
  if (errs.length) return setStatus(errs.join('. ') + '.', true);
  const btn = document.getElementById('saveBtn'); btn.disabled = true; setStatus('Saving…');
  try {
    session = await ensureLoggedIn();
    const body = { job: v('fJob'), accident_at: new Date(v('fDT')).toISOString(), injured: v('fInjured'), location: v('fLoc'), injury: v('fInjury'), what: v('fWhat'), action: v('fAction'), witnesses: v('fWitnesses'), photos, reported_by: v('fBy'), signature: sigDirty ? document.getElementById('sigPad').toDataURL('image/png') : null };
    const r = await fetch(REST + '/dgc_accidents', { method: 'POST', headers: ah({ Prefer: 'return=representation' }), body: JSON.stringify(body) });
    if (!r.ok) throw new Error(await r.text());
    const saved = (await r.json())[0];
    rows.unshift(saved); selectedId = saved.id; renderList(); showReport(saved);
  } catch (e) { btn.disabled = false; setStatus('Not saved: ' + e.message, true); }
}
function setStatus(m, err) { const el = document.getElementById('formStatus'); if (el) { el.textContent = m; el.className = 'form-status ' + (err ? 'err' : 'ok'); } }

(async () => {
  session = await ensureLoggedIn();
  if (!session) { window.location.replace('../staff/'); return; }
  setInterval(async () => { session = await ensureLoggedIn(); }, 45 * 60 * 1000);
  try { await Promise.all([load(), loadJobs(), loadStaff()]); renderList(); }
  catch (err) { const m = /does not exist|42P01/.test(err.message) ? 'The accident table isn\'t set up yet. Run create_accidents.sql in Supabase first.' : 'Error: ' + err.message;
    document.getElementById('list').innerHTML = `<p class="empty-state" style="color:#ef4444;padding:20px">${esc(m)}</p>`; }
  document.getElementById('newBtn').addEventListener('click', () => { selectedId = null; renderList(); showForm(); });
  document.getElementById('list').addEventListener('click', e => { const c = e.target.closest('[data-id]'); if (!c) return; selectedId = c.dataset.id; renderList(); showReport(rows.find(r => r.id === selectedId)); });
  document.getElementById('searchInput').addEventListener('input', renderList);
  document.getElementById('jobFilter').addEventListener('change', renderList);
})();
</script>
