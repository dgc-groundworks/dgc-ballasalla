<style>
/* Accounts (Ash, 12 Oct 2026, night): the week's staff hours, a wage, income tax and NI estimate, salaries and the
   Excel export. Runs on the ORIGINAL Job Planner database (Ash: "point the accounts at the original planner"), so the
   hours are exactly the ones the Timesheet app writes and the Staff screen shows. Hours show as they come in, marked
   UNAPPROVED, and turn APPROVED once a project manager approves the week on the Staff screen (or here).
   Data only through the public.acc_* functions (dgc-ballasalla/staff/accounts.sql, kept out of the repository);
   the raw pay tables stay Planner-admin only. Ported from silverdale-app/planner/accounts.html. */
:root { --bg:#14171c; --panel:#1d222b; --panel2:#262c37; --border:#333a47; --text:#e8ebf0; --muted:#9aa4b2; --accent:#e8b84b; --accent-dark:#b5852a;
  --danger:#e5534b; --ok:#3fb950; --warn:#d29922; --info:#58a6ff; --wk:#11151b; }
[data-theme="light"] { --bg:#f0f4f8; --panel:#ffffff; --panel2:#e4ecf4; --border:#b8ccd8; --text:#1a2b3c; --muted:#5c7a94; --accent:#d97706; --accent-dark:#b45309;
  --danger:#dc2626; --ok:#15803d; --warn:#b45309; --info:#1d4ed8; --wk:#eef2f6; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
main { max-width: none; margin: 0; padding: 14px 20px 60px; }
/* inside the Silverdale app or the Planner the host's bar is the only header (Ash, 13 Oct 2026, night) */
html.framed #sdBackBar, html.framed #plBackBar { display: none !important; }
html.framed .titlebar h1, html.framed .titlebar .ver { display: none; }
.titlebar { min-height: 34px; }
h1 { font-size: 1.25rem; margin: 0; }
h2 { font-size: 1rem; margin: 0 0 8px; }
h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin: 0 0 8px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.push { margin-left: auto; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 12px; }
.muted { color: var(--muted); }
.small { font-size: 0.82rem; }
button { font: inherit; }
.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--border); padding: 7px 13px; border-radius: 8px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
.btn.go { background: #16a34a; color: #fff; border-color: #16a34a; }
.btn.sm { padding: 4px 9px; font-size: 0.8rem; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--panel2); color: var(--muted); border: 0; padding: 6px 11px; cursor: pointer; font-weight: 600; font-size: .82rem; }
.seg button.on { background: var(--accent); color: #1a1a1a; }
input, select, textarea { background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 7px; font: inherit; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: .78rem; color: var(--muted); }
.formgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 10px; align-items: end; }
.status { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status.ok { border-color: color-mix(in srgb, var(--ok) 60%, var(--border)); background: color-mix(in srgb, var(--ok) 10%, var(--panel)); }
.status.wait { border-color: color-mix(in srgb, var(--warn) 70%, var(--border)); background: color-mix(in srgb, var(--warn) 12%, var(--panel)); }
.status b.big { font-size: 1.05rem; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: .72rem; font-weight: 700; letter-spacing: .02em; border: 1px solid currentColor; white-space: nowrap; }
.pill.est { color: var(--info); }
.pill.draft { color: var(--warn); }
.pill.ok { color: var(--ok); }
.pill.unv { color: var(--danger); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 10px; }
.kpi { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.kpi .k { font-size: .75rem; color: var(--muted); }
.kpi .v { font-size: 1.35rem; font-weight: 800; margin-top: 2px; }
.kpi .s { font-size: .74rem; color: var(--muted); margin-top: 2px; }
.draftmark .v::after { content: " UNAPPROVED"; font-size: .65rem; color: var(--warn); font-weight: 800; vertical-align: super; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.t { border-collapse: collapse; width: 100%; font-size: .8rem; }
table.t th, table.t td { border-bottom: 1px solid var(--border); padding: 5px 6px; text-align: right; white-space: nowrap; }
table.t th { background: var(--panel2); color: var(--muted); font-weight: 600; position: sticky; top: 0; }
table.t td.l, table.t th.l { text-align: left; }
table.t td.c, table.t th.c { text-align: center; }
table.t tr.tot td { font-weight: 800; background: var(--panel2); border-top: 2px solid var(--border); }
table.t td.name { position: sticky; left: 0; background: var(--panel); font-weight: 600; text-align: left; }
table.t tr.tot td.name { background: var(--panel2); }
th.wk, td.wk { background: color-mix(in srgb, var(--panel2) 45%, var(--panel)); }
th.wk { color: var(--muted); }
td.lv { color: var(--ok); font-weight: 700; }
td.miss { color: var(--danger); }
td.flag { background: color-mix(in srgb, var(--warn) 15%, var(--panel)); box-shadow: inset 0 -3px 0 var(--warn); }
td.chg { background: color-mix(in srgb, var(--danger) 14%, var(--panel)); box-shadow: inset 0 -3px 0 var(--danger); }
td.fixed { background: color-mix(in srgb, var(--info) 12%, var(--panel)); box-shadow: inset 0 -3px 0 var(--info); }
#hoursTable td.c { min-width: 52px; vertical-align: top; }
#hoursTable td .ts-see { display: block; margin: 3px auto 0; }
#hoursTable td .fx { display: block; font-size: .66rem; color: var(--info); font-weight: 700; margin-top: 2px; white-space: nowrap; }
/* corrections to weeks already approved (Ash, 13 Oct 2026, night) */
.corr-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px 10px; align-items: end; margin-top: 8px; }
.corr-form .wide { grid-column: 1 / -1; }
.corr-form textarea { width: 100%; min-height: 56px; }
.corr-sum { padding: 8px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--border); font-size: .86rem; }
.corr-sugg { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: .84rem; }
.pill.fix { color: var(--info); }
.gate { margin-top: 8px; padding: 8px 10px; border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--panel)); border-radius: 6px; }
.gate ul { margin: 6px 0; padding-left: 18px; }
.gate label { display: flex; gap: 8px; align-items: flex-start; font-weight: 600; margin-top: 6px; }
.tick { color: var(--ok); font-weight: 800; }
tr.person { cursor: pointer; }
tr.person:hover td { background: var(--panel2); }
tr.detail td { background: var(--bg); text-align: left; white-space: normal; }
.dl { display: grid; grid-template-columns: 110px 1fr; gap: 3px 10px; font-size: .8rem; }
.anom { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-bottom: 1px dashed var(--border); font-size: .84rem; }
.anom .who { font-weight: 700; min-width: 150px; }
.sev-warn { color: var(--warn); }
.sev-bad { color: var(--danger); }
.sev-info { color: var(--muted); }
details > summary { cursor: pointer; font-weight: 700; }
.msg { margin-top: 8px; min-height: 1.2em; font-size: .85rem; }
.msg.err { color: var(--danger); }
.msg.ok { color: var(--ok); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--panel2); border: 1px solid var(--border); border-radius: 99px; padding: 3px 10px; font-size: .78rem; cursor: pointer; color: var(--text); }
.hidden { display: none !important; }
.confirm { margin-top: 10px; padding: 10px; border: 1px dashed var(--warn); border-radius: 8px; }
.fcgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 10px; }
.fcw { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.fcw h3 { margin: 10px 0 4px; font-size: .7rem; }
.fch { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.fc4 { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; font-size: .82rem; }
.fc4 span:nth-child(odd) { color: var(--muted); }
.fc4 span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
.fc4 .b { font-weight: 800; }
.fcb { max-width: 360px; margin: 6px 0; }
table.fct td.l, table.fct th.l { white-space: normal; min-width: 128px; }
table.fct td { vertical-align: top; font-variant-numeric: tabular-nums; }
table.fct tr.in td { border-bottom: 0; }
table.fct tr.sal td { color: var(--muted); }
table.fct tr.wt td { font-weight: 800; }
table.fct tr.wt td .small { font-weight: 400; }
.fcp { color: var(--info); }
@media (max-width: 480px) { table.fct { font-size: .72rem; } table.fct th, table.fct td { padding: 5px 3px; } table.fct th { white-space: normal; vertical-align: bottom; } table.fct td.l, table.fct th.l { min-width: 0; width: 34%; } table.fct.open td.l, table.fct.open th.l { min-width: 150px; } }
@media (max-width: 640px) { main { padding: 10px 16px 50px; } .titlebar .seg button { padding: 6px 8px; } #hoursTable td.c { min-width: 44px; } .anom { flex-direction: column; gap: 0; } .anom .who { min-width: 0; } }
</style>

<script>
"use strict";
/* ============================== settings ============================== */
const ACC_VERSION = "Accounts 2.2 (13 Oct 2026, original Job Planner)";
/* Same as the Planner's Staff screen (staff/app.js), so Accounts adds up exactly as the approver saw it */
const BANK_HOLIDAYS = new Set([
  '2025-01-01','2025-04-18','2025-04-21','2025-05-05','2025-06-06','2025-07-07','2025-08-25','2025-12-25','2025-12-26',
  '2026-01-01','2026-04-03','2026-04-06','2026-05-04','2026-06-05','2026-07-06','2026-08-31','2026-12-25','2026-12-28',
  '2027-01-01','2027-03-26','2027-03-29','2027-05-03','2027-06-04','2027-07-05','2027-08-30','2027-12-27','2027-12-28',
]);
const SALARIED = new Map([['Andy Wynne-Smythe', 8], ['Andrew Wynne-Smythe', 8]]);
const EXCLUDED_FROM_HOURS = new Set(['John McLoughlin', 'John Mcloughlin', 'Andy Wynne-Smythe', 'Andrew Wynne-Smythe']);
const LONG_DAY = 10, VERY_LONG_DAY = 12, LONG_WEEK = 55;
const LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const TEST = LOCAL && new URLSearchParams(location.search).get('test') === '1';
const REST = SUPABASE_URL + '/rest/v1';

/* ============================== small helpers ============================== */
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const r2 = v => Math.round(v * 100) / 100;
const gbp = v => '£' + r2(num(v)).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const hrs = v => { const n = r2(num(v)); return (Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0$/, '')); };
function valFromIso(iso) { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function isoFromVal(t) { return new Date(t).toISOString().slice(0, 10); }
const addDays = (iso, n) => isoFromVal(valFromIso(iso) + n * 86400000);
const dow = iso => new Date(valFromIso(iso)).getUTCDay();
const isWeekday = iso => { const d = dow(iso); return d >= 1 && d <= 5; };
function todayIso() { const d = new Date(); return isoFromVal(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); }
function mondayOf(iso) { const d = dow(iso); return addDays(iso, -((d + 6) % 7)); }
const dayName = iso => new Date(valFromIso(iso)).toLocaleDateString('en-GB', { weekday: 'short', timeZone: 'UTC' });
const fmtDay = iso => { const d = new Date(valFromIso(iso)); return d.getUTCDate() + ' ' + d.toLocaleDateString('en-GB', { month: 'short', timeZone: 'UTC' }); };
const fmtLong = iso => new Date(valFromIso(iso)).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const fmtWhen = ts => ts ? new Date(ts).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const weekLabel = s => fmtDay(s) + ' to ' + fmtDay(addDays(s, 6)) + ' ' + addDays(s, 6).slice(0, 4);
const norm = s => String(s || '').trim().toLowerCase();
const isTest = name => /^test\b/i.test(name || '');

/* ============================== data access ============================== */
let FIXTURE = null; /* localhost ?test=1 only: canned data, nothing is sent anywhere */
async function rpc(name, args) {
  if (TEST) return testRpc(name, args || {});
  const sess = await ensureLoggedIn();
  if (!sess) throw Object.assign(new Error('Please sign in again.'), { code: 'auth' });
  const r = await fetch(REST + '/rpc/' + name, { method: 'POST',
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + sess.access_token, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {}) });
  const txt = await r.text();
  let body = null; try { body = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!r.ok) throw Object.assign(new Error((body && body.message || txt || 'Request failed').replace(/^Accounts: /, '')), { code: body && body.code });
  return body;
}
async function testRpc(name, a) {
  if (!FIXTURE) FIXTURE = await (await fetch('accounts-fixture.json', { cache: 'no-store' })).json();
  await new Promise(r => setTimeout(r, 30));
  const me = FIXTURE.me;
  if (name === 'acc_me') return me;
  if (name === 'acc_week') { const w = FIXTURE.weeks[a.p_start]; if (!me.hours) throw new Error('not allowed for this login'); return w ? JSON.parse(JSON.stringify(w)) : { ...JSON.parse(JSON.stringify(Object.values(FIXTURE.weeks)[0])), periodStart: a.p_start, periodEnd: addDays(a.p_start, 6), hours: [], timesheets: [], leave: [], extras: [], approval: null, approvalLog: [], dayworks: [], exports: [] }; }
  if (name === 'acc_approve') { if (!me.approve) throw new Error('only the approvers can approve hours'); const w = FIXTURE.weeks[a.p_start]; const ap = { by: me.email, at: new Date().toISOString() }; if (w) { w.approval = ap; w.approvalLog.push({ action: 'approved', by: me.email, at: ap.at }); } return ap; }
  if (name === 'acc_log_export') { const w = FIXTURE.weeks[a.p_start]; if (w) w.exports.unshift({ kind: a.p_kind, by: me.email, at: new Date().toISOString(), approved: !!w.approval }); return null; }
  if (name === 'acc_salary_save') { if (!me.money) throw new Error('not allowed'); const p = a.p; const row = { ...p, id: p.id || ('t' + Date.now()), annual_salary: p.annual_salary === '' ? null : p.annual_salary, monthly_amount: p.monthly_amount === '' ? null : p.monthly_amount, pay_day: p.pay_day === '' ? null : Number(p.pay_day), active: p.active !== false };
    for (const w of Object.values(FIXTURE.weeks)) { const i = w.salaries.findIndex(s => s.id === row.id); if (i >= 0) w.salaries[i] = row; else w.salaries.push(row); } return row; }
  if (name === 'acc_person_set') { for (const w of Object.values(FIXTURE.weeks)) { w.settings = w.settings.filter(s => s.person_key !== a.p_key); w.settings.push({ person_key: a.p_key, allowance: a.p_allowance, ni_category: a.p_ni, note: a.p_note }); } return null; }
  if (name === 'acc_rate_set') { for (const w of Object.values(FIXTURE.weeks)) { const x = w.rates.find(r => r.taxYear === a.p_year && r.key === a.p_key); if (x) Object.assign(x, { value: a.p_value, checkedOn: a.p_checked, verified: a.p_verified }); } return null; }
  if (name === 'acc_day_sources') return (FIXTURE.daySources || {})[a.p_name + '|' + a.p_date] || { name: a.p_name, date: a.p_date, timesheets: [], dayworks: [], grid: [], sameSheet: [] };
  if (name === 'acc_approver_set') { if (!me.director) throw new Error('only a director can change the approvers'); for (const w of Object.values(FIXTURE.weeks)) { const x = w.approvers.find(p => p.email === a.p_email); if (x) x.active = a.p_active; else w.approvers.push({ email: a.p_email, name: a.p_name, active: a.p_active }); } return null; }
  if (name === 'acc_corrections_for') { const all = FIXTURE.corrections || [], live = c => c; return { paidHere: all.filter(c => c.payWeek === a.p_start).map(live), madeHere: all.filter(c => c.periodStart === a.p_start).map(c => ({ ...c, payWeekApproved: !!(FIXTURE.weeks[c.payWeek] && FIXTURE.weeks[c.payWeek].approval) })), nextOpenWeek: (() => { let w = addDays(a.p_start, 7); const m = mondayOf(todayIso()); if (w < m) w = m; while (FIXTURE.weeks[w] && FIXTURE.weeks[w].approval) w = addDays(w, 7); return w; })(), checks: (FIXTURE.checks || []).filter(k => k.periodStart === a.p_start) }; }
  if (name === 'acc_correction_add') { if (!me.director) throw new Error('only a director can record a correction'); const p = a.p, w = FIXTURE.weeks[p.start]; if (!w || !w.approval) throw new Error('this week is not approved yet, so change the hours on the Staff screen instead'); FIXTURE.corrections = FIXTURE.corrections || []; if (FIXTURE.corrections.some(c => c.staffId === p.staffId && c.date === p.date && !c.cancelledAt)) throw new Error('there is already a correction for that day'); const st = w.staff.find(x => x.id === p.staffId); let pw = addDays(p.start, 7); if (pw < mondayOf(todayIso())) pw = mondayOf(todayIso()); while (FIXTURE.weeks[pw] && FIXTURE.weeks[pw].approval) pw = addDays(pw, 7); const row = { id: Date.now(), periodStart: p.start, staffId: p.staffId, name: st ? st.name : '?', date: p.date, oldHours: Number(p.oldHours), newHours: Number(p.newHours), rate: st ? st.rate : null, reason: p.reason, evidence: p.evidence || null, payWeek: p.payWeek || pw, by: me.email, at: new Date().toISOString() }; FIXTURE.corrections.push(row); return row; }
  if (name === 'acc_correction_cancel') { const c = (FIXTURE.corrections || []).find(x => String(x.id) === String(a.p_id)); if (c) Object.assign(c, { cancelledBy: me.email, cancelledAt: new Date().toISOString(), cancelReason: a.p_reason }); return c; }
  if (name === 'acc_approve_checked') { FIXTURE.checks = FIXTURE.checks || []; FIXTURE.checks.push({ periodStart: a.p_start, by: me.email, at: new Date().toISOString(), items: a.p_items }); return testRpc('acc_approve', a); }
  throw new Error('unknown test call ' + name);
}

/* ============================== state ============================== */
const S = { me: null, start: null, W: null, view: null, open: new Set(), approveAsk: false, msg: '', msgKind: '', editRate: null, editSalary: null, editTax: null, busy: false, corr: null, gateOk: false };
if (TEST) window.__accS = S; /* localhost ?test=1 only: lets the test page read the sums */
function pickStartFromHash() {
  const h = location.hash.slice(1);
  const m = /week=(\d{4}-\d{2}-\d{2})/.exec(h);
  if (m) return mondayOf(m[1]);
  if (/approve/.test(h)) return addDays(mondayOf(todayIso()), -7);
  return null;
}

/* ============================== the rates ============================== */
function taxYearOf(iso) { const y = Number(iso.slice(0, 4)); return iso >= y + '-04-06' ? y + '/' + String(y + 1).slice(2) : (y - 1) + '/' + String(y).slice(2); }
function ratesFor(iso) {
  const all = (S.W && S.W.rates) || [];
  const want = taxYearOf(iso);
  const years = [...new Set(all.map(r => r.taxYear))].sort().reverse();
  const year = years.includes(want) ? want : years[0];
  const R = { year, wanted: want, missingYear: year !== want, rows: all.filter(r => r.taxYear === year) };
  R.rows.forEach(r => { R[r.key] = num(r.value); });
  R.unverified = R.rows.filter(r => !r.verified);
  return R;
}
/* Isle of Man income tax on a year's pay, single-person allowance unless the person's own allowance is set */

/* ============================== average pay and the look-ahead ============================== */
/* Ash, 12 Oct 2026, night: an "Average pay per week" box under "Pay this week", from the last few approved weeks of

   plus any salary pay days that fall in each week. Everything here is an ESTIMATE, on the Isle of Man rates below. */

async function loadForecast() {

    const got = await Promise.all(cands.concat([thisMon]).map(w => (S.W && S.W.periodStart === w) ? Promise.resolve(S.W) : rpc('acc_week', { p_start: w }).catch(() => null)));

    rows += `<tr class="in"><td class="l">${head}${open ? '' : '<div class="small muted">Hourly staff</div>'}</td>${cells(w.hourly)}</tr>`
      + `<tr class="in sal"><td class="l">+ salaries <span class="small muted">(paid ${esc(payDays(w))})</span>${open ? `<div class="small muted">${w.sal.map(x => esc(x.s.name) + ' (' + esc(companyName(x.s.company)) + ', ' + esc(dayName(x.payDate) + ' ' + fmtDay(x.payDate)) + ')').join('; ')}</div>` : ''}</td>${cells(w.S2)}</tr>`
      + `<tr class="wt"><td class="l">Week total, with salaries</td>${cells(w.tot)}</tr>`;
  });
  h += `<div class="card"><div class="bar"><h2 style="margin:0">The next 4 weeks</h2>${est}<span class="push small muted">hourly staff and salaries</span></div>
    <div class="scroll"><table class="t fct${open ? ' open' : ''}"><thead><tr><th class="l">Week</th><th>Money to staff</th><th>Tax and NI to pay</th><th>Total cost</th>${open ? '<th>Gross pay</th><th>Income tax</th><th>Employee NI</th><th>Employer NI</th>' : ''}</tr></thead>
    <tbody>${rows}<tr class="tot"><td class="l">4-week total</td>${cells(all)}</tr></tbody></table></div>
    <p class="small muted">These are estimates, not payslips, worked out on the Isle of Man tax and NI rates (see Rates below). Estimate rows use the average week above. Partly actual means this week's real hours so far, with the average for the days still to come. Salaries come from the salary list (every company) and are added in the week of each person's pay day.${(S.W.salaries || []).some(x => x.active !== false) ? '' : ' No salaries have been entered yet, so none are included.'}</p>
    ${toggle}</div>`;
  return h;
}

/* ============================== render ============================== */

        /* amber or red edge: a "See" button opens the timesheet pop-up (Ash, 12 Oct 2026) */

  if (B.money && view === 'dgc') {

        <td class="l">${taxCell('staff:' + r.s.id, r.set, r.custom)}</td></tr>`;
    });
    h += `<tr class="tot"><td class="name">Totals</td><td>${hrs(B.T.total)}</td><td></td><td>${gbp(B.T.gross)}${B.adjAll.length ? `<div class="small" style="color:var(--info)">incl. corrections ${gbp(B.T.adjGross)}</div>` : ''}</td><td>${gbp(B.T.tax)}</td><td>${gbp(B.T.eeNI)}</td><td>${gbp(B.T.net)}</td><td>${gbp(B.T.advances)}</td><td>${gbp(B.T.toPay)}</td><td>${gbp(B.T.erNI)}</td><td>${gbp(B.T.cost)}</td><td></td></tr></tbody></table></div></div>`;
  }

  /* ---- salaries ---- */
  if (B.money) h += salariesHTML(sal, view, est);
  else if (view === 'silverdale' || !B.money) h += `<div class="card"><h2>Salaries and pay</h2><p class="muted">Your login doesn't have "Can see money" switched on, so pay figures aren't shown. Ash or Harry can switch it on in the Silverdale app (Apps, Who can see money).</p></div>`;

  /* ---- dayworks ---- */
  if (view === 'dgc') {
    const dw = W.dayworks || [];
    h += `<div class="card"><h2>Dayworks and subcontractor sheets this week</h2>${dw.length ? `<div class="scroll"><table class="t"><thead><tr><th class="l">Name</th><th class="l">Day</th><th class="l">Site</th><th class="c">Start to finish</th><th>Hours</th><th>Pay hours that day</th><th class="l">Sent to the client</th><th class="l">Photo</th></tr></thead><tbody>${dw.map(x => {
      const row = B.rows.find(r => norm(r.s.name) === norm(x.name)), day = row && row.days.find(d => d.date === x.date), billed = x.billedHours != null ? x.billedHours : x.hours;
      const mismatch = day && num(billed) > day.worked + 0.01;
      return `<tr><td class="l">${esc(x.name)}</td><td class="l">${esc(dayName(x.date) + ' ' + fmtDay(x.date))}</td><td class="l">${esc(x.site || '')}</td><td class="c">${esc((x.start || '') + (x.finish ? ' to ' + x.finish : ''))}</td><td>${hrs(billed)}${x.billedHours != null && num(x.billedHours) !== num(x.hours) ? ` <span class="small muted">(sheet ${hrs(x.hours)})</span>` : ''}</td><td class="${mismatch ? 'sev-warn' : ''}">${day ? hrs(day.worked) : '<span class="muted">not on staff list</span>'}</td><td class="l">${x.sentAt ? 'Yes, ' + esc(fmtWhen(x.sentAt)) : '<span class="muted">Not yet</span>'}</td><td class="l">${seeBtn(x.name, x.date, '')}</td></tr>`;

  if (view === 'dgc') {

      ${canExport ? `<div class="bar" style="margin-top:6px"><button class="btn primary" type="button" data-act="excel" id="excelBtn">${esc(excelLabel())}</button><button class="btn" type="button" data-act="excel-change" id="excelChange"${S.handleName ? '' : ' hidden'}>Change save location</button><button class="btn" type="button" data-act="csv">Download CSV</button></div>
        <p class="small muted">${approved ? 'The Excel file has the hours, the daily detail, what was flagged, the pay estimate, dayworks, salaries and the rates used.' : 'Not approved yet: the file is marked UNAPPROVED on every sheet.'} In Chrome or Edge each week remembers its own file and saves over it; pick a OneDrive folder and everyone sees it.</p>`
        : '<p class="muted">The export opens once the hours are approved.</p>'}
      ${(W.exports || []).length ? `<details class="small"><summary>Exported ${W.exports.length} time${W.exports.length > 1 ? 's' : ''}</summary>${W.exports.map(e => `<div>${esc(e.kind === 'csv' ? 'CSV' : 'Excel')} by ${esc(nameOf(e.by))}, ${esc(fmtWhen(e.at))}${e.approved ? '' : ' (draft)'}</div>`).join('')}</details>` : ''}</div>`;
  }

  /* ---- rates ---- */
  h += ratesHTML(B);
  /* ---- approvers ---- */
  h += `<div class="card"><details${S.editApprovers ? ' open' : ''}><summary>Who can approve hours</summary>
    <p class="small muted">Only these people can approve a week. ${me.director ? 'Directors can change the list.' : 'Ash or Harry can change the list.'}</p>

  h += `<p class="small muted" style="margin-top:14px">${esc(ACC_VERSION)}. Signed in as ${esc(me.name || me.email)}${me.approve ? ' (approver)' : ''}. Pay data is read through Accounts only; the Planner's own tables stay locked.</p>`;

/* ---- corrections to weeks already approved (Ash, 13 Oct 2026, night: "an option to fix it") ----
   A director records: this person, this day, was paid X hours, should have been Y, because Z. It is paid in the next
   pay run as its own line (Pay this week, Pay per person and both exports say so). The approved week is never rewritten.
   Data: acc_correction_add / acc_correction_cancel / acc_corrections_for (staff/accounts-corrections.sql). */
function corrPaid(sid, date) {
  const r = S.B && S.B.rows.find(x => x.s.id === sid), x = r && r.days.find(y => y.date === date);
  return x ? x.paid : 0;
}
function corrBtn(B, sid, date) {
  if (!B.approved || !S.me || !sid || !date) return '';
  const r = B.rows.find(x => x.s.id === sid), x = r && r.days.find(y => y.date === date);
  if (!x) return '';
  if (x.fixed) return ` <span class="pill fix">corrected to ${hrs(x.fixed.newHours)}h, paid in the week of ${esc(fmtDay(x.fixed.payWeek))}</span>`;
  if (!S.me.director) return '';
  return ` <button class="btn sm" type="button" data-corrfor="${esc(sid + '|' + date)}">Record a correction</button>`;
}
/* everything still amber or "?" that the approver must tick off before approving (Ash: "That should have been flagged earlier") */
function gateItems(B) {
  const out = [];
  B.rows.forEach(r => r.days.forEach(x => {
    const bits = [];
    if (x.flags.includes('missing')) bits.push('no hours on a working day ("?")');
    if (x.flags.includes('dayworks')) { const sh = x.dayworks.reduce((a, y) => a + num(y.billedHours != null ? y.billedHours : y.hours), 0); bits.push('the paper dayworks sheet says ' + hrs(sh) + 'h, the pay hours say ' + hrs(x.worked) + 'h'); }
    if (x.flags.includes('twice')) bits.push('the grid and their own timesheet disagree');
    if (x.flags.includes('long')) bits.push('long day, ' + hrs(x.value) + 'h');
    if (x.flags.includes('leave')) bits.push('hours on a day booked as leave');
    if (bits.length) out.push({ name: r.s.name, staffId: r.s.id, date: x.date, text: dayName(x.date) + ' ' + fmtDay(x.date) + ': ' + bits.join('; ') });
  }));
  /* dayworks sheets that cover more than a day's pay hours but weren't caught above (a weekend sheet with no pay hours) */
  return out;
}

async function saveCorrection(btn) {
  corrFromForm();
  const c = S.corr;
  if (!c || !c.staffId || !c.date) return say('Pick the person and the day.', 'err');
  if (c.newHours == null || isNaN(c.newHours)) return say('Type the hours it should have been.', 'err');
  if (!c.reason || c.reason.trim().length < 5) return say('Say why (a few words).', 'err');
  if (btn) btn.disabled = true;
  try {
    const r = await rpc('acc_correction_add', { p: { start: S.start, staffId: c.staffId, date: c.date, oldHours: c.oldHours, newHours: c.newHours, reason: c.reason.trim(), evidence: (c.evidence || '').trim() } });
    S.corr = null; await reload(true);
    say('Correction saved: ' + (r && r.staff_name ? r.staff_name + ', ' : '') + 'paid in the pay run for the week of ' + fmtDay((r && (r.pay_week || r.payWeek)) || '') + '.', 'ok');
  } catch (e) { if (btn) btn.disabled = false; say('Not saved: ' + e.message, 'err'); }
}

const FS_SUPPORTED = 'showSaveFilePicker' in window;
const HANDLE_DB = 'dgc-staff-tracker', HANDLE_STORE = 'handles', HANDLE_KEY = 'exportFile'; /* the same store as the Staff screen used, so saved week files carry over */
function openHandleDB() { return new Promise((res, rej) => { const q = indexedDB.open(HANDLE_DB, 1); q.onupgradeneeded = () => q.result.createObjectStore(HANDLE_STORE); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function getHandle(key) { try { const db = await openHandleDB(); return await new Promise((res, rej) => { const q = db.transaction(HANDLE_STORE, 'readonly').objectStore(HANDLE_STORE).get(key); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); }); } catch (e) { return null; } }
async function putHandle(h, key) { try { const db = await openHandleDB(); db.transaction(HANDLE_STORE, 'readwrite').objectStore(HANDLE_STORE).put(h, key); } catch (e) {} }
async function dropHandle(key) { try { const db = await openHandleDB(); db.transaction(HANDLE_STORE, 'readwrite').objectStore(HANDLE_STORE).delete(key); } catch (e) {} }
const weekKey = () => 'week:' + (S.start || '');

async function doExcel() {
  if (S.busy) return; S.busy = true;
  const btn = $('#excelBtn'); if (btn) btn.disabled = true;
  const name = `Staff Hours ${S.start} to ${addDays(S.start, 6)}${S.B.approved ? '' : ' UNAPPROVED'}.xlsx`;
  const type = { description: 'Excel Workbook', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } };
  try {
    let handle = null;
    if (FS_SUPPORTED && S.B.approved) {
      handle = await getHandle(weekKey());
      if (handle) { let p = await handle.queryPermission({ mode: 'readwrite' }); if (p !== 'granted') p = await handle.requestPermission({ mode: 'readwrite' }); if (p !== 'granted') handle = null; }
      if (!handle) {
        const last = await getHandle(HANDLE_KEY);
        try { handle = await window.showSaveFilePicker({ suggestedName: name, types: [type], ...(last ? { startIn: last } : {}) }); }
        catch (e) { if (e.name === 'AbortError') throw e; handle = await window.showSaveFilePicker({ suggestedName: name, types: [type] }); }
        await putHandle(handle, weekKey()); await putHandle(handle, HANDLE_KEY);
      }
    }
    say('Building the Excel file...', '');
    const blob = new Blob([await buildWorkbook()], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    if (handle) { const w = await handle.createWritable(); await w.write(blob); await w.close(); say('Saved to ' + handle.name + ' at ' + new Date().toLocaleTimeString('en-GB') + '.', 'ok'); }
    else { downloadBlob(blob, name); say('Downloaded ' + name + '.', 'ok'); }
    await rpc('acc_log_export', { p_start: S.start, p_kind: 'excel' }).catch(() => {});
    await reload(true);
  } catch (e) { if (e.name !== 'AbortError') say('Export failed: ' + e.message, 'err'); else say('', ''); }
  finally { S.busy = false; await refreshHandle(); const b = $('#excelBtn'); if (b) b.disabled = false; }
}
function downloadBlob(blob, name) { const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); }
async function doCsv() {
  const B = S.B, q = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = ['Week', 'Status', 'Name', ...B.dates, 'Worked', 'Leave/BH', 'OT', 'Total hours', ...(B.money ? ['Rate', 'Gross', 'Income tax est', 'Employee NI est', 'Net pay est', 'Advances', 'Left to pay est', 'Employer NI est', 'Total cost est'] : [])];
  const st = B.approved ? 'Approved' : 'UNAPPROVED';
  const lines = [head.map(q).join(',')].concat(B.rows.map(r => [S.start, st, r.s.name, ...r.days.map(x => x.kind === 'hours' ? x.value : (x.kind === 'H' || x.kind === 'BH' || x.kind === 'U') ? x.kind : ''), r.worked, r.leavePaid, r.ot, r.total,
    ...(B.money ? [r.rate, r2(r.gross), r2(r.tax), r2(r.eeNI), r2(r.net), r2(r.advances), r2(r.toPay), r2(r.erNI), r2(r.cost)] : [])].map(q).join(',')));
  if (B.adjAll.length) {
    lines.push('');
    lines.push(['Week', 'Status', 'Name', 'Corrected day', 'Week corrected', 'Was hours', 'Now hours', 'Difference hours', ...(B.money ? ['Rate', 'Difference £ (in Gross above)'] : []), 'Why', 'Recorded by'].map(q).join(','));
    B.adjAll.forEach(c => { const d = r2(num(c.newHours) - num(c.oldHours)); lines.push([S.start, 'CORRECTION FROM AN EARLIER WEEK', c.name, c.date, c.periodStart, num(c.oldHours), num(c.newHours), d, ...(B.money ? [num(c.rate), r2(d * num(c.rate))] : []), c.reason, nameOf(c.by)].map(q).join(',')); });
  }
  const name = `Staff Hours ${S.start} to ${addDays(S.start, 6)}${B.approved ? '' : ' UNAPPROVED'}.csv`;
  downloadBlob(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' }), name);
  say('Downloaded ' + name + '.', 'ok');
  await rpc('acc_log_export', { p_start: S.start, p_kind: 'csv' }).catch(() => {});
  await reload(true);
}

function say(m, k) { S.msg = m; S.msgKind = k || ''; const el = document.querySelector('.msg'); if (el) { el.textContent = m; el.className = 'msg ' + (k || ''); } else render(); }
async function goWeek(start) { S.start = start; S.approveAsk = false; S.open.clear(); S.msg = ''; history.replaceState(null, '', '#week=' + start); await reload(); await refreshHandle(); }
async function reload(keepMsg) {
  try {
    const [W, C] = await Promise.all([rpc('acc_week', { p_start: S.start }),
      rpc('acc_corrections_for', { p_start: S.start }).catch(e => ({ paidHere: [], madeHere: [], checks: [], error: e.message }))]);
    W.corrections = C; S.W = W; if (!keepMsg) S.msg = ''; render();
  }
  catch (e) { $('#app').innerHTML = `<div class="card"><h2>Couldn't load the week</h2><p>${esc(e.message)}</p><button class="btn" type="button" data-act="retry">Try again</button></div>`; }
}

  catch (e) { say('Not saved: ' + e.message, 'err'); }
}
document.addEventListener('click', async ev => {

  if (d.view) { S.view = d.view; try { localStorage.setItem('acc_view', d.view); } catch (e) {} render(); return; }
  if (d.week) return goWeek(d.week);
  if (d.taxedit) { S.editTax = d.taxedit; render(); return; }
  if (d.taxsave) {
    const allow = $('#txAllow').value.trim();
    try { await rpc('acc_person_set', { p_key: d.taxsave, p_allowance: allow === '' ? null : Number(allow), p_ni: $('#txNi').value, p_note: $('#txNote').value }); S.editTax = null; say('Tax settings saved.', 'ok'); await reload(true); }
    catch (e) { say('Not saved: ' + e.message, 'err'); } return;

    const [year, key] = d.ratesave.split('|');

    catch (e) { say('Not saved: ' + e.message, 'err'); } return;
  }
  if (d.saledit) { S.editSalary = d.saledit; render(); return; }
  if (d.saladd) { S.editSalary = 'staff:' + d.saladd; render(); return; }
  if (d.salon) { const s = S.W.salaries.find(x => x.id === d.salon); if (s) await saveSalary({ ...s, active: true }); return; }
  if (d.corrpre != null) { const x = S.B.suggestions[Number(d.corrpre)]; if (x) { S.corr = { ...x }; render(); const f = $('#corrForm'); if (f) f.scrollIntoView({ block: 'center' }); } return; }
  if (d.corrfor) { const [sid, dt] = d.corrfor.split('|'); const x = S.B.suggestions.find(y => y.staffId === sid && y.date === dt) || { staffId: sid, date: dt, oldHours: corrPaid(sid, dt), newHours: null, reason: '', evidence: '' }; S.corr = { ...x }; render(); const f = $('#corrForm'); if (f) f.scrollIntoView({ block: 'center' }); return; }
  if (d.corrcancel) {
    const why = window.prompt('Why is this correction being cancelled? (It is kept, marked cancelled.)', '');
    if (why == null) return;
    try { await rpc('acc_correction_cancel', { p_id: Number(d.corrcancel), p_reason: why }); say('Correction cancelled. It stays on record.', 'ok'); await reload(true); } catch (e) { say('Not cancelled: ' + e.message, 'err'); } return;
  }
  if (d.approver) {
    const p = S.W.approvers.find(x => x.email === d.approver);
    try { await rpc('acc_approver_set', { p_email: p.email, p_name: p.name, p_active: d.on === '1' }); say('Approvers updated.', 'ok'); await reload(true); } catch (e) { say('Not saved: ' + e.message, 'err'); } return;
  }
  switch (d.act) {
    case 'prev': return goWeek(addDays(S.start, -7));
    case 'next': return goWeek(addDays(S.start, 7));
    case 'last': return goWeek(addDays(mondayOf(todayIso()), -7));
    case 'this': return goWeek(mondayOf(todayIso()));
    case 'retry': return reload();
    case 'theme': if (typeof toggleTheme === 'function') toggleTheme(); return;
    case 'fc-break': S.fcBreak = !S.fcBreak; render(); return;
    case 'approve': S.approveAsk = true; render(); return;
    case 'approve-no': S.approveAsk = false; S.gateOk = false; render(); return;
    case 'corr-new': S.corr = { staffId: '', date: '', oldHours: 0, newHours: null, reason: '', evidence: '' }; render(); return;
    case 'corr-cancel-form': S.corr = null; render(); return;
    case 'corr-save': return saveCorrection(t);
    case 'approve-yes':
      t.disabled = true;
      const items = gateItems(S.B);
      if (items.length && !S.gateOk) { say('Tick the box to say you have checked the items listed first.', 'err'); t.disabled = false; return; }
      try { const r = await rpc('acc_approve_checked', { p_start: S.start, p_items: items.map(x => ({ name: x.name, date: x.date, text: x.text })) })
          .catch(e => (/acc_approve_checked|PGRST202|schema cache/i.test(e.message + ' ' + (e.code || '')) ? rpc('acc_approve', { p_start: S.start }) : Promise.reject(e)));
        S.approveAsk = false; S.gateOk = false; S.fc = null; await reload(true); say(r && r.already ? 'This week was already approved.' : 'Approved. Accounts can now pay these hours.', 'ok');
        try { if (window.parent !== window) window.parent.postMessage({ type: 'acc-approved', periodStart: S.start }, location.origin); } catch (e) {} }
      catch (e) { t.disabled = false; say('Not approved: ' + e.message, 'err'); }
      return;
    case 'excel': return doExcel();
    case 'excel-change': await dropHandle(weekKey()); await refreshHandle(); return;
    case 'csv': return doCsv();
    case 'tax-cancel': S.editTax = null; render(); return;
    case 'rate-cancel': S.editRate = null; render(); return;
    case 'sal-new': S.editSalary = 'new'; render(); return;
    case 'sal-cancel': S.editSalary = null; render(); return;
    case 'sal-save': return saveSalary({ id: $('#slId').value, name: $('#slName').value, company: $('#slCo').value, job_title: $('#slJob').value, annual_salary: $('#slYear').value, monthly_amount: $('#slMonth').value, pay_day: $('#slDay').value, start_date: $('#slStart').value, note: $('#slNote').value, staff_id: $('#slStaff').value, active: true });
    case 'sal-off': { const s = S.W.salaries.find(x => x.id === $('#slId').value); if (s) return saveSalary({ ...s, active: false }); return; }
    case 'approver-add': {
      const email = $('#apEmail').value.trim(), name = $('#apName').value.trim();
      try { await rpc('acc_approver_set', { p_email: email, p_name: name, p_active: true }); S.editApprovers = true; say('Approver added.', 'ok'); await reload(true); } catch (e) { say('Not added: ' + e.message, 'err'); } return;
    }
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'gateOk') { S.gateOk = t.checked; const b = $('#approveYes'); if (b) b.disabled = !t.checked; return; }
  if (t.id === 'cfPerson' || t.id === 'cfDay') { corrFromForm(); render(); const f = $('#corrForm'); if (f) f.scrollIntoView({ block: 'center' }); return; }
});
document.addEventListener('input', ev => { if (ev.target.id === 'cfNew') corrPreview(); });
window.addEventListener('hashchange', () => { const s = pickStartFromHash(); if (s && s !== S.start) { S.focusApprove = /approve/.test(location.hash); goWeek(s); } });

/* ============================== start ============================== */
(async function boot() {
  if (!TEST) {
    const sess = await ensureLoggedIn();
    if (!sess) {
      const waitLogin = showLoginForm($('#app'), 'Accounts');
      const h = $('#app h2'); if (h) h.textContent = 'Accounts: please sign in';
      await waitLogin;
    }
  }
  try { S.me = await rpc('acc_me'); }
  catch (e) { $('#app').innerHTML = `<div class="card"><h2>Accounts</h2><p>${esc(e.message)}</p></div>`; return; }
  if (!S.me || !S.me.hours) {
    $('#app').innerHTML = `<div class="card"><h2>Accounts</h2><p>This login (${esc((S.me && S.me.email) || 'not signed in')}) can't open Accounts.</p><p class="muted">Accounts is for the directors, the hours approvers, and people with the Accounts app and "Can see money" both switched on. Ask Ash or Harry if you need it.</p><button class="btn" type="button" onclick="logout()">Sign out</button></div>`;
    return;
  }
  let v = null; try { v = localStorage.getItem('acc_view'); } catch (e) {}
  S.view = v === 'silverdale' || v === 'dgc' ? v : (S.me.ws === 'silverdale' ? 'silverdale' : 'dgc');
  const fromHash = pickStartFromHash();
  S.focusApprove = /approve/.test(location.hash);
  /* default: last week (the one being paid), unless asked for another */
  S.start = fromHash || addDays(mondayOf(todayIso()), -7);
  await reload(); await refreshHandle();
})();
</script>
</body>
</html>
