<style>
/* Accounts (Ash, 12 Oct 2026, night): the week's staff hours, a wage, income tax and NI estimate, salaries and the
   Excel export. Runs on the ORIGINAL Job Planner database (Ash: "point the accounts at the original planner"), so the
   hours are exactly the ones the Timesheet app writes and the Staff screen shows. Hours show as they come in, marked
   UNAPPROVED, and turn APPROVED once a project manager approves the week on the Staff screen (or here).
   Data only through the public.acc_* functions (dgc-ballasalla/staff/accounts.sql, kept out of the repository);
   the raw pay tables stay Planner-admin only. Ported from silverdale-app/planner/accounts.html. */
:root { --bg:#0f1216; --panel:#212733; --panel2:#2b3240; --border:#3d4554; --text:#e8ebf0; --muted:#9aa4b2; --accent:#e8b84b; --accent-dark:#b5852a;
  --danger:#e5534b; --ok:#3fb950; --warn:#d29922; --info:#58a6ff; --wk:#11151b; }
[data-theme="light"] { --bg:#e4ebf3; --panel:#ffffff; --panel2:#e9eff6; --border:#afc2d2; --text:#1a2b3c; --muted:#4a657e; --accent:#d97706; --accent-dark:#b45309;
  --danger:#dc2626; --ok:#15803d; --warn:#b45309; --info:#1d4ed8; --wk:#eef2f6; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
main { max-width: none; margin: 0; padding: 14px 20px 60px; }
/* inside the Silverdale app or the Planner the host's bar is the only header (Ash, 13 Oct 2026, night) */
html.framed #sdBackBar, html.framed #plBackBar { display: none !important; }
html.framed .titlebar h1, html.framed .titlebar .ver { display: none; }
.titlebar { min-height: 34px; }
h1 { font-size: 1.25rem; margin: 0; }
h2 { font-size: 1rem; margin: 0 0 8px; }
h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin: 0 0 8px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.push { margin-left: auto; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 12px; }
.muted { color: var(--muted); }
.small { font-size: 0.82rem; }
button { font: inherit; }
.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--border); padding: 7px 13px; border-radius: 8px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink,#1a1a1a); border-color: var(--accent); }
.btn.go { background: #16a34a; color: #fff; border-color: #16a34a; }
.btn.sm { padding: 4px 9px; font-size: 0.8rem; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--panel2); color: var(--muted); border: 0; padding: 6px 11px; cursor: pointer; font-weight: 600; font-size: .82rem; }
.seg button.on { background: var(--accent); color: var(--accent-ink,#1a1a1a); }
input, select, textarea { background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 7px; font: inherit; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: .78rem; color: var(--muted); }
.formgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 10px; align-items: end; }
.status { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status.ok { border-color: color-mix(in srgb, var(--ok) 60%, var(--border)); background: color-mix(in srgb, var(--ok) 10%, var(--panel)); }
.status.wait { border-color: color-mix(in srgb, var(--warn) 70%, var(--border)); background: color-mix(in srgb, var(--warn) 12%, var(--panel)); }
.status b.big { font-size: 1.05rem; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: .72rem; font-weight: 700; letter-spacing: .02em; border: 1px solid currentColor; white-space: nowrap; }
.pill.est { color: var(--info); }
.salrun, .salavg { margin-top: 10px; padding: 8px 12px; border: 1px solid var(--border); border-left: 3px solid var(--info); border-radius: 8px; font-size: .9rem; }
.salrun div, .salavg span { display: block; margin-top: 3px; }
.pill.draft { color: var(--warn); }
.pill.ok { color: var(--ok); }
.pill.unv { color: var(--danger); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 10px; }
.kpi { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.kpi .k { font-size: .75rem; color: var(--muted); }
.kpi .v { font-size: 1.35rem; font-weight: 800; margin-top: 2px; }
.kpi .s { font-size: .74rem; color: var(--muted); margin-top: 2px; }
.draftmark .v::after { content: " UNAPPROVED"; font-size: .65rem; color: var(--warn); font-weight: 800; vertical-align: super; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.t { border-collapse: collapse; width: 100%; font-size: .8rem; }
table.t th, table.t td { border-bottom: 1px solid var(--border); padding: 5px 6px; text-align: right; white-space: nowrap; }
table.t th { background: var(--panel2); color: var(--muted); font-weight: 600; position: sticky; top: 0; }
table.t td.l, table.t th.l { text-align: left; }

table.t tr.tot td.name { background: var(--panel2); }
th.wk, td.wk { background: color-mix(in srgb, var(--panel2) 45%, var(--panel)); }
th.wk { color: var(--muted); }
td.lv { color: var(--ok); font-weight: 700; }
td.miss { color: var(--danger); }
td.flag { background: color-mix(in srgb, var(--warn) 15%, var(--panel)); box-shadow: inset 0 -3px 0 var(--warn); }
td.chg { background: color-mix(in srgb, var(--danger) 14%, var(--panel)); box-shadow: inset 0 -3px 0 var(--danger); }
td.fixed { background: color-mix(in srgb, var(--info) 12%, var(--panel)); box-shadow: inset 0 -3px 0 var(--info); }
#hoursTable td.c { min-width: 52px; vertical-align: top; }
#hoursTable td .ts-see { display: block; margin: 3px auto 0; }
#hoursTable td .fx { display: block; font-size: .66rem; color: var(--info); font-weight: 700; margin-top: 2px; white-space: nowrap; }
/* corrections to weeks already approved (Ash, 13 Oct 2026, night) */
.corr-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px 10px; align-items: end; margin-top: 8px; }
.corr-form .wide { grid-column: 1 / -1; }
.corr-form textarea { width: 100%; min-height: 56px; }
.corr-sum { padding: 8px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--border); font-size: .86rem; }
.corr-sugg { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: .84rem; }
.pill.fix { color: var(--info); }
.gate { margin-top: 8px; padding: 8px 10px; border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--panel)); border-radius: 6px; }

.gate label { display: flex; gap: 8px; align-items: flex-start; font-weight: 600; margin-top: 6px; }

tr.person:hover td { background: var(--panel2); }
tr.detail td { background: var(--bg); text-align: left; white-space: normal; }
.dl { display: grid; grid-template-columns: 110px 1fr; gap: 3px 10px; font-size: .8rem; }
.anom { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-bottom: 1px dashed var(--border); font-size: .84rem; }
.anom .who { font-weight: 700; min-width: 150px; }
.sev-warn { color: var(--warn); }
.sev-bad { color: var(--danger); }
.sev-info { color: var(--muted); }
details > summary { cursor: pointer; font-weight: 700; }
.msg { margin-top: 8px; min-height: 1.2em; font-size: .85rem; }
.msg.err { color: var(--danger); }
.msg.ok { color: var(--ok); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--panel2); border: 1px solid var(--border); border-radius: 99px; padding: 3px 10px; font-size: .78rem; cursor: pointer; color: var(--text); }
.hidden { display: none !important; }
.confirm { margin-top: 10px; padding: 10px; border: 1px dashed var(--warn); border-radius: 8px; }
.fcgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 10px; }
.fcw { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.fcw h3 { margin: 10px 0 4px; font-size: .7rem; }
.fch { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.fc4 { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; font-size: .82rem; }
.fc4 span:nth-child(odd) { color: var(--muted); }
.fc4 span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
.fc4 .b { font-weight: 800; }
.fcb { max-width: 360px; margin: 6px 0; }
table.fct td.l, table.fct th.l { white-space: normal; min-width: 128px; }
table.fct td { vertical-align: top; font-variant-numeric: tabular-nums; }
table.fct tr.in td { border-bottom: 0; }
table.fct tr.sal td { color: var(--muted); }
table.fct tr.wt td { font-weight: 800; }
table.fct tr.wt td .small { font-weight: 400; }
.fcp { color: var(--info); }
table.fct.ev tr.mon td { border-top: 2px solid var(--border); }
table.fct.ev tr.run td { background: color-mix(in srgb, var(--info) 8%, var(--panel)); }
table.fct.ev td .pill { margin-top: 3px; }
/* Hours for the office (Ash, 18 Oct 2026): big and readable, prints on its own */
.fresh { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 6px; font-size: .85rem; color: var(--muted); }
.fresh b { color: var(--text); }
.ofc-status { padding: 12px 14px; border-radius: 10px; margin-top: 10px; font-size: 1rem; border: 2px solid var(--border); }
.ofc-status.wait { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, var(--panel)); }
.ofc-status.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--panel)); }
.ofc-status ul, .ofc-checks ul { margin: 6px 0 0; padding-left: 20px; }
.ofc-status li, .ofc-checks li { margin: 3px 0; }
.ofc-checks { margin-top: 12px; padding: 10px 14px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--warn) 60%, var(--border)); font-size: .92rem; }
table.t.ofc { font-size: 1.05rem; }
table.t.ofc th, table.t.ofc td { padding: 11px 12px; }
table.t.ofc tbody tr:nth-child(even):not(.tot) td { background: color-mix(in srgb, var(--panel2) 55%, var(--panel)); }
table.t.ofc th .dd { display: block; font-weight: 500; font-size: .78rem; }
.ofc-h { margin: 0; font-size: 1.35rem; }
.ofc-pay { margin: 4px 0 0; font-size: .95rem; color: var(--muted); }
.titlebar .seg button { padding: 9px 14px; font-size: .92rem; }
.wkbar h2 { font-size: 1.1rem; }
.wkbtns { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.wkbtns .btn.on { border-color: var(--accent); color: var(--accent); }
.pill.pday { color: var(--accent); }
.wkline { margin: 4px 0 0; }
table.t.ofc th { font-size: .85rem; }
table.t.ofc td.name { font-size: 1.02rem; }
table.t.ofc td.big { font-weight: 800; font-size: 1.1rem; }
table.t.ofc td.notes { text-align: left; white-space: normal; min-width: 240px; font-size: .88rem; line-height: 1.35; }
table.t.ofc td.notes div + div { margin-top: 2px; }
.ofc-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.ofc-tools .btn { padding: 9px 16px; }
.printonly { display: none; }
@media print {
  html.office-view body > *:not(main) { display: none !important; }
  html.office-view main > *:not(#officeSheet) { display: none !important; }
  html.office-view .noprint { display: none !important; }
  html.office-view .printonly { display: inline !important; }
  html.office-view, html.office-view body { background: #fff !important; color: #000 !important; }
  html.office-view main { padding: 0; }
  html.office-view #officeSheet { border: 0; padding: 0; margin: 0; background: #fff; color: #000; }
  html.office-view #officeSheet .scroll { overflow: visible; }
  html.office-view table.t.ofc { font-size: 10.5pt; }
  html.office-view table.t.ofc th, html.office-view table.t.ofc td { padding: 4px 6px; border-bottom: 1px solid #999; color: #000; background: #fff !important; box-shadow: none; position: static; }
  html.office-view table.t.ofc tr.tot td { border-top: 2px solid #000; }
  html.office-view .ofc-status { background: #fff !important; color: #000; }
  @page { size: A4 landscape; margin: 10mm; }
}
/* 2.12: step 1, the project managers' check (from Weekly Hours 0.3, Ash, 22 Oct 2026: one hours screen, one approval) */
.hm-status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel2); margin-top: 10px; font-size: .95rem; }
.hm-status .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); flex: none; }
.hm-status.s-ok .dot { background: var(--ok); } .hm-status.s-late .dot { background: var(--danger); }
.hm-status.s-late { border-color: color-mix(in srgb, var(--danger) 55%, var(--border)); }
.hm-status .counts { margin-left: auto; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.hm-status .counts b { color: var(--text); }
.hm-step { display: inline-block; font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
.hm-info { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: .84rem; line-height: 1.4; margin: 8px 2px 0; }
.hm-info svg { width: 16px; height: 16px; flex: none; margin-top: 1px; color: var(--info); }
.hm-info b { color: var(--text); }
.hm-viewas { margin-top: 10px; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
.hm-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; }
.hm-filters { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.hm-filters button { min-height: 40px; padding: 6px 14px; border: 0; background: var(--panel2); color: var(--muted); font-weight: 700; font-size: .86rem; cursor: pointer; }
.hm-filters button + button { border-left: 1px solid var(--border); }
.hm-filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink,#1a1a1a); }
.hm-as { display: inline-flex; gap: 6px; align-items: center; } .hm-as select { min-height: 40px; }
.hm-toolbar .btn.go { min-height: 40px; }
details.hm-sites { margin-top: 10px; padding: 4px 14px; border: 1px solid var(--border); border-radius: 10px; }
details.hm-sites summary { min-height: 40px; display: flex; align-items: center; font-size: .92rem; }
.hm-siterow { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(200px, 1.6fr) 90px minmax(160px, 1.4fr); gap: 4px 12px; align-items: center; padding: 7px 0; border-top: 1px solid var(--border); font-size: .88rem; }
.hm-siterow .pill { justify-self: start; white-space: normal; }
@media (max-width: 900px) { .hm-siterow { grid-template-columns: 1fr 1fr; } }
table.t.ofc { font-variant-numeric: tabular-nums; }
table.t.ofc thead th:first-child { border-top-left-radius: 8px; } table.t.ofc thead th:last-child { border-top-right-radius: 8px; }

table.t.ofc td.name { padding: 4px 6px; }
.hm-pn { display: block; width: 100%; text-align: left; background: transparent; border: 0; color: inherit; border-radius: 8px; padding: 6px; min-height: 44px; cursor: pointer; font: inherit; }
.hm-pn:hover { background: var(--panel2); }

td.hm-chk { min-width: 220px; white-space: normal; }

.hm-pb { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.hm-pill { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 800; padding: 3px 9px; border-radius: 99px; background: var(--panel2); color: var(--muted); white-space: nowrap; }
.hm-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.hm-h { margin: 0 0 8px; font-size: 1.15rem; text-transform: none; letter-spacing: 0; color: var(--text); }

textarea.hm-note { width: 100%; min-height: 64px; }
@media (max-width: 640px) { .hm-status { display: block; } .hm-status .dot { display: inline-block; margin-right: 8px; vertical-align: 1px; } .hm-status .counts { display: block; margin: 4px 0 0; } td.hm-chk { min-width: 180px; } table.t.ofc td.name { white-space: normal; min-width: 108px; max-width: 128px; } .hm-pn { padding: 4px 2px; } .hm-pn b { font-size: .92rem; } .hm-pn small { display: none; } .hm-dc { min-width: 40px; } }

      hourly: w.hourly, sal: w.sal.length ? w.S2 : null, hourlyFig: w.partly ? 'Partly actual' : 'Estimate', mix: w.sal.length ? salFigMix(w.sal, x => x.pay.actual) : '', runWeek: !!w.sal.length, n: new Set(w.sal.map(x => x.s.id)).size });
  });
  lines.push({ label: 'A normal month', sub: 'hourly staff: the average week x 52 / 12' + (xs.length ? '; salaries: one normal month' : ''),
    hourly: payScale(A, 52 / 12), sal: xs.length ? SM : null, hourlyFig: 'Estimate', mix: xs.length ? salFigMix(xs, x => x.actual) : '', month: true, n: xs.length });
  const cells = (o, sal) => `<td>${gbp(o.net)}</td><td>${gbp(taxNI(o))}${sal ? `<div class="small muted evni">incl. salaried NI ${gbp(sal.eeNI + sal.erNI)}</div>` : ''}</td><td>${gbp(o.cost)}</td>`
    + (open ? `<td>${gbp(o.gross)}</td><td>${gbp(o.tax)}</td><td>${gbp(o.eeNI)}</td><td>${gbp(o.erNI)}</td>` : '');
  let rows = '';
  lines.forEach(L => {
    const tot = L.sal ? payAdd(L.hourly, L.sal) : L.hourly;
    const pill = L.hourlyFig === 'Partly actual' ? '<span class="pill fix">Partly actual</span>' : '<span class="pill est">Estimate</span>';
    rows += `<tr class="wt${L.month ? ' mon' : ''}${L.runWeek ? ' run' : ''}"><td class="l"><b>${esc(L.label)}</b><div class="small muted evsub">${L.date ? `<span class="evdate">${esc(L.date)}</span>` : ''}${L.sub ? `<span class="evmore">${L.date ? ': ' : ''}${esc(L.sub)}</span>` : ''}</div><div class="small">${pill} <span class="muted evmix">hourly staff${L.sal ? '; salaries: ' + esc(L.mix) : ''}</span></div></td>${cells(tot, L.sal)}</tr>`;
    if (open && L.sal) rows += `<tr class="in sal"><td class="l">Hourly staff</td>${cells(L.hourly, null)}</tr><tr class="in sal"><td class="l">Salaried staff (${L.n})<div class="small">their NI: employee ${gbp(L.sal.eeNI)}, employer ${gbp(L.sal.erNI)}</div></td>${cells(L.sal, null)}</tr>`;
  });
  const R = ratesFor(todayIso()), psX = xs.filter(x => x.actual);
  const psNames = psX.length ? [psX.map(x => x.s.name.split(' ')[0]).join(' and ') + [...new Set(psX.map(x => x.s.payslip && x.s.payslip.period ? ', ' + x.s.payslip.period.split(' ')[0] : ''))].join('')] : [];
  const toggle = `<button class="btn sm" type="button" data-act="fc-break" aria-expanded="${open}">${open ? 'Hide the breakdown' : 'Show the breakdown'}</button>`;
  return `<div class="card" id="everyoneCard"><div class="bar"><h2 style="margin:0">Everyone's pay</h2>${est}<span class="push small muted">hourly and salaried staff, every company, by payday</span></div>
    ${nextPayNote(S.fc)}<div class="scroll"><table class="t fct ev${open ? ' open' : ''}"><thead><tr><th class="l"></th><th>Money to staff</th><th>Tax and NI to pay</th><th>Total cost</th>${open ? '<th>Gross pay</th><th>Income tax</th><th>Employee NI</th><th>Employer NI</th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div>
    ${xs.length ? `<p class="small" id="salNiLine">Salaried staff's NI in a normal month: employee ${gbp(SM.eeNI)}, employer ${gbp(SM.erNI)}, together <b>${gbp(SM.eeNI + SM.erNI)}</b>. It is part of Tax and NI to pay above, with their income tax of ${gbp(SM.tax)}.</p>` : ''}
    <p class="small muted">Money to staff is what goes out the door to them (gross pay less income tax and employee NI). Tax and NI to pay is their income tax and employee NI plus the company's employer NI. Total cost is the two added together. <b>Payslip</b> = the figures on the last real payslip${psNames.length ? ' (' + esc(psNames.join(' and ')) + ')' : ''}. <b>Contract</b> = the salary in the contract, with tax and NI estimated. <b>Estimate</b> = worked out by this page on the Isle of Man ${esc(R.year)} tax and NI rates (see Rates), not a payslip.</p>
    ${toggle}</div>`;
}
/* Monday and Tuesday (2.11): the next payday pays last week, which is before the first row above, so say where it is */
function nextPayNote(F) {
  const nw = nextPayWeek();
  if (!F || nw >= F.thisMon) return '';
  return `<p class="small" id="nextPayNote"><b>${esc(paydayWord(nw))}: ${esc(dayMonYear(payRunOf(nw)))}</b>, for the ${esc(weekEndPaid(nw).replace(/^Week/, 'week').replace(/, paid .*$/, ''))}. Its real figures are in the week below${S.start === nw ? '' : ` <button class="btn sm" type="button" data-week="${nw}">Open it</button>`}. The rows above start with the week being worked now.</p>`;
}
function forecastHTML(est) {
  /* Ash, 13 Oct 2026: "key information at the top", "two numbers for each of the next 4 weeks", plus salaries in the
     week they're paid. Words: Money to staff (net), Tax and NI to pay (income tax, employee and employer NI), Total cost.
     Since 13 Oct (night) the top is one "Everyone's pay" card; the hourly cards below sit behind "Show the breakdown".
     Presentation only: the sums are the same as before. */
  const F = S.fc, open = !!S.fcBreak;
  const toggle = `<button class="btn sm" type="button" data-act="fc-break" aria-expanded="${open}">${open ? 'Hide the breakdown' : 'Show the breakdown'}</button>`;
  const taxNI = o => num(o.tax) + num(o.eeNI) + num(o.erNI);
  const top = `<div class="card" id="everyoneCard"><div class="bar"><h2 style="margin:0">Everyone's pay</h2>${est}<span class="push small muted">hourly and salaried staff, every company</span></div>`;
  if (!F || F.status === 'loading') return top + '<p class="muted small">Working out the average from the last approved weeks...</p></div>';
  if (F.status === 'error') return top + `<p class="small sev-bad">Couldn't work out the average: ${esc(F.msg)}</p></div>`;
  const A = F.avg, n = F.basis.length;
  if (!n) return top + '<p class="muted">No approved weeks yet to average.</p></div>';

  /* ---- the next 4 weeks ---- */
  /* 2.11: the same four Monday to Sunday weeks as before (from the week being worked now), each named by its payday */
  const curB = F.cur ? buildWeek(F.cur) : null;
  const weeks = [0, 1, 2, 3].map(i => {
    const mon = addDays(F.thisMon, i * 7), sun = addDays(mon, 6), pw = paydayWord(mon);
    const label = (/^(Next payday|This week's payday|Payday today)$/.test(pw) ? pw + ', ' : 'Payday ') + paidOn(mon);
    let hourly = { ...A }, how = 'the average week', partly = false;
    if (i === 0 && curB) {
      const wd = curB.dates.map((d, j) => ({ d, j })).filter(o => isWeekday(o.d));
      const missing = wd.filter(o => !(curB.dayTotals[o.j] > 0)).length, got = wd.length - missing;
      const weekendHrs = curB.dates.some((d, j) => !isWeekday(d) && curB.dayTotals[j] > 0);
      if (got || weekendHrs) {
        hourly = {}; FC_KEYS.forEach(k => hourly[k] = num(curB.T[k]) + A[k] * missing / 5);
        how = missing ? `real hours for ${got} day${got === 1 ? '' : 's'} so far, the average for the other ${missing}` : 'the real hours entered';
        partly = true;
      }
    }
    const sal = salariesBetween(mon, sun);
    const S2 = { gross: 0, net: 0, tax: 0, eeNI: 0, erNI: 0, cost: 0 };
    sal.forEach(x => { S2.gross += x.pay.gross; S2.net += x.pay.net; S2.tax += x.pay.tax; S2.eeNI += x.pay.eeNI; S2.erNI += x.pay.erNI; S2.cost += x.pay.cost; });
    const tot = {}; ['gross', 'net', 'tax', 'eeNI', 'erNI', 'cost'].forEach(k => tot[k] = num(hourly[k]) + S2[k]);
    return { label, mon, sun, hourly, how, partly, sal, S2, tot };
  });

  let h = everyoneHTML(A, weeks, est);
  if (!open) return h;

  /* ---- behind the breakdown: the hourly average week ---- */
  h += `<div class="card"><div class="bar"><h2 style="margin:0">An average week</h2>${est}<span class="push small muted">hourly staff</span></div>`;
  h += `<div class="cards">
      <div class="kpi"><div class="k">Money to staff</div><div class="v">${gbp(A.net)}</div><div class="s">to their bank accounts</div></div>
      <div class="kpi"><div class="k">Tax and NI to pay</div><div class="v">${gbp(taxNI(A))}</div><div class="s">to the Treasury</div></div>
      <div class="kpi"><div class="k">Total cost</div><div class="v">${gbp(A.cost)}</div><div class="s">the two added together</div></div>
      <div class="kpi"><div class="k">Hours paid</div><div class="v">${hrs(A.total)}h</div><div class="s">a week</div></div></div>
    <p class="small muted">Based on the average of the last ${n} ${F.draft ? 'weeks with hours. None are approved yet, so these are UNAPPROVED figures' : 'approved week' + (n > 1 ? 's' : '')} (${F.basis.slice().reverse().map(w => esc(fmtDay(w))).join(', ')}). Salaries are added in the next 4 paydays below.</p>
    ${salAvgHTML(A)}
    ${open ? `<div class="fc4 fcb"><span>Gross pay</span><span>${gbp(A.gross)}</span><span>Income tax</span><span>${gbp(A.tax)}</span><span>Employee NI</span><span>${gbp(A.eeNI)}</span><span>Employer NI</span><span>${gbp(A.erNI)}</span></div>
      <p class="small muted">Money to staff is gross pay less income tax and employee NI. Tax and NI to pay is income tax plus employee and employer NI. Total cost is gross pay plus employer NI. Up to ${FC_WEEKS} approved weeks are used${n < FC_WEEKS ? `; only ${n} ${n > 1 ? 'are' : 'is'} approved on the Monday weeks so far (they started on 14 Sep 2026)` : ''}.</p>` : ''}
    ${toggle}</div>`;

  const all = { gross: 0, net: 0, tax: 0, eeNI: 0, erNI: 0, cost: 0 };
  weeks.forEach(w => Object.keys(all).forEach(k => all[k] += w.tot[k]));
  const cells = o => `<td>${gbp(o.net)}</td><td>${gbp(taxNI(o))}</td><td>${gbp(o.cost)}</td>` + (open ? `<td>${gbp(o.gross)}</td><td>${gbp(o.tax)}</td><td>${gbp(o.eeNI)}</td><td>${gbp(o.erNI)}</td>` : '');
  let rows = '';
  weeks.forEach(w => {
    const head = `<b>${esc(w.label)}</b> <span class="small muted">week ending ${esc(dayName(w.sun) + ' ' + fmtDay(w.sun))}</span><div class="small ${w.partly ? 'fcp' : 'muted'}">${w.partly ? 'Partly actual' : 'Estimate'}</div>`
      + (open ? `<div class="small muted">Hourly staff from ${esc(w.how)}, about ${hrs(w.hourly.total)}h.</div>` : '');
    if (!w.sal.length) { rows += `<tr class="wt"><td class="l">${head}</td>${cells(w.tot)}</tr>`; return; }
    rows += `<tr class="in"><td class="l">${head}${open ? '' : '<div class="small muted">Hourly staff</div>'}</td>${cells(w.hourly)}</tr>`
      + `<tr class="in sal"><td class="l">+ salaries <span class="small muted">(${esc(salRunWords(w.sal))})</span>${open ? `<div class="small muted">${w.sal.map(x => esc(x.s.name) + ' (' + esc(companyName(x.s.company)) + ', ' + esc(figWord(x)) + (x.pay.part ? ', part month' : '') + ')').join('; ')}</div>` : ''}</td>${cells(w.S2)}</tr>`
      + `<tr class="wt"><td class="l">Week total, with salaries</td>${cells(w.tot)}</tr>`;
  });
  h += `<div class="card"><div class="bar"><h2 style="margin:0">The next 4 paydays</h2>${est}<span class="push small muted">hourly staff and salaries, from the week being worked now</span></div>
    <div class="scroll"><table class="t fct${open ? ' open' : ''}"><thead><tr><th class="l">Week</th><th>Money to staff</th><th>Tax and NI to pay</th><th>Total cost</th>${open ? '<th>Gross pay</th><th>Income tax</th><th>Employee NI</th><th>Employer NI</th>' : ''}</tr></thead>
    <tbody>${rows}<tr class="tot"><td class="l">4 paydays total</td>${cells(all)}</tr></tbody></table></div>
    <p class="small muted">These are estimates, not payslips, worked out on the Isle of Man tax and NI rates (see Rates below). Estimate rows use the average week above. Partly actual means the real hours so far in the week being worked now, with the average for the days still to come. Salaries come from the salary list (every company): each person is paid once a month, and the payment is shown in ${esc(PAY_RULES[payRule()])} (${esc(WEEKDAYS[payWeekday()])}s; see How salaries are paid, under Salaried staff).${(S.W.salaries || []).some(x => x.active !== false) ? '' : ' No salaries have been entered yet, so none are included.'}</p>
    ${toggle}</div>`;
  return h;
}

/* ============================== render ============================== */
function render() {
  const W = S.W, me = S.me;
  if (!W) return;
  const B = buildWeek(W); S.B = B;
  const view = S.view;
  document.documentElement.classList.toggle('office-view', view === 'office');
  const approved = B.approved, a = W.approval;
  const canExport = approved || me.approve || me.director;
  const nowMon = mondayOf(todayIso()), notOver = addDays(B.start, 6) >= todayIso();
  const est = '<span class="pill est" title="Worked out by this page from the rates below. Not a payslip.">ESTIMATE</span>';
  const draft = approved ? '' : ' <span class="pill draft">UNAPPROVED</span>';
  let h = '';

  h += `<div class="bar titlebar"><h1>Accounts</h1><span class="muted small ver">${esc(ACC_VERSION)}${TEST ? ' &middot; TEST DATA' : ''}</span>
    <span class="push"></span>
    <div class="seg" role="group" aria-label="Which company">${[['office', 'DGC and Silverdale hours'], ['dgc', 'Approve and pay'], ['silverdale', 'Silverdale only']].filter(([k]) => k === 'office' || !(S.pmMode || S.asPm)).map(([k, l]) => `<button type="button" data-view="${k}" class="${view === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <button class="btn sm" type="button" data-act="theme">Light / dark</button></div>`;
  /* ---- an average week and the next 4 weeks, at the top (Ash, 12 Oct 2026, night; moved up 13 Oct 2026) ---- */
  if (B.money && view === 'dgc') { h += forecastHTML(est); if (!S.fc) setTimeout(loadForecast, 0); }
  /* 2.11: every week is named by its week ending and its payday; "this week" only for a payday in today's week */
  const nowWk = mondayOf(todayIso()), nextWk = nextPayWeek(), lastWk = lastPayWeek();
  h += `<div class="bar wkbar" style="margin-top:10px"><button class="btn" type="button" data-act="prev" aria-label="Previous week">&lsaquo;</button>
    ${view === 'office' ? '' : `<h2 style="margin:0">${esc(weekEndPaid(B.start))}</h2>`}
    <button class="btn" type="button" data-act="next" aria-label="Next week">&rsaquo;</button>
    <span class="wkbtns"><button class="btn sm${B.start === lastWk ? ' on' : ''}" type="button" data-act="last" title="${esc(weekEndPaid(lastWk))}">Last payday, ${esc(paidOn(lastWk))}</button><button class="btn sm${B.start === nextWk ? ' on' : ''}" type="button" data-act="nextpay" title="${esc(weekEndPaid(nextWk))}">${payRunOf(nextWk) === todayIso() ? 'Payday today' : 'Next payday'}, ${esc(paidOn(nextWk))}</button>${nowWk !== nextWk ? `<button class="btn sm${B.start === nowWk ? ' on' : ''}" type="button" data-act="this" title="${esc(weekEndPaid(nowWk))}">Week being worked</button>` : ''}</span></div>
    ${view === 'office' ? '' : `<p class="small muted wkline">${esc(fmtRange(B.start))}. <b>${esc(paydayWord(B.start))}.</b></p>`}
    ${(W.unapprovedWeeks || []).filter(w => w !== B.start).length ? `<div class="bar"><span class="small muted">Also waiting for approval:</span><span class="chips">${W.unapprovedWeeks.filter(w => w !== B.start).map(w => `<button class="chip" type="button" data-week="${w}">${esc(weekEndPaid(w))}</button>`).join('')}</span></div>` : ''}`;
  h += freshHTML(W, B);
  const foot = `<p class="small muted noprint" style="margin-top:14px">${esc(ACC_VERSION)}. Signed in as ${esc(me.name || me.email)}${me.approve ? ' (approver)' : ''}. Pay data is read through Accounts only; the Planner's own tables stay locked.</p>`;
  /* ---- Hours for the office (Ash, 18 Oct 2026): just the hours, to hand to the office for wages ---- */
  if (view === 'office') {
    if (S.msg) h += `<div class="msg ${S.msgKind}">${esc(S.msg)}</div>`;
    $('#app').innerHTML = h + officeHTML(B, me) + foot;

  }

  /* ---- approval status ---- */
  if (view === 'dgc') {
    if (approved) {
      h += `<div class="status ok"><b class="big">Approved</b><span>by ${esc(nameOf(a.by))} on ${esc(fmtWhen(a.at))}. These hours have gone to accounts.</span>
        ${W.approvalLog.length > 1 ? `<details class="small" style="flex-basis:100%"><summary>Approval history</summary>${approvalLogHTML(W)}</details>` : ''}
        ${checkLineHTML(B)}
        ${reopenHTML(B, a)}
        ${B.suggestions.length ? `<span class="small sev-warn" style="flex-basis:100%"><b>${B.suggestions.length} ${B.suggestions.length === 1 ? 'day looks' : 'days look'} wrong in the approved week on screen.</b> If the pay was short or over, ${me.director ? 'use <b>Record a correction</b> below' : 'ask Ash or Harry to record a correction'}: it is paid in the next pay run as its own line, and the approved week stays exactly as it was sent.</span>` : ''}
        ${B.fixedHere.length ? `<span class="small" style="flex-basis:100%;color:var(--info)">${B.fixedHere.length} correction${B.fixedHere.length === 1 ? '' : 's'} recorded against the week on screen (see Corrections below).</span>` : ''}</div>`;
    } else {
      h += `<div class="status wait"><b class="big">Waiting for approval</b><span>${me.approve ? 'Check the hours and anything flagged below, then approve them. Accounts only treat them as final once approved.' : esc(((W.approvers || []).filter(p => p.active).map(p => p.name.split(' ')[0]).join(' or ') || 'An approver') + ' still need to approve these hours. The figures below are a draft and may change.')}</span>
        ${notOver ? `<span class="small" style="flex-basis:100%">The week isn't over yet (it ends ${esc(dayMonYear(addDays(B.start, 6)))}).</span>` : ''}
        ${me.approve ? (S.approveAsk
          ? `<div class="confirm" style="flex-basis:100%"><b>Approve ${esc(weekLabel(B.start))}?</b> ${B.rows.length} people, ${hrs(B.T.total)} paid hours${gateItems(B).length ? `, <span class="sev-warn">${gateItems(B).length} still to check</span>` : ''}.${gateHTML(B)}<div class="bar" style="margin-top:8px"><button class="btn go" type="button" data-act="approve-yes" id="approveYes"${gateItems(B).length && !S.gateOk ? ' disabled' : ''}>Yes, approve the hours</button><button class="btn" type="button" data-act="approve-no">Cancel</button></div></div>`

        ${checkLineHTML(B)}

    }
  }
  if (S.msg) h += `<div class="msg ${S.msgKind}">${esc(S.msg)}</div>`;

  const sal = B.money ? salaryRows(view) : [];
  if (B.money && view === 'dgc') {
    h += `<div class="card"><div class="bar"><h2 style="margin:0">Pay on ${esc(dayMonYear(payRunOf(B.start)))}</h2>${est}${draft}<span class="push small muted">Tax year ${esc(B.R.year)}${B.R.missingYear ? ` <span class="pill unv">no ${esc(B.R.wanted)} rates yet: using ${esc(B.R.year)}</span>` : ''}</span></div>
      <div class="cards">
        <div class="kpi${approved ? '' : ' draftmark'}"><div class="k">Money to staff</div><div class="v">${gbp(B.T.net)}</div><div class="s">what they receive${B.T.advances ? `; ${gbp(B.T.advances)} already paid as advances, so ${gbp(B.T.toPay)} left to pay` : ''}</div></div>
        <div class="kpi${approved ? '' : ' draftmark'}"><div class="k">Tax and NI to pay</div><div class="v">${gbp(B.T.tax + B.T.eeNI + B.T.erNI)}</div><div class="s">income tax ${gbp(B.T.tax)}, employee NI ${gbp(B.T.eeNI)}, employer NI ${gbp(B.T.erNI)}</div></div>
        <div class="kpi${approved ? '' : ' draftmark'}"><div class="k">Total cost</div><div class="v">${gbp(B.T.cost)}</div><div class="s">gross pay ${gbp(B.T.gross)} plus employer NI</div></div>
        <div class="kpi"><div class="k">Hours paid</div><div class="v">${hrs(B.T.total)}h</div><div class="s">${hrs(B.T.worked)}h worked, ${hrs(B.T.leavePaid)}h paid leave and bank holiday, ${hrs(B.T.ot)}h overtime; ${B.rows.length} people</div></div>
        ${B.adjAll.length ? `<div class="kpi" style="border-color:var(--info)"><div class="k">Corrections from earlier weeks</div><div class="v" style="color:var(--info)">${B.T.adjGross >= 0 ? '+' : ''}${gbp(B.T.adjGross)}</div><div class="s">${B.T.adjHours >= 0 ? '+' : ''}${hrs(B.T.adjHours)}h on ${B.adjAll.length} line${B.adjAll.length === 1 ? '' : 's'}, gross, already in the figures here. See Corrections below.</div></div>` : ''}
      </div>
      ${salThisRunHTML(B)}
      ${B.R.unverified.length ? `<p class="small sev-warn">[UNVERIFIED] ${B.R.unverified.map(r => esc(r.label)).join('; ')}. See Rates below.</p>` : ''}
      <p class="small muted">Estimate only, not a payslip. Isle of Man rates for ${esc(B.R.year)} from gov.im (see Rates). Everyone is on the standard single-person allowance unless accounts set their own. Income tax uses a normal week (a day off is averaged out) so a short week doesn't drop anyone into a lower band; NI is worked out on the week's pay. Advances already paid are taken off what's left to pay.</p></div>`;
  }


  /* ---- hours grid ---- */
  if (view === 'dgc') {
    h += `<div class="card"><div class="bar"><h2 style="margin:0">Hours</h2>${draft}<span class="push small muted">Click a name for the daily detail. <span class="tick">&#10003;</span> = they pressed Send on the Timesheet app.</span></div><div class="scroll"><table class="t" id="hoursTable"><thead><tr><th class="l">Name</th>${B.dates.map(d => `<th class="c${isWeekday(d) ? '' : ' wk'}">${dayName(d)}<br>${fmtDay(d)}</th>`).join('')}<th>Worked</th><th>Leave/BH</th><th>OT</th><th>Total</th></tr></thead><tbody>`;
    B.rows.forEach(r => {
      const open = S.open.has(r.s.id);

function corrPaid(sid, date) {

/* everything still amber or "?" that the approver must tick off before approving (Ash: "That should have been flagged earlier") */
function gateItems(B) {
  const out = [];
  B.rows.forEach(r => r.days.forEach(x => {
    const bits = [];
    if (x.flags.includes('missing')) bits.push('no hours on a working day ("?")');
    if (x.flags.includes('dayworks')) { const sh = x.dayworks.reduce((a, y) => a + num(y.billedHours != null ? y.billedHours : y.hours), 0); bits.push('the paper dayworks sheet says ' + hrs(sh) + 'h, the pay hours say ' + hrs(x.worked) + 'h'); }
    if (x.flags.includes('twice')) bits.push('the grid and their own timesheet disagree');
    if (x.flags.includes('long')) bits.push('long day, ' + hrs(x.value) + 'h');
    if (x.flags.includes('leave')) bits.push('hours on a day booked as leave');
    if (bits.length) out.push({ name: r.s.name, staffId: r.s.id, date: x.date, text: dayName(x.date) + ' ' + fmtDay(x.date) + ': ' + bits.join('; ') });
  }));
  /* 2.12: step 1 first. Anyone with hours this week who no project manager has checked is listed, so the approver either
     waits for the check or ticks that he has checked them himself (the list is kept in acc_approval_checks, as before). */
  checkRows(B).filter(c => c.needs && !c.approved).forEach(c => out.push({ name: c.r.s.name, staffId: c.r.s.id, date: '', text: 'not checked by a project manager yet (step 1, on DGC and Silverdale hours)' }));

  return `<div class="confirm" style="flex-basis:100%" id="reopenForm"><b>Open ${esc(weekLabel(B.start))} again?</b>
        <p class="small" style="margin:6px 0">${paidLine}</p>
        <p class="small muted" style="margin:6px 0">Nothing is deleted: the approval stays in the history, with this beside it (who, when, where and why). The week shows as waiting for approval until someone approves it again.</p>
        <label class="small" style="display:block">Why (required)<textarea id="reopenWhy" style="width:100%;min-height:56px" placeholder="For example: Lee Duffy's Friday is wrong">${esc(S.reopenWhy || '')}</textarea></label>
        <div class="bar" style="margin-top:8px"><button class="btn primary" type="button" data-act="reopen-yes" id="reopenYes">Yes, open it again</button><button class="btn" type="button" data-act="reopen-no">Cancel</button></div></div>`;
}
function say(m, k) { S.msg = m; S.msgKind = k || ''; const el = document.querySelector('.msg'); if (el) { el.textContent = m; el.className = 'msg ' + (k || ''); } else render(); }
async function goWeek(start, auto) { if (!auto) S.picked = true; S.start = start; S.approveAsk = false; S.reopenAsk = false; S.open.clear(); S.msg = ''; history.replaceState(null, '', '#week=' + start); await reload(); await refreshHandle(); }
/* Weekly Hours sends a director here with a correction filled in (Ash, 17 Oct 2026):
   #week=YYYY-MM-DD&correct=<staff id>|<day>|<should have been>|<why>. It only fills the form, once; nothing is saved
   until Save the correction, which goes through acc_correction_add as before. */
function correctFromHash() {
  const m = /[#&]correct=([^&]+)/.exec(location.hash); if (!m) return null;
  let parts; try { parts = decodeURIComponent(m[1]).split('|'); } catch (e) { return null; }
  const [staffId, date, newH, ...why] = parts;
  if (!/^[0-9a-f-]{36}$/i.test(staffId || '') || !/^\d{4}-\d{2}-\d{2}$/.test(date || '')) return null;
  const n = newH === '' || newH == null ? null : Number(newH);
  return { staffId, date, newHours: n != null && isFinite(n) ? n : null, reason: why.join('|') };
}
function applyPendingCorr() {
  const c = S.pendingCorr; if (!c || !S.B || mondayOf(c.date) !== S.start) return;
  S.pendingCorr = null;
  if (!S.me || !S.me.director) { say('Only a director can record a correction.', 'err'); return; }
  if (!S.B.approved) { say('That week is not approved for pay yet, so change the hours on the Staff screen instead.', 'err'); return; }
  if ((S.B.fixedHere || []).some(f => f.staffId === c.staffId && f.date === c.date)) { say('There is already a correction for that day (see Corrections). Cancel it first if it is wrong.', 'err'); return; }
  if (!S.B.rows.some(r => r.s.id === c.staffId)) { say('That person is not in that week.', 'err'); return; }
  S.view = 'dgc';
  S.corr = { staffId: c.staffId, date: c.date, oldHours: corrPaid(c.staffId, c.date), newHours: c.newHours, reason: c.reason, evidence: '' };
  render(); const f = $('#corrForm'); if (f) f.scrollIntoView({ block: 'center' });
}
/* 2.12: one place that reads a week. A project manager without Accounts (or a director using See it as) gets
   acc_pm_week: only his people, no money at all. Everyone who does the project managers' check (step 1) also gets
   dgc_wh_week, the same answer Weekly Hours used, for the Check column. Nothing here changes how the hours add up. */
const NO_CORR = e => ({ paidHere: [], madeHere: [], checks: [], error: e && e.message });
async function loadWeekData(start) {
  const pm = S.pmMode || !!S.asPm;
  const [W, C, wh] = await Promise.all([
    pm ? rpc('acc_pm_week', { p_start: start, p_as: S.asPm }) : rpc('acc_week', { p_start: start }),
    pm ? Promise.resolve(NO_CORR()) : rpc('acc_corrections_for', { p_start: start }).catch(NO_CORR),
    S.whOn ? rpc('dgc_wh_week', { p_start: start, p_as: S.asPm }).catch(e => ({ __err: e.message || 'not read' })) : Promise.resolve(null)]);
  return [W, C, wh];
}
function takeWh(wh) { if (wh && wh.__err) { S.wh = null; S.whErr = wh.__err; } else { S.wh = wh; S.whErr = ''; } S.whReady = true; }
const whSig = wh => wh && !wh.__err ? JSON.stringify((wh.people || []).map(p => [p.id, (p.approvals || []).length, (p.history || []).length])) : '';
async function reload(keepMsg) {
  try {
    const [W, C, wh] = await loadWeekData(S.start);
    W.corrections = C; S.W = W; takeWh(wh); S.sig = weekSig(W, C) + whSig(wh); S.loadedAt = Date.now(); if (!keepMsg) S.msg = ''; render();
    applyPendingCorr();
  }
  catch (e) { $('#app').innerHTML = `<div class="card"><h2>Couldn't load the week</h2><p>${esc(e.message)}</p><button class="btn" type="button" data-act="retry">Try again</button></div>`; }
}
async function loadPaySet() {
  try { const r = await rpc('acc_settings_get'); if (r && r.salary_run) S.paySet = { weekday: 2, rule: 'nearest', ...r.salary_run }; } catch (e) { /* keep the default: Tuesday, nearest */ }
}
async function saveSalary(patch) {
  try { await rpc('acc_salary_save', { p: patch }); S.editSalary = null; say('Saved.', 'ok'); await reload(true); }
  catch (e) { say('Not saved: ' + e.message, 'err'); }
}
document.addEventListener('click', async ev => {
  const t = ev.target.closest('button, tr.person'); if (!t) return;
  const d = t.dataset;
  if (d.tsName) { ev.stopPropagation(); openTimesheet(d.tsName, d.tsDate); return; }
  if (t.matches('tr.person')) { const id = d.person; S.open.has(id) ? S.open.delete(id) : S.open.add(id); render(); return; }
  /* 2.12: step 1, the project managers' check */
  if (d.hmperson) { hmPerson(d.hmperson); return; }
  if (d.hmday) { const i = d.hmday.indexOf('|'); hmDay(d.hmday.slice(0, i), d.hmday.slice(i + 1)); return; }
  if (d.hmappr) { hmApprove([d.hmappr]); return; }
  if (d.hmunappr) { hmUnapprove(d.hmunappr); return; }
  if (d.hmf) { S.whFilter = d.hmf; render(); return; }
  if (d.act === 'hm-close') { hmClose(); return; }
  if (d.act === 'hm-see') { hmClose(); openTimesheet(d.name, d.date); return; }
  if (d.act === 'hm-appr-all') { const ids = [...document.querySelectorAll('#officeTable [data-hmappr]')].map(b => b.dataset.hmappr); if (ids.length) hmApprove(ids); return; }
  if (d.act === 'hm-appr-go') return hmApproveGo(t);
  if (d.act === 'hm-unappr-go') return hmUnapproveGo(t);
  if (d.act === 'hm-asme') { S.asPm = null; S.whFilter = 'all'; return reload(); }
  if (d.view && d.view !== 'office' && (S.pmMode || S.asPm)) return;
  if (d.view) { S.view = d.view; window.scrollTo(0, 0); if (!S.picked && S.start !== defaultWeek(S.view)) return goWeek(defaultWeek(S.view), true); render(); return; } /* 2.11: no week picked yet, so the hours show the week being worked and the pay the next payday */
  if (d.week) return goWeek(d.week);
  if (d.taxedit) { S.editTax = d.taxedit; render(); return; }
  if (d.taxsave) {
    const allow = $('#txAllow').value.trim();
    try { await rpc('acc_person_set', { p_key: d.taxsave, p_allowance: allow === '' ? null : Number(allow), p_ni: $('#txNi').value, p_note: $('#txNote').value }); S.editTax = null; say('Tax settings saved.', 'ok'); await reload(true); }
    catch (e) { say('Not saved: ' + e.message, 'err'); } return;
  }
  if (d.rateedit) { S.editRate = d.rateedit; render(); return; }
  if (d.ratesave) {
    const [year, key] = d.ratesave.split('|');
    try { await rpc('acc_rate_set', { p_year: year, p_key: key, p_value: Number($('#rtVal').value), p_source: null, p_checked: $('#rtDate').value || null, p_verified: $('#rtOk').checked, p_note: null }); S.editRate = null; say('Rate saved.', 'ok'); await reload(true); }
    catch (e) { say('Not saved: ' + e.message, 'err'); } return;
  }
  if (d.saledit) { S.editSalary = d.saledit; render(); return; }
  if (d.saladd) { S.editSalary = 'staff:' + d.saladd; render(); return; }
  if (d.salon) { const s = S.W.salaries.find(x => x.id === d.salon); if (s) await saveSalary({ ...s, active: true }); return; }
  if (d.corrpre != null) { const x = S.B.suggestions[Number(d.corrpre)]; if (x) { S.corr = { ...x }; render(); const f = $('#corrForm'); if (f) f.scrollIntoView({ block: 'center' }); } return; }
  if (d.corrfor) { const [sid, dt] = d.corrfor.split('|'); const x = S.B.suggestions.find(y => y.staffId === sid && y.date === dt) || { staffId: sid, date: dt, oldHours: corrPaid(sid, dt), newHours: null, reason: '', evidence: '' }; S.corr = { ...x }; render(); const f = $('#corrForm'); if (f) f.scrollIntoView({ block: 'center' }); return; }
  if (d.corrcancel) {
    const why = window.prompt('Why is this correction being cancelled? (It is kept, marked cancelled.)', '');
    if (why == null) return;
    try { await rpc('acc_correction_cancel', { p_id: Number(d.corrcancel), p_reason: why }); say('Correction cancelled. It stays on record.', 'ok'); await reload(true); } catch (e) { say('Not cancelled: ' + e.message, 'err'); } return;
  }
  if (d.approver) {
    const p = S.W.approvers.find(x => x.email === d.approver);
    try { await rpc('acc_approver_set', { p_email: p.email, p_name: p.name, p_active: d.on === '1' }); say('Approvers updated.', 'ok'); await reload(true); } catch (e) { say('Not saved: ' + e.message, 'err'); } return;
  }
  switch (d.act) {
    case 'prev': return goWeek(addDays(S.start, -7));
    case 'next': return goWeek(addDays(S.start, 7));
    case 'last': return goWeek(lastPayWeek());
    case 'nextpay': return goWeek(nextPayWeek());
    case 'this': return goWeek(mondayOf(todayIso()));
    case 'retry': return reload();
    case 'refresh': { t.disabled = true; const y = window.scrollY; await reload(true); window.scrollTo(0, y); return; }
    case 'ofc-print': return officePrint();
    case 'ofc-excel': return officeExcel();
    case 'ofc-csv': return officeCsv();
    case 'ofc-copy': return officeCopy();
    case 'theme': if (typeof toggleTheme === 'function') toggleTheme(); return;
    case 'fc-break': S.fcBreak = !S.fcBreak; render(); return;
    case 'approve': S.approveAsk = true; render(); return;
    case 'approve-no': S.approveAsk = false; S.gateOk = false; render(); return;
    case 'reopen': S.reopenAsk = true; render(); { const w = $('#reopenWhy'); if (w) w.focus(); } return;
    case 'reopen-no': S.reopenAsk = false; render(); return;
    case 'reopen-yes': {
      const why = ($('#reopenWhy') || {}).value || '';
      if (!why.trim()) { say('Say why the week is being opened again first.', 'err'); const w = $('#reopenWhy'); if (w) w.focus(); return; }
      t.disabled = true;
      try { const r = await rpc('acc_unapprove', { p_start: S.start, p_reason: why.trim() });
        S.reopenAsk = false; S.reopenWhy = ''; S.fc = null; await reload(true); say(r && r.already ? 'That week was already open.' : 'Opened again. The approval and why it was opened are kept in the history. Approve it again when the hours are right.', 'ok');
        try { if (window.top !== window.self) window.top.postMessage({ type: 'acc-approved', periodStart: S.start, reopened: true }, location.origin); } catch (e) {} }
      catch (e) { t.disabled = false; say('Not opened again: ' + e.message, 'err'); }
      return;
    }
    case 'corr-new': S.corr = { staffId: '', date: '', oldHours: 0, newHours: null, reason: '', evidence: '' }; render(); return;
    case 'corr-cancel-form': S.corr = null; render(); return;
    case 'corr-save': return saveCorrection(t);
    case 'approve-yes':
      t.disabled = true;
      const items = gateItems(S.B);
      if (items.length && !S.gateOk) { say('Tick the box to say you have checked the items listed first.', 'err'); t.disabled = false; return; }
      try { const r = await rpc('acc_approve_checked', { p_start: S.start, p_items: items.map(x => ({ name: x.name, date: x.date, text: x.text })) })
          .catch(e => (/acc_approve_checked|PGRST202|schema cache/i.test(e.message + ' ' + (e.code || '')) ? rpc('acc_approve', { p_start: S.start }) : Promise.reject(e)));
        S.approveAsk = false; S.gateOk = false; S.fc = null; await reload(true); say(r && r.already ? 'That week was already approved.' : 'Approved. Accounts can now pay these hours.', 'ok');
        try { if (window.parent !== window) window.parent.postMessage({ type: 'acc-approved', periodStart: S.start }, location.origin); } catch (e) {} }
      catch (e) { t.disabled = false; say('Not approved: ' + e.message, 'err'); }
      return;
    case 'excel': return doExcel();
    case 'excel-change': await dropHandle(weekKey()); await refreshHandle(); return;
    case 'csv': return doCsv();
    case 'tax-cancel': S.editTax = null; render(); return;
    case 'rate-cancel': S.editRate = null; render(); return;
    case 'sal-new': S.editSalary = 'new'; render(); return;
    case 'payset-save': {
      const v = { weekday: Number($('#psDay').value), rule: $('#psRule').value };
      try { await rpc('acc_setting_set', { p_key: 'salary_run', p_value: v }); await loadPaySet(); S.editPaySet = true; S.fc = null; say('Saved: salaries now show in ' + PAY_RULES[v.rule] + ' (' + WEEKDAYS[v.weekday] + 's).', 'ok'); render(); }
      catch (e) { say('Not saved: ' + e.message, 'err'); } return;
    }
    case 'sal-cancel': S.editSalary = null; render(); return;
    case 'sal-save': return saveSalary({ id: $('#slId').value, name: $('#slName').value, company: $('#slCo').value, job_title: $('#slJob').value, annual_salary: $('#slYear').value, monthly_amount: $('#slMonth').value, pay_day: $('#slDay').value, start_date: $('#slStart').value, note: $('#slNote').value, staff_id: $('#slStaff').value, active: true, figure_status: $('#slFig').value, source: $('#slSrc').value, next_annual_salary: $('#slNext').value, next_from: $('#slNextFrom').value });
    case 'sal-off': { const s = S.W.salaries.find(x => x.id === $('#slId').value); if (s) return saveSalary({ ...s, active: false }); return; }
    case 'approver-add': {
      const email = $('#apEmail').value.trim(), name = $('#apName').value.trim();
      try { await rpc('acc_approver_set', { p_email: email, p_name: name, p_active: true }); S.editApprovers = true; say('Approver added.', 'ok'); await reload(true); } catch (e) { say('Not added: ' + e.message, 'err'); } return;
    }
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'officePay') { S.officePay = t.checked; render(); return; }
  if (t.id === 'hmAs') { S.asPm = t.value || null; S.whFilter = 'all'; S.view = 'office'; reload(); return; }
  if (t.id === 'gateOk') { S.gateOk = t.checked; const b = $('#approveYes'); if (b) b.disabled = !t.checked; return; }
  if (t.id === 'cfPerson' || t.id === 'cfDay') { corrFromForm(); render(); const f = $('#corrForm'); if (f) f.scrollIntoView({ block: 'center' }); return; }
});
document.addEventListener('input', ev => { if (ev.target.id === 'cfNew') corrPreview(); if (ev.target.id === 'reopenWhy') S.reopenWhy = ev.target.value; });
window.addEventListener('hashchange', () => { S.pendingCorr = correctFromHash() || S.pendingCorr; const s = pickStartFromHash(); if (s && s !== S.start) { S.focusApprove = /approve/.test(location.hash); goWeek(s); } else applyPendingCorr(); });

/* ============================== start ============================== */
(async function boot() {
  if (!TEST) {
    const sess = await ensureLoggedIn();
    if (!sess) {
      const waitLogin = showLoginForm($('#app'), 'Accounts');
      const h = $('#app h2'); if (h) h.textContent = 'Accounts: please sign in';
      await waitLogin;
    }
  }
  try { S.me = await rpc('acc_me'); }
  catch (e) { $('#app').innerHTML = `<div class="card"><h2>Accounts</h2><p>${esc(e.message)}</p></div>`; return; }
  /* 2.12 (Ash, 22 Oct 2026: "Merge Weekly Hours into Accounts, so there's one hours screen and one approval"): the
     project managers' check (step 1) is on the hours tab. Who does it is decided by the database (dgc_wh_who): John and the
     directors for everyone, each project manager for the people on his sites. A project manager with no Accounts login gets
     the hours tab only, his people only and no money (acc_pm_week). */
  try { S.who = await rpc('dgc_wh_who', { p_as: null }); } catch (e) { S.who = null; }
  S.whOn = !!(S.who && (S.who.lead || S.who.manager));
  if ((!S.me || !S.me.hours) && S.whOn) {
    S.pmMode = true;
    S.me = { email: S.who.email, name: S.who.name, role: 'pm', hours: true, money: false, approve: false, director: false, pm: true };
  }
  if (!S.me || !S.me.hours) {
    $('#app').innerHTML = `<div class="card"><h2>Accounts</h2><p>This login (${esc((S.me && S.me.email) || 'not signed in')}) can't open Accounts.</p><p class="muted">Accounts is for the directors, the hours approvers, the project managers (for the people on their sites) and people with the Accounts app and "Can see money" both switched on. Ask Ash or Harry if you need it.</p><button class="btn" type="button" onclick="logout()">Sign out</button></div>`;
    return;
  }
  /* Ash, 22 Oct 2026: "I want it preset to hours for everyone, so the first one that comes up is hours for DGC and
     Silverdale." Everyone opens on DGC and Silverdale hours for the week paid on the next payday (Mon 19 to Sun 25 Oct on
     Thu 22 Oct, paid Tue 27 Oct), whatever was open last time. Until 2.11 a director's last view was kept, and that view opened on the week just
     gone (12 to 18 Oct on Thu 22 Oct, already paid on Tue 20 Oct). A link to approve or correct a week still opens Approve and pay. */
  const fromHash = pickStartFromHash();
  S.pendingCorr = correctFromHash();
  S.focusApprove = /approve/.test(location.hash);
  S.view = (S.focusApprove || S.pendingCorr) && (S.me.approve || S.me.director) && !S.pmMode ? 'dgc' : 'office';
  S.picked = !!fromHash; S.day = todayIso();
  S.start = fromHash || defaultWeek(S.view);
  await loadPaySet();
  await reload(); await refreshHandle();
})();
</script>
