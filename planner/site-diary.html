<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Diary</title>
<script src="../staff/config.js"></script>
<script src="../staff/auth.js"></script>
<script src="theme.js"></script>
<style>
:root {
  --bg:#0f1117;--surf:#1a1d27;--surf2:#222636;--bord:#2e3347;
  --accent:#f59e0b;--text:#e2e8f0;--muted:#64748b;
  --green:#22c55e;--red:#ef4444;--blue:#3b82f6;
}
[data-theme="light"] {
  --bg:#f0f4f8;--surf:#ffffff;--surf2:#e4ecf4;--bord:#b8ccd8;
  --accent:#e08a00;--text:#1a2b3c;--muted:#5c7a94;
  --green:#16a34a;--red:#dc2626;--blue:#2563eb;
}
[data-theme="light"] .topbar{background:#1b2a3b;border-bottom-color:#0d1a26}
[data-theme="light"] .topbar h1{color:#f59e0b}
[data-theme="light"] .back-btn{color:#8ab0cc;border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.08)}
[data-theme="light"] .new-btn{background:#f59e0b}
[data-theme="light"] .theme-toggle-btn{color:#cde0f5;border-color:rgba(255,255,255,.2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}

.topbar{background:var(--surf);border-bottom:1px solid var(--bord);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.topbar h1{font-size:1rem;font-weight:700;color:var(--accent);flex:1}
.back-btn{display:flex;align-items:center;gap:6px;background:var(--surf2);border:1px solid var(--bord);border-radius:7px;padding:6px 12px;color:var(--muted);font-size:0.82rem;font-weight:600;text-decoration:none;white-space:nowrap;transition:all .15s;font-family:inherit}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}

.layout{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 49px)}
@media(max-width:700px){.layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}}

/* ── Left panel: entry list ── */
.list-panel{border-right:1px solid var(--bord);display:flex;flex-direction:column}
.list-header{padding:12px 14px;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.list-header input,.list-header select{background:var(--surf2);border:1px solid var(--bord);border-radius:6px;padding:6px 10px;color:var(--text);font-size:0.82rem;font-family:inherit}
.list-header input{flex:1;min-width:120px}
.list-scroll{overflow-y:auto;flex:1}

.entry-card{padding:12px 14px;border-bottom:1px solid var(--bord);cursor:pointer;transition:background .1s}
.entry-card:hover,.entry-card.selected{background:var(--surf2)}
.entry-card .ec-date{font-size:0.78rem;color:var(--muted)}
.entry-card .ec-site{font-weight:700;font-size:0.95rem;margin:2px 0}
.entry-card .ec-preview{font-size:0.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-card .ec-author{font-size:0.75rem;color:var(--muted);margin-top:4px}

/* ── Right panel: form / view ── */
.form-panel{padding:20px 24px;overflow-y:auto}

.new-btn{background:var(--accent);color:#1a1d27;border:none;padding:8px 18px;border-radius:6px;font-size:0.85rem;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.new-btn:hover{background:#fbbf24}

.section-title{font-size:0.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:10px;margin-top:20px}
.section-title:first-child{margin-top:0}

label{display:flex;flex-direction:column;gap:4px;font-size:0.82rem;color:var(--muted);margin-bottom:10px}
input[type=text],input[type=date],textarea,select{background:var(--surf);border:1px solid var(--bord);border-radius:6px;padding:10px 12px;color:var(--text);font-size:0.9rem;font-family:inherit;outline:none;transition:border-color .15s;width:100%;display:block}
input[type=text]:focus,input[type=date]:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;line-height:1.5}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.grid2{grid-template-columns:1fr}}

/* Weather chips */
.weather-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.wx-chip{background:var(--surf);border:1px solid var(--bord);border-radius:20px;padding:5px 12px;font-size:0.82rem;cursor:pointer;color:var(--muted);transition:all .15s;font-family:inherit}
.wx-chip:hover{border-color:var(--accent);color:var(--text)}
.wx-chip.sel{background:var(--accent);border-color:var(--accent);color:#1a1d27;font-weight:700}

.form-btns{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.btn-save{background:var(--green);color:#fff;border:none;padding:9px 24px;border-radius:6px;font-size:0.9rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn-save:hover{background:#16a34a}
.btn-save:disabled{opacity:.5;cursor:default}
.btn-cancel{background:var(--surf2);color:var(--muted);border:1px solid var(--bord);padding:9px 18px;border-radius:6px;font-size:0.9rem;cursor:pointer;font-family:inherit}
.btn-cancel:hover{color:var(--text)}
.btn-del{background:none;border:1px solid rgba(239,68,68,.4);color:var(--red);padding:9px 14px;border-radius:6px;font-size:0.85rem;cursor:pointer;font-family:inherit;margin-left:auto}
.btn-del:hover{background:rgba(239,68,68,.1)}

.form-status{font-size:0.85rem;color:var(--muted);margin-top:8px;min-height:1.2em}
.form-status.ok{color:var(--green)}
.form-status.err{color:var(--red)}

.empty-state{padding:40px 20px;text-align:center;color:var(--muted);font-size:0.9rem}

/* Staff picker */
.staff-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px;margin-bottom:6px}
.sp-item{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:5px 8px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .15s;user-select:none}
.sp-item:hover{background:rgba(255,255,255,.11);border-color:var(--accent)}
.sp-item.checked{background:rgba(245,158,11,.15);border-color:var(--accent)}
.sp-cb{accent-color:var(--accent);width:13px;height:13px;cursor:pointer;flex-shrink:0}
.sp-name{font-size:0.76rem;font-weight:600;color:var(--text);line-height:1.2}
.sp-role{font-size:0.65rem;color:var(--muted);display:block;margin-top:1px}

/* ── Report / document view ── */
.report-doc{background:#fff;color:#1a2a3f;border-radius:10px;padding:36px 40px;max-width:820px;box-shadow:0 4px 32px rgba(0,0,0,.45);font-family:'Segoe UI',Calibri,Arial,sans-serif}

/* Letterhead */
.lh-bar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:16px}
.lh-logo{height:62px;width:auto}
.lh-right{text-align:right}
.lh-company{font-size:1rem;font-weight:800;color:#1a2a3f;letter-spacing:-.2px;line-height:1.2}
.lh-addr{font-size:0.76rem;color:#4a6080;margin-top:3px;line-height:1.5}
.lh-rule{border:none;border-top:3px solid #1a2a3f;margin-bottom:18px}
.lh-rule2{border:none;border-top:1px solid #c8d4e0;margin:14px 0}

/* Doc title row */
.report-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.report-title h2{font-size:1.45rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#1a2a3f}
.report-ref{font-size:0.75rem;color:#4a6080;font-weight:600;letter-spacing:.3px}

/* Meta grid */
.report-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1.5px solid #1a2a3f;border-radius:6px;overflow:hidden;margin-bottom:22px}
.rm-cell{padding:10px 14px;border-right:1px solid #c8d4e0}
.rm-cell:last-child{border-right:none}
.rm-cell .rmc-label{font-size:0.63rem;text-transform:uppercase;letter-spacing:.08em;color:#4a6080;margin-bottom:3px;font-weight:700}
.rm-cell .rmc-val{font-size:0.9rem;font-weight:700;color:#1a2a3f;line-height:1.3}

/* Report sections */
.rs{margin-bottom:0;border:1px solid #c8d4e0;border-radius:6px;overflow:hidden;margin-bottom:10px}
.rs-hdr{background:#1a2a3f;color:#fff;font-size:0.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:8px 14px}
.rs-body{padding:14px;font-size:0.9rem;line-height:1.65;color:#1a2a3f;min-height:52px;white-space:pre-wrap}
.rs-body.rs-empty{color:#8a9ab0;font-style:italic}

/* Signature row */
.sig-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}
.sig-box{border-top:1.5px solid #1a2a3f;padding-top:8px}
.sig-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:.08em;color:#4a6080;font-weight:700}
.sig-name{font-size:0.88rem;color:#1a2a3f;margin-top:24px;font-weight:600}
.sig-date{font-size:0.78rem;color:#4a6080;margin-top:2px}

/* Footer disclaimer */
.report-footer{margin-top:18px;padding-top:14px;border-top:1px solid #c8d4e0;font-size:0.7rem;color:#8a9ab0;line-height:1.5;text-align:center}

/* Action bar outside document */
.report-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn-print{background:#1a2a3f;color:#fff;border:none;padding:9px 20px;border-radius:6px;font-size:0.88rem;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.btn-print:hover{background:#243552}

/* Print */
@media print {
  .topbar,.list-panel,.report-actions,#newEntryBtn{display:none!important}
  body{background:#fff}
  .layout{display:block}
  .form-panel{padding:0;overflow:visible}
  .report-doc{box-shadow:none;border-radius:0;padding:20mm 18mm;max-width:100%;margin:0}
  @page{margin:0}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="back-btn" href="index.html" target="_top">&#8592; Planner</a>
  <button class="theme-toggle-btn" onclick="toggleTheme()" style="background:none;border:1px solid rgba(255,255,255,.18);border-radius:6px;color:#8ab0cc;font-size:11px;font-weight:700;padding:4px 10px;cursor:pointer;font-family:inherit;letter-spacing:.02em;margin-left:auto;margin-right:8px">Light Mode</button>
  <h1>Site Diary</h1>
  <button class="new-btn" id="newEntryBtn">+ New Entry</button>
</header>

<div class="layout">
  <!-- Left: entry list -->
  <aside class="list-panel">
    <div class="list-header">
      <input type="text" id="searchInput" placeholder="Search site or notes…">
      <select id="siteFilter"><option value="">All sites</option></select>
    </div>
    <div class="list-scroll" id="entryList">
      <p class="empty-state">Loading…</p>
    </div>
  </aside>

  <!-- Right: form / view -->
  <main class="form-panel" id="formPanel">
    <p class="empty-state" id="defaultMsg">Select an entry to view it, or tap <strong>+ New Entry</strong> to write today's diary.</p>
  </main>
</div>

<script>
const REST = SUPABASE_URL + '/rest/v1';
let session = null;
let entries = [];
let plannerJobs = [];
let staffList = [];
let selectedId = null;
let editMode = false;
let currentWeather = '';

// H7/D2: map logged-in email to display name
const EMAIL_NAME_MAP = {
  'ash@dgc.im': 'Ash',
  'ash@silverdale.im': 'Ash',
  'harry@dgc.im': 'Andrew Harrison',
  'andrew@dgc.im': 'Andrew Harrison',
  'andy@dgc.im': 'Andy W-Smythe',
  'john@dgc.im': 'John McLoughlin',
};
function mapEmailToName(email) {
  if (!email) return '';
  const lower = email.toLowerCase().trim();
  if (EMAIL_NAME_MAP[lower]) return EMAIL_NAME_MAP[lower];
  const local = lower.split('@')[0];
  if (local.startsWith('ash')) return 'Ash';
  if (local.startsWith('harry') || local === 'andrew') return 'Andrew Harrison';
  if (local.startsWith('andy')) return 'Andy W-Smythe';
  if (local.startsWith('john')) return 'John McLoughlin';
  return '';
}

function ah(extra = {}) {
  return { ...authedHeaders(session), ...extra };
}

// ── Data ──────────────────────────────────────────────────────────────────────
async function loadEntries() {
  const r = await fetch(REST + '/dgc_site_diary?order=diary_date.desc,created_at.desc&limit=200', { headers: ah() });
  if (!r.ok) throw new Error(await r.text());
  entries = await r.json();
}

async function loadStaff() {
  try {
    const r = await fetch(REST + '/dgc_staff?active=eq.true&order=name.asc&select=id,name,role', { headers: ah() });
    if (r.ok) staffList = await r.json();
  } catch {}
}

// D1: load active planner jobs for the site dropdown
async function loadPlannerJobs() {
  try {
    const r = await fetch(REST + '/dgc_planner_jobs?archived=eq.false&select=id,name,start_date,base_weeks&order=name.asc', { headers: ah() });
    if (r.ok) plannerJobs = await r.json();
  } catch {}
}

// D3: look up deployment board allocation for a given site + date
function getWorkersFromDeployment(dateStr, siteName) {
  const job = plannerJobs.find(j => j.name === siteName);
  if (!job || !job.start_date) return '';
  let alloc = {};
  try { alloc = JSON.parse(localStorage.getItem('dgc_resource_alloc') || '{}'); } catch {}
  const jobAlloc = alloc[job.id];
  if (!jobAlloc) return '';
  const diaryDate = new Date(dateStr + 'T00:00:00');
  const base = new Date(job.start_date + 'T00:00:00');
  const n = Math.max(1, job.base_weeks || 4);
  for (let i = 0; i < n; i++) {
    const s = new Date(base);
    s.setDate(base.getDate() + i * 7);
    const weekEnd = new Date(s);
    weekEnd.setDate(s.getDate() + 6);
    if (diaryDate >= s && diaryDate <= weekEnd) {
      const weekStart = s.toISOString().slice(0, 10);
      const workers = jobAlloc[weekStart];
      return workers ? workers.join(', ') : '';
    }
  }
  return '';
}

async function saveEntry(data, id = null) {
  session = await ensureLoggedIn(); // always refresh before writing
  if (id) {
    const r = await fetch(REST + '/dgc_site_diary?id=eq.' + id, {
      method: 'PATCH',
      headers: ah({ Prefer: 'return=representation' }),
      body: JSON.stringify(data),
    });
    if (!r.ok) throw new Error(await r.text());
    return (await r.json())[0];
  } else {
    const r = await fetch(REST + '/dgc_site_diary', {
      method: 'POST',
      headers: ah({ Prefer: 'return=representation' }),
      body: JSON.stringify(data),
    });
    if (!r.ok) throw new Error(await r.text());
    return (await r.json())[0];
  }
}

async function deleteEntry(id) {
  const r = await fetch(REST + '/dgc_site_diary?id=eq.' + id, {
    method: 'DELETE',
    headers: ah(),
  });
  if (!r.ok) throw new Error(await r.text());
}

// ── Rendering ─────────────────────────────────────────────────────────────────
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00Z');
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderList() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const site   = document.getElementById('siteFilter').value;
  const list   = document.getElementById('entryList');

  // Populate site filter
  const sites = [...new Set(entries.map(e => e.site).filter(Boolean))].sort();
  const filterSel = document.getElementById('siteFilter');
  const cur = filterSel.value;
  filterSel.innerHTML = '<option value="">All sites</option>' + sites.map(s => `<option value="${esc(s)}" ${cur===s?'selected':''}>${esc(s)}</option>`).join('');

  const filtered = entries.filter(e => {
    const matchSite = !site || e.site === site;
    const matchSearch = !search || [e.site,e.work_done,e.notes,e.author].join(' ').toLowerCase().includes(search);
    return matchSite && matchSearch;
  });

  if (!filtered.length) {
    list.innerHTML = '<p class="empty-state">No entries found.</p>';
    return;
  }

  list.innerHTML = filtered.map(e => `
    <div class="entry-card ${e.id === selectedId ? 'selected' : ''}" data-id="${e.id}">
      <div class="ec-date">${fmtDate(e.diary_date)}${e.weather ? ' · ' + e.weather : ''}</div>
      <div class="ec-site">${esc(e.site)}</div>
      <div class="ec-preview">${esc(e.work_done || '')}</div>
      <div class="ec-author">${esc(e.author || '')}</div>
    </div>`).join('');

  list.querySelectorAll('.entry-card').forEach(card => {
    card.addEventListener('click', () => {
      selectedId = card.dataset.id;
      editMode = false;
      renderList();
      showView(entries.find(e => e.id === selectedId));
    });
  });
}

function showView(e) {
  if (!e) return;
  const panel = document.getElementById('formPanel');
  const dateShort = e.diary_date ? e.diary_date.split('-').reverse().join('/') : '—';
  const refNum = `SD-${(e.diary_date || '').replace(/-/g,'')}-${(e.site || 'SITE').replace(/[^A-Z0-9]/gi,'').substring(0,6).toUpperCase()}`;

  panel.innerHTML = `
    <div class="report-doc" id="printArea">

      <!-- Letterhead -->
      <div class="lh-bar">
        <img src="../dgc-logo-dark.png" alt="DGC" class="lh-logo">
        <div class="lh-right">
          <div class="lh-company">Drainage &amp; Groundwork Contractors Limited</div>
          <div class="lh-addr">23 Circular Road, Douglas, Isle of Man, IM1 1AF<br>
            Registered in the Isle of Man</div>
        </div>
      </div>
      <hr class="lh-rule">

      <!-- Document title -->
      <div class="report-title">
        <h2>Site Diary</h2>
        <span class="report-ref">Ref: ${esc(refNum)}</span>
      </div>

      <!-- 4-cell meta -->
      <div class="report-meta">
        <div class="rm-cell">
          <div class="rmc-label">Date</div>
          <div class="rmc-val">${esc(fmtDate(e.diary_date))}</div>
        </div>
        <div class="rm-cell">
          <div class="rmc-label">Site / Project</div>
          <div class="rmc-val">${esc(e.site || '—')}</div>
        </div>
        <div class="rm-cell">
          <div class="rmc-label">Written by</div>
          <div class="rmc-val">${esc(e.author || '—')}</div>
        </div>
        <div class="rm-cell">
          <div class="rmc-label">Weather</div>
          <div class="rmc-val">${esc(e.weather || '—')}</div>
        </div>
      </div>

      ${reportBlock('Work Carried Out', e.work_done)}
      ${reportBlock('Workers on Site', e.workers)}
      ${reportBlock('Plant &amp; Equipment on Site', e.plant)}
      ${reportBlock('Issues &amp; Incidents', e.issues)}
      ${reportBlock('Inspections &amp; Visitors', e.visitors)}
      ${reportBlock('Notes', e.notes)}

      <!-- Signature row -->
      <div class="sig-row">
        <div class="sig-box">
          <div class="sig-label">Signed (Site Manager / Author)</div>
          <div class="sig-name">${esc(e.author || '')}</div>
          <div class="sig-date">Date: ${esc(fmtDate(e.diary_date))}</div>
        </div>
        <div class="sig-box">
          <div class="sig-label">Countersigned (if applicable)</div>
          <div class="sig-name" style="color:#c8d4e0">&nbsp;</div>
          <div class="sig-date">Date: &nbsp;</div>
        </div>
      </div>

      <div class="report-footer">
        This document is a site diary record produced by Drainage &amp; Groundwork Contractors Limited.
        It is intended for internal records and may be used as supporting documentation for contractual,
        health &amp; safety, or insurance purposes. Ref: ${esc(refNum)}
      </div>
    </div>

    <!-- Actions — hidden on print -->
    <div class="report-actions">
      <button class="btn-print" onclick="window.print()">&#128438; Print / Save PDF</button>
      <button class="btn-save" id="editBtn" style="background:var(--blue)">&#9998; Edit</button>
      <button class="btn-del" id="delBtn">Delete</button>
    </div>`;

  document.getElementById('editBtn').addEventListener('click', () => showForm(e));
  document.getElementById('delBtn').addEventListener('click', async () => {
    if (!confirm('Delete this diary entry?')) return;
    await deleteEntry(e.id);
    selectedId = null;
    await loadEntries();
    renderList();
    document.getElementById('formPanel').innerHTML = '<p class="empty-state" id="defaultMsg">Entry deleted.</p>';
  });
}

function reportBlock(title, content) {
  const empty = !content || !content.trim();
  return `<div class="rs">
    <div class="rs-hdr">${title}</div>
    <div class="rs-body${empty?' rs-empty':''}">${empty ? 'Nothing recorded' : esc(content)}</div>
  </div>`;
}

function block(title, content) {
  if (!content) return '';
  return `<div class="view-block"><h3>${title}</h3><p>${esc(content)}</p></div>`;
}

function buildStaffPicker(existingWorkers) {
  const checked = new Set((existingWorkers || '').split(',').map(n => n.trim()).filter(Boolean));
  // Active staff from Supabase
  const rows = staffList.map(s => {
    const isChecked = checked.has(s.name);
    checked.delete(s.name); // track which names are "known"
    return `<label class="sp-item${isChecked?' checked':''}" onclick="this.classList.toggle('checked',this.querySelector('.sp-cb').checked)">
      <input type="checkbox" class="sp-cb" value="${esc(s.name)}"${isChecked?' checked':''}>
      <span><span class="sp-name">${esc(s.name)}</span><span class="sp-role">${esc(s.role||'')}</span></span>
    </label>`;
  });
  // Any names from existing entry not in current staff list (left the company etc)
  checked.forEach(name => {
    if (!name) return;
    rows.push(`<label class="sp-item checked" onclick="this.classList.toggle('checked',this.querySelector('.sp-cb').checked)">
      <input type="checkbox" class="sp-cb" value="${esc(name)}" checked>
      <span><span class="sp-name">${esc(name)}</span><span class="sp-role">Former</span></span>
    </label>`);
  });
  return rows.join('');
}

function getSelectedWorkers() {
  return [...document.querySelectorAll('.sp-cb:checked')].map(cb => cb.value).join(', ');
}

function showForm(existing = null) {
  editMode = true;
  currentWeather = existing?.weather || '';
  const panel = document.getElementById('formPanel');
  const today = new Date().toISOString().slice(0, 10);

  const WEATHER = ['Sunny','Partly Cloudy','Overcast','Drizzle','Rain','Heavy Rain','Windy','Foggy','Frost'];

  // D1: build site dropdown options (active jobs + past diary sites + Other)
  const pastSites = [...new Set(entries.map(e => e.site).filter(Boolean))];
  const jobNames = plannerJobs.map(j => j.name);
  const allSites = [...new Set([...jobNames, ...pastSites])].sort((a, b) => a.localeCompare(b));
  const existingSite = existing?.site || '';
  const existingIsCustom = existingSite && !allSites.includes(existingSite);
  const siteOptions = allSites.map(s =>
    `<option value="${esc(s)}" ${existingSite === s ? 'selected' : ''}>${esc(s)}</option>`
  ).join('');

  // H7/D2: author prefill from email
  const authorDefault = existing?.author || mapEmailToName(session?.user?.email) || '';

  panel.innerHTML = `
    <div class="section-title">Date &amp; Site</div>
    <div class="grid2">
      <label>Date <input type="date" id="f-date" value="${existing?.diary_date || today}" required></label>
      <label>Site / Job
        <select id="f-site-select" required>
          <option value="">— Select a job —</option>
          ${siteOptions}
          <option value="__custom__" ${existingIsCustom ? 'selected' : ''}>Other (type below)…</option>
        </select>
        <input type="text" id="f-site-custom" placeholder="Custom site name"
          style="margin-top:6px;display:${existingIsCustom ? 'block' : 'none'}"
          value="${existingIsCustom ? esc(existingSite) : ''}">
      </label>
    </div>
    <label>Written by <input type="text" id="f-author" value="${esc(authorDefault)}" placeholder="Name"></label>

    <div class="section-title">Conditions</div>
    <div style="font-size:0.82rem;color:var(--muted);margin-bottom:6px">Weather</div>
    <div class="weather-row" id="weatherRow">
      ${WEATHER.map(w => `<button type="button" class="wx-chip ${currentWeather===w?'sel':''}" data-w="${w}">${w}</button>`).join('')}
    </div>

    <div class="section-title">Site Activity</div>
    <div style="font-size:0.82rem;color:var(--muted);margin-bottom:6px">Workers on site</div>
    <div class="staff-picker" id="staffPicker">${buildStaffPicker(existing?.workers)}</div>
    <p id="workers-hint" style="font-size:0.75rem;color:var(--muted);margin-bottom:8px"></p>
    <label>Plant &amp; Equipment on site <textarea id="f-plant" rows="3" placeholder="e.g. 13T Excavator, Dumper">${esc(existing?.plant || '')}</textarea></label>

    <div class="section-title">Work Carried Out *</div>
    <textarea id="f-work" rows="8" placeholder="Describe all work carried out today…" required>${esc(existing?.work_done || '')}</textarea>

    <div class="section-title">Issues &amp; Incidents</div>
    <textarea id="f-issues" rows="5" placeholder="Any problems, delays, safety incidents…">${esc(existing?.issues || '')}</textarea>

    <div class="section-title">Inspections &amp; Visitors</div>
    <textarea id="f-visitors" rows="3" placeholder="Client visits, inspections, deliveries…">${esc(existing?.visitors || '')}</textarea>

    <div class="section-title">Notes</div>
    <textarea id="f-notes" rows="3" placeholder="Anything else worth recording">${esc(existing?.notes || '')}</textarea>

    <div class="form-btns">
      <button class="btn-save" id="saveBtn">Save Entry</button>
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      ${existing ? `<button class="btn-del" id="delBtn2">Delete</button>` : ''}
    </div>
    <p class="form-status" id="formStatus"></p>`;

  // D1: custom site toggle
  function getSiteValue() {
    const sel = document.getElementById('f-site-select');
    if (sel.value === '__custom__') return document.getElementById('f-site-custom').value.trim();
    return sel.value;
  }
  document.getElementById('f-site-select').addEventListener('change', function() {
    document.getElementById('f-site-custom').style.display = this.value === '__custom__' ? 'block' : 'none';
    autoFillWorkers();
  });

  // D3: auto-tick workers from deployment board
  function autoFillWorkers() {
    const site = getSiteValue();
    const date = document.getElementById('f-date').value;
    const hint = document.getElementById('workers-hint');
    if (!site || !date || site === '__custom__') return;
    const w = getWorkersFromDeployment(date, site);
    if (!w) return;
    const names = w.split(',').map(n => n.trim()).filter(Boolean);
    let ticked = 0;
    document.querySelectorAll('.sp-cb').forEach(cb => {
      if (names.includes(cb.value) && !cb.checked) { cb.checked = true; cb.closest('.sp-item').classList.add('checked'); ticked++; }
    });
    if (ticked && hint) hint.textContent = 'Deployment board names pre-ticked — adjust as needed';
  }
  document.getElementById('f-date').addEventListener('change', autoFillWorkers);
  // Trigger once for new entries if site already selected
  if (!existing) setTimeout(autoFillWorkers, 0);

  // Weather chips
  document.querySelectorAll('.wx-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      currentWeather = currentWeather === chip.dataset.w ? '' : chip.dataset.w;
      document.querySelectorAll('.wx-chip').forEach(c => c.classList.toggle('sel', c.dataset.w === currentWeather));
    });
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const site = getSiteValue();
    const work = document.getElementById('f-work').value.trim();
    if (!site) { setStatus('Site / Job is required', true); return; }
    if (!work)  { setStatus('Work Carried Out is required', true); return; }
    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await saveEntry({
        diary_date: document.getElementById('f-date').value,
        site,
        author:  document.getElementById('f-author').value.trim() || null,
        weather: currentWeather || null,
        workers: getSelectedWorkers() || null,
        plant:   document.getElementById('f-plant').value.trim() || null,
        work_done: work,
        issues:   document.getElementById('f-issues').value.trim() || null,
        visitors: document.getElementById('f-visitors').value.trim() || null,
        notes:    document.getElementById('f-notes').value.trim() || null,
      }, existing?.id || null);
      await loadEntries();
      const saved = entries.find(e => existing ? e.id === existing.id : e.site === site);
      selectedId = saved?.id || null;
      renderList();
      if (saved) showView(saved); else document.getElementById('formPanel').innerHTML = '<p class="empty-state">Saved.</p>';
    } catch (err) {
      setStatus('Error: ' + err.message, true);
      btn.disabled = false; btn.textContent = 'Save Entry';
    }
  });

  document.getElementById('cancelBtn').addEventListener('click', () => {
    editMode = false;
    const entry = entries.find(e => e.id === selectedId);
    if (entry) showView(entry);
    else document.getElementById('formPanel').innerHTML = '<p class="empty-state" id="defaultMsg">Select an entry or tap + New Entry.</p>';
  });

  const del2 = document.getElementById('delBtn2');
  if (del2) {
    del2.addEventListener('click', async () => {
      if (!confirm('Delete this entry?')) return;
      await deleteEntry(existing.id);
      selectedId = null;
      await loadEntries();
      renderList();
      document.getElementById('formPanel').innerHTML = '<p class="empty-state">Entry deleted.</p>';
    });
  }
}

function setStatus(msg, err = false) {
  const el = document.getElementById('formStatus');
  if (el) { el.textContent = msg; el.className = 'form-status ' + (err ? 'err' : 'ok'); }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
(async () => {
  session = await ensureLoggedIn();
  if (!session) { window.location.replace('../staff/'); return; }

  // Silently refresh the JWT every 45 minutes so long sessions don't expire mid-save
  setInterval(async () => { session = await ensureLoggedIn(); }, 45 * 60 * 1000);

  try {
    await Promise.all([loadEntries(), loadPlannerJobs(), loadStaff()]);
    renderList();
  } catch (err) {
    const msg = err.message.includes('does not exist') || err.message.includes('42P01')
      ? 'Table not set up yet. Run the SQL in Supabase first — ask your admin.'
      : 'Error: ' + err.message;
    document.getElementById('entryList').innerHTML = `<p class="empty-state" style="color:#ef4444;padding:20px">${msg}</p>`;
  }

  document.getElementById('newEntryBtn').addEventListener('click', () => {
    selectedId = null;
    renderList();
    showForm();
  });

  document.getElementById('searchInput').addEventListener('input', renderList);
  document.getElementById('siteFilter').addEventListener('change', renderList);
})();
</script>
</body>
</html>
