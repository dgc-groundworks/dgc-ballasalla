<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolbox Talks</title>
<script src="../staff/config.js"></script>
<script src="../staff/auth.js?v=6"></script>
<script src="theme.js"></script>
<!-- Toolbox Talks (Ash, 20 Oct 2026): fill in on the Planner, pass the tablet or phone round to sign, filed hourly as a PDF
     into the job's Toolbox Talks folder by the task on Ash's Mac. Same look and pattern as Accident Report and Site Diary. -->
<style>
:root {
  --bg:#0b0d12;--surf:#1e2331;--surf2:#282d3e;--bord:#3a4058;
  --accent:#f59e0b;--text:#e2e8f0;--muted:#94a3b8;
  --green:#22c55e;--red:#ef4444;--blue:#3b82f6;
}
[data-theme="light"] {
  --bg:#e4ebf3;--surf:#ffffff;--surf2:#e9eff6;--bord:#afc2d2;
  --accent:#e08a00;--text:#1a2b3c;--muted:#4a657e;
  --green:#16a34a;--red:#dc2626;--blue:#2563eb;
}
[data-theme="light"] .topbar{background:#1b2a3b;border-bottom-color:#0d1a26}
[data-theme="light"] .topbar h1{color:#f59e0b}
[data-theme="light"] .back-btn{color:#8ab0cc;border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.08)}
[data-theme="light"] .new-btn{background:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}
.topbar{background:var(--surf);border-bottom:1px solid var(--bord);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.topbar h1{font-size:1rem;font-weight:700;color:var(--accent);flex:1}
.back-btn{display:flex;align-items:center;gap:6px;background:var(--surf2);border:1px solid var(--bord);border-radius:7px;padding:6px 12px;color:var(--muted);font-size:0.82rem;font-weight:600;text-decoration:none;white-space:nowrap;font-family:inherit}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}
.layout{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 49px)}
@media(max-width:700px){.layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.list-panel{border-right:1px solid var(--bord);display:flex;flex-direction:column}
.list-header{padding:12px 14px;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.list-header input,.list-header select{background:var(--surf2);border:1px solid var(--bord);border-radius:6px;padding:6px 10px;color:var(--text);font-size:0.82rem;font-family:inherit}
.list-header input{flex:1;min-width:120px}
.list-scroll{overflow-y:auto;flex:1}
.entry-card{padding:12px 14px;border-bottom:1px solid var(--bord);cursor:pointer}
.entry-card:hover,.entry-card.selected{background:var(--surf2)}
.ec-date{font-size:0.78rem;color:var(--muted)}
.ec-site{font-weight:700;font-size:0.95rem;margin:2px 0}
.ec-preview{font-size:0.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-author{font-size:0.75rem;color:var(--muted);margin-top:4px}
.form-panel{padding:20px 24px;overflow-y:auto}
.new-btn{background:var(--accent);color:var(--accent-ink,#1a1d27);border:none;padding:8px 18px;border-radius:6px;font-size:0.85rem;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.section-title{font-size:0.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:22px 0 10px}
.section-title:first-child{margin-top:0}
label{display:flex;flex-direction:column;gap:4px;font-size:0.82rem;color:var(--muted);margin-bottom:10px}
input[type=text],input[type=number],input[type=datetime-local],textarea,select{background:var(--surf);border:1px solid var(--bord);border-radius:6px;padding:10px 12px;color:var(--text);font-size:0.9rem;font-family:inherit;outline:none;width:100%;display:block}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.hint{font-size:0.78rem;color:var(--muted);margin:-4px 0 10px}
.form-btns{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.btn-save{background:var(--green);color:#fff;border:none;padding:10px 24px;border-radius:6px;font-size:0.9rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn-save:disabled{opacity:.5;cursor:default}
.btn-cancel{background:var(--surf2);color:var(--muted);border:1px solid var(--bord);padding:9px 16px;border-radius:6px;font-size:0.88rem;cursor:pointer;font-family:inherit}
.btn-cancel:hover{color:var(--text)}
.form-status{font-size:0.85rem;color:var(--muted);margin-top:8px;min-height:1.2em}
.form-status.ok{color:var(--green)}
.form-status.err{color:var(--red)}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted);font-size:0.9rem;line-height:1.6}
.sig-pad{background:#fff;border:1px solid var(--bord);border-radius:6px;width:100%;max-width:420px;height:110px;touch-action:none;display:block}
/* one row per person signing */
.att{border:1px solid var(--bord);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--surf)}
.att-head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.att-head input{flex:1}
.att-head .co{max-width:170px}
.att-foot{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:0.78rem;color:var(--muted)}
.att-foot button{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:0.78rem}
/* the printed record: white letterhead, same as the Site Diary */
.report-doc{background:#fff;color:#1a2a3f;border-radius:10px;padding:36px 40px;max-width:820px;box-shadow:0 4px 32px rgba(0,0,0,.45);font-family:'Segoe UI',Calibri,Arial,sans-serif}
.lh-bar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:16px}
.lh-logo{height:62px;width:auto}
.lh-right{text-align:right}
.lh-company{font-size:1rem;font-weight:800;line-height:1.2}
.lh-addr{font-size:0.76rem;color:#4a6080;margin-top:3px;line-height:1.5}
.lh-rule{border:none;border-top:3px solid #1a2a3f;margin-bottom:18px}
.report-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.report-title h2{font-size:1.45rem;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.report-ref{font-size:0.75rem;color:#4a6080;font-weight:600}
.report-meta{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid #1a2a3f;border-radius:6px;overflow:hidden;margin-bottom:22px}
.rm-cell{padding:10px 14px;border-right:1px solid #c8d4e0}
.rm-cell:last-child{border-right:none}
.rmc-label{font-size:0.63rem;text-transform:uppercase;letter-spacing:.08em;color:#4a6080;margin-bottom:3px;font-weight:700}
.rmc-val{font-size:0.9rem;font-weight:700;line-height:1.3}
.rs{border:1px solid #c8d4e0;border-radius:6px;overflow:hidden;margin-bottom:10px}
.rs-hdr{background:#1a2a3f;color:#fff;font-size:0.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:8px 14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rs-body{padding:14px;font-size:0.9rem;line-height:1.65;min-height:44px;white-space:pre-wrap}
.rs-empty{color:#8a9ab0;font-style:italic}
.att-table{width:100%;border-collapse:collapse;font-size:0.86rem}
.att-table th{text-align:left;font-size:0.63rem;text-transform:uppercase;letter-spacing:.08em;color:#4a6080;padding:8px 14px;border-bottom:1px solid #c8d4e0}
.att-table td{padding:6px 14px;border-bottom:1px solid #e3e9f0;vertical-align:middle}
.att-table img{height:34px;max-width:160px}
.sig-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}
.sig-box{border-top:1.5px solid #1a2a3f;padding-top:8px}
.sig-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:.08em;color:#4a6080;font-weight:700}
.sig-img{height:46px;margin-top:6px}
.sig-name{font-size:0.88rem;margin-top:6px;font-weight:600}
.report-footer{margin-top:18px;padding-top:14px;border-top:1px solid #c8d4e0;font-size:0.7rem;color:#8a9ab0;line-height:1.5;text-align:center}
.report-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn-print{background:#1a2a3f;color:#fff;border:none;padding:9px 20px;border-radius:6px;font-size:0.88rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn-edit{background:var(--blue)}
.file-note{font-size:0.8rem;color:var(--muted);margin-top:10px}
@media print {
  .topbar,.list-panel,.report-actions,.file-note{display:none!important}
  body{background:#fff}
  .layout{display:block}
  .form-panel{padding:0;overflow:visible}
  .report-doc{box-shadow:none;border-radius:0;padding:16mm 15mm;max-width:100%}
  @page{margin:0}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="back-btn" href="index.html" target="_top">&#8592; Planner</a>
  <h1>Toolbox Talks</h1>
  <button class="new-btn" id="newBtn">+ New Toolbox Talk</button>
</header>
<div class="layout">
  <aside class="list-panel">
    <div class="list-header">
      <input type="text" id="searchInput" placeholder="Search topic, job or name">
      <select id="jobFilter"><option value="">All jobs</option></select>
    </div>
    <div class="list-scroll" id="list"><p class="empty-state">Loading…</p></div>
  </aside>
  <main class="form-panel" id="panel">
    <p class="empty-state">Pick a toolbox talk to view it, or press <strong>+ New Toolbox Talk</strong>.<br><br>Each talk is saved as a PDF in that job's Toolbox Talks folder on the shared drive.</p>
  </main>
</div>
<script>
const REST = SUPABASE_URL + '/rest/v1';
let session = null, rows = [], jobs = [], staff = [], selectedId = null, editing = null, pads = {};
const EMAIL_NAME_MAP = { 'ash@dgc.im': 'Ash Aziz', 'ash@silverdale.im': 'Ash Aziz', 'harry@dgc.im': 'Andrew Harrison', 'andrew@dgc.im': 'Andrew Harrison', 'john@dgc.im': 'John McLoughlin', 'john.mcloughlin@dgc.im': 'John McLoughlin' };
function myName() { const e = (session && (session.email || (session.user && session.user.email)) || '').toLowerCase(); return EMAIL_NAME_MAP[e] || ''; }
const ah = (x = {}) => ({ ...authedHeaders(session), ...x });
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);

// Starter topics. General good practice in our own words: always check them against the job's RAMS and add what is
// specific to the job in "On this job". Change or add topics here.
const TOPICS = {
  'Silica dust (cutting and breaking)': 'Cutting, drilling and breaking concrete, kerbs and slabs makes fine silica dust that damages the lungs for life.\nCut wet or with extraction every time. No dry cutting.\nWear the right mask (FFP3), face-fit tested and clean shaven where it seals.\nDamp down and clean up with a vacuum, never a dry brush.\nKeep others out of the dust area.',
  'Excavations and trench support': 'Never go into an unsupported trench deeper than 1.2 m, or shallower if the ground is poor.\nUse the support shown in the RAMS (boxes, sheets, battering) and check it before anyone goes in.\nKeep spoil, plant and materials at least 1 m back from the edge.\nBarriers round open excavations, and a safe way in and out (ladder).\nThe trench is inspected at the start of every shift and after anything that could affect it.',
  'Underground services (CAT and Genny)': 'Have the service drawings on site and read them before digging.\nScan with the CAT and Genny before and during the dig; the operator must be trained.\nMark services on the ground and keep the marks up.\nHand dig within 500 mm of a known service. No forks or picks near cables.\nIf you hit or expose an unknown service: stop, keep clear, tell the supervisor.',
  'Working near plant and machinery': 'Only trained, ticketed people operate plant.\nStay out of the swing radius and blind spots. Make eye contact with the operator before you approach.\nUse a banksman for reversing and lifting, with agreed signals.\nPre-use checks every day, recorded.\nSeat belts on. Never carry passengers.',
  'Manual handling': 'Plan the lift: weight, route, where it is going.\nUse the kit first (barrow, lifter, plant) and get help for heavy or awkward loads.\nBend the knees, keep it close, no twisting.\nManhole covers and kerbs: use lifters, not hands.\nReport any strain early.',
  'Confined spaces (manholes and chambers)': 'Never enter a manhole or chamber without the permit and the trained team named in the RAMS.\nTest the air before and during entry. No test, no entry.\nTop man stays at the top with rescue kit ready.\nTell the supervisor before anyone goes in.\nIf anyone collapses, do not go in after them: raise the alarm.',
  'Working near water': 'Life jackets on within 2 m of the water edge.\nCheck the tide times and weather before starting.\nNo working alone near water.\nKnow where the throw lines and rescue kit are.\nKeep edges clear and barriers in place.',
  'Traffic management and road works': 'Set out signs and cones exactly as the traffic plan shows, before work starts.\nHi-vis on at all times on or near the road.\nStay inside the coned area. Never step back into live traffic.\nBanksman for plant moving in or out of the works.\nCheck signs and lights at the start and end of the day.',
  'Concrete and cement burns': 'Wet concrete and cement burn the skin, often without pain at first.\nGloves, long sleeves and boots, with trousers over boots.\nWash any splash off with clean water straight away.\nEye wash on site; use it at once if cement gets in an eye.\nNo kneeling in wet concrete without knee protection.',
  'Hand-arm vibration (HAVS) and noise': 'Breakers, compactors and cut-off saws cause lasting damage to hands and hearing.\nUse the lowest-vibration tool for the job and keep it maintained.\nShare the work and keep to the trigger times in the RAMS.\nEar defenders on when the noise sign says so.\nReport tingling, numbness or white fingers.',
  'Slips, trips and housekeeping': 'Keep walkways clear of spoil, hoses and materials.\nClear up as you go, not at the end of the day.\nCover or barrier holes and edges.\nGood lighting in the dark and in chambers.\nReport damaged ground, kit or barriers.',
};

async function load() { const r = await fetch(REST + '/dgc_toolbox_talks?order=talk_at.desc&limit=500', { headers: ah() }); if (!r.ok) throw new Error(await r.text()); rows = await r.json(); }
async function loadJobs() { try { const r = await fetch(REST + '/dgc_planner_jobs?archived=eq.false&select=id,name&order=name.asc', { headers: ah() }); if (r.ok) jobs = await r.json(); } catch {} }
async function loadStaff() { try { const r = await fetch(REST + '/dgc_staff?active=eq.true&order=name.asc&select=name', { headers: ah() }); if (r.ok) staff = await r.json(); } catch {} }
function fmtWhen(iso) { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
function refOf(r) { const d = new Date(r.talk_at); const ymd = isNaN(d) ? '' : d.toISOString().slice(0, 10).replace(/-/g, ''); return `TBT-${ymd}-${String(r.job || 'SITE').replace(/[^A-Z0-9]/gi, '').slice(0, 6).toUpperCase()}`; }

function renderList() {
  const q = $('searchInput').value.toLowerCase(), sel = $('jobFilter'), jf = sel.value;
  const allJobs = [...new Set([...jobs.map(j => j.name), ...rows.map(r => r.job)])].filter(Boolean).sort();
  sel.innerHTML = '<option value="">All jobs</option>' + allJobs.map(n => `<option${n === jf ? ' selected' : ''}>${esc(n)}</option>`).join('');
  const list = rows.filter(r => (!jf || r.job === jf) && (!q || [r.topic, r.job, r.presenter, (r.attendees || []).map(a => a.name).join(' ')].join(' ').toLowerCase().includes(q)));
  $('list').innerHTML = list.length ? list.map(r => `<div class="entry-card${r.id === selectedId ? ' selected' : ''}" data-id="${r.id}">
    <div class="ec-date">${esc(fmtWhen(r.talk_at))}</div>
    <div class="ec-site">${esc(r.topic)}</div>
    <div class="ec-preview">${esc(r.job)} · ${(r.attendees || []).length} signed</div>
    <div class="ec-author">${r.filed_at && new Date(r.filed_at) >= new Date(r.updated_at) ? 'Saved to the job folder' : 'Waiting to be saved to the job folder'}</div></div>`).join('') : '<p class="empty-state">No toolbox talks yet.</p>';
}

function showRecord(r) {
  const att = (r.attendees || []);
  $('panel').innerHTML = `<div class="report-doc">
    <div class="lh-bar"><img src="../dgc-logo-dark.png" alt="DGC" class="lh-logo">
      <div class="lh-right"><div class="lh-company">Drainage &amp; Groundwork Contractors Limited</div>
      <div class="lh-addr">23 Circular Road, Douglas, Isle of Man, IM1 1AF<br>Registered in the Isle of Man</div></div></div>
    <hr class="lh-rule">
    <div class="report-title"><h2>Toolbox Talk</h2><span class="report-ref">Ref: ${esc(refOf(r))}</span></div>
    <div class="report-meta">
      <div class="rm-cell"><div class="rmc-label">Job</div><div class="rmc-val">${esc(r.job)}</div></div>
      <div class="rm-cell"><div class="rmc-label">Date &amp; time</div><div class="rmc-val">${esc(fmtWhen(r.talk_at))}</div></div>
      <div class="rm-cell"><div class="rmc-label">Topic</div><div class="rmc-val">${esc(r.topic)}</div></div>
      <div class="rm-cell"><div class="rmc-label">Given by</div><div class="rmc-val">${esc(r.presenter || '—')}${r.duration_min ? `<br><span style="font-weight:600;font-size:.8rem">${r.duration_min} minutes</span>` : ''}</div></div>
    </div>
    ${[['Key points and hazards', r.points], ['On this job', r.on_this_job], ['RAMS / risk assessment', r.rams_ref], ['Questions raised', r.questions], ['Actions agreed', r.actions]].map(([h, v]) => `<div class="rs"><div class="rs-hdr">${h}</div><div class="rs-body${v ? '' : ' rs-empty'}">${esc(v || 'Nothing recorded')}</div></div>`).join('')}
    <div class="rs"><div class="rs-hdr">Attendance: I have received and understood this toolbox talk</div>
      ${att.length ? `<table class="att-table"><thead><tr><th>Name</th><th>Company</th><th>Signature</th></tr></thead><tbody>${att.map(a => `<tr><td>${esc(a.name)}</td><td>${esc(a.company || '')}</td><td>${a.sig ? `<img src="${esc(a.sig)}" alt="Signature">` : '<span class="rs-empty">Not signed</span>'}</td></tr>`).join('')}</tbody></table>` : '<div class="rs-body rs-empty">Nobody signed</div>'}</div>
    <div class="sig-row">
      <div class="sig-box"><div class="sig-label">Given by</div>${r.presenter_sig ? `<img class="sig-img" src="${esc(r.presenter_sig)}" alt="">` : ''}<div class="sig-name">${esc(r.presenter || '')}</div></div>
      <div class="sig-box"><div class="sig-label">Checked by (supervisor / manager)</div>${r.manager_sig ? `<img class="sig-img" src="${esc(r.manager_sig)}" alt="">` : ''}<div class="sig-name">${esc(r.manager || '')}</div></div>
    </div>
    <div class="report-footer">Toolbox talk record produced by Drainage &amp; Groundwork Contractors Limited. Ref: ${esc(refOf(r))}</div>
  </div>
  <div class="report-actions"><button class="btn-print" onclick="window.print()">Print or save as PDF</button><button class="btn-print btn-edit" id="editBtn">Edit or add signatures</button></div>
  <p class="file-note">${r.filed_at && new Date(r.filed_at) >= new Date(r.updated_at) ? 'Saved to the job\'s Toolbox Talks folder on the shared drive.' : 'Will be saved to the job\'s Toolbox Talks folder on the shared drive within the hour (when the office computer is on).'}</p>`;
  $('editBtn').addEventListener('click', () => showForm(r));
}

// ── Form ──
function sigPad(canvas) {
  const x = canvas.getContext('2d'); let down = false; const pad = { dirty: false, canvas };
  x.lineWidth = 2.2; x.lineCap = 'round'; x.strokeStyle = '#1a2a3f';
  const pos = e => { const b = canvas.getBoundingClientRect(); return [(e.clientX - b.left) * canvas.width / b.width, (e.clientY - b.top) * canvas.height / b.height]; };
  canvas.addEventListener('pointerdown', e => { down = true; pad.dirty = true; x.beginPath(); x.moveTo(...pos(e)); });
  canvas.addEventListener('pointermove', e => { if (down) { x.lineTo(...pos(e)); x.stroke(); } });
  ['pointerup', 'pointerleave'].forEach(t => canvas.addEventListener(t, () => { down = false; }));
  pad.clear = () => { x.clearRect(0, 0, canvas.width, canvas.height); pad.dirty = false; pad.keep = null; };
  pad.load = src => { if (!src) return; const i = new Image(); i.onload = () => x.drawImage(i, 0, 0, canvas.width, canvas.height); i.src = src; pad.keep = src; };
  pad.value = () => pad.dirty ? canvas.toDataURL('image/png') : (pad.keep || null);
  return pad;
}
let attN = 0;
function addAttendee(a = {}) {
  const n = ++attN, d = document.createElement('div');
  d.className = 'att'; d.dataset.n = n;
  d.innerHTML = `<div class="att-head"><input type="text" class="nm" list="staffNames" placeholder="Name" value="${esc(a.name || '')}"><input type="text" class="co" placeholder="Company" value="${esc(a.company || 'DGC')}"></div>
    <canvas class="sig-pad" width="420" height="110"></canvas>
    <div class="att-foot"><span>Sign above</span><button type="button" class="clr">Clear</button><button type="button" class="rm">Remove person</button></div>`;
  $('attList').appendChild(d);
  const pad = sigPad(d.querySelector('canvas')); pad.load(a.sig); pad.time = a.time || null; pads['a' + n] = pad;
  d.querySelector('.clr').onclick = () => pad.clear();
  d.querySelector('.rm').onclick = () => { delete pads['a' + n]; d.remove(); };
}

function showForm(r = null) {
  editing = r; pads = {}; attN = 0;
  const local = d => new Date(new Date(d).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  const when = local(r ? r.talk_at : Date.now());
  const topicIsLib = r && TOPICS[r.topic];
  $('panel').innerHTML = `
    <div class="section-title">The talk</div>
    <div class="grid2">
      <label>Job<select id="fJob"><option value="">Choose the job…</option>${[...new Set([...jobs.map(j => j.name), ...(r ? [r.job] : [])])].map(n => `<option${r && r.job === n ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></label>
      <label>Date and time<input type="datetime-local" id="fWhen" value="${when}"></label>
    </div>
    <div class="grid2">
      <label>Topic<select id="fTopicPick"><option value="">Choose a topic…</option>${Object.keys(TOPICS).map(t => `<option${r && r.topic === t ? ' selected' : ''}>${esc(t)}</option>`).join('')}<option value="__own"${r && !topicIsLib ? ' selected' : ''}>Something else (type it)</option></select></label>
      <label>How long (minutes)<input type="number" id="fMins" min="1" max="120" value="${esc(r ? r.duration_min || '' : 15)}"></label>
    </div>
    <label id="ownTopicWrap" style="display:${r && !topicIsLib ? 'flex' : 'none'}">Topic<input type="text" id="fTopicOwn" value="${esc(r && !topicIsLib ? r.topic : '')}" placeholder="What is the talk about?"></label>
    <label>Key points and hazards<textarea id="fPoints" rows="6" placeholder="Pick a topic to fill this in, then change it to suit">${esc(r ? r.points : '')}</textarea></label>
    <p class="hint">The starter points are general. Check them against the job's RAMS.</p>
    <label>On this job<textarea id="fJobPts" rows="3" placeholder="What it means here today: where, which plant, which hazards">${esc(r ? r.on_this_job : '')}</textarea></label>
    <label>RAMS / risk assessment it relates to<input type="text" id="fRams" value="${esc(r ? r.rams_ref : '')}" placeholder="e.g. RAMS 03 Excavation, Rev B"></label>

    <div class="section-title">Given by</div>
    <label>Name<input type="text" id="fBy" list="staffNames" value="${esc(r ? r.presenter : myName())}"></label>
    <canvas class="sig-pad" id="presPad" width="420" height="110"></canvas>
    <div class="att-foot"><span>Sign above</span><button type="button" id="presClr">Clear</button></div>

    <div class="section-title">Who attended</div>
    <p class="hint">Pass the phone or tablet round. Each person types their name and signs.</p>
    <div id="attList"></div>
    <button type="button" class="btn-cancel" id="addAtt">+ Add a person</button>

    <div class="section-title">After the talk</div>
    <label>Questions raised<textarea id="fQs" rows="2" placeholder="Anything the lads asked">${esc(r ? r.questions : '')}</textarea></label>
    <label>Actions agreed<textarea id="fActs" rows="2" placeholder="Who will do what, by when">${esc(r ? r.actions : '')}</textarea></label>
    <label>Checked by (supervisor or manager)<input type="text" id="fMgr" list="staffNames" value="${esc(r ? r.manager || '' : '')}" placeholder="Name, if someone checks it"></label>
    <canvas class="sig-pad" id="mgrPad" width="420" height="110"></canvas>
    <div class="att-foot"><span>Sign above</span><button type="button" id="mgrClr">Clear</button></div>
    <datalist id="staffNames">${staff.map(s => `<option value="${esc(s.name)}">`).join('')}</datalist>

    <div class="form-btns"><button class="btn-save" id="saveBtn">Save Toolbox Talk</button><button class="btn-cancel" id="cancelBtn">Cancel</button></div>
    <div class="form-status" id="formStatus"></div>`;
  pads.pres = sigPad($('presPad')); pads.mgr = sigPad($('mgrPad'));
  if (r) { pads.pres.load(r.presenter_sig); pads.mgr.load(r.manager_sig); }
  $('presClr').onclick = () => pads.pres.clear(); $('mgrClr').onclick = () => pads.mgr.clear();
  (r && r.attendees && r.attendees.length ? r.attendees : [{}, {}, {}]).forEach(addAttendee);
  $('addAtt').onclick = () => addAttendee();
  $('fTopicPick').onchange = e => {
    const t = e.target.value; $('ownTopicWrap').style.display = t === '__own' ? 'flex' : 'none';
    if (TOPICS[t] && (!$('fPoints').value.trim() || Object.values(TOPICS).includes($('fPoints').value))) $('fPoints').value = TOPICS[t];
  };
  $('saveBtn').onclick = save;
  $('cancelBtn').onclick = () => r ? showRecord(r) : ($('panel').innerHTML = '<p class="empty-state">Cancelled.</p>');
}

async function save() {
  const v = id => $(id).value.trim();
  const pick = v('fTopicPick'), topic = pick === '__own' ? v('fTopicOwn') : pick;
  const attendees = [...document.querySelectorAll('#attList .att')].map(d => {
    const pad = pads['a' + d.dataset.n], sig = pad.value();
    return { name: d.querySelector('.nm').value.trim(), company: d.querySelector('.co').value.trim(), sig, time: sig ? (pad.dirty ? new Date().toISOString() : pad.time) : null };
  }).filter(a => a.name || a.sig);
  const errs = [];
  if (!v('fJob')) errs.push('Choose the job');
  if (!topic) errs.push('Choose or type the topic');
  if (!v('fBy')) errs.push('Say who gave the talk');
  if (attendees.some(a => !a.name)) errs.push('Every signature needs a name');
  if (errs.length) return status(errs.join('. ') + '.', true);
  const body = { job: v('fJob'), talk_at: new Date(v('fWhen')).toISOString(), duration_min: parseInt(v('fMins')) || null, topic,
    points: v('fPoints'), on_this_job: v('fJobPts'), rams_ref: v('fRams'), presenter: v('fBy'), presenter_sig: pads.pres.value(),
    attendees, questions: v('fQs'), actions: v('fActs'), manager: v('fMgr'), manager_sig: pads.mgr.value() };
  const btn = $('saveBtn'); btn.disabled = true; status('Saving…');
  try {
    session = await ensureLoggedIn();
    if (!editing) body.created_by = myName() || (session && session.email) || null;
    const url = editing ? `${REST}/dgc_toolbox_talks?id=eq.${editing.id}` : `${REST}/dgc_toolbox_talks`;
    const res = await fetch(url, { method: editing ? 'PATCH' : 'POST', headers: ah({ 'Content-Type': 'application/json', Prefer: 'return=representation' }), body: JSON.stringify(body) });
    if (!res.ok) throw new Error(await res.text());
    const saved = (await res.json())[0];
    rows = [saved, ...rows.filter(x => x.id !== saved.id)].sort((a, b) => new Date(b.talk_at) - new Date(a.talk_at));
    selectedId = saved.id; renderList(); showRecord(saved);
  } catch (e) { btn.disabled = false; status('Not saved: ' + e.message, true); }
}
function status(m, err) { const el = $('formStatus'); if (el) { el.textContent = m; el.className = 'form-status ' + (err ? 'err' : 'ok'); } }

(async () => {
  session = await ensureLoggedIn();
  if (!session) { waitForPlannerSignIn('Toolbox Talks'); return; }
  setInterval(async () => { session = await ensureLoggedIn(); }, 45 * 60 * 1000);
  try { await Promise.all([load(), loadJobs(), loadStaff()]); renderList(); }
  catch (err) { const m = /does not exist|42P01/.test(err.message) ? 'The toolbox talk table isn\'t set up yet. Run create_toolbox.sql in Supabase first.' : 'Error: ' + err.message;
    $('list').innerHTML = `<p class="empty-state" style="color:#ef4444;padding:20px">${esc(m)}</p>`; }
  $('newBtn').addEventListener('click', () => { selectedId = null; renderList(); showForm(); });
  $('list').addEventListener('click', e => { const c = e.target.closest('[data-id]'); if (!c) return; selectedId = c.dataset.id; renderList(); showRecord(rows.find(r => r.id === selectedId)); });
  $('searchInput').addEventListener('input', renderList);
  $('jobFilter').addEventListener('change', renderList);
})();
</script>
<script src="suggest-change.js?v=3"></script>
</body>
</html>
