<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1d27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Job Planner">
<title>DGC Job Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root {
  --bg:#0f1117; --surf:#1a1d27; --surf2:#222636; --bord:#2e3347;
  --accent:#f59e0b; --text:#e2e8f0; --muted:#64748b;
  --c-run:#22c55e; --c-award:#3b82f6; --c-conf:#10b981;
  --c-likely:#f97316; --c-tend:#f59e0b; --c-ph:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh}
a{color:var(--accent);text-decoration:none}

/* ── Header ── */
.hdr{background:var(--surf);padding:7px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--bord)}
.logo{display:flex;align-items:center;gap:10px}
.logo-svg{height:36px;width:auto;display:block;flex-shrink:0}
.logo-txt{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.2px}
.logo-txt span{color:var(--accent)}
.hdr-r{display:flex;align-items:center;gap:10px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.sync-dot.live{background:var(--c-run)}
.sync-dot.local{background:var(--accent)}
.ver{font-size:11px;color:var(--text);font-weight:700;opacity:.7}
.usr{font-size:11px;color:var(--muted);cursor:pointer}
.usr:hover{color:var(--text)}

/* ── Update banner ── */
#upd-banner{display:none;background:var(--accent);color:#1a1d27;padding:11px 14px;font-size:14px;font-weight:900;text-align:center;cursor:pointer;position:sticky;top:46px;z-index:49;letter-spacing:.3px;animation:pulse-banner 2s ease-in-out infinite}
#upd-banner:hover{background:#fbbf24}
@keyframes pulse-banner{0%,100%{opacity:1}50%{opacity:.75}}

/* ── Sync notice ── */
#sync-notice{display:none;background:#1e293b;border-bottom:1px solid var(--bord);padding:5px 14px;font-size:11px;color:var(--muted)}

/* ── Nav ── */
.nav{background:var(--surf);border-bottom:1px solid var(--bord);display:flex;overflow-x:auto}
.nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:13px;font-weight:700;padding:10px 16px;cursor:pointer;white-space:nowrap;font-family:inherit;transition:color .1s}
.nav button:hover{color:var(--text)}
.nav button.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── Panels ── */
.panel{display:none}.panel.active{display:block}

/* ── Timeline ── */
#tl-wrap{overflow-x:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
#tl-wrap svg text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

/* ── Jobs table ── */
.job-tbl{width:100%;border-collapse:collapse}
.job-tbl th{font-size:10px;font-weight:700;color:var(--muted);text-align:left;padding:7px 10px;border-bottom:1px solid var(--bord);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.job-tbl td{padding:7px 10px;border-bottom:1px solid var(--bord);vertical-align:middle}
.job-tbl tr:hover td{background:var(--surf);cursor:pointer}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-right:6px}
.jname{font-weight:600;font-size:13px;line-height:1.2}
.jnote{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.wks{font-size:13px;white-space:nowrap}
.wks-delta{font-size:10px;margin-top:1px}
.wks-delta.fast{color:var(--c-run)}
.wks-delta.slow{color:#ef4444}
.ppl{font-size:13px;white-space:nowrap}
.tbl-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;padding:3px 6px;border-radius:4px;line-height:1;font-family:inherit}
.tbl-btn:hover{color:var(--text);background:var(--surf2)}

/* ── Add bar ── */
.add-bar{padding:10px 12px}
.btn-add{background:var(--accent);color:#1a1d27;border:none;padding:7px 18px;border-radius:6px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-add:hover{background:#fbbf24}

/* ── Archive header ── */
.arch-hdr{padding:10px 12px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bord)}

/* ── Edit modal ── */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:flex-end;justify-content:center;padding:0}
.mbg.open{display:flex}
@media(min-width:500px){.mbg{align-items:center;padding:20px}}
.mbox{background:var(--surf);border:1px solid var(--bord);border-radius:18px 18px 0 0;padding:20px 18px;width:100%;max-width:440px}
@media(min-width:500px){.mbox{border-radius:16px}}
.mbox h3{font-size:15px;font-weight:700;margin-bottom:14px}
.fr{margin-bottom:11px}
.fr label{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.fr input,.fr select,.fr textarea{width:100%;background:var(--surf2);border:1px solid var(--bord);color:var(--text);padding:8px 10px;border-radius:7px;font-size:14px;font-family:inherit}
.fr textarea{resize:vertical;min-height:52px}
.fr input:focus,.fr select:focus,.fr textarea:focus{outline:1px solid var(--accent);border-color:var(--accent)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wks-calc{font-size:11px;color:var(--muted);margin-top:3px;min-height:14px}
.wks-calc.fast{color:var(--c-run)}
.wks-calc.slow{color:#ef4444}
.ov-row{display:flex;align-items:center;gap:10px;padding:3px 0;border-bottom:1px solid #1e2130;font-size:12px}
.mac{display:flex;align-items:center;gap:8px;margin-top:14px}
.btn-sv{background:var(--accent);color:#1a1d27;border:none;padding:8px 20px;border-radius:7px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-sv:hover{background:#fbbf24}
.btn-arch{background:none;border:1px solid var(--bord);color:var(--muted);padding:7px 12px;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;margin-left:auto}
.btn-arch:hover{border-color:#ef4444;color:#ef4444}
.btn-unarch{background:none;border:1px solid var(--bord);color:var(--muted);padding:7px 12px;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;margin-left:auto}
.btn-unarch:hover{border-color:var(--c-run);color:var(--c-run)}
.btn-cx{background:none;border:none;color:var(--muted);padding:8px;font-size:13px;cursor:pointer;font-family:inherit}
.btn-cx:hover{color:var(--text)}

/* ── Auth / Setup ── */
.screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:900}
.auth-box{background:var(--surf);border:1px solid var(--bord);border-radius:18px;padding:28px 24px;width:100%;max-width:360px}
.auth-box h2{font-size:20px;font-weight:800;color:var(--accent);margin-bottom:3px}
.auth-box .sub{font-size:12px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.ai{display:block;width:100%;background:var(--surf2);border:1px solid var(--bord);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:10px}
.ai:focus{outline:1px solid var(--accent);border-color:var(--accent)}
.btn-p{width:100%;background:var(--accent);color:#1a1d27;border:none;padding:11px;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-p:hover{background:#fbbf24}
.or-div{text-align:center;font-size:11px;color:var(--muted);margin:10px 0}
.btn-l{width:100%;background:none;border:1px solid var(--bord);color:var(--muted);padding:10px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit}
.btn-l:hover{border-color:var(--text);color:var(--text)}
.err{color:#ef4444;font-size:12px;margin-bottom:8px;min-height:16px}
.setup-note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.5}
.setup-note a{color:var(--accent)}

@media(max-width:480px){
  .job-tbl th:nth-child(4),.job-tbl td:nth-child(4){display:none}
  .jnote{max-width:120px}
}

/* ── Staff Tab ───────────────────────────────────────────── */
.snav{background:var(--surf);border-bottom:1px solid var(--bord);display:flex;overflow-x:auto;padding:0 8px}
.snav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:12px;font-weight:700;padding:9px 14px;cursor:pointer;white-space:nowrap;font-family:inherit}
.snav button:hover{color:var(--text)}
.snav button.active{color:var(--accent);border-bottom-color:var(--accent)}
.sv{display:none}.sv.active{display:block}

.hrs-hdr{display:flex;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap}
.hrs-hdr span{font-size:13px;font-weight:700;color:var(--text);min-width:200px;text-align:center}
.btn-today,.btn-fill{background:none;border:1px solid var(--bord);color:var(--muted);padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700}
.btn-today:hover{border-color:var(--text);color:var(--text)}
.btn-fill{color:var(--accent);border-color:var(--accent)}
.btn-fill:hover{background:var(--accent);color:#1a1d27}
.nav-arrow{background:none;border:1px solid var(--bord);color:var(--text);font-size:18px;width:32px;height:32px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;font-family:inherit;flex-shrink:0}
.nav-arrow:hover{border-color:var(--accent);color:var(--accent)}
.hrs-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hrs-tbl{border-collapse:collapse;font-size:12px;width:100%}
.hrs-tbl th{background:var(--surf);padding:5px 6px;text-align:center;font-size:10px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--bord);border-right:1px solid var(--bord);white-space:nowrap;position:sticky;top:0;z-index:5}
.hrs-tbl th.name-th{text-align:left;position:sticky;left:0;background:var(--surf);z-index:6;min-width:120px;padding:5px 10px}
.hrs-tbl th.wk2{border-left:2px solid var(--accent)}
.hrs-tbl td{padding:3px 4px;border-bottom:1px solid var(--bord);border-right:1px solid var(--bord);text-align:center;vertical-align:middle}
.hrs-tbl td.name-td{text-align:left;padding:4px 10px;font-weight:700;font-size:13px;color:var(--text);position:sticky;left:0;background:var(--surf2);z-index:4;white-space:nowrap;min-width:120px}
.hrs-tbl td.wk2{border-left:2px solid var(--accent)}
.hrs-tbl td.tot-td{font-weight:800;font-size:13px;color:var(--accent);background:var(--surf);padding:4px 8px}
.hrs-tbl td.bh-td{background:#0a0d14;color:var(--muted);font-size:10px}
.hrs-tbl td.leave-td{background:#1e3a2f;color:#22c55e;font-weight:800;font-size:13px;text-align:center}
.hrs-tbl td.leave-td.unpaid{background:#2a1f0a;color:#f59e0b}
.hrs-inp{width:46px;background:var(--bg);border:1px solid var(--bord);color:var(--text);border-radius:5px;padding:4px 2px;font-size:13px;font-weight:700;text-align:center;font-family:inherit}
.hrs-inp:focus{outline:1px solid var(--accent);border-color:var(--accent)}
.hrs-inp.changed{border-color:#22c55e}
.save-hrs-btn{background:var(--accent);color:#1a1d27;border:none;padding:7px 20px;border-radius:7px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.save-hrs-btn:hover{background:#fbbf24}
.row-fill-btn{background:none;border:1px solid var(--bord);color:var(--muted);padding:3px 8px;border-radius:5px;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap}
.row-fill-btn:hover{border-color:var(--accent);color:var(--accent)}
.hrs-act{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--bord)}
.hrs-stat{font-size:12px;color:var(--muted);flex:1}

.adv-section,.leave-section{padding:14px 12px;border-top:2px solid var(--bord)}
.adv-section h3,.leave-section h3{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--text)}
.adv-hint{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5}
.adv-form{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.adv-form select,.adv-form input{background:var(--surf2);border:1px solid var(--bord);color:var(--text);padding:7px 9px;border-radius:7px;font-size:13px;font-family:inherit}
.adv-form select{min-width:120px}
.adv-form input[type=number]{width:100px}
.adv-form input[type=date]{width:140px}
.adv-form input[type=text]{min-width:120px;flex:1}
.adv-form button{background:var(--accent);color:#1a1d27;border:none;padding:7px 16px;border-radius:7px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.adv-list-wrap{display:flex;flex-direction:column;gap:4px}
.adv-row{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--surf2);border-radius:6px;font-size:12px;flex-wrap:wrap}
.adv-row .ar-name{font-weight:700;min-width:80px;flex-shrink:0}
.adv-row .ar-type{font-weight:700;min-width:60px;flex-shrink:0}
.adv-row .ar-amt{font-weight:800;min-width:60px;flex-shrink:0}
.adv-row .ar-date{color:var(--muted);flex-shrink:0}
.adv-row .ar-note{color:var(--muted);flex:1}
.adv-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;margin-left:auto;flex-shrink:0}
.adv-del:hover{color:#ef4444}

.roster-card{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--bord)}
.rc-name{font-weight:700;font-size:14px;flex:1}
.rc-sub{font-size:12px;color:var(--muted)}
.roster-btn{background:none;border:1px solid var(--bord);color:var(--muted);padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700;white-space:nowrap}
.roster-btn:hover{border-color:#ef4444;color:#ef4444}
.roster-btn.restore:hover{border-color:var(--c-run);color:var(--c-run)}

.st-setup-box{margin:20px 12px;background:var(--surf2);border:1px solid var(--bord);border-radius:12px;padding:16px}
.st-setup-box h3{font-size:14px;font-weight:700;margin-bottom:8px;color:var(--accent)}
.st-setup-box p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:6px}
.st-setup-box pre{background:var(--bg);border:1px solid var(--bord);border-radius:8px;padding:12px;font-size:10px;color:#94a3b8;overflow-x:auto;margin-top:8px;white-space:pre;line-height:1.5}
.st-empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}
/* ── Resource Planner (Deployment board) ──
   --panel/--panel2 were referenced below but never defined anywhere in
   :root, so every chip/column/header was rendering with no fill at all
   (transparent, relying on whatever sat behind it). Defined here as
   translucent panels, scoped to this tab only, so a background shows
   through underneath — Trello-style board photo, without touching the
   rest of the app's theme. */
#tab-resources{
  --panel: rgba(26,29,39,0.74);
  --panel2: rgba(34,38,54,0.8);
  position:relative;
  background:
    radial-gradient(1100px 700px at 12% -10%, rgba(245,158,11,0.12), transparent 60%),
    radial-gradient(900px 650px at 100% 105%, rgba(11,61,108,0.4), transparent 55%),
    linear-gradient(160deg, #0f1117 0%, #141826 45%, #1b2130 100%);
  background-attachment:fixed;
}
.res-layout{display:flex;height:calc(100vh - 100px);overflow:hidden}
.res-sidebar{width:180px;flex-shrink:0;border-right:1px solid var(--bord);padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;background:rgba(15,17,23,0.45);backdrop-filter:blur(3px)}
.res-sidebar-hdr{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:4px 2px 6px}
.res-staff-list{display:flex;flex-direction:column;gap:5px}
.res-chip{background:var(--panel);border:1px solid var(--bord);border-radius:6px;padding:7px 10px;font-size:12px;font-weight:600;cursor:grab;user-select:none;transition:background .15s,border-color .15s}
.res-chip:hover{border-color:var(--accent);color:var(--accent)}
.res-chip.res-dragging{opacity:0.4}
.res-board{flex:1;overflow-x:auto;overflow-y:auto;padding:16px;display:flex;gap:12px;align-items:flex-start}
.res-col{width:210px;flex-shrink:0;background:var(--panel);border:1px solid var(--bord);border-radius:10px;overflow:hidden}
.res-col-hdr{padding:11px 13px;background:var(--panel2)}
.res-col-name{font-weight:700;font-size:13px;margin-bottom:3px}
.res-col-meta{font-size:10px;color:var(--muted)}
.res-week-cell{border-top:1px solid var(--bord);padding:8px 10px}
.res-week-cell-hdr{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.res-clear-week-btn{margin-left:auto;background:none;border:1px solid rgba(239,68,68,.35);color:#ef4444;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;cursor:pointer;font-family:inherit;line-height:1.5;flex-shrink:0}
.res-clear-week-btn:hover{background:rgba(239,68,68,.1)}
.res-clear-job-btn{background:none;border:1px solid rgba(239,68,68,.3);color:#ef4444;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;cursor:pointer;font-family:inherit;line-height:1.5;flex-shrink:0;margin-top:4px;width:100%}
.res-clear-job-btn:hover{background:rgba(239,68,68,.1)}
.res-undo-btn{background:none;border:1px solid var(--bord);color:var(--muted);font-size:11px;font-weight:700;padding:5px 10px;border-radius:7px;cursor:pointer;font-family:inherit;margin-left:auto}
.res-undo-btn:not(:disabled):hover{border-color:var(--accent);color:var(--accent)}
.res-undo-btn:disabled{opacity:.35;cursor:default}
.res-wk-num{background:var(--panel2);border-radius:4px;padding:1px 5px;font-size:9px;color:var(--accent);font-weight:700}
.res-week-zone{display:flex;flex-wrap:wrap;gap:4px;min-height:38px;border-radius:6px;padding:4px;border:1px solid transparent;transition:background .15s,border .15s}
.res-week-zone.res-drag-over{background:rgba(230,184,75,0.12);border:1px dashed var(--accent)}
.res-placed-chip{display:flex;align-items:center;gap:3px;background:var(--panel2);border:1px solid var(--bord);border-radius:5px;padding:3px 7px;font-size:11px;font-weight:600}
.res-remove-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:0 1px;line-height:1}
.res-remove-btn:hover{color:#f85149}
.res-leave-badge{font-size:10px;color:var(--muted);font-weight:400;margin-left:3px}
.res-week-cell--past{opacity:0.38;pointer-events:none;filter:grayscale(0.3)}
.res-col--collapsed .res-week-cell{display:none}
.res-col-toggle{background:none;border:1px solid var(--bord);border-radius:5px;color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;padding:2px 6px;line-height:1.4;margin-left:auto;flex-shrink:0}
.res-col-toggle:hover{color:var(--accent);border-color:var(--accent)}
.res-col-hdr-row{display:flex;align-items:flex-start;gap:6px}
.res-board-toolbar{display:flex;align-items:center;gap:8px;padding:0 0 14px;flex-wrap:wrap;flex-shrink:0;width:100%}
.res-filter-btn{background:var(--panel);border:1px solid var(--bord);border-radius:7px;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;padding:5px 12px;transition:background .15s,color .15s,border-color .15s}
.res-filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.res-filter-btn.active{background:var(--accent);color:#0d1117;border-color:var(--accent)}
.res-collapse-all-btn{margin-left:auto;background:var(--panel);border:1px solid var(--bord);border-radius:7px;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;padding:5px 12px;transition:background .15s,color .15s}
.res-collapse-all-btn:hover{color:var(--accent);border-color:var(--accent)}

<!-- ── Main app ── -->

    <div class="mac">

}
function getJobOverrides(jobId) {
  try { return JSON.parse(localStorage.getItem('dgc-job-overrides')||'{}')[jobId]||[]; } catch(e) { return []; }
}
function saveJobOverrides(jobId, ovs) {
  try { const s=JSON.parse(localStorage.getItem('dgc-job-overrides')||'{}'); s[jobId]=ovs; localStorage.setItem('dgc-job-overrides',JSON.stringify(s)); } catch(e) {}
}

function revisedWeeks(j) {
  const bd = j.id ? getBaseDays(j.id) : 0;
  const totalDays = (j.base_weeks || 0) * 5 + bd;
  if (!j.people_on_site || j.people_on_site <= 0) return Math.ceil(totalDays / 5);
  return Math.ceil(totalDays * j.people_needed / j.people_on_site) / 5;
}

// ── Date helpers ───────────────────────────────────────────
function toDateStr(d) {
  // YYYY-MM-DD from Date object
  return d.toISOString().substring(0,10);
}
function weekdayCount(from, to) {
  let count = 0, d = new Date(from + 'T12:00:00'), end = new Date(to + 'T12:00:00');
  while (d <= end) { const day = d.getDay(); if (day !== 0 && day !== 6) count++; d.setDate(d.getDate() + 1); }
  return count;
}
function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return toDateStr(d);
}
function fmtDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});
}
function mondayOf(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const dow = d.getDay(); // 0=Sun
  const diff = (dow === 0 ? -6 : 1 - dow);
  d.setDate(d.getDate() + diff);
  return toDateStr(d);
}
// Snap any date to the nearest Mon-Fri non-BH working day (forward only)
function snapToWorkingDay(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const wd = d.getDay();
  if (wd === 6) d.setDate(d.getDate() + 2); // Sat → Mon
  else if (wd === 0) d.setDate(d.getDate() + 1); // Sun → Mon
  for (let i = 0; i < 20; i++) { const ds = toDateStr(d), w = d.getDay(); if (w !== 0 && w !== 6 && !IOM_BH.has(ds)) break; d.setDate(d.getDate() + 1); }
  return toDateStr(d);
}
function daysBetween(a, b) {
  return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 86400000);
}
function nextWorkingDay() {
  const d = new Date();
  do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6);
  return toDateStr(d);
}

// ── Isle of Man bank holidays ──────────────────────────────
const IOM_BH = new Set([
  '2025-01-01','2025-04-18','2025-04-21','2025-05-05','2025-07-07','2025-08-25','2025-12-25','2025-12-26',
  '2026-01-01','2026-04-03','2026-04-06','2026-05-04','2026-05-25','2026-06-12','2026-07-06','2026-08-31','2026-12-25','2026-12-28',
  '2027-01-01','2027-03-26','2027-03-29','2027-05-03','2027-07-05','2027-08-30','2027-12-27','2027-12-28',
  '2028-01-03','2028-04-14','2028-04-17','2028-05-01','2028-07-05','2028-08-26','2028-12-25','2028-12-26',
]);
function isWorkingDay(dateStr) {
  const dow = new Date(dateStr + 'T12:00:00').getDay();
  return dow !== 0 && dow !== 6 && !IOM_BH.has(dateStr);
}
function addWorkingDays(dateStr, days) {
  const d = new Date(dateStr + 'T12:00:00');
  let rem = Math.abs(Math.round(days));
  const dir = days >= 0 ? 1 : -1;
  while (rem > 0) { d.setDate(d.getDate() + dir); if (isWorkingDay(toDateStr(d))) rem--; }
  return toDateStr(d);
}
function workingDaysBetween(startStr, endStr) {
  const end = new Date(endStr + 'T12:00:00');
  const d = new Date(startStr + 'T12:00:00');
  if (end <= d) return 0;
  let count = 0;
  while (d < end) { d.setDate(d.getDate() + 1); if (isWorkingDay(toDateStr(d))) count++; }
  return count;
}
// Mon-Fri count, start_date = day 1 (inclusive). Bank holidays count as weekdays.
function addWeekdays(dateStr, n) {
  const d = new Date(dateStr + 'T12:00:00');
  let rem = Math.max(Math.round(n), 1) - 1;
  // BH are non-working — skip them (job extends by 1 day per BH in the period)
  while (rem > 0) { d.setDate(d.getDate() + 1); const wd = d.getDay(); const ds = toDateStr(d); if (wd !== 0 && wd !== 6 && !IOM_BH.has(ds)) rem--; }
  return toDateStr(d);
}
// Count Mon-Fri non-BH days from a to b inclusive.
function weekdaysBetween(a, b) {
  const da = new Date(a + 'T12:00:00'), db = new Date(b + 'T12:00:00');
  let n = 0, d = new Date(da);
  while (d <= db) { const wd = d.getDay(); const ds = toDateStr(d); if (wd !== 0 && wd !== 6 && !IOM_BH.has(ds)) n++; d.setDate(d.getDate() + 1); }
  return n;
}
function jobEndDate(j) {
  const today = toDateStr(new Date());
  const bd = j.id ? getBaseDays(j.id) : 0;
  const totalDays = (j.base_weeks || 0) * 5 + bd;
  const pos = j.people_on_site || 0, pn = j.people_needed || 0;
  const revised = (pos > 0 && pn > 0) ? Math.ceil(totalDays * pn / pos) : totalDays;
  return addWeekdays(j.start_date || today, Math.max(revised, 1));
}

// ── Local jobs ─────────────────────────────────────────────
function loadLocal() {
  try { const d = JSON.parse(localStorage.getItem(L_JOBS_K)||'[]'); if (Array.isArray(d) && d.length) return d; } catch(e) {}
  // First time — seed
  const seeds = SEEDS.map((s,i) => Object.assign({ id: 'local-'+(i+1), created_at: new Date().toISOString() }, s));
  saveLocal(seeds);
  return seeds;
}
function saveLocal(jobs) {
  localStorage.setItem(L_JOBS_K, JSON.stringify(jobs));
}

// ── Supabase CRUD ──────────────────────────────────────────
async function sbLoad() {
  const { data, error } = await _sb.from('dgc_planner_jobs').select('*').order('start_date');
  if (error) { console.error(error); return []; }
  if (!data.length) {
    // Seed Supabase on first use
    for (const s of SEEDS) {
      await _sb.from('dgc_planner_jobs').insert(s);
    }
    const { data: d2 } = await _sb.from('dgc_planner_jobs').select('*').order('start_date');
    return d2 || [];
  }
  return data;
}
async function sbUpsert(job) {
  if (job.id) {
    job.updated_at = new Date().toISOString();
    const { error } = await _sb.from('dgc_planner_jobs').upsert(job);
    if (error) console.error(error);
    return job.id;
  } else {
    const { data, error } = await _sb.from('dgc_planner_jobs').insert(job).select('id').single();
    if (error) { console.error(error); return null; }
    return data?.id;
  }
}
async function sbDelete(id) {
  await _sb.from('dgc_planner_jobs').delete().eq('id', id);
}

// ── Unified load/save ──────────────────────────────────────
async function loadJobs() {
  if (_local) return loadLocal();
  return sbLoad();
}
async function upsertJob(job) {
  let savedId;
  if (_local) {
    const jobs = loadLocal();
    const idx = jobs.findIndex(j => j.id === job.id);
    if (idx >= 0) jobs[idx] = job; else jobs.push(job);
    saveLocal(jobs);
    savedId = job.id;
  } else {
    savedId = await sbUpsert(job);
  }
  await refresh();
  return savedId;
}
async function removeJob(id) {
  if (_local) {
    const jobs = loadLocal().filter(j => j.id !== id);
    saveLocal(jobs);
  } else {
    await sbDelete(id);
  }
  await refresh();
}

// ── Refresh ────────────────────────────────────────────────
let _jobs = [];
async function refresh() {
  _jobs = await loadJobs();
  const tlJobs = applyTlRowOrder(_jobs.filter(j => !j.archived && j.on_timeline !== false));
  renderTimeline(tlJobs);
  renderTable(applyTlRowOrder(_jobs.filter(j => !j.archived)), 'jobs-body', false);
  renderTable(_jobs.filter(j => j.archived), 'archive-body', true);
  bindTableRowDrag();
}

// ── Realtime ───────────────────────────────────────────────
function initRealtime() {
  if (!_sb) return;
  _sb.channel('plan-jobs')
    .on('postgres_changes', { event:'*', schema:'public', table:'dgc_planner_jobs' }, () => refresh())
    .subscribe();
}

// ── Timeline (SVG Gantt) ───────────────────────────────────
// ── Drag state ─────────────────────────────────────────────
let _drag = null;
let _resize = null;
let _wasDrag = false;
let _origin = null; // current timeline origin (Monday of this week), set by renderTimeline
let _lastTap = { id: null, time: 0 }; // touch double-tap tracking

function renderTimeline(jobs) {
  const W_PX  = 52;   // px per week
  const ROW_H = 46;
  const HEAD_H = 44;  // two-line header
  const FOOT_H = 56;  // gang chart footer
  const LBL_W = 130;
  const WEEKS  = 26;

  const today = toDateStr(new Date());
  const origin = mondayOf(today); // first Monday of current week
  _origin = origin; // expose for drag handlers

  const svgW = LBL_W + WEEKS * W_PX + 20;
  const svgH = HEAD_H + Math.max(jobs.length,1) * ROW_H + FOOT_H;

  let s = `<svg width="${svgW}" height="${svgH}" xmlns="http://www.w3.org/2000/svg" style="display:block">`;

  // Week column backgrounds + full Mon/date headers every week
  for (let w = 0; w < WEEKS; w++) {
    const wDate = addDays(origin, w * 7);
    const x = LBL_W + w * W_PX;
    const isEven = w % 2 === 0;
    s += `<rect x="${x}" y="0" width="${W_PX}" height="${svgH}" fill="${isEven?'#1a1d27':'#1e2130'}" />`;
    const d = new Date(wDate+'T12:00:00');
    const dayName = d.toLocaleDateString('en-GB',{weekday:'short'});
    const dateLbl = d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    const cx = x + W_PX / 2;
    s += `<text x="${cx}" y="16" font-size="8" text-anchor="middle" fill="#475569" font-weight="600">${dayName}</text>`;
    s += `<text x="${cx}" y="32" font-size="9" text-anchor="middle" fill="#94a3b8" font-weight="700">${dateLbl}</text>`;
  }

  // Today line
  const todayOff = daysBetween(origin, today);
  const todayX   = LBL_W + (todayOff / 7) * W_PX;
  s += `<line x1="${todayX}" y1="${HEAD_H}" x2="${todayX}" y2="${svgH - FOOT_H}" stroke="#f59e0b" stroke-width="1.5" opacity=".6" stroke-dasharray="4,3"/>`;
  s += `<text x="${todayX+3}" y="${HEAD_H-8}" font-size="9" fill="#f59e0b" font-weight="700">Today</text>`;

  // Label column bg
  s += `<rect x="0" y="0" width="${LBL_W}" height="${svgH}" fill="#0f1117"/>`;
  s += `<line x1="${LBL_W}" y1="${HEAD_H}" x2="${LBL_W}" y2="${svgH}" stroke="#2e3347" stroke-width="1"/>`;

  // Job rows
  if (!jobs.length) {
    s += `<text x="${LBL_W + 20}" y="${HEAD_H + 28}" font-size="13" fill="#64748b">No jobs on timeline. Add jobs in the Jobs tab.</text>`;
  }
  jobs.forEach((j, i) => {
    const y0 = HEAD_H + i * ROW_H;
    const y1 = y0 + ROW_H;
    const by = y0 + 7;
    const bh = ROW_H - 14;
    const col = STATUS_COL[j.status] || '#94a3b8';
    const rw  = revisedWeeks(j);

    // Row separator
    s += `<line x1="0" y1="${y1}" x2="${svgW}" y2="${y1}" stroke="#2e3347" stroke-width=".5" opacity=".6"/>`;

    // Label
    const lbl = j.name.length > 16 ? j.name.substring(0,15)+'…' : j.name;
    s += `<text x="${LBL_W-8}" y="${by + bh/2 + 4}" font-size="12" text-anchor="end" fill="#e2e8f0" font-weight="600">${esc(lbl)}</text>`;

    // Bar position
    const startOff = daysBetween(origin, j.start_date || today);
    const bx = LBL_W + (startOff / 7) * W_PX;
    const endDate = jobEndDate(j);
    const endOff = daysBetween(origin, endDate);
    // Bar ends at actual last working day — weekend gap shows between jobs
    const bEnd = LBL_W + ((endOff + 1) / 7) * W_PX;
    const bw = Math.max(bEnd - bx, 8);

    // Bar (clip to visible area)
    if (bx < LBL_W + WEEKS * W_PX && bx + bw > LBL_W) {
      const cx = Math.max(bx, LBL_W);
      const cw = Math.min(bx + bw, LBL_W + WEEKS * W_PX) - cx;
      s += `<rect x="${cx}" y="${by}" width="${cw}" height="${bh}" rx="5" fill="${col}" opacity=".85" data-id="${j.id}" class="tl-bar" style="cursor:pointer"/>`;
      // People badge
      if (bw > 28) {
        const bBadgeX = Math.min(bx + bw - 20, LBL_W + WEEKS * W_PX - 20);
        s += `<circle cx="${bBadgeX}" cy="${by+bh/2}" r="11" fill="${col}" stroke="white" stroke-width="1.5" data-id="${j.id}" class="tl-badge" style="cursor:pointer"/>`;
        s += `<text x="${bBadgeX}" y="${by+bh/2+4}" font-size="10" text-anchor="middle" fill="white" font-weight="900" pointer-events="none">${j.people_on_site}</text>`;
      }
      // Job name on bar if wide enough
      if (bw > 60) {
        const txtX = cx + 7;
        const maxChars = Math.floor(cw / 7);
        const barLbl = j.name.length > maxChars ? j.name.substring(0, maxChars-1)+'…' : j.name;
        s += `<text x="${txtX}" y="${by+bh/2+4}" font-size="11" fill="white" font-weight="700" pointer-events="none">${esc(barLbl)}</text>`;
      }
      // End date label — inside bar, right-aligned at the actual last working day
      if (bw > 55) {
        const endActX = Math.min(LBL_W + (endOff / 7) * W_PX - 3, LBL_W + WEEKS * W_PX - 4);
        s += `<text x="${endActX}" y="${by + 10}" font-size="7.5" text-anchor="end" fill="rgba(255,255,255,0.78)" font-weight="700" pointer-events="none">${fmtDate(endDate)}</text>`;
      }
      // Resize grip — three vertical lines at right edge (visual cue to drag here)
      if (bw > 30) {
        const gx = Math.min(bx + bw - 11, LBL_W + WEEKS * W_PX - 5);
        if (gx > cx) {
          for (let l = 0; l < 3; l++) s += `<line x1="${gx+l*3}" y1="${by+5}" x2="${gx+l*3}" y2="${by+bh-5}" stroke="rgba(255,255,255,0.38)" stroke-width="1.5" stroke-linecap="round" pointer-events="none"/>`;
        }
      }
    }
  });

  // ── Gang footer ───────────────────────────────────────────
  // Single weekly bar when all active days have the same headcount.
  // Breaks into 5 daily bars when any day differs (mid-week overlaps, starts/ends, or explicit overrides).
  // Bank holiday days (isWorkingDay = false) are skipped and never cause a split.
  const footY = HEAD_H + Math.max(jobs.length,1) * ROW_H;
  s += `<rect x="0" y="${footY}" width="${svgW}" height="${FOOT_H}" fill="#0a0d14"/>`;
  s += `<line x1="0" y1="${footY}" x2="${svgW}" y2="${footY}" stroke="#2e3347" stroke-width="1"/>`;
  s += `<text x="${LBL_W-8}" y="${footY+FOOT_H/2+4}" font-size="11" text-anchor="end" fill="#64748b" font-weight="700">Gang</text>`;

  const weekData = [];
  for (let w = 0; w < WEEKS; w++) {
    const dayTotals = [0, 0, 0, 0, 0];
    for (let d = 0; d < 5; d++) {
      const dateStr = addDays(origin, w * 7 + d);
      if (!isWorkingDay(dateStr)) continue; // bank holidays stay 0, excluded from split check
      jobs.forEach(j => {
        const jStart = j.start_date || today;
        // Visual boundary = day after last working day — matches bar
        const jVisualEnd = addDays(jobEndDate(j), 1);
        if (jStart <= dateStr && dateStr < jVisualEnd) {
          const ov = getJobOverrides(j.id).find(o => o.date === dateStr);
          dayTotals[d] += ov ? ov.people : (j.people_on_site || j.people_needed || 0);
        }
      });
    }
    weekData.push(dayTotals);
  }

  const maxPpl = Math.max(...weekData.flat(), 1);
  const GANG_CAP = Math.max(jobs.reduce((acc, j) => acc + (j.people_needed || j.people_on_site || 0), 0), 1);
  const barZone = FOOT_H - 20;
  const D_W = W_PX / 5;

  for (let w = 0; w < WEEKS; w++) {
    const dayTotals = weekData[w];
    const x = LBL_W + w * W_PX;
    const nonZero = dayTotals.filter(v => v > 0);
    if (!nonZero.length) continue;
    const allSame = nonZero.every(v => v === nonZero[0]);
    if (!allSame) {
      // Different headcounts within the week — break into daily bars
      dayTotals.forEach((ppl, d) => {
        if (!ppl) return;
        const dx = x + d * D_W;
        const barH = Math.max(Math.round((ppl / maxPpl) * barZone), 3);
        const barY = footY + FOOT_H - barH - 12;
        const ratio = ppl / GANG_CAP;
        const barCol = ratio > 0.85 ? '#ef4444' : ratio > 0.5 ? '#f59e0b' : '#22c55e';
        s += `<rect x="${(dx+0.5).toFixed(1)}" y="${barY}" width="${(D_W-1).toFixed(1)}" height="${barH}" rx="2" fill="${barCol}" opacity=".85"/>`;
        s += `<text x="${(dx+D_W/2).toFixed(1)}" y="${footY+FOOT_H-2}" font-size="7" text-anchor="middle" fill="${barCol}" font-weight="800">${ppl}</text>`;
      });
    } else {
      // Same headcount all active days — single clean weekly bar
      const ppl = nonZero[0];
      const barH = Math.max(Math.round((ppl / maxPpl) * barZone), 4);
      const barY = footY + FOOT_H - barH - 12;
      const ratio = ppl / GANG_CAP;
      const barCol = ratio > 0.85 ? '#ef4444' : ratio > 0.5 ? '#f59e0b' : '#22c55e';
      s += `<rect x="${x+3}" y="${barY}" width="${W_PX-6}" height="${barH}" rx="3" fill="${barCol}" opacity=".85"/>`;
      s += `<text x="${x+W_PX/2}" y="${footY+FOOT_H-2}" font-size="9" text-anchor="middle" fill="${barCol}" font-weight="800">${ppl}</text>`;
    }
  }

  s += '</svg>';
  document.getElementById('tl-svg').innerHTML = s;

  // Bar: drag body=move, drag right edge=resize, double-click=edit
  document.querySelectorAll('.tl-bar').forEach(el => {
    el.style.cursor = 'grab';
    el.addEventListener('mousemove', e => {
      el.style.cursor = (el.getBoundingClientRect().right - e.clientX) < 14 ? 'ew-resize' : 'grab';
    });
    el.addEventListener('mousedown', e => {
      const j = _jobs.find(x => x.id == el.getAttribute('data-id'));
      if (!j) return;
      // Double-click detection via mousedown — e.preventDefault() below suppresses dblclick,
      // so we detect two rapid mousedowns on the same job instead.
      const now = Date.now();
      if (_lastTap.id === j.id && (now - _lastTap.time) < 350) {
        _lastTap = { id: null, time: 0 };
        openEdit(j);
        return;
      }
      _lastTap = { id: j.id, time: now };
      const rect = el.getBoundingClientRect();
      if ((rect.right - e.clientX) < 14) {
        _resize = { job: j, origX: e.clientX, origWeeks: j.base_weeks, origDays: getBaseDays(j.id), lastDeltaDays: null };
      } else {
        const actualStart = j.start_date || toDateStr(new Date());
        const startOff = _origin ? daysBetween(_origin, actualStart) : 0;
        const dragAnchor = (startOff < 0 && _origin) ? _origin : actualStart;
        _drag = { job: j, origX: e.clientX, origStart: actualStart, dragAnchor, lastDeltaDays: null };
      }
      _wasDrag = false;
      e.preventDefault();
    });
    el.addEventListener('touchstart', e => {
      const j = _jobs.find(x => x.id == el.getAttribute('data-id'));
      if (!j) return;
      // Double-tap → open edit modal
      const now = Date.now();
      if (_lastTap.id === j.id && (now - _lastTap.time) < 350) {
        _lastTap = { id: null, time: 0 };
        e.preventDefault();
        openEdit(j);
        return;
      }
      _lastTap = { id: j.id, time: now };
      const rect = el.getBoundingClientRect();
      const tx = e.touches[0].clientX;
      if ((rect.right - tx) < rect.width * 0.22) {
        _resize = { job: j, origX: tx, origWeeks: j.base_weeks, origDays: getBaseDays(j.id), lastDeltaDays: null };
      } else {
        const actualStart = j.start_date || toDateStr(new Date());
        const startOff = _origin ? daysBetween(_origin, actualStart) : 0;
        const dragAnchor = (startOff < 0 && _origin) ? _origin : actualStart;
        _drag = { job: j, origX: tx, origStart: actualStart, dragAnchor, lastDeltaDays: null };
      }
      _wasDrag = false;
    }, { passive: false });
    el.addEventListener('dblclick', e => {
      e.stopPropagation();
      const j = _jobs.find(x => x.id == el.getAttribute('data-id'));
      if (j) openEdit(j);
    });
  });
  // Click badge → open edit modal
  document.querySelectorAll('.tl-badge').forEach(el => {
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      const j = _jobs.find(x => x.id == el.getAttribute('data-id'));
      if (j) openEdit(j);
    });
  });
}


// ── Jobs table ────────────────────────────────────────────
function renderTable(jobs, bodyId, isArchive) {
  const tb = document.getElementById(bodyId);
  if (!jobs.length) {
    tb.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--muted)">${isArchive?'No archived jobs.':'No active jobs — add one above.'}</td></tr>`;
    return;
  }
  tb.innerHTML = jobs.map(j => {
    const col = STATUS_COL[j.status]||'#94a3b8';
    const rw  = revisedWeeks(j);
    const endDate = addDays(j.start_date || toDateStr(new Date()), rw * 7);
    let wksDelta = '';
    if (j.people_on_site !== j.people_needed && j.people_on_site > 0) {
      const diff = rw - j.base_weeks;
      const cls  = diff < 0 ? 'fast' : 'slow';
      const sign  = diff < 0 ? '↓' : '↑';
      wksDelta = `<div class="wks-delta ${cls}">${sign} ${Math.abs(diff)}w vs base ${j.base_weeks}w</div>`;
    }
    const pplNote = j.people_on_site !== j.people_needed ? ` <span style="color:var(--muted)">(${j.people_needed} needed)</span>` : '';
    const statusLbl = STATUS_LBL[j.status]||j.status;
    const note = (j.note||'').substring(0,60);
    return `<tr onclick="openEdit(_jobs.find(x=>x.id=='${j.id}'))" ${!isArchive ? `data-jobid="${esc(j.id)}" draggable="true"` : ''}>
      <td>
        <div style="display:flex;align-items:flex-start;gap:4px">
          ${!isArchive ? `<span style="color:var(--muted);font-size:13px;margin-top:2px;flex-shrink:0;cursor:grab" title="Drag to reorder" onclick="event.stopPropagation()">⠿</span>` : ''}
          <span class="dot" style="background:${col};margin-top:3px;flex-shrink:0"></span>
          <div>
            <div class="jname">${esc(j.name)}</div>
            ${note ? `<div class="jnote">${esc(note)}</div>` : ''}
          </div>
        </div>
      </td>
      <td>
        <div class="wks">${rw}w</div>
        ${wksDelta}
        <div style="font-size:10px;color:var(--muted)">${fmtDate(j.start_date)} → ${fmtDate(endDate)}</div>
        <div style="font-size:10px;color:var(--accent);margin-top:2px">Wk&nbsp;${isoWeekNum(j.start_date||toDateStr(new Date()))}–${isoWeekNum(endDate)}</div>
      </td>
      <td><div class="ppl">${j.people_on_site}${pplNote}</div></td>
      <td><span style="font-size:11px;font-weight:600;color:${col}">${statusLbl}</span></td>
      <td><button class="tbl-btn" title="Edit" onclick="event.stopPropagation();openEdit(_jobs.find(x=>x.id=='${j.id}'))">✏️</button></td>
    </tr>`;
  }).join('');
}

function openEdit(j) {

function closeModal() {
  document.getElementById('edit-modal').classList.remove('open');
  document.getElementById('split-section').style.display = 'none';
}

let _finishLock = false;
function calcPreview() {
  const bw = parseInt(document.getElementById('m-weeks').value)||0;
  const bd = Math.min(4, Math.max(0, parseInt(document.getElementById('m-days').value)||0));
  const totalDays = bw * 5 + bd;
  const np = parseInt(document.getElementById('m-needed').value)||0;
  const os = parseInt(document.getElementById('m-onsite').value)||0;
  const start = document.getElementById('m-start').value;
  const prev = document.getElementById('wks-preview');
  if (start && (bw || bd) && !_finishLock) {
    document.getElementById('m-finish').value = addWeekdays(start, totalDays);
  }
  if (!totalDays || !np || !os) { prev.textContent = ''; return; }
  const revisedTotal = Math.ceil(totalDays * np / os);
  const rw2 = Math.floor(revisedTotal / 5), rd2 = revisedTotal % 5;
  const bLabel = bd ? `${bw}w ${bd}d` : `${bw}w`;
  const rLabel = rd2 ? `${rw2}w ${rd2}d` : `${rw2}w`;
  if (os === np) { prev.textContent = `${rLabel} at full staffing`; prev.className = 'wks-calc'; }
  else if (os > np) { prev.textContent = `${rLabel} ↓ (${bLabel} base at ${np} people)`; prev.className = 'wks-calc fast'; }
  else { prev.textContent = `${rLabel} ↑ (${bLabel} base at ${np} people)`; prev.className = 'wks-calc slow'; }
}
function onFinishChange() {
  const start = document.getElementById('m-start').value;
  const finish = document.getElementById('m-finish').value;
  if (!start || !finish || finish <= start) return;
  _finishLock = true;
  const totalDays = weekdaysBetween(start, finish);
  document.getElementById('m-weeks').value = Math.floor(totalDays / 5);
  document.getElementById('m-days').value = totalDays % 5;
  calcPreview();
  _finishLock = false;
}

async function saveModal() {
  const id = document.getElementById('m-id').value;
  const bd = Math.min(4, Math.max(0, parseInt(document.getElementById('m-days').value)||0));
  const job = {
    name: document.getElementById('m-name').value.trim() || 'New Job',
    base_weeks: parseInt(document.getElementById('m-weeks').value)||0,
    people_needed: parseInt(document.getElementById('m-needed').value)||2,
    people_on_site: parseInt(document.getElementById('m-onsite').value)||2,
    start_date: document.getElementById('m-start').value || toDateStr(new Date()),
    status: document.getElementById('m-status').value,
    note: document.getElementById('m-note').value.trim(),
    on_timeline: true,
    archived: _editArchived
  };
  if (id) { job.id = id; saveBaseDays(id, bd); }
  else if (_local) { job.id = 'local-' + Date.now(); saveBaseDays(job.id, bd); }
  closeModal();
  const savedId = await upsertJob(job);
  if (!id && !_local && savedId && bd > 0) saveBaseDays(savedId, bd);
}

// ── Day override UI ───────────────────────────────────────
function renderOverrideList(jobId) {
  jobId = jobId !== undefined ? jobId : document.getElementById('m-id').value;
  const listEl = document.getElementById('ov-list');
  if (!listEl) return;
  if (!jobId) {
    listEl.innerHTML = '<span style="font-size:11px;color:var(--muted)">Save the job first to add day overrides.</span>';
    return;
  }
  const ovs = getJobOverrides(jobId);
  listEl.innerHTML = ovs.length ? ovs.map((o, i) =>
    `<div class="ov-row">
      <span style="flex:1">${fmtDate(o.date)}</span>
      <span style="font-weight:700;color:#60a5fa;min-width:60px">${o.people} people</span>
      <button type="button" onclick="removeDayOverride(${i})" style="background:none;border:1px solid #374151;color:#64748b;border-radius:4px;padding:1px 7px;cursor:pointer;font-size:12px">✕</button>
    </div>`
  ).join('') : '<span style="font-size:11px;color:var(--muted)">No day overrides yet.</span>';
}
function addDayOverride() {
  const jobId = document.getElementById('m-id').value;
  if (!jobId) return;
  const date = document.getElementById('ov-date').value;
  const people = parseInt(document.getElementById('ov-people').value);
  if (!date || isNaN(people) || people < 0) return;
  const ovs = getJobOverrides(jobId);
  const idx = ovs.findIndex(o => o.date === date);
  if (idx >= 0) ovs[idx].people = people; else ovs.push({date, people});
  ovs.sort((a, b) => a.date.localeCompare(b.date));
  saveJobOverrides(jobId, ovs);
  document.getElementById('ov-date').value = '';
  document.getElementById('ov-people').value = '';
  renderOverrideList(jobId);
  renderTimeline(_jobs.filter(x => x.on_timeline && !x.archived));
}
function removeDayOverride(idx) {
  const jobId = document.getElementById('m-id').value;
  if (!jobId) return;
  const ovs = getJobOverrides(jobId);
  ovs.splice(idx, 1);
  saveJobOverrides(jobId, ovs);
  renderOverrideList(jobId);
  renderTimeline(_jobs.filter(x => x.on_timeline && !x.archived));
}

async function archiveJob() {
  const id = document.getElementById('m-id').value;

  const j = _jobs.find(x => x.id == id);

// ── Resource Planner ──────────────────────────────────────
let _resInitDone = false;
let _resStaff = [];
let _resLeave = [];
let _resActiveFilters = new Set(); // empty = show all
let _resCollapsed = new Set();
let _resColOrder = [];
let _resUndoStack = [];
let _draggingColId = null;
let _tlRowOrder = [];
let _tlDraggingRow = null;

function resLoadColOrder() {
  try { _resColOrder = JSON.parse(localStorage.getItem('dgc_resource_col_order') || '[]'); } catch { _resColOrder = []; }
}
function resSaveColOrder(ids) {
  _resColOrder = ids;
  try { localStorage.setItem('dgc_resource_col_order', JSON.stringify(ids)); } catch {}
}

function isoWeekNum(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const jan4 = new Date(d.getFullYear(), 0, 4);
  const startW1 = new Date(jan4);
  startW1.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7));
  return Math.max(1, Math.floor((d - startW1) / (7 * 86400000)) + 1);
}

async function initResourcePlanner() {
  if (_resInitDone) { renderResourcePlanner(); return; }
  _resInitDone = true;
  try {
    const today = new Date().toISOString().slice(0, 10);
    const future = new Date(Date.now() + 180 * 24 * 3600000).toISOString().slice(0, 10);
    const [{ data: staffData }, { data: leaveData }] = await Promise.all([
      _sb.from('dgc_staff').select('id,name,role,active').order('name'),
      _sb.from('dgc_staff_leave').select('staff_id,from_date,to_date').lte('from_date', future).gte('to_date', today),
    ]);
    _resStaff = (staffData || []).filter(s => s.active); // only employed staff
    _resLeave = leaveData || [];
  } catch (e) {
    console.error('Resource planner load failed', e);
    _resStaff = [];
    _resLeave = [];
  }
  renderResourcePlanner();
}

function resGetAlloc() {
  try { return JSON.parse(localStorage.getItem('dgc_resource_alloc') || '{}'); } catch { return {}; }
}
function resSaveAlloc(data) {
  try { localStorage.setItem('dgc_resource_alloc', JSON.stringify(data)); } catch {}
}

function resWeeks(job) {
  if (!job.start_date) return [];
  const weeks = [];
  const today = new Date().toISOString().slice(0, 10);
  const base = new Date(job.start_date + 'T00:00:00');
  const n = Math.max(1, job.base_weeks || 4);
  for (let i = 0; i < n; i++) {
    const s = new Date(base); s.setDate(base.getDate() + i * 7);
    const e = new Date(s);    e.setDate(s.getDate() + 4);
    const fmt = d => d.getDate() + ' ' + d.toLocaleString('en-GB', { month: 'short' });
    const startIso = s.toISOString().slice(0, 10);
    weeks.push({
      num: i + 1,
      startIso,
      wkNum: isoWeekNum(startIso),
      label: 'W' + (i + 1) + ' · ' + fmt(s) + '–' + fmt(e),
      isPast: startIso < today,
    });
  }
  return weeks;
}

function renderResourcePlanner() {
  const today = new Date().toISOString().slice(0, 10);
  const onLeaveIds = new Set(
    _resLeave.filter(l => l.from_date <= today && l.to_date >= today).map(l => l.staff_id)
  );
  // Active staff not on leave → top list
  const activeStaff = _resStaff.filter(s => !onLeaveIds.has(s.id));
  // Active staff currently on leave → bottom section
  const onLeaveStaff = _resStaff.filter(s => onLeaveIds.has(s.id));

  const statusOrder = { running:0, awarded:1, confirmed:2, tendering_likely:3, tendering:4, placeholder:5 };
  let jobs = (_jobs || []).filter(j => !j.archived);
  if (_resActiveFilters.size > 0) jobs = jobs.filter(j => _resActiveFilters.has(j.status));
  // Apply saved column order
  resLoadColOrder();
  const orderedJobs = [];
  const remaining = [...jobs];
  _resColOrder.forEach(id => {
    const idx = remaining.findIndex(j => j.id === id);
    if (idx >= 0) orderedJobs.push(...remaining.splice(idx, 1));
  });
  // Append new/unknown jobs at the end sorted by status
  remaining.sort((a, b) => (statusOrder[a.status] ?? 9) - (statusOrder[b.status] ?? 9));
  orderedJobs.push(...remaining);
  jobs = orderedJobs;
  const alloc = resGetAlloc();

  // Build conflict set: 'name|weekStart' pairs allocated in 2+ jobs
  const _wpj = {};
  for (const [jId, weeks] of Object.entries(alloc)) {
    for (const [wkStart, names] of Object.entries(weeks)) {
      for (const n of (names || [])) {
        const k = n + '|' + wkStart;
        if (!_wpj[k]) _wpj[k] = [];
        _wpj[k].push(jId);
      }
    }
  }
  const conflictSet = new Set(Object.entries(_wpj).filter(([,ids]) => ids.length > 1).map(([k]) => k));
  const totalConflicts = conflictSet.size;

  const chipHtml = (s, onLeave) => {
    const badge = onLeave ? '<span class="res-leave-badge">(leave)</span>' : '';
    return `<div class="res-chip" draggable="true" data-name="${esc(s.name)}" title="${esc(s.role || '')}">${esc(s.name)}${badge}</div>`;
  };

  // Jobs as columns, weeks as rows within each column
  const colsHtml = jobs.map(j => {
    const weeks = resWeeks(j);
    const col = STATUS_COL[j.status] || '#94a3b8';
    if (!weeks.length) return '';
    const collapsed = _resCollapsed.has(j.id);
    const weeksHtml = weeks.map(w => {
      const placed = ((alloc[j.id] || {})[w.startIso] || []);
      const placedHtml = placed.map(name => {
        const isClash = conflictSet.has(name + '|' + w.startIso);
        return `<div class="res-placed-chip${isClash ? ' res-placed-chip--conflict' : ''}" ${isClash ? 'title="Double-booked this week"' : ''}>${esc(name)}<button class="res-remove-btn" data-job="${esc(j.id)}" data-week="${w.startIso}" data-name="${esc(name)}" title="Remove">×</button></div>`;
      }).join('');
      const cellConflict = placed.some(name => conflictSet.has(name + '|' + w.startIso));
      const pastCls = w.isPast ? ' res-week-cell--past' : '';
      const conflictCellCls = cellConflict ? ' res-week-cell--conflict' : '';
      const clearBtn = placed.length > 0
        ? `<button class="res-clear-week-btn" data-job="${esc(j.id)}" data-week="${w.startIso}" title="Remove all staff from this week">Clear</button>`
        : '';
      return `<div class="res-week-cell${pastCls}${conflictCellCls}">
        <div class="res-week-cell-hdr">${w.label} <span class="res-wk-num">Wk&nbsp;${w.wkNum}</span>${cellConflict ? '<span style="color:#ef4444;font-size:10px;font-weight:800;margin-left:4px">⚠ clash</span>' : ''}${clearBtn}</div>
        <div class="res-week-zone" data-job="${esc(j.id)}" data-week="${w.startIso}">${placedHtml}</div>
      </div>`;
    }).join('');
    const statusLabel = STATUS_LBL[j.status] || j.status;
    const hasAnyAlloc = weeks.some(w => ((alloc[j.id] || {})[w.startIso] || []).length > 0);
    const clearJobBtn = hasAnyAlloc
      ? `<button class="res-clear-job-btn" data-clearjob="${esc(j.id)}" ondragstart="event.stopPropagation()" title="Remove all staff from all weeks">Clear all weeks</button>`
      : '';
    return `<div class="res-col${collapsed ? ' res-col--collapsed' : ''}" data-jobid="${esc(j.id)}">
      <div class="res-col-hdr" draggable="true" style="border-top:3px solid ${col};cursor:grab">
        <div class="res-col-hdr-row">
          <span class="res-col-drag-handle" title="Drag to reorder">⠿</span>
          <div style="flex:1;min-width:0">
            <div class="res-col-name">${esc(j.name)}</div>
            <div class="res-col-meta">${j.base_weeks}w · ${j.people_on_site || 0} on site · <span style="color:${col}">${statusLabel}</span></div>
          </div>
          <button class="res-col-toggle" data-toggle-job="${esc(j.id)}" ondragstart="event.stopPropagation()">${collapsed ? '▼' : '▲'}</button>
        </div>
        ${clearJobBtn}
      </div>
      ${weeksHtml}
    </div>`;
  }).join('');

  document.getElementById('res-staff-active').innerHTML = activeStaff.map(s => chipHtml(s, false)).join('') ||
    '<p style="color:var(--muted);font-size:12px;padding:4px">No active staff</p>';
  const leaveHdr = document.getElementById('res-leave-hdr');
  if (onLeaveStaff.length) {
    leaveHdr.style.display = '';
    document.getElementById('res-staff-bottom').innerHTML = onLeaveStaff.map(s => chipHtml(s, true)).join('');
  } else {
    leaveHdr.style.display = 'none';
    document.getElementById('res-staff-bottom').innerHTML = '';
  }
  document.getElementById('res-jobs-body').innerHTML = colsHtml ||
    '<p style="color:var(--muted);padding:20px">No active jobs — add some in the Timeline tab.</p>';

  const badgeEl = document.getElementById('resConflictBadge');
  if (badgeEl) {
    if (totalConflicts > 0) {
      badgeEl.textContent = totalConflicts + (totalConflicts === 1 ? ' conflict' : ' conflicts');
      badgeEl.hidden = false;
    } else {
      badgeEl.hidden = true;
    }
  }

  bindResDragDrop();
}

function bindResDragDrop() {
  const tab = document.getElementById('tab-resources');

  tab.querySelectorAll('.res-chip').forEach(chip => {
    chip.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', chip.dataset.name);
      e.dataTransfer.effectAllowed = 'copy';
      chip.classList.add('res-dragging');
    });
    chip.addEventListener('dragend', () => chip.classList.remove('res-dragging'));
  });

  tab.querySelectorAll('.res-week-zone').forEach(zone => {
    zone.addEventListener('dragover', e => {
      if (_draggingColId) return; // column drag — ignore
      e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; zone.classList.add('res-drag-over');
    });
    zone.addEventListener('dragleave', e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('res-drag-over'); });
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('res-drag-over');
      if (_draggingColId) return; // column drag — ignore
      const name = e.dataTransfer.getData('text/plain');
      if (!name) return;
      const { job: jobId, week: weekStart } = zone.dataset;

      // DEP2: conflict detection
      const weekEndDate = new Date(weekStart + 'T00:00:00');
      weekEndDate.setDate(weekEndDate.getDate() + 6);
      const weekEndIso = weekEndDate.toISOString().slice(0, 10);
      const alloc = resGetAlloc();
      const conflicts = [];

      for (const [otherJobId, weeks] of Object.entries(alloc)) {
        if (String(otherJobId) === String(jobId)) continue;
        if ((weeks[weekStart] || []).includes(name)) {
          const otherJob = (_jobs || []).find(j => String(j.id) === String(otherJobId));
          conflicts.push(`already on "${otherJob ? otherJob.name : 'another project'}" this week`);
        }
      }
      const staffMember = _resStaff.find(s => s.name === name);
      if (staffMember && _resLeave.some(l =>
        l.staff_id === staffMember.id &&
        l.from_date <= weekEndIso && l.to_date >= weekStart
      )) {
        conflicts.push('on holiday this week');
      }
      if (conflicts.length > 0 && !confirm(`⚠️ ${name} is ${conflicts.join(' and ')}.\n\nAdd anyway?`)) {
        return;
      }

      if (!alloc[jobId]) alloc[jobId] = {};
      if (!alloc[jobId][weekStart]) alloc[jobId][weekStart] = [];
      if (!alloc[jobId][weekStart].includes(name)) {
        alloc[jobId][weekStart].push(name);
        resSaveAlloc(alloc);
        renderResourcePlanner();
      }
    });
  });

  tab.querySelectorAll('.res-remove-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const { job, week, name } = btn.dataset;
      const alloc = resGetAlloc();
      if (alloc[job] && alloc[job][week]) {
        alloc[job][week] = alloc[job][week].filter(n => n !== name);
        resSaveAlloc(alloc);
        renderResourcePlanner();
      }
    });
  });

  // Undo helper
  function resPushUndo(snapshot) {
    _resUndoStack.push(snapshot);
    if (_resUndoStack.length > 20) _resUndoStack.shift();
    const undoBtn = document.getElementById('resUndoBtn');
    if (undoBtn) undoBtn.disabled = false;
  }
  function resUpdateUndoBtn() {
    const undoBtn = document.getElementById('resUndoBtn');
    if (undoBtn) undoBtn.disabled = _resUndoStack.length === 0;
  }

  // Drop on column header → assign person to ALL (future) weeks of that job
  tab.querySelectorAll('.res-col-hdr').forEach(hdr => {
    const col = hdr.closest('.res-col');
    if (!col) return;
    const jobId = col.dataset.jobid;
    hdr.addEventListener('dragover', e => {
      if (_draggingColId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      hdr.classList.add('res-col-hdr--drop-target');
    });
    hdr.addEventListener('dragleave', e => {
      if (!hdr.contains(e.relatedTarget)) hdr.classList.remove('res-col-hdr--drop-target');
    });
    hdr.addEventListener('drop', e => {
      hdr.classList.remove('res-col-hdr--drop-target');
      if (_draggingColId) return;
      e.preventDefault();
      const name = e.dataTransfer.getData('text/plain');
      if (!name) return;
      const job = (_jobs || []).find(j => String(j.id) === String(jobId));
      if (!job) return;
      const futureWeeks = resWeeks(job).filter(w => !w.isPast);
      if (!futureWeeks.length) return;
      const alloc = resGetAlloc();
      // Collect conflicts across all target weeks
      const conflictWeeks = [], leaveWeeks = [];
      const staffMember = _resStaff.find(s => s.name === name);
      for (const w of futureWeeks) {
        const wEnd = new Date(w.startIso + 'T00:00:00');
        wEnd.setDate(wEnd.getDate() + 6);
        const wEndIso = wEnd.toISOString().slice(0, 10);
        for (const [otherId, wks] of Object.entries(alloc)) {
          if (String(otherId) === String(jobId)) continue;
          if ((wks[w.startIso] || []).includes(name)) {
            const oj = (_jobs || []).find(j => String(j.id) === String(otherId));
            conflictWeeks.push(`Wk ${w.wkNum} (${oj ? oj.name : 'another job'})`);
          }
        }
        if (staffMember && _resLeave.some(l =>
          l.staff_id === staffMember.id && l.from_date <= wEndIso && l.to_date >= w.startIso
        )) leaveWeeks.push('Wk ' + w.wkNum);
      }
      const warnings = [];
      if (conflictWeeks.length) warnings.push('double-booked in ' + conflictWeeks.join(', '));
      if (leaveWeeks.length) warnings.push('on leave in ' + leaveWeeks.join(', '));
      if (warnings.length && !confirm(`⚠️ ${name} is ${warnings.join(' and ')}.\n\nAdd to all weeks of "${job.name}" anyway?`)) return;
      resPushUndo(JSON.parse(JSON.stringify(alloc)));
      if (!alloc[jobId]) alloc[jobId] = {};
      let added = 0;
      for (const w of futureWeeks) {
        if (!alloc[jobId][w.startIso]) alloc[jobId][w.startIso] = [];
        if (!alloc[jobId][w.startIso].includes(name)) { alloc[jobId][w.startIso].push(name); added++; }
      }
      if (added) { resSaveAlloc(alloc); renderResourcePlanner(); }
    });
  });

  // DEP1: clear week buttons
  tab.querySelectorAll('.res-clear-week-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const { job, week } = btn.dataset;
      const alloc = resGetAlloc();
      if (alloc[job] && alloc[job][week] && alloc[job][week].length) {
        resPushUndo(JSON.parse(JSON.stringify(alloc)));
        delete alloc[job][week];
        resSaveAlloc(alloc);
        renderResourcePlanner();
      }
    });
  });

  // Clear all weeks for a project
  tab.querySelectorAll('[data-clearjob]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const jobId = btn.dataset.clearjob;
      const alloc = resGetAlloc();
      if (alloc[jobId] && Object.keys(alloc[jobId]).length) {
        resPushUndo(JSON.parse(JSON.stringify(alloc)));
        delete alloc[jobId];
        resSaveAlloc(alloc);
        renderResourcePlanner();
      }
    });
  });

  // Undo button
  const undoBtn = document.getElementById('resUndoBtn');
  if (undoBtn) {
    undoBtn.replaceWith(undoBtn.cloneNode(true)); // strip old listeners
    const freshUndo = document.getElementById('resUndoBtn');
    resUpdateUndoBtn();
    freshUndo.addEventListener('click', () => {
      if (!_resUndoStack.length) return;
      const prev = _resUndoStack.pop();
      resSaveAlloc(prev);
      resUpdateUndoBtn();
      renderResourcePlanner();
    });
  }

  // Filter buttons — single-select; clone first to strip any stale listeners
  tab.querySelectorAll('.res-filter-btn').forEach(btn => {
    const fresh = btn.cloneNode(true);
    btn.replaceWith(fresh);
    fresh.addEventListener('click', () => {
      const f = fresh.dataset.filter;
      if (f === 'all' || _resActiveFilters.has(f)) {
        _resActiveFilters.clear();
      } else {
        _resActiveFilters.clear();
        _resActiveFilters.add(f);
      }
      tab.querySelectorAll('.res-filter-btn').forEach(b => {
        if (b.dataset.filter === 'all') b.classList.toggle('active', _resActiveFilters.size === 0);
        else b.classList.toggle('active', _resActiveFilters.has(b.dataset.filter));
      });
      renderResourcePlanner();
    });
  });
  // Sync All button active state on first render
  tab.querySelectorAll('.res-filter-btn').forEach(b => {
    if (b.dataset.filter === 'all') b.classList.toggle('active', _resActiveFilters.size === 0);
    else b.classList.toggle('active', _resActiveFilters.has(b.dataset.filter));
  });

  // Collapse all toggle — clone first to strip stale listeners
  const collapseAllBtn = document.getElementById('resCollapseAllBtn');
  if (collapseAllBtn) {
    collapseAllBtn.replaceWith(collapseAllBtn.cloneNode(true));
    const freshCollapse = document.getElementById('resCollapseAllBtn');
    freshCollapse.addEventListener('click', () => {
      const visibleJobs = (_jobs || []).filter(j => !j.archived);
      const allCollapsed = visibleJobs.every(j => _resCollapsed.has(j.id));
      if (allCollapsed) {
        _resCollapsed.clear();
        freshCollapse.textContent = 'Collapse All';
      } else {
        visibleJobs.forEach(j => _resCollapsed.add(j.id));
        freshCollapse.textContent = 'Expand All';
      }
      renderResourcePlanner();
    });
  }

  // Individual column collapse toggles
  tab.querySelectorAll('[data-toggle-job]').forEach(btn => {
    btn.addEventListener('click', () => {
      const jid = btn.dataset.toggleJob;
      if (_resCollapsed.has(jid)) _resCollapsed.delete(jid);
      else _resCollapsed.add(jid);
      renderResourcePlanner();
    });
  });

  // Column drag-to-reorder — drag starts on the header, drop targets are columns
  _draggingColId = null;
  tab.querySelectorAll('.res-col').forEach(col => {
    const hdr = col.querySelector('.res-col-hdr');
    if (!hdr) return;

    hdr.addEventListener('dragstart', e => {
      _draggingColId = col.dataset.jobid;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', ''); // required for Firefox
      setTimeout(() => col.classList.add('res-col--dragging'), 0);
    });

    hdr.addEventListener('dragend', () => {
      _draggingColId = null;
      col.classList.remove('res-col--dragging');
      tab.querySelectorAll('.res-col').forEach(c => c.classList.remove('res-col--drop-left', 'res-col--drop-right'));
    });

    col.addEventListener('dragover', e => {
      if (!_draggingColId || _draggingColId === col.dataset.jobid) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = col.getBoundingClientRect();
      const isLeft = e.clientX < rect.left + rect.width / 2;
      tab.querySelectorAll('.res-col').forEach(c => c.classList.remove('res-col--drop-left', 'res-col--drop-right'));
      col.classList.add(isLeft ? 'res-col--drop-left' : 'res-col--drop-right');
    });

    col.addEventListener('dragleave', e => {
      if (!col.contains(e.relatedTarget)) col.classList.remove('res-col--drop-left', 'res-col--drop-right');
    });

    col.addEventListener('drop', e => {
      tab.querySelectorAll('.res-col').forEach(c => c.classList.remove('res-col--drop-left', 'res-col--drop-right'));
      if (!_draggingColId || _draggingColId === col.dataset.jobid) return;
      e.preventDefault();
      const rect = col.getBoundingClientRect();
      const isLeft = e.clientX < rect.left + rect.width / 2;
      const currentIds = Array.from(tab.querySelectorAll('.res-col')).map(c => c.dataset.jobid);
      const fromIdx = currentIds.indexOf(_draggingColId);
      if (fromIdx < 0) return;
      currentIds.splice(fromIdx, 1);
      let toIdx = currentIds.indexOf(col.dataset.jobid);
      if (toIdx < 0) return;
      if (!isLeft) toIdx += 1;
      currentIds.splice(toIdx, 0, _draggingColId);
      resSaveColOrder(currentIds);
      renderResourcePlanner();
    });
  });
}

// ── Deployment clash detection ─────────────────────────────
function checkDeploymentClashes() {
  const alloc = resGetAlloc();
  const weekPersonJobs = {};
  for (const [jId, weeks] of Object.entries(alloc)) {
    for (const [wkStart, names] of Object.entries(weeks)) {
      for (const name of (names || [])) {
        const k = name + '|' + wkStart;
        if (!weekPersonJobs[k]) weekPersonJobs[k] = [];
        weekPersonJobs[k].push(jId);
      }
    }
  }
  const clashes = [];
  for (const [k, jobIds] of Object.entries(weekPersonJobs)) {
    if (jobIds.length > 1) {
      const [name, weekStart] = k.split('|');
      clashes.push({ name, weekStart });
    }
  }
  return clashes;
}
function showClashToast(clashes) {
  const existing = document.getElementById('clashToast');
  if (existing) existing.remove();
  if (!clashes.length) return;
  const names = [...new Set(clashes.map(c => c.name))];
  const shown = names.slice(0, 3).join(', ') + (names.length > 3 ? ` +${names.length - 3} more` : '');
  const toast = document.createElement('div');
  toast.id = 'clashToast';
  toast.className = 'res-clash-toast';
  toast.innerHTML = `<div class="res-clash-toast-title">⚠ Deployment conflicts created</div>
    <div style="font-size:12px">${shown} now double-booked across jobs</div>
    <a class="res-clash-toast-link" onclick="document.querySelector('.nav button:nth-child(4)').click();document.getElementById('clashToast')?.remove()">Review in Deployment →</a>`;
  document.body.appendChild(toast);
  setTimeout(() => { toast.remove?.(); }, 8000);
}

// ── Job split ──────────────────────────────────────────────
function openSplitSection() {
  const id = document.getElementById('m-id').value;
  if (!id) return;
  const j = _jobs.find(x => String(x.id) === String(id));
  if (!j) return;
  const endDate = jobEndDate(j);
  const totalDays = weekdaysBetween(j.start_date, endDate);
  document.getElementById('split-date').value = addWeekdays(j.start_date, Math.max(1, Math.ceil(totalDays / 2)));
  document.getElementById('split-section').style.display = '';
}
async function confirmSplit() {
  const id = document.getElementById('m-id').value;
  const splitDate = document.getElementById('split-date').value;
  if (!id || !splitDate) return;
  const j = _jobs.find(x => String(x.id) === String(id));
  if (!j) return;
  if (splitDate <= j.start_date) { alert('Split date must be after the job start date.'); return; }
  const endDate = jobEndDate(j);
  if (splitDate >= endDate) { alert('Split date must be before the job end date.'); return; }
  const p1Days = weekdaysBetween(j.start_date, splitDate);
  const p2Start = addWeekdays(splitDate, 1);
  const p2Days = weekdaysBetween(p2Start, endDate);
  const rem1 = p1Days % 5, rem2 = p2Days % 5;
  const base = { people_needed: j.people_needed, people_on_site: j.people_on_site, status: j.status, note: j.note, on_timeline: true, archived: false };
  const part1 = { ...base, name: j.name + ' (1)', base_weeks: Math.floor(p1Days / 5), start_date: j.start_date };
  const part2 = { ...base, name: j.name + ' (2)', base_weeks: Math.max(1, Math.floor(p2Days / 5)), start_date: p2Start };
  closeModal();
  j.archived = true;
  await upsertJob(j);
  const id1 = await upsertJob(part1);
  const id2 = await upsertJob(part2);
  if (id1 && rem1) saveBaseDays(id1, rem1);
  if (id2 && rem2) saveBaseDays(id2, rem2);
  if (rem1 || rem2) await refresh();
}

// ── Global drag handlers (mouse) ──────────────────────────
const _W_PX = 52;

function _applyDragMove(clientX, clientY) {
  if (!_drag) return;
  const deltaX = clientX - _drag.origX;
  const deltaDays = Math.round((deltaX / _W_PX) * 7);
  if (Math.abs(deltaDays) >= 1) _wasDrag = true;
  const previewDate = addDays(_drag.dragAnchor, deltaDays);
  showDragTooltip(clientX, clientY, '→ ' + fmtDate(previewDate));
  if (deltaDays === _drag.lastDeltaDays) return;
  _drag.lastDeltaDays = deltaDays;
  const j = _jobs.find(x => x.id == _drag.job.id);
  if (!j) return;
  j.start_date = previewDate;
  const tl = document.getElementById('tab-timeline');
  if (tl && tl.classList.contains('active')) renderTimeline(_jobs.filter(x => x.on_timeline && !x.archived));
}

function _applyResizeMove(clientX, clientY) {
  if (!_resize) return;
  const D_PX = _W_PX / 5; // px per weekday — enables day-level drag precision
  const deltaX = clientX - _resize.origX;
  const deltaDays = Math.round(deltaX / D_PX);
  if (deltaDays !== 0) _wasDrag = true;
  const origTotal = (_resize.origWeeks || 0) * 5 + (_resize.origDays || 0);
  const newTotal = Math.max(1, origTotal + deltaDays);
  const newWeeks = Math.floor(newTotal / 5);
  const newRem = newTotal % 5;
  const start = _resize.job.start_date || toDateStr(new Date());
  const finish = addWeekdays(start, newTotal);
  const lbl = newRem ? `${newWeeks}w ${newRem}d / ends ${fmtDate(finish)}` : `${newWeeks}w / ends ${fmtDate(finish)}`;
  showDragTooltip(clientX, clientY, '↔ ' + lbl);
  if (deltaDays === _resize.lastDeltaDays) return;
  _resize.lastDeltaDays = deltaDays;
  const j = _jobs.find(x => x.id == _resize.job.id);
  if (!j) return;
  j.base_weeks = newWeeks;
  saveBaseDays(j.id, newRem);
  // Direct DOM update — smooth per-day feedback (full re-render on release)
  const barEl = document.querySelector(`.tl-bar[data-id="${j.id}"]`);
  if (barEl && _origin) {
    const liveEnd = addWeekdays(start, newTotal);
    const liveEndOff = daysBetween(_origin, liveEnd);
    const liveStartOff = daysBetween(_origin, start);
    const liveW = Math.max(((liveEndOff - liveStartOff + 1) / 7) * _W_PX, 8);
    barEl.setAttribute('width', liveW);
  }
}

window.addEventListener('mousemove', e => {
  if (_drag) _applyDragMove(e.clientX, e.clientY);
  else if (_resize) _applyResizeMove(e.clientX, e.clientY);
});
window.addEventListener('mouseup', async e => {
  hideDragTooltip();
  if (_drag) {
    const deltaX = e.clientX - _drag.origX;
    const deltaDays = Math.round((deltaX / _W_PX) * 7);
    const { job, origStart, dragAnchor } = _drag;
    _drag = null;
    const j = _jobs.find(x => x.id == job.id);
    if (!j) return;
    if (Math.abs(deltaDays) >= 1) {
      _wasDrag = true;
      // Snap to nearest working day (Mon-Fri, skip BH) — no Monday forcing
      j.start_date = snapToWorkingDay(addDays(dragAnchor, deltaDays));
      await upsertJob(j);
      { const cl = checkDeploymentClashes(); if (cl.length) showClashToast(cl); }
    } else {
      j.start_date = origStart;
      renderTimeline(_jobs.filter(x => x.on_timeline && !x.archived));
    }
  } else if (_resize) {
    const deltaX = e.clientX - _resize.origX;
    const D_PX = _W_PX / 5;
    const deltaDays = Math.round(deltaX / D_PX);
    const { job, origWeeks, origDays } = _resize;
    _resize = null;
    const j = _jobs.find(x => x.id == job.id);
    if (!j) return;
    if (deltaDays !== 0) {
      _wasDrag = true;
      const origTotal = (origWeeks || 0) * 5 + (origDays || 0);
      const newTotal = Math.max(1, origTotal + deltaDays);
      j.base_weeks = Math.floor(newTotal / 5);
      saveBaseDays(j.id, newTotal % 5);
      await upsertJob(j);
      { const cl = checkDeploymentClashes(); if (cl.length) showClashToast(cl); }
    } else {
      j.base_weeks = origWeeks;
      saveBaseDays(j.id, origDays || 0);
      renderTimeline(_jobs.filter(x => x.on_timeline && !x.archived));
    }
  }
});

// ── State ──────────────────────────────────────────────────
let _stPeriod = null;   // Monday that starts the 2-week window (YYYY-MM-DD)
let _staff    = [];     // all staff (active + inactive)
let _stHours  = {};     // key = staffId+'|'+date → hours
let _stAdv    = [];     // advances/bonuses/OT entries
let _stLeave  = [];     // leave records
let _stLoaded = false;
let _stChangedCells = new Set();
let _stFillActive = false;
let _stPreFillData = {};

// ── Period helpers ─────────────────────────────────────────
// DGC fortnights start on Saturdays. Anchor: Sat 11 Apr 2026.
const DGC_FN_ANCHOR = '2026-04-11';
function dgcFortnightSat(dateStr) {
  const anchor = new Date(DGC_FN_ANCHOR + 'T12:00:00');
  const d = new Date(dateStr + 'T12:00:00');
  const diff = Math.round((d - anchor) / 86400000);
  const n = Math.floor(diff / 14);
  return toDateStr(new Date(anchor.getTime() + n * 14 * 86400000));
}
function initStPeriod() {
  if (!_stPeriod) _stPeriod = dgcFortnightSat(toDateStr(new Date()));
}
function stPeriodDates() {
  initStPeriod();
  // _stPeriod is Saturday; Mon wk1 = Sat+2, Mon wk2 = Sat+9
  const d = [];
  for (let w = 0; w < 2; w++)
    for (let day = 0; day < 5; day++)
      d.push(addDays(_stPeriod, 2 + w * 7 + day));
  return d;
}
function shiftPeriod(days) {
  initStPeriod();
  _stPeriod = addDays(_stPeriod, days);
  renderHoursGrid();
}
function goToPeriodNow() {
  _stPeriod = dgcFortnightSat(toDateStr(new Date()));
  renderHoursGrid();
}

// Paginate through all rows in a table (bypasses Supabase 1000-row max_rows cap)
async function fetchAllRows(table, query) {
  const PAGE = 1000;
  let all = [], from = 0;
  while (true) {
    const r = await query(_sb.from(table)).range(from, from + PAGE - 1);
    if (r.error) return r;
    all = all.concat(r.data || []);
    if ((r.data || []).length < PAGE) return { data: all, error: null };
    from += PAGE;
  }
}

// ── Load from Supabase ─────────────────────────────────────
async function loadStaffData() {
  if (!_sb) return;
  try {
    const [sR, hR, aR, lR, tsR] = await Promise.all([
      _sb.from('dgc_staff').select('*').order('name'),
      fetchAllRows('dgc_staff_hours', t => t.select('*').order('work_date')),
      _sb.from('dgc_staff_advances').select('*').order('entry_date', { ascending: false }),
      _sb.from('dgc_staff_leave').select('*').order('from_date', { ascending: false }),
      fetchAllRows('dgc_timesheets', t => t.select('staff_name,work_date,hours').order('work_date')),
    ]);
    if (sR.error) {
      console.error('Staff error:', sR.error);
      showStaffSetup();
      return;
    }
    _staff = sR.data || [];
    _stHours = {};
    // Load manual PM entries first (may be integer-truncated by RPC, will be overridden below)
    (hR.data || []).forEach(h => { _stHours[h.staff_id + '|' + h.work_date] = parseFloat(h.hours) || 0; });
    // Worker timesheet submissions take priority — they carry the true decimal hours (e.g. 8.5)
    const staffByName = {};
    _staff.forEach(s => { staffByName[s.name.trim().toLowerCase()] = s.id; });
    (tsR.data || []).forEach(t => {
      const sid = staffByName[(t.staff_name || '').trim().toLowerCase()];
      if (sid && parseFloat(t.hours) > 0) {
        const key = sid + '|' + t.work_date;
        _stHours[key] = (parseFloat(t.hours) || 0);
      }
    });
    _stAdv   = aR.data || [];
    _stLeave = lR.data || [];
    _stLoaded = true;
    // Hide setup, show content
    document.getElementById('st-setup').style.display = 'none';
    document.getElementById('sv-hours').style.display = '';
    document.getElementById('sv-roster').style.display = '';
    document.getElementById('sv-inactive').style.display = '';
    renderHoursGrid();
    renderRoster();
    renderAdvancesList();
    renderLeaveList();
  } catch(err) {
    console.error('Staff load failed:', err);
    showStaffSetup();
  }
}

function showStaffSetup() {
  document.getElementById('st-setup-sql').textContent = ST_SETUP_SQL;
  document.getElementById('st-setup').style.display = 'block';

  ['sv-hours','sv-roster','sv-inactive'].forEach(id => {
    const el = document.getElementById(id);
