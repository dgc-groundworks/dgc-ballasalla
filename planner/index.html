  });
}

// ── Hours grid ────────────────────────────────────────────
const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri'];

function renderHoursGrid() {
  initStPeriod();
  const dates = stPeriodDates();
  const active = _staff.filter(s => s.active !== false);

  // Period label: show Sat start to Fri end (the full DGC fortnight)
  const sat = new Date(_stPeriod + 'T12:00:00');
  const fri = new Date(sat.getTime() + 13 * 86400000);
  document.getElementById('st-period-lbl').textContent =
    sat.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' — ' +
    fri.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});

  const tbl = document.getElementById('hrs-tbl');

  // Build leave map: staffId -> { date: 'H'|'U' } for days in this fortnight
  const leaveDays = {};
  _stLeave.forEach(l => {
    if (l.from_date <= dates[9] && l.to_date >= _stPeriod) {
      dates.forEach(d => {
        if (d >= l.from_date && d <= l.to_date) {
          if (!leaveDays[l.staff_id]) leaveDays[l.staff_id] = {};
          leaveDays[l.staff_id][d] = l.leave_type === 'Holiday' ? 'H' : 'U';
        }
      });
    }
  });

  let h = '<thead><tr><th class="name-th">Name</th>';
  dates.forEach((d, i) => {
    const dt = new Date(d + 'T12:00:00');
    const bh = !isWorkingDay(d);
    const sep = i === 5 ? ' wk2' : '';
    const col = bh ? 'color:#ef4444' : '';
    h += `<th class="${sep}" style="${col}">${DAY_NAMES[i%5]}<br><span style="font-size:8px;color:var(--muted)">${dt.getDate()} ${dt.toLocaleDateString('en-GB',{month:'short'})}</span></th>`;
  });
  h += '<th>OT</th><th>Total</th><th>Adv £</th><th>Bonus £</th><th>Notes</th><th></th></tr></thead><tbody>';

  if (!active.length) {
    h += `<tr><td colspan="17" class="st-empty">No active staff — add people in the Team tab.</td></tr>`;
  }

  active.forEach(s => {
    let total = 0;
    const myLeave = leaveDays[s.id] || {};
    h += `<tr data-sid="${s.id}"><td class="name-td">${esc(s.name)}</td>`;
    dates.forEach((d, i) => {
      const bh = !isWorkingDay(d);
      const sep = i === 5 ? ' wk2' : '';
      const marker = myLeave[d];
      if (bh) {
        h += `<td class="bh-td${sep}">—</td>`;
      } else if (marker) {
        total += marker === 'H' ? 8 : 0;
        const unpaidCls = marker === 'U' ? ' unpaid' : '';
        h += `<td class="leave-td${unpaidCls}${sep ? ' '+sep.trim() : ''}">${marker}</td>`;
      } else {
        const val = _stHours[s.id + '|' + d];
        const disp = val !== undefined ? val : '';
        total += val || 0;
        h += `<td class="${sep}"><input class="hrs-inp" type="number" min="0" max="24" step="0.5" value="${disp}" placeholder="" data-sid="${s.id}" data-date="${d}" oninput="onHrsChange(this)"></td>`;
      }
    });
    const periodAdv = _stAdv.filter(a => a.staff_id === s.id && a.entry_date >= _stPeriod && a.entry_date <= dates[9]);
    const ot    = periodAdv.filter(a => a.entry_type === 'Overtime').reduce((sum, a) => sum + (parseFloat(a.amount) || 0), 0);
    const adv   = periodAdv.filter(a => a.entry_type === 'Advance').reduce((sum, a) => sum + (parseFloat(a.amount) || 0), 0);
    const bonus = periodAdv.filter(a => a.entry_type === 'Bonus').reduce((sum, a) => sum + (parseFloat(a.amount) || 0), 0);
    h += `<td class="tot-td">${ot > 0 ? ot.toFixed(1) + 'h' : '—'}</td>`;
    h += `<td class="tot-td">${(total + ot) > 0 ? (total + ot).toFixed(1) : '—'}</td>`;
    h += `<td class="tot-td adv-jump" onclick="document.getElementById('tab-staff').querySelector('.adv-section').scrollIntoView({behavior:'smooth'})" style="cursor:pointer" title="Click to add advance">${adv > 0 ? '£'+adv.toFixed(0) : '£0'}</td>`;
    h += `<td class="tot-td adv-jump" onclick="document.getElementById('tab-staff').querySelector('.adv-section').scrollIntoView({behavior:'smooth'})" style="cursor:pointer" title="Click to add bonus">${bonus > 0 ? '£'+bonus.toFixed(0) : '£0'}</td>`;
    h += `<td><input type="text" class="hrs-notes-inp" placeholder="Notes..." data-sid="${s.id}" style="width:100%;background:var(--bg);border:1px solid var(--bord);color:var(--text);border-radius:5px;padding:3px 6px;font-size:12px;font-family:inherit"></td>`;
    h += `<td><button class="row-fill-btn" onclick="fillRow(this,'${s.id}')" title="Fill this person's Mon–Fri to 8h">Full week</button></td>`;
    h += `</tr>`;
  });

  h += '</tbody>';
  tbl.innerHTML = h;
}

function onHrsChange(inp) {
  inp.classList.add('changed');
  _stChangedCells.add(inp);
}

async function saveHours() {
  if (!_stChangedCells.size) { stStat('Nothing to save.'); return; }
  stStat('Saving...');
  const rows = Array.from(_stChangedCells).map(inp => ({
    staff_id: inp.dataset.sid,
    work_date: inp.dataset.date,
    hours: parseFloat(inp.value) || 0,
  }));
  const { error } = await _sb.from('dgc_staff_hours')
    .upsert(rows, { onConflict: 'staff_id,work_date' });
  if (error) { console.error(error); stStat('Save failed.'); return; }
  rows.forEach(r => { _stHours[r.staff_id + '|' + r.work_date] = r.hours; });
  _stChangedCells.forEach(inp => inp.classList.remove('changed'));
  _stChangedCells.clear();
  _stFillActive = false;
  document.getElementById('btn-fill').textContent = 'Fill 8s';
  stStat('Saved ✓');
  setTimeout(() => stStat(''), 2500);
}

function stStat(msg) { document.getElementById('hrs-stat').textContent = msg; }

function fillEightHours() {
  if (_stFillActive) {
    // Undo
    document.querySelectorAll('.hrs-inp').forEach(inp => {
      const k = inp.dataset.sid + '|' + inp.dataset.date;
      inp.value = _stPreFillData[k] !== undefined ? _stPreFillData[k] : '';
      inp.classList.remove('changed');
    });
    _stChangedCells.clear();
    _stFillActive = false;
    document.getElementById('btn-fill').textContent = 'Fill 8s';
    return;
  }
  _stPreFillData = {};
  document.querySelectorAll('.hrs-inp').forEach(inp => {
    const k = inp.dataset.sid + '|' + inp.dataset.date;
    _stPreFillData[k] = inp.value;
    if (!inp.value || inp.value === '0') {
      inp.value = '8';
      inp.classList.add('changed');
      _stChangedCells.add(inp);
    }
  });
  _stFillActive = true;
  document.getElementById('btn-fill').textContent = 'Undo fill';
}

function fillRow(btn, sid) {
  const row = btn.closest('tr');
  const inputs = row.querySelectorAll('.hrs-inp');
  const allFilled = Array.from(inputs).every(inp => inp.value == 8);
  inputs.forEach(inp => {
    if (allFilled) { inp.value = ''; } else if (!inp.value || inp.value === '0') { inp.value = '8'; }
    inp.classList.add('changed');
    _stChangedCells.add(inp);
  });
  btn.textContent = allFilled ? 'Full week' : 'Undo';
}

// ── Sub-view switching ────────────────────────────────────
function showSV(name, btn) {
  document.querySelectorAll('.sv').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.snav button').forEach(b => b.classList.remove('active'));
  const sv = document.getElementById('sv-' + name);
  if (sv) {
    sv.classList.add('active');
    // Lazy-load: an iframe only fetches its page the first time its tab is
    // opened, not the moment the Staff tab loads — otherwise every locked
    // sub-page (Add Staff, Fuel, Timesheets) starts up at once and each
    // shows its own login box before you have a session, instead of just
    // logging in once and the rest picking up the same session.
    const iframe = sv.querySelector('iframe[data-src]');
    if (iframe) { iframe.src = iframe.dataset.src; iframe.removeAttribute('data-src'); }
  }
  if (btn) btn.classList.add('active');
}

// ── Holidays & Leave ──────────────────────────────────────
function renderLeaveList() {
  populateStaffDropdown('hol-staff');
  const list = document.getElementById('leave-list');
  const dates = stPeriodDates();
  const periodStart = _stPeriod;          // Saturday
  const periodEnd   = dates[9];           // Friday wk2
  const relevant = _stLeave
    .filter(l => l.from_date <= periodEnd && l.to_date >= periodStart)
    .map(l => ({
      ...l,
      clippedFrom: l.from_date > periodStart ? l.from_date : periodStart,
      clippedTo:   l.to_date   < periodEnd   ? l.to_date   : periodEnd,
    }))
    .sort((a, b) => a.clippedFrom.localeCompare(b.clippedFrom));
  if (!relevant.length) { list.innerHTML = '<div class="st-empty" style="padding:8px 0">No leave this fortnight.</div>'; return; }
  list.innerHTML = '<div class="adv-list-wrap">' + relevant.map(l => {
    const sn    = (_staff.find(s => s.id === l.staff_id) || {}).name || '?';
    const label = l.leave_type === 'Holiday' ? 'Paid' : 'Unpaid';
    const col   = l.leave_type === 'Holiday' ? '#22c55e' : '#f59e0b';
    const days  = weekdayCount(l.clippedFrom, l.clippedTo);
    return `<div class="adv-row">
      <span class="ar-date">${fmtDate(l.clippedFrom)} → ${fmtDate(l.clippedTo)}</span>
      <span class="ar-name">${esc(sn)}</span>
      <span class="ar-type" style="color:${col}">${label}</span>
      <span class="ar-amt">${days}d</span>
      <span class="ar-note">${esc(l.notes || '')}</span>
      <button class="adv-del" onclick="deleteLeave('${l.id}')" title="Delete">✕</button>
    </div>`;
  }).join('') + '</div>';
}

window.addEventListener('touchend', async e => {
  hideDragTooltip();
  const touch = e.changedTouches[0];
  if (_drag) {
    const deltaX = touch.clientX - _drag.origX;
    const deltaDays = Math.round((deltaX / _W_PX) * 7);
    const { job, origStart, dragAnchor } = _drag;
    _drag = null;
    const j = _jobs.find(x => x.id == job.id);
    if (!j) return;
    if (Math.abs(deltaDays) >= 1) {
      _wasDrag = true;
      // Snap to nearest working day (Mon-Fri, skip BH) — no Monday forcing
      j.start_date = snapToWorkingDay(addDays(dragAnchor, deltaDays));
      await upsertJob(j);
      { const cl = checkDeploymentClashes(); if (cl.length) showClashToast(cl); }
    } else {
      j.start_date = origStart;
      renderTimeline(_jobs.filter(x => x.on_timeline && !x.archived));
    }
  } else if (_resize) {
    const deltaX = touch.clientX - _resize.origX;
    const D_PX = _W_PX / 5;
    const deltaDays = Math.round(deltaX / D_PX);
    const { job, origWeeks, origDays } = _resize;
    _resize = null;
    const j = _jobs.find(x => x.id == job.id);
    if (!j) return;
    if (deltaDays !== 0) {
      _wasDrag = true;
      const origTotal = (origWeeks || 0) * 5 + (origDays || 0);
      const newTotal = Math.max(1, origTotal + deltaDays);
      j.base_weeks = Math.floor(newTotal / 5);
      saveBaseDays(j.id, newTotal % 5);
      await upsertJob(j);
      { const cl = checkDeploymentClashes(); if (cl.length) showClashToast(cl); }
    } else {
      j.base_weeks = origWeeks;
      saveBaseDays(j.id, origDays || 0);
      renderTimeline(_jobs.filter(x => x.on_timeline && !x.archived));
    }
  }
});
