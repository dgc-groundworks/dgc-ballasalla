<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dayworks (TEST BUILD)</title>
<script src="../staff/config.js"></script>
<script src="theme.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg:#0f1117;--surf:#1a1d27;--surf2:#222636;--bord:#2e3347;
  --accent:#f59e0b;--text:#e2e8f0;--muted:#64748b;
  --green:#22c55e;--red:#ef4444;--blue:#3b82f6;
}
[data-theme="light"] {
  --bg:#f0f4f8;--surf:#ffffff;--surf2:#e4ecf4;--bord:#b8ccd8;
  --accent:#e08a00;--text:#1a2b3c;--muted:#5c7a94;
  --green:#16a34a;--red:#dc2626;--blue:#2563eb;
}
[data-theme="light"] .topbar{background:#1b2a3b;border-bottom-color:#0d1a26}
[data-theme="light"] .topbar h1{color:#f59e0b}
[data-theme="light"] .back-btn{color:#8ab0cc;border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}

.topbar{background:var(--surf);border-bottom:1px solid var(--bord);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.topbar h1{font-size:1rem;font-weight:700;color:var(--accent)}
.test-banner{background:#dc2626;color:#fff;font-size:0.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:4px}
.back-btn{display:flex;align-items:center;gap:6px;background:var(--surf2);border:1px solid var(--bord);border-radius:7px;padding:6px 12px;color:var(--muted);font-size:0.82rem;font-weight:600;text-decoration:none;white-space:nowrap;transition:all .15s;font-family:inherit}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle-btn{background:none;border:1px solid rgba(255,255,255,.18);border-radius:6px;color:#8ab0cc;font-size:11px;font-weight:700;padding:4px 10px;cursor:pointer;font-family:inherit;letter-spacing:.02em;margin-left:auto}

.dw-nav{background:var(--surf);border-bottom:1px solid var(--bord);padding:0 16px;display:flex;gap:4px;position:sticky;top:45px;z-index:9}
.dw-navbtn{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:0.85rem;font-weight:700;padding:10px 14px;cursor:pointer;font-family:inherit}
.dw-navbtn:hover{color:var(--text)}
.dw-navbtn.active{color:var(--accent);border-bottom-color:var(--accent)}

.dw-main{padding:20px 24px;max-width:1300px;margin:0 auto}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);font-size:0.9rem}
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:0.85rem;color:var(--muted)}
.crumb button{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;font-family:inherit;font-size:0.85rem;padding:0}
.crumb .sep{color:var(--muted)}

/* Send bar */
.send-bar{background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.send-bar .sb-info{flex:1;min-width:200px}
.send-bar .sb-range{font-weight:800;font-size:1rem}
.send-bar .sb-sub{font-size:0.78rem;color:var(--muted);margin-top:2px}

.alert-dot{display:inline-block;vertical-align:middle;width:9px;height:9px;border-radius:50%;background:var(--accent);flex-shrink:0;box-shadow:0 0 0 3px rgba(245,158,11,.25)}

/* Overview: one wide table per job (Name / Date range / Ground Workers /
   Total hours), spanning the page — replaces the old narrow sidebar list. */
.overview-section{margin-bottom:24px}
.overview-hdr{display:flex;align-items:center;gap:8px;font-weight:800;font-size:0.95rem;text-transform:uppercase;letter-spacing:.03em;color:var(--text);margin-bottom:10px}
.overview-hdr .oh-hours{margin-left:auto;color:var(--muted);font-size:0.8rem;font-weight:700;text-transform:none;letter-spacing:0}
.overview-table{width:100%;border-collapse:collapse;background:var(--surf);border:1px solid var(--bord);border-radius:10px;overflow:hidden;table-layout:fixed}
.overview-table th{text-align:left;padding:10px 16px;font-size:0.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--bord);background:var(--surf2)}
.overview-table td{padding:12px 16px;border-bottom:1px solid var(--bord);font-size:0.9rem}
.overview-table tr:last-child td{border-bottom:none}
.overview-row{cursor:pointer;transition:background .15s}
.overview-row:hover td{background:var(--surf2)}
.overview-row.active td{background:var(--accent);color:#1a1d27}
.overview-row .or-hours{font-weight:800;color:var(--accent)}
.overview-row.active .or-hours{color:#1a1d27}
/* Same table/colgroup as .overview-table so its number sits directly
   under the "Total hours" column above it, not just right-aligned loose. */
.overview-total-table{margin-top:4px}
.overview-total-row td{font-weight:900;font-size:1rem;background:var(--surf2);border-bottom:none}
.overview-total-row .or-hours{color:var(--accent)}

.back-inline{display:inline-flex;align-items:center;gap:6px;background:var(--surf2);border:1px solid var(--bord);border-radius:7px;padding:8px 16px;color:var(--text);font-size:0.85rem;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:16px}
.back-inline:hover{border-color:var(--accent);color:var(--accent)}

/* Week view */
.week-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.week-nav button{background:var(--surf2);border:1px solid var(--bord);border-radius:7px;color:var(--text);padding:6px 12px;cursor:pointer;font-family:inherit;font-weight:700}
.week-nav button:disabled{opacity:.35;cursor:default}
.week-nav .wn-label{font-weight:800;flex:1;text-align:center}
.week-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:800px){.week-grid{grid-template-columns:1fr}}
.week-photos img{width:100%;border-radius:8px;border:1px solid var(--bord);margin-bottom:10px}
.day-row{background:var(--surf);border:1px solid var(--bord);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.day-row.flagged{border-color:var(--accent);background:rgba(245,158,11,.06)}
.day-row .dr-date{font-weight:800;margin-bottom:8px}
.day-row .dr-fields{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
.day-row label{display:flex;flex-direction:column;gap:3px;font-size:0.7rem;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=number]{background:var(--bg);border:1px solid var(--bord);border-radius:6px;padding:7px 9px;color:var(--text);font-size:0.85rem;font-family:inherit;outline:none;width:100%}
input:focus{border-color:var(--accent)}
.day-row .dr-hours{font-weight:800;color:var(--accent);white-space:nowrap;padding-bottom:7px}
.flag-note{background:rgba(245,158,11,.1);border:1px solid var(--accent);border-radius:6px;padding:7px 10px;font-size:0.76rem;color:var(--accent);margin-bottom:8px}

/* Person summary (top of the week/photo view) */
.person-summary{background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:18px 20px;margin-bottom:22px}
.ps-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.ps-head h2{font-size:1.1rem;font-weight:800}
.ps-range{color:var(--muted);font-size:0.85rem}
.ps-week{margin-bottom:14px}
.ps-week-label{font-size:0.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:6px}
.ps-table{width:100%;border-collapse:collapse;font-size:0.82rem;table-layout:fixed}
.ps-table th{text-align:left;padding:5px 8px;font-size:0.65rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--bord)}
.ps-table td{padding:5px 8px;border-bottom:1px solid var(--bord);word-wrap:break-word}
.ps-table tr:last-child td{border-bottom:none}
.ps-total-row td{font-weight:800;background:var(--surf2)}
.ps-grand{text-align:right;font-weight:900;font-size:0.95rem;margin-top:8px;color:var(--accent)}

.btn-save{background:var(--green);color:#fff;border:none;padding:8px 16px;border-radius:6px;font-size:0.82rem;font-weight:700;cursor:pointer;font-family:inherit}
/* Highlighted (glowing) only when actually actionable — flat and dim
   otherwise, so it's obvious at a glance whether there's anything to send. */
.btn-primary{background:var(--accent);color:#1a1d27;border:none;padding:10px 22px;border-radius:6px;font-size:0.9rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 0 0 3px rgba(245,158,11,.3);transition:opacity .15s,box-shadow .15s}
.btn-primary:disabled{opacity:.35;cursor:default;box-shadow:none}
.btn-secondary{background:var(--surf2);color:var(--muted);border:1px solid var(--bord);padding:8px 16px;border-radius:6px;font-size:0.82rem;cursor:pointer;font-family:inherit}
.btn-danger{background:none;border:1px solid rgba(239,68,68,.4);color:var(--red);padding:7px 12px;border-radius:6px;font-size:0.78rem;cursor:pointer;font-family:inherit}

/* Warning popup when Save for client is clicked with missing/unchecked fields */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-box{background:var(--surf);border:1px solid var(--bord);border-radius:12px;padding:24px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.modal-box h3{font-size:1.05rem;margin-bottom:10px;color:var(--accent)}
.modal-box p{font-size:0.88rem;color:var(--text);line-height:1.55;margin-bottom:20px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px}

/* Upload tab */
.upload-zone{padding:40px 20px;border:2px dashed var(--bord);border-radius:10px;text-align:center;color:var(--muted);font-size:0.95rem;cursor:pointer;transition:all .15s}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);color:var(--accent);background:rgba(245,158,11,.06)}
.upload-zone input{display:none}

/* Historic */
.hist-batch{background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:16px 18px;margin-bottom:12px;cursor:pointer}
.hist-batch:hover{border-color:var(--accent)}
.hist-batch .hb-ref{font-weight:800}
.hist-batch .hb-meta{font-size:0.8rem;color:var(--muted);margin-top:4px}

/* ── Branded document (matches Site Diary) ── */
.report-doc{background:#fff;color:#1a2a3f;border-radius:10px;padding:36px 40px;max-width:900px;box-shadow:0 4px 32px rgba(0,0,0,.45);font-family:'Segoe UI',Calibri,Arial,sans-serif;margin:0 auto}
.lh-bar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:16px}
.lh-logo{height:62px;width:auto}
.lh-right{text-align:right}
.lh-company{font-size:1rem;font-weight:800;color:#1a2a3f;letter-spacing:-.2px;line-height:1.2}
.lh-addr{font-size:0.76rem;color:#4a6080;margin-top:3px;line-height:1.5}
.lh-rule{border:none;border-top:3px solid #1a2a3f;margin-bottom:18px}
.report-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.report-title h2{font-size:1.45rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#1a2a3f}
.report-ref{font-size:0.75rem;color:#4a6080;font-weight:600;letter-spacing:.3px}
.report-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1.5px solid #1a2a3f;border-radius:6px;overflow:hidden;margin-bottom:22px}
.rm-cell{padding:10px 14px;border-right:1px solid #c8d4e0}
.rm-cell:last-child{border-right:none}
.rm-cell .rmc-label{font-size:0.63rem;text-transform:uppercase;letter-spacing:.08em;color:#4a6080;margin-bottom:3px;font-weight:700}
.rm-cell .rmc-val{font-size:0.9rem;font-weight:700;color:#1a2a3f;line-height:1.3}
.site-block{border:1px solid #c8d4e0;border-radius:6px;overflow:hidden;margin-bottom:16px}
.site-hdr{background:#1a2a3f;color:#fff;font-size:0.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px}
.week-hdr{background:#e4ecf4;color:#1a2a3f;font-size:0.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;border-top:1px solid #c8d4e0}
.dw-table{width:100%;border-collapse:collapse;font-size:0.82rem}
.dw-table th{text-align:left;padding:6px 14px;font-size:0.65rem;text-transform:uppercase;letter-spacing:.05em;color:#4a6080;border-bottom:1px solid #c8d4e0}
.dw-table td{padding:6px 14px;border-bottom:1px solid #eef2f7;color:#1a2a3f}
.dw-table tr:last-child td{border-bottom:none}
.week-total-row td{font-weight:800;background:#f7fafc;border-top:1.5px solid #c8d4e0}
.grand-total{margin-top:8px;text-align:right;font-size:1rem;font-weight:900;color:#1a2a3f}
.report-footer{margin-top:18px;padding-top:14px;border-top:1px solid #c8d4e0;font-size:0.7rem;color:#8a9ab0;line-height:1.5;text-align:center}
.report-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;max-width:900px;margin-left:auto;margin-right:auto}
.btn-print{background:#1a2a3f;color:#fff;border:none;padding:9px 20px;border-radius:6px;font-size:0.88rem;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.btn-print:hover{background:#243552}

@media print {
  .topbar,.dw-nav,.report-actions{display:none!important}
  body{background:#fff}
  .dw-main{padding:0;max-width:100%}
  .report-doc{box-shadow:none;border-radius:0;padding:20mm 18mm;max-width:100%;margin:0}
  @page{margin:0}
}
</style>

  <a class="back-btn" href="index.html" target="_top">&#8592; Planner</a>
  <h1>Dayworks</h1>
  <span class="test-banner">Test build — not live</span>
  <button class="theme-toggle-btn" onclick="toggleTheme()">Light Mode</button>
</header>
<nav class="dw-nav">
  <button class="dw-navbtn active" data-tab="current">Current</button>

<main class="dw-main" id="mainArea"><p class="empty-state">Loading…</p></main>

<script>
// ---------------------------------------------------------------
// Dayworks — Job -> Name -> Week drill-down, real Supabase persistence.
// Table: public.dgc_dayworks_entries · Bucket: dayworks-timesheets (public)
// Anon key directly, no login gate (matches Timesheet app's shared
// tables) — lighter security for this test/early phase.
//
// Anon-key UPDATE silently no-ops regardless of RLS (confirmed
// elsewhere this project) — there is NO update policy on this table.
// Every "save" here deletes the old row and inserts a corrected one.
//
// AI vision extraction is still stubbed — needs Ash's own Anthropic
// API key + a Supabase Edge Function (see the Obsidian spec: DGC
// Brain/Prompts/DGC Dayworks — Build Spec & Prompt.md).
// ---------------------------------------------------------------

const REST = SUPABASE_URL + '/rest/v1/dgc_dayworks_entries';
const STORAGE_UPLOAD = SUPABASE_URL + '/storage/v1/object/dayworks-timesheets/';
const STORAGE_PUBLIC = SUPABASE_URL + '/storage/v1/object/public/dayworks-timesheets/';
const NO_JOB = '(Needs a job assigned)';
const NO_NAME = '(Needs a name)';

function sbHeaders(extra) {
  return Object.assign({ apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }, extra || {});
}
function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(iso) { return iso ? iso.split('-').reverse().join('/') : '—'; }
// Ash, 9 Sep 2026: lunch is now a field the PM can see and change on
// every entry, not just a silent guess. This function is only the
// DEFAULT shown before anyone touches it — "30 mins for a 7+ hour day
// and none for a 4 hour day." Nothing was stated for the gap between 4h
// and 7h, so it defaults to 0 there rather than inventing an assumed
// break. Once staff are writing their own hours on the sheet, or the PM
// can see what was actually taken, the field gets edited to match —
// that's the whole point of making it editable instead of fixed.
function rawMins(start, finish) {
  if (!start || !finish) return 0;
  const [sh, sm] = start.split(':').map(Number);
  const [fh, fm] = finish.split(':').map(Number);
  let mins = (fh * 60 + fm) - (sh * 60 + sm);
  if (mins < 0) mins += 24 * 60;
  return mins;
}
function defaultLunchMins(start, finish) {
  if (!start || !finish) return 0;
  return (rawMins(start, finish) / 60) >= 7 ? 30 : 0;
}
function calcHours(start, finish, lunchMins) {
  if (!start || !finish) return null;
  const lunch = (lunchMins === null || lunchMins === undefined || lunchMins === '') ? defaultLunchMins(start, finish) : Number(lunchMins);
  return Math.round(((rawMins(start, finish) - lunch) / 60) * 100) / 100;
}
function daySummaryLine(e) {
  const d = e.date ? new Date(e.date + 'T12:00:00') : null;
  const dayLabel = d ? d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }) : 'No date set';
  const timeStr = (e.start && e.finish) ? `${e.start} to ${e.finish}` : 'time not set';
  const lunch = e.lunch == null ? defaultLunchMins(e.start, e.finish) : e.lunch;
  const lunchStr = (e.start && e.finish) ? `, ${lunch} min lunch` : '';
  const hoursStr = e.hours == null ? '—' : e.hours;
  return `${dayLabel} — ${timeStr}${lunchStr} — ${hoursStr} hours${e.description ? ' — ' + esc(e.description) : ''}`;
}
function getMonday(iso) {
  const d = new Date(iso + 'T12:00:00');
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  return d.toISOString().slice(0, 10);
}

// The "site" field on old data is really free text ("Ballasalla - Main
// Road", "Ballasalla (BS4)", "Ballasalla + Quay West") that mixes the
// actual job with a description of the work area. Ash, 8 Sep 2026:
// there are only two real jobs (Ballasalla, Quay West) — the rest is
// description and should show as that, not create phantom extra jobs.
function baseJob(site) {
  const s = (site || '').trim();
  if (!s) return NO_JOB;
  if (/ballasalla/i.test(s)) return 'Ballasalla';
  if (/quay west/i.test(s)) return 'Quay West';
  return s;
}
// Ash, 9 Sep 2026: some people genuinely work two jobs in the same
// week ("Ballasalla + Quay West" on one sheet) — baseJob() above would
// silently pick just one and hide the other's hours. Never let that
// happen quietly: a site naming more than one real job must be split
// into one entry per job/day before it can be confirmed.
function siteNamesMultipleJobs(site) {
  const s = (site || '');
  return /ballasalla/i.test(s) && /quay west/i.test(s);
}
function jobDescription(site) {
  let s = (site || '').trim();
  s = s.replace(/ballasalla/gi, '').replace(/quay west/gi, '');
  s = s.replace(/^[\s\-+()]+|[\s\-+()]+$/g, '').trim();
  return s;
}

function rowToEntry(r) {
  return {
    id: r.id, image: STORAGE_PUBLIC + encodeURIComponent(r.image_path), imagePath: r.image_path,
    name: r.staff_name || '', date: r.work_date || '', weekEnding: r.week_ending || '',
    site: r.site || '', start: r.start_time || '', finish: r.finish_time || '',
    hours: r.hours == null ? null : Number(r.hours), confirmed: !!r.confirmed, flagged: !!r.flagged,
    note: r.note || '', description: r.description || '',
    lunch: r.lunch_mins == null ? null : Number(r.lunch_mins),
    sentAt: r.sent_at || null, sentBatchRef: r.sent_batch_ref || null
  };
}
// sent_at/sent_batch_ref/lunch_mins were each added after this table's
// first version — detected once at boot so this still works before Ash
// runs the matching ALTER TABLE, instead of every save silently failing
// with an unknown-column error. PostgREST rejects an insert/select
// naming a column that doesn't exist yet, even as null, so these can't
// just always be sent.
let sentColumnsExist = true;
let descriptionColumnExists = true;
let lunchColumnExists = true;
async function detectSentColumns() {
  try {
    const r = await fetch(REST + '?select=sent_at&limit=1', { headers: sbHeaders() });
    sentColumnsExist = r.ok;
  } catch (e) { sentColumnsExist = false; }
  try {
    const r2 = await fetch(REST + '?select=description&limit=1', { headers: sbHeaders() });
    descriptionColumnExists = r2.ok;
  } catch (e) { descriptionColumnExists = false; }
  try {
    const r3 = await fetch(REST + '?select=lunch_mins&limit=1', { headers: sbHeaders() });
    lunchColumnExists = r3.ok;
  } catch (e) { lunchColumnExists = false; }
}

function entryToRow(e) {
  const row = {
    image_path: e.imagePath, staff_name: e.name, work_date: e.date || null,
    week_ending: e.weekEnding || null, site: e.site, start_time: e.start, finish_time: e.finish,
    hours: e.hours, confirmed: e.confirmed, flagged: e.flagged, note: e.note || ''
  };
  if (sentColumnsExist) { row.sent_at = e.sentAt || null; row.sent_batch_ref = e.sentBatchRef || null; }
  if (descriptionColumnExists) { row.description = e.description || ''; }
  if (lunchColumnExists) { row.lunch_mins = e.lunch == null ? null : e.lunch; }
  return row;
}

let entries = [];
let state = { tab: 'current', job: null, name: null, weekIndex: 0, histJob: null, histName: null, historicRef: null };

async function loadEntries() {
  const r = await fetch(REST + '?select=*&order=work_date.desc.nullslast', { headers: sbHeaders() });
  if (!r.ok) throw new Error(await r.text());
  entries = (await r.json()).map(rowToEntry);
}
async function insertRow(entryLike) {
  const r = await fetch(REST, {
    method: 'POST',
    headers: sbHeaders({ 'Content-Type': 'application/json', Prefer: 'return=representation' }),
    body: JSON.stringify(entryToRow(entryLike))
  });
  if (!r.ok) throw new Error(await r.text());
  const [row] = await r.json();
  return rowToEntry(row);
}
async function deleteRow(id) {
  const r = await fetch(REST + '?id=eq.' + encodeURIComponent(id), { method: 'DELETE', headers: sbHeaders() });
  if (!r.ok) throw new Error(await r.text());
}
// No UPDATE path exists (anon UPDATE is silently blocked) — this is
// delete-then-reinsert dressed up as a save.
async function saveEntry(oldId, updated) {
  await deleteRow(oldId);
  const saved = await insertRow(updated);
  entries = entries.filter(x => x.id !== oldId);
  entries.push(saved);
  return saved;
}
async function uploadImageFile(file) {
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = crypto.randomUUID() + '.' + ext;
  const r = await fetch(STORAGE_UPLOAD + encodeURIComponent(path), {
    method: 'POST', headers: sbHeaders({ 'Content-Type': file.type || 'image/jpeg' }), body: file
  });
  if (!r.ok) throw new Error(await r.text());
  return path;
}

function unsent() { return entries.filter(e => !e.sentAt); }

// ---------------------------------------------------------------
// Rendering — one dispatcher into #mainArea based on `state`.
// ---------------------------------------------------------------
function render() {
  document.querySelectorAll('.dw-navbtn').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  if (state.tab === 'upload') renderUpload();
  else if (state.tab === 'historic') renderHistoric();
  else renderCurrent();
}

// Ash, 9 Sep 2026: one wide table per job — Name / Date range / Ground
// Workers / Total hours — running most of the page width. Ash, 10 Sep
// 2026: clicking a name should open THEIR OWN page (not stack the detail
// underneath the tables) — so the list and the detail are two distinct
// views of the Current tab, with a Back link out of the detail one.
function renderCurrent() {
  const main = document.getElementById('mainArea');
  const pool = unsent();
  const byJob = {};
  pool.forEach(e => { (byJob[baseJob(e.site)] = byJob[baseJob(e.site)] || []).push(e); });

  const dates = pool.map(e => e.date).filter(Boolean).sort();
  const from = dates[0], to = dates[dates.length - 1];
  const anyUnready = pool.some(e => e.flagged || !e.confirmed || siteNamesMultipleJobs(e.site));
  const totalHours = pool.reduce((s, e) => s + (e.hours || 0), 0);
  // Missing/unchecked fields no longer block the button outright — clicking
  // with some still unready pops a warning (Save anyway / Cancel) instead.
  // Only a genuinely empty pool or a missing database column still disables it.
  const canSend = pool.length > 0 && sentColumnsExist;

  // If whatever was selected has since been sent/removed, drop back to
  // the picker rather than showing an empty detail page.
  if (state.job && !byJob[state.job]) { state.job = null; state.name = null; }
  if (state.job && state.name && !byJob[state.job].some(e => (e.name || NO_NAME) === state.name)) {
    state.name = null;
  }

  const sendBarHtml = `
    <div class="send-bar">
      <div class="sb-info">
        <div class="sb-range">${from ? fmtDate(from) + ' – ' + fmtDate(to) : 'No dated entries yet'}</div>
        <div class="sb-sub">${pool.length} entr${pool.length === 1 ? 'y' : 'ies'} since the last save · ${totalHours} hours so far${anyUnready ? ' · some still need checking' : ' · all clear, ready to save'}${!sentColumnsExist ? ' · Historic filing needs a database update first, see below' : ''}</div>
      </div>
      <button class="btn-primary" id="sendBtn" ${canSend ? '' : 'disabled'}>Save for client</button>
    </div>
    ${!sentColumnsExist ? `<p class="flag-note" style="max-width:none">&#9888; Can't file saved packs into Historic yet — run this in the Job Planner's SQL Editor first:<br><code style="font-family:monospace">alter table public.dgc_dayworks_entries add column if not exists sent_at timestamptz;<br>alter table public.dgc_dayworks_entries add column if not exists sent_batch_ref text;</code></p>` : ''}
    ${!lunchColumnExists ? `<p class="flag-note" style="max-width:none">&#9888; The editable lunch field won't save yet — run this in the Job Planner's SQL Editor:<br><code style="font-family:monospace">alter table public.dgc_dayworks_entries add column if not exists lunch_mins integer;</code></p>` : ''}
  `;

  // Detail page for one person — replaces the list entirely.
  if (state.job && state.name) {
    const selectedRows = byJob[state.job].filter(e => (e.name || NO_NAME) === state.name);
    main.innerHTML = `
      ${sendBarHtml}
      <button class="back-inline" id="backToList">&#8592; Back to list</button>
      ${personDetailHtml(selectedRows)}
    `;
    document.getElementById('backToList').addEventListener('click', () => { state.name = null; render(); });
    const sendBtn = document.getElementById('sendBtn');
    if (sendBtn) sendBtn.addEventListener('click', () => attemptSaveForClient(pool, from, to, anyUnready));
    wirePersonDetail(selectedRows);
    return;
  }

  // List page — every job as its own wide table.
  let html = sendBarHtml + overviewTablesHtml(pool);
  main.innerHTML = html;

  main.querySelectorAll('.overview-row').forEach(row => {
    row.addEventListener('click', () => {
      state.job = row.dataset.job; state.name = row.dataset.name; state.weekIndex = 0; render();
    });
  });
  const sendBtn = document.getElementById('sendBtn');
  if (sendBtn) sendBtn.addEventListener('click', () => attemptSaveForClient(pool, from, to, anyUnready));
}

// Shared by the Current list and a Historic batch's own page — one wide
// table per job (Name / Date range / Ground Workers / Total hours) plus
// a grand total row. Rows carry data-job/data-name for the caller to wire.
function overviewTablesHtml(rows) {
  const byJob = {};
  rows.forEach(e => { (byJob[baseJob(e.site)] = byJob[baseJob(e.site)] || []).push(e); });
  if (!Object.keys(byJob).length) return '<p class="empty-state">Nothing here yet.</p>';

  const totalHours = rows.reduce((s, e) => s + (e.hours || 0), 0);
  let html = '';
  Object.keys(byJob).sort().forEach(job => {
    const jrows = byJob[job];
    const byName = {};
    jrows.forEach(e => { (byName[e.name || NO_NAME] = byName[e.name || NO_NAME] || []).push(e); });
    const jobHours = jrows.reduce((s, r) => s + (r.hours || 0), 0);
    html += `
      <div class="overview-section">
        <div class="overview-hdr">${esc(job)}<span class="oh-hours">${jobHours} hours</span></div>
        <table class="overview-table">
          <colgroup><col style="width:34%"><col style="width:24%"><col style="width:22%"><col style="width:20%"></colgroup>
          <thead><tr><th>Name</th><th>Date range</th><th>Ground Workers</th><th>Total hours</th></tr></thead>
          <tbody>`;
    Object.keys(byName).sort().forEach(name => {
      const rs = byName[name];
      const flagged = rs.some(r => r.flagged || !r.confirmed || siteNamesMultipleJobs(r.site));
      const hrs = rs.reduce((s, r) => s + (r.hours || 0), 0);
      const nDates = rs.map(r => r.date).filter(Boolean).sort();
      const range = nDates.length ? fmtDate(nDates[0]) + ' – ' + fmtDate(nDates[nDates.length - 1]) : 'No dates yet';
      html += `
            <tr class="overview-row" data-job="${esc(job)}" data-name="${esc(name)}">
              <td>${flagged ? '<span class="alert-dot" title="Needs checking"></span> ' : ''}${esc(name)}</td>
              <td>${range}</td>
              <td>Ground Worker</td>
              <td class="or-hours">${hrs}h</td>
            </tr>`;
    });
    html += `</tbody></table></div>`;
  });
  html += `
    <table class="overview-table overview-total-table">
      <colgroup><col style="width:34%"><col style="width:24%"><col style="width:22%"><col style="width:20%"></colgroup>
      <tbody><tr class="overview-total-row"><td colspan="3">Total:</td><td class="or-hours">${totalHours}h</td></tr></tbody>
    </table>`;
  return html;
}

function personDetailHtml(rows) {
  const byWeek = {};
  rows.forEach(e => { const wk = e.date ? getMonday(e.date) : '(no date yet)'; (byWeek[wk] = byWeek[wk] || []).push(e); });
  const weekKeys = Object.keys(byWeek).sort();
  if (state.weekIndex >= weekKeys.length) state.weekIndex = weekKeys.length - 1;
  if (state.weekIndex < 0) state.weekIndex = 0;
  const wk = weekKeys[state.weekIndex];
  const weekRows = (byWeek[wk] || []).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const weekTotal = weekRows.reduce((s, r) => s + (r.hours || 0), 0);
  const images = [...new Set(weekRows.map(r => r.image))];

  return `
    ${personSummaryHtml(rows, state.name)}
    <div class="week-nav">
      <button id="wkPrev" ${state.weekIndex <= 0 ? 'disabled' : ''}>&lsaquo; Previous week</button>
      <div class="wn-label">${wk === '(no date yet)' ? 'No date set' : 'Week of ' + fmtDate(wk)} (${state.weekIndex + 1} of ${weekKeys.length}) — ${weekTotal}h</div>
      <button id="wkNext" ${state.weekIndex >= weekKeys.length - 1 ? 'disabled' : ''}>Next week &rsaquo;</button>
    </div>
    <div class="week-grid">
      <div>
        ${weekRows.map(e => dayRowHtml(e)).join('')}
      </div>
      <div class="week-photos">
        ${images.map(img => `<img src="${img}" alt="Timesheet photo">`).join('')}
      </div>
    </div>
  `;
}

function wirePersonDetail(rows) {
  document.getElementById('wkPrev').addEventListener('click', () => { state.weekIndex--; render(); });
  document.getElementById('wkNext').addEventListener('click', () => { state.weekIndex++; render(); });
  const byWeek = {};
  rows.forEach(e => { const wk = e.date ? getMonday(e.date) : '(no date yet)'; (byWeek[wk] = byWeek[wk] || []).push(e); });
  const weekKeys = Object.keys(byWeek).sort();
  const wk = weekKeys[state.weekIndex];
  (byWeek[wk] || []).forEach(e => wireDayRow(e));
}

// Summary block at the top of a person's page: name + overall date
// range, then every week (1, 2, 3…) as its own Mon-Fri style table
// (start/finish/lunch/hours/jobsite), a total per week, then one grand
// total for the whole payment cycle — before the week-by-week photo
// editor underneath. Always covers ALL of this person's unsent weeks,
// not just whichever week the editor below is currently showing.
function personSummaryHtml(rows, name) {
  const dated = rows.filter(r => r.date).map(r => r.date).sort();
  const from = dated[0] || null, to = dated.length ? dated[dated.length - 1] : null;
  const byWeek = {};
  rows.forEach(e => { const wk = e.date ? getMonday(e.date) : '(no date yet)'; (byWeek[wk] = byWeek[wk] || []).push(e); });
  const weekKeys = Object.keys(byWeek).sort();
  let body = '', grand = 0;
  weekKeys.forEach((wkKey, i) => {
    const wrows = byWeek[wkKey].slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    const total = wrows.reduce((s, r) => s + (r.hours || 0), 0);
    grand += total;
    body += `
      <div class="ps-week">
        <div class="ps-week-label">Week ${i + 1}${wkKey === '(no date yet)' ? ' — no date set' : ' — w/c ' + fmtDate(wkKey)}</div>
        <table class="ps-table">
          <colgroup><col style="width:24%"><col style="width:11%"><col style="width:11%"><col style="width:11%"><col style="width:10%"><col style="width:33%"></colgroup>
          <thead><tr><th>Day</th><th>Start</th><th>Finish</th><th>Lunch</th><th>Hours</th><th>Jobsite</th></tr></thead>
          <tbody>
            ${wrows.map(r => {
              const d = r.date ? new Date(r.date + 'T12:00:00') : null;
              const dayLabel = d ? d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' }) : 'No date';
              const lunch = r.lunch == null ? defaultLunchMins(r.start, r.finish) : r.lunch;
              return `<tr><td>${esc(dayLabel)}</td><td>${esc(r.start) || '—'}</td><td>${esc(r.finish) || '—'}</td><td>${(r.start && r.finish) ? lunch + ' min' : '—'}</td><td>${r.hours == null ? '—' : r.hours}</td><td>${esc(r.site) || '—'}</td></tr>`;
            }).join('')}
            <tr class="ps-total-row"><td colspan="4">Week ${i + 1} total</td><td colspan="2">${total}h</td></tr>
          </tbody>
        </table>
      </div>`;
  });
  return `
    <div class="person-summary">
      <div class="ps-head">
        <h2>${esc(name)}</h2>
        <span class="ps-range">${from ? fmtDate(from) + ' – ' + fmtDate(to) : 'No dates set yet'}</span>
      </div>
      ${body || '<p class="empty-state" style="padding:20px 0">No entries yet.</p>'}
      <div class="ps-grand">Total hours this payment cycle: ${grand}</div>
    </div>`;
}

function wireDayRow(e) {
  const row = document.querySelector(`.day-row[data-id="${e.id}"]`);
  if (!row) return;
  const startEl = row.querySelector('[data-f=start]'), finishEl = row.querySelector('[data-f=finish]');
  const dateEl = row.querySelector('[data-f=date]'), descEl = row.querySelector('[data-f=description]');
  const lunchEl = row.querySelector('[data-f=lunch]');
  const recalc = () => {
    row.querySelector('[data-hours]').textContent = (calcHours(startEl.value, finishEl.value, lunchEl.value) ?? '—') + 'h';
    row.querySelector('[data-summary]').textContent = daySummaryLine({
      date: dateEl.value, start: startEl.value, finish: finishEl.value,
      lunch: lunchEl.value === '' ? null : Number(lunchEl.value),
      hours: calcHours(startEl.value, finishEl.value, lunchEl.value), description: descEl.value
    });
  };
  // Lunch auto-fills from the 7+/4hr presumption whenever start/finish
  // change — but only until the PM types into the lunch field directly.
  // Once they've touched it, their figure sticks even if times change.
  lunchEl.addEventListener('input', () => { lunchEl.dataset.manual = '1'; recalc(); });
  [startEl, finishEl].forEach(el => el.addEventListener('change', () => {
    if (lunchEl.dataset.manual !== '1') lunchEl.value = defaultLunchMins(startEl.value, finishEl.value);
    recalc();
  }));
  [dateEl, descEl].forEach(el => el.addEventListener('change', recalc));

  row.querySelector('[data-save]').addEventListener('click', async () => {
    const btn = row.querySelector('[data-save]');
    const status = row.querySelector('[data-status]');
    const siteVal = row.querySelector('[data-f=site]').value.trim();
    if (siteNamesMultipleJobs(siteVal)) {
      status.textContent = 'This names more than one job (e.g. "Ballasalla + Quay West") — split it into a separate entry per job/day first, don\'t leave it combined.';
      return;
    }
    btn.disabled = true; status.textContent = 'Saving…';
    const updated = Object.assign({}, e, {
      name: row.querySelector('.dr-name').value.trim(),
      date: dateEl.value,
      start: startEl.value, finish: finishEl.value,
      lunch: lunchEl.value === '' ? 0 : Number(lunchEl.value),
      site: siteVal,
      description: descEl.value.trim(),
      confirmed: true, flagged: false, note: ''
    });
    updated.hours = calcHours(updated.start, updated.finish, updated.lunch);
    try {
      await saveEntry(e.id, updated);
      render();
    } catch (err) {
      btn.disabled = false; status.textContent = 'Save failed: ' + err.message;
    }
  });

  row.querySelector('[data-remove]').addEventListener('click', async () => {
    if (!confirm('Remove this entry permanently?')) return;
    try { await deleteRow(e.id); entries = entries.filter(x => x.id !== e.id); render(); }
    catch (err) { alert('Could not remove: ' + err.message); }
  });
}

// A static page can't write straight to the shared drive on its own — no
// backend, and browsers deliberately block that. Setting the tab title
// before a manual print is the closest fallback equivalent (Chrome/Edge's
// "Print > Save as PDF" dialog suggests it as the filename).
function rangeLabel(from, to) {
  return `${fmtDate(from).replace(/\//g, '-')} to ${fmtDate(to).replace(/\//g, '-')}`;
}
function printPack(from, to) {
  const prev = document.title;
  document.title = `DGC Dayworks ${rangeLabel(from, to)}`;
  const reset = () => { document.title = prev; window.removeEventListener('afterprint', reset); };
  window.addEventListener('afterprint', reset);
  window.print();
}

// ---------------------------------------------------------------
// Real file output: a proper PDF (branded summary, same look as the
// on-screen preview) + the original photos, bundled and — on Chrome/Edge
// — written straight into the Daywork/Dandara folder via the File System
// Access API. Safari/Firefox don't support writing to a chosen folder
// from a webpage at all, so there it falls back to one zip download that
// the PM extracts into a same-named folder themselves.
// ---------------------------------------------------------------
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('dayworks-fs', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readonly');
    const r = tx.objectStore('handles').get(key);
    r.onsuccess = () => resolve(r.result || null);
    r.onerror = () => reject(r.error);
  });
}
async function idbSet(key, val) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
// Grabs (or asks Ash to pick, once) the Daywork/Dandara folder handle.
// Must be called as the FIRST await after the click, before any slow
// work — the browser only allows the picker/permission prompt while the
// click's "user activation" is still fresh.
async function getDandaraFolderHandle() {
  if (!('showDirectoryPicker' in window)) return null;
  let handle = await idbGet('dandaraFolder').catch(() => null);
  if (handle) {
    try {
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') return handle;
      if ((await handle.requestPermission({ mode: 'readwrite' })) === 'granted') return handle;
    } catch (e) { /* handle gone (folder moved/deleted) — fall through to re-pick */ }
    handle = null;
  }
  try {
    handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    await idbSet('dandaraFolder', handle);
    return handle;
  } catch (e) {
    return null; // user cancelled the picker
  }
}
async function writeFileToDir(dirHandle, name, blob) {
  const fh = await dirHandle.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(blob);
  await w.close();
}
// Renders the branded summary off-screen at full size, rasterises it
// (html2canvas), then slices that image across as many A4 pages as
// needed (the standard "negative-offset" trick for a tall single image).
async function buildClientPdfBlob(rows, from, to, refLabel) {
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-99999px;top:0;width:900px;background:#fff';
  holder.innerHTML = buildPackHtml(rows, from, to, refLabel);
  const doc = holder.querySelector('.report-doc');
  if (doc) { doc.style.boxShadow = 'none'; doc.style.borderRadius = '0'; doc.style.margin = '0'; }
  document.body.appendChild(holder);
  try {
    const canvas = await html2canvas(holder, { scale: 2, backgroundColor: '#ffffff' });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW;
    const imgH = (canvas.height * imgW) / canvas.width;
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    let heightLeft = imgH, y = 0;
    pdf.addImage(imgData, 'JPEG', 0, y, imgW, imgH);
    heightLeft -= pageH;
    while (heightLeft > 0) {
      y = heightLeft - imgH;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, y, imgW, imgH);
      heightLeft -= pageH;
    }
    return pdf.output('blob');
  } finally {
    holder.remove();
  }
}
// Builds the PDF + gathers the photos, then either writes everything
// straight into Daywork/Dandara/[range] (Chrome/Edge, once a folder is
// chosen) or downloads one zip with the same contents for Safari/Firefox
// (and for anyone who cancels the folder picker) to extract into place.
async function saveClientPackToDisk(rows, from, to) {
  const range = rangeLabel(from, to);
  const dirHandle = await getDandaraFolderHandle(); // first, while the click is still fresh

  const pdfBlob = await buildClientPdfBlob(rows, from, to, `DGC Dayworks Hours ${range}`);
  const images = [...new Set(rows.map(r => r.image))];
  const photos = [];
  for (let i = 0; i < images.length; i++) {
    const blob = await fetch(images[i]).then(r => r.blob());
    const ext = (images[i].split('.').pop() || 'jpg').split('?')[0];
    photos.push({ name: `Timesheet ${i + 1}.${ext}`, blob });
  }

  const zip = new JSZip();
  zip.file(`DGC Dayworks ${range}.pdf`, pdfBlob);
  const tsFolder = zip.folder(`DGC Timesheets ${range}`);
  photos.forEach(p => tsFolder.file(p.name, p.blob));
  const zipBlob = await zip.generateAsync({ type: 'blob' });

  if (dirHandle) {
    const dated = await dirHandle.getDirectoryHandle(range, { create: true });
    await writeFileToDir(dated, `DGC Dayworks ${range}.pdf`, pdfBlob);
    const tsDir = await dated.getDirectoryHandle(`DGC Timesheets ${range}`, { create: true });
    for (const p of photos) await writeFileToDir(tsDir, p.name, p.blob);
    await writeFileToDir(dated, `DGC Dayworks ${range}.zip`, zipBlob);
    return { wroteToDisk: true, range };
  }

  const a = document.createElement('a');
  a.href = URL.createObjectURL(zipBlob);
  a.download = `DGC Dayworks ${range}.zip`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  return { wroteToDisk: false, range };
}

// Ash, 10 Sep 2026: don't hard-block the button when something's still
// missing or unchecked — warn instead, and let him decide. "Save anyway"
// goes ahead with what's there; "Cancel" backs out so it can be fixed first.
function showUnreadyModal(count, onSaveAnyway) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>&#9888; Some fields are missing</h3>
      <p>${count} ${count === 1 ? 'entry still needs' : 'entries still need'} a date, a confirmation, or a job split before this pack is fully accurate — some of it may be unreadable or not entered yet. You can save anyway and sort the rest later, or cancel and go check them first.</p>
      <div class="modal-actions">
        <button class="btn-secondary" id="modalCancel">Cancel</button>
        <button class="btn-primary" id="modalSaveAnyway">Save anyway</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  overlay.querySelector('#modalCancel').addEventListener('click', close);
  overlay.querySelector('#modalSaveAnyway').addEventListener('click', () => { close(); onSaveAnyway(); });
}
function attemptSaveForClient(pool, from, to, anyUnready) {
  if (!anyUnready) { showSendPreview(pool, from, to); return; }
  const count = pool.filter(e => e.flagged || !e.confirmed || siteNamesMultipleJobs(e.site)).length;
  showUnreadyModal(count, () => showSendPreview(pool, from, to));
}

function showSendPreview(pool, from, to) {
  const range = rangeLabel(from, to);
  const batchRef = `DGC Dayworks Hours ${range}`;
  const main = document.getElementById('mainArea');
  main.innerHTML = buildPackHtml(pool, from, to, batchRef) + `
    <div class="report-actions">
      <button class="btn-primary" id="confirmSendBtn">&#10003; Save for client</button>
      <button class="btn-print" id="printPackBtn">&#128438; Print / Save PDF manually</button>
      <button class="btn-secondary" id="cancelSendBtn">Cancel</button>
    </div>
    <p class="flag-note" id="saveStatus" style="max-width:none;display:none"></p>`;
  document.getElementById('printPackBtn').addEventListener('click', () => printPack(from, to));
  document.getElementById('cancelSendBtn').addEventListener('click', render);
  document.getElementById('confirmSendBtn').addEventListener('click', async () => {
    const btn = document.getElementById('confirmSendBtn');
    const status = document.getElementById('saveStatus');
    status.style.display = 'block';
    btn.disabled = true; btn.textContent = 'Saving…';
    status.textContent = 'Building the PDF and gathering photos…';
    try {
      const result = await saveClientPackToDisk(pool, from, to);
      status.textContent = result.wroteToDisk
        ? `Saved straight into the "${range}" folder in Daywork/Dandara.`
        : `Downloaded "DGC Dayworks ${range}.zip" — extract it into a new folder named "${range}" inside Daywork/Dandara.`;
      for (const e of pool) {
        await saveEntry(e.id, Object.assign({}, e, { sentAt: new Date().toISOString(), sentBatchRef: batchRef }));
      }
      setTimeout(() => { state.job = null; state.name = null; state.tab = 'current'; render(); }, result.wroteToDisk ? 500 : 2200);
    } catch (err) {
      btn.disabled = false; btn.textContent = '✓ Save for client';
      status.textContent = 'Save failed: ' + err.message + ' — nothing has been marked as sent, safe to retry.';
    }
  });
}

// ---------------------------------------------------------------
// Upload tab
// ---------------------------------------------------------------
function renderUpload() {
  document.getElementById('mainArea').innerHTML = `
    <div class="upload-zone" id="uploadZone">
      <span id="uploadZoneLabel">&#128247; Drop timesheet photos here, or click to choose<br>
      <span style="font-size:0.78rem">(AI reading needs Ash's Claude API key set up first — new uploads land in Current under "${NO_JOB}" for you to categorise)</span></span>
      <input type="file" id="fileInput" accept="image/*" multiple>
    </div>`;
  const zone = document.getElementById('uploadZone');
  zone.addEventListener('click', () => document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', e => { handleFiles(e.target.files); e.target.value = ''; });
  ['dragover', 'dragleave', 'drop'].forEach(evt => zone.addEventListener(evt, e => e.preventDefault()));
  zone.addEventListener('dragover', () => zone.classList.add('drag'));
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', e => { zone.classList.remove('drag'); handleFiles(e.dataTransfer.files); });
}
async function handleFiles(files) {
  const imgFiles = [...files].filter(f => f.type.startsWith('image/'));
  if (!imgFiles.length) return;
  const label = document.getElementById('uploadZoneLabel');
  let done = 0;
  for (const file of imgFiles) {
    label.textContent = `Uploading ${done + 1} of ${imgFiles.length}…`;
    try {
      const path = await uploadImageFile(file);
      const saved = await insertRow({
        imagePath: path, name: '', date: '', weekEnding: '', site: '',
        start: '08:00', finish: '16:30', hours: null, confirmed: false, flagged: true,
        note: 'Just uploaded — AI reading is not wired up yet. Type in what the sheet says.'
      });
      entries.push(saved);
    } catch (err) { alert('Upload failed for ' + file.name + ': ' + err.message); }
    done++;
  }
  state.tab = 'current'; state.job = NO_JOB; state.name = null;
  render();
}

// ---------------------------------------------------------------
// Historic tab
// ---------------------------------------------------------------
function renderHistoric() {
  const sent = entries.filter(e => e.sentAt);
  const byBatch = {};
  sent.forEach(e => { (byBatch[e.sentBatchRef || '(unknown batch)'] = byBatch[e.sentBatchRef || '(unknown batch)'] || []).push(e); });
  const refs = Object.keys(byBatch).sort().reverse();

  const main = document.getElementById('mainArea');
  if (!refs.length) { main.innerHTML = '<p class="empty-state">Nothing sent yet — saved packs will show up here.</p>'; return; }

  if (state.historicRef && byBatch[state.historicRef]) {
    renderHistoricBatch(byBatch[state.historicRef], state.historicRef);
    return;
  }

  main.innerHTML = refs.map(ref => {
    const rows = byBatch[ref];
    const dates = rows.map(r => r.date).filter(Boolean).sort();
    const hrs = rows.reduce((s, r) => s + (r.hours || 0), 0);
    const sentWhen = rows[0].sentAt ? new Date(rows[0].sentAt).toLocaleDateString('en-GB') : '—';
    return `<div class="hist-batch" data-ref="${esc(ref)}">
      <div class="hb-ref">${esc(ref)}</div>
      <div class="hb-meta">${fmtDate(dates[0])} – ${fmtDate(dates[dates.length-1])} · ${rows.length} entries · ${hrs} hours · sent ${sentWhen}</div>
    </div>`;
  }).join('');
  main.querySelectorAll('.hist-batch').forEach(el => {
    el.addEventListener('click', () => { state.historicRef = el.dataset.ref; state.histJob = null; state.histName = null; render(); });
  });
}

// A sent batch browses exactly like the Current homepage — the same wide
// job tables, click a name to see their page — just sourced from this
// batch's rows instead of the unsent pool, and read-only (nothing here
// should still be edited once it's gone to the client).
function renderHistoricBatch(rows, ref) {
  const main = document.getElementById('mainArea');
  const dates = rows.map(r => r.date).filter(Boolean).sort();
  const from = dates[0], to = dates[dates.length - 1];

  if (state.histJob && state.histName) {
    const selRows = rows.filter(e => baseJob(e.site) === state.histJob && (e.name || NO_NAME) === state.histName);
    main.innerHTML = `
      <div class="crumb"><button id="crumbHistList">Historic</button><span class="sep">/</span><button id="crumbHistBatch">${esc(ref)}</button><span class="sep">/</span><span>${esc(state.histName)}</span></div>
      <button class="back-inline" id="backToHistBatch">&#8592; Back to ${esc(ref)}</button>
      ${personSummaryHtml(selRows, state.histName)}
      <div class="week-photos" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px">
        ${[...new Set(selRows.map(r => r.image))].map(img => `<img src="${img}" alt="Timesheet photo" style="width:100%;border-radius:8px;border:1px solid var(--bord)">`).join('')}
      </div>`;
    document.getElementById('crumbHistList').addEventListener('click', () => { state.historicRef = null; state.histJob = null; state.histName = null; render(); });
    document.getElementById('crumbHistBatch').addEventListener('click', () => { state.histJob = null; state.histName = null; render(); });
    document.getElementById('backToHistBatch').addEventListener('click', () => { state.histJob = null; state.histName = null; render(); });
    return;
  }

  main.innerHTML = `
    <div class="crumb"><button id="crumbHistList">Historic</button><span class="sep">/</span><span>${esc(ref)}</span></div>
    <div class="send-bar">
      <div class="sb-info">
        <div class="sb-range">${fmtDate(from)} – ${fmtDate(to)}</div>
        <div class="sb-sub">${rows.length} entries · ${rows.reduce((s, r) => s + (r.hours || 0), 0)} hours · sent ${rows[0].sentAt ? new Date(rows[0].sentAt).toLocaleDateString('en-GB') : '—'}</div>
      </div>
      <button class="btn-secondary" id="downloadHistBtn">Download PDF + photos again</button>
    </div>
    ${overviewTablesHtml(rows)}
  `;
  document.getElementById('crumbHistList').addEventListener('click', () => { state.historicRef = null; render(); });
  document.getElementById('downloadHistBtn').addEventListener('click', async () => {
    const btn = document.getElementById('downloadHistBtn');
    btn.disabled = true; btn.textContent = 'Preparing…';
    try { await saveClientPackToDisk(rows, from, to); btn.textContent = 'Done'; }
    catch (err) { alert('Could not prepare files: ' + err.message); btn.disabled = false; btn.textContent = 'Download PDF + photos again'; }
  });
  main.querySelectorAll('.overview-row').forEach(row => {
    row.addEventListener('click', () => { state.histJob = row.dataset.job; state.histName = row.dataset.name; render(); });
  });
}

// ---------------------------------------------------------------
document.querySelectorAll('.dw-navbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.tab = btn.dataset.tab; state.job = null; state.name = null; state.historicRef = null; state.histJob = null; state.histName = null;
    render();
  });
});

(async function boot() {
  try {
    await detectSentColumns();
    await loadEntries();
    render();
  } catch (err) {
    document.getElementById('mainArea').innerHTML =
      `<p class="empty-state">Couldn't load entries — has the dgc_dayworks_entries table been created yet?<br><span style="font-size:0.72rem;color:var(--red)">${esc(err.message)}</span></p>`;
  }
})();
</script>
