<style>

[data-theme="light"]{--bg:#f0f4f8;--surf:#ffffff;--surf2:#e4ecf4;--bord:#b8ccd8;--accent:#c26a00;--text:#1a2b3c;--muted:#5c7a94;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}
.topbar{background:var(--surf);border-bottom:1px solid var(--bord);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.topbar h1{font-size:1.05rem;font-weight:800;color:var(--accent)}
.topbar .sub{font-size:0.78rem;color:var(--muted);margin-left:auto}

.theme-toggle-btn:hover{border-color:var(--accent);color:var(--accent)}
.nav{background:var(--surf);border-bottom:1px solid var(--bord);padding:0 20px;display:flex;gap:4px;position:sticky;top:49px;z-index:9}
.navbtn{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:0.85rem;font-weight:700;padding:10px 14px;cursor:pointer;font-family:inherit}
.navbtn:hover{color:var(--text)}
.navbtn.active{color:var(--accent);border-bottom-color:var(--accent)}
.main{padding:22px;max-width:1200px;margin:0 auto}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted)}

.hint{font-size:0.8rem;color:var(--muted);margin:10px 0 16px}
.drop-zone.dragover textarea{border-color:var(--accent);border-style:dashed}
.drop-hint{font-size:0.78rem;color:var(--muted);margin-top:6px}
.link-btn{background:none;border:none;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.bulk-add-log{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--bord)}
.bulk-add-log textarea{min-height:90px}
.btn{background:var(--accent);color:#1a1d27;border:none;padding:10px 20px;border-radius:6px;font-size:0.88rem;font-weight:800;cursor:pointer;font-family:inherit}

.btn-secondary{background:var(--surf2);color:var(--text);border:1px solid var(--bord);padding:9px 18px;border-radius:6px;font-size:0.85rem;font-weight:700;cursor:pointer;font-family:inherit}

.row-actions{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.stat-bar{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px;font-size:0.82rem;color:var(--muted)}
.stat-bar b{color:var(--text)}
table.leads{width:100%;border-collapse:collapse;font-size:0.8rem}
table.leads th{text-align:left;padding:8px 10px;background:var(--surf2);border-bottom:1px solid var(--bord);white-space:nowrap;position:sticky;top:94px}
table.leads td{padding:8px 10px;border-bottom:1px solid var(--bord);vertical-align:top}

.lead-section-hdr{font-size:0.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--bord)}
.lead-section-hdr:first-of-type{margin-top:4px}
.lead-list{display:flex;flex-direction:column;background:var(--surf);border:1px solid var(--bord);border-radius:10px;overflow:hidden}

.lead-list .lead-row:last-child{border-bottom:none}
.lead-row.flagged{background:rgba(245,158,11,.06)}
.lr-main{flex:1;min-width:0}
.lr-applicant{font-size:0.98rem;font-weight:700;margin-bottom:3px}
.reg-name-toggle{background:none;border:none;padding:0;margin-bottom:3px;font:inherit;font-size:0.98rem;font-weight:700;color:var(--text);cursor:pointer;text-align:left;display:block}
.reg-name-toggle:hover{color:var(--accent)}
.reg-related{margin:6px 0;font-size:0.82rem}
.reg-related summary{cursor:pointer;color:var(--accent);font-weight:700}
.reg-related ol{margin:8px 0 2px 20px}
.reg-related li{margin:0 0 8px;color:var(--text)}
.reg-related li div{color:var(--muted);margin-top:2px}

.reg-work{background:var(--surf2);border-left:4px solid var(--accent);border-radius:6px;padding:10px 12px;margin:6px 0 4px;font-size:1.02rem;font-weight:700;color:var(--text);line-height:1.4}
.reg-work .lbl{display:block;font-size:0.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.reg-work-gloss{font-weight:700}
.reg-work-raw{font-size:0.8rem;font-weight:400;color:var(--muted);line-height:1.4;margin-top:4px}
.reg-plain{margin:2px 0 4px}
.reg-links{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
.reg-why{border:1px solid var(--bord);border-radius:6px;padding:7px 12px;margin:4px 0;font-size:0.82rem;color:var(--text);line-height:1.5}
.reg-why summary{cursor:pointer;color:var(--muted);font-size:0.78rem;font-weight:700;list-style:none}
.reg-why summary::-webkit-details-marker{display:none}
.reg-why summary::before{content:'\25b8 ';color:var(--accent)}
.reg-why[open] summary::before{content:'\25be ';color:var(--accent)}

.lr-meta{font-size:0.78rem;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lr-meta select{background:var(--bg);border:1px solid var(--bord);border-radius:5px;color:var(--muted);padding:3px 6px;font-size:0.74rem;font-family:inherit}

.register-pull{margin-top:32px;padding-top:22px;border-top:1px solid var(--bord)}
.register-pull input[type=date],.register-pull input[type=text],.register-pull select{background:var(--surf);border:1px solid var(--bord);border-radius:6px;color:var(--text);padding:6px 8px;font-size:0.85rem;font-family:inherit}
.register-pull label{font-size:0.85rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sal-input:hover{border-color:var(--bord)}
.sal-input:focus{background:var(--bg);border-color:var(--accent);outline:none}
.lr-side{display:flex;align-items:center;gap:12px;flex-shrink:0}

.send-toggle.on{background:var(--green);color:#08210f}
.send-toggle.off{background:transparent;color:var(--accent);border:1px solid var(--accent)}

.nav{overflow-x:auto}

.nav-count:not(:empty){display:inline-block;min-width:18px;padding:0 6px;margin-left:5px;border-radius:9px;background:var(--surf2);color:var(--text);font-size:0.7rem;line-height:1.5}

.reg-actions button{padding:6px 10px;font-size:0.76rem;white-space:nowrap}
.reg-actions button.natural{border-color:var(--accent);color:var(--accent)}
.f-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.doc-copy-label{font-size:0.75rem;color:var(--muted);margin-right:auto;align-self:center}
.doc-toolbar{gap:8px}
.timing-panel{background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:10px 14px;font-size:0.82rem}
.tp-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.who-inv{font-size:0.85rem;margin:6px 0 4px;padding:6px 10px;border-left:3px solid rgba(56,153,207,.7);background:var(--surf2);border-radius:0 6px 6px 0;color:var(--text);line-height:1.5}

.orig-banner{margin-top:8px;padding-top:8px;border-top:1px solid var(--bord);font-weight:400}

table.tstats th{position:static}

.align-toggle{display:inline-flex;gap:6px;margin-left:10px}
.align-toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.doc-edit-panel textarea,.doc-edit-panel input{width:100%;box-sizing:border-box;font-family:inherit;font-size:0.85rem;padding:6px 8px;border:1px solid var(--bord);border-radius:5px;background:var(--bg);color:var(--text)}

<script>
// ---------------------------------------------------------------
// Silverdale Canvassing — pulls a pasted table of IoM planning
// applications, classifies each lead, applies the standing
// never-contact list and a dedup log (both persisted in
// localStorage — no backend yet, this is v1), then generates
// print-ready branded letters and DL envelopes from the templates
// agreed 8 Sep 2026.
//
// v1 intake is paste-based, not a live pull from pbc.gov.im: a
// browser page can't cross-origin-scrape a .gov site directly, and
// building a real scraper needs a server-side piece (a Supabase
// Edge Function, same pattern as Dayworks' AI extraction) — that's
// a deliberate next phase, not skipped by accident. For now: copy
// the table from the Weekly List export (or the PDF) and paste it
// in on the Import tab.
// ---------------------------------------------------------------

// ---- Theme (dark default, light optional, remembered per browser) ----
const LS_THEME = 'silverdale_canvassing_theme';
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggleBtn');
  if (btn) btn.textContent = theme === 'light' ? 'Dark Mode' : 'Light Mode';
}
function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  applyTheme(next);
  try { localStorage.setItem(LS_THEME, next); } catch {}
}
(function initTheme(){
  let saved = 'dark';
  try { saved = localStorage.getItem(LS_THEME) || 'dark'; } catch {}

// Lets a paste box also accept a dropped or picked file — reads it as
// text and fills the textarea, since dropping a file onto a plain
// <textarea> just inserts its filename, not its contents.
function wireFileDrop(dropZoneId, fileInputId, fileBtnId, textareaId){
  const dropZone = document.getElementById(dropZoneId);
  const fileInput = document.getElementById(fileInputId);
  const textarea = document.getElementById(textareaId);
  const readFile = (file) => {
    if (!file) return;

  };
  document.getElementById(fileBtnId).addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    dropZone.classList.remove('dragover');
    readFile(e.dataTransfer.files[0]);
  });
}

const CLOUD_IDS = { [LS_LEADS]: 'leads', [LS_LOG]: 'log', [LS_REGISTER_DISMISSED]: 'archive' };

async function cloudFetch(path, opts){
  const session = await ensureLoggedIn();
  if (!session) throw new Error('signed-out');
  opts = opts || {};
  return fetch(SUPABASE_URL + path, Object.assign({}, opts, { headers: authedHeaders(session, opts.headers) }));
}
function cloudStatus(kind, text){
  const el = document.getElementById('cloudStatus');

function cloudQueue(lsKey){
  if (!cloud.on || !CLOUD_IDS[lsKey]) return;
  cloud.pending.add(lsKey);
  cloudStatus('saving', 'Saving online…');
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(cloudFlush, 1500);
}
function localJson(lsKey){ try { return JSON.parse(localStorage.getItem(lsKey) || (lsKey === LS_LEADS ? '[]' : '{}')); } catch { return lsKey === LS_LEADS ? [] : {}; } }
async function cloudFlush(){
  if (cloud.busy) { clearTimeout(cloud.timer); cloud.timer = setTimeout(cloudFlush, 800); return; }
  cloud.busy = true;
  try {
    for (const lsKey of [...cloud.pending]) {
      const res = await cloudPush(CLOUD_IDS[lsKey], localJson(lsKey));
      if (res === 'conflict') { cloud.pending.clear(); cloud.busy = false; await cloudConflict(); return; }
      cloud.pending.delete(lsKey);
    }
    cloudStatus('ok', 'Saved online');
  } catch (e) {
    cloudStatus('warn', 'Not saved online yet (saved on this computer)');
    clearTimeout(cloud.timer); cloud.timer = setTimeout(cloudFlush, 30000);
  } finally { cloud.busy = false; }
}
// Only overwrites the online copy if nobody else has saved since we last read it.
async function cloudPush(id, data){
  const known = cloud.known[id];
  let r, rows;
  if (known) {
    r = await cloudFetch(`/rest/v1/canvass_state?id=eq.${id}&updated_at=eq.${encodeURIComponent(known)}`,
      { method: 'PATCH', headers: { Prefer: 'return=representation' }, body: JSON.stringify({ data, updated_by: cloud.email || null }) });
    if (!r.ok) throw new Error('save failed ' + r.status);
    rows = await r.json();
    if (!rows.length) return 'conflict';
  } else {
    r = await cloudFetch('/rest/v1/canvass_state',
      { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify({ id, data, updated_by: cloud.email || null }) });
    if (r.status === 409) return 'conflict';
    if (!r.ok) throw new Error('save failed ' + r.status);
    rows = await r.json();
  }
  cloud.known[id] = rows[0].updated_at;
  return 'ok';
}
async function cloudRows(select){
  const r = await cloudFetch('/rest/v1/canvass_state?select=' + (select || 'id,data,updated_at'));
  if (!r.ok) throw new Error('load failed ' + r.status);
  return r.json();
}
function writeLocalFromRows(rows){
  const byId = Object.fromEntries(rows.map(x => [x.id, x]));
  for (const [lsKey, id] of Object.entries(CLOUD_IDS)) {
    if (!byId[id]) continue;
    cloud.known[id] = byId[id].updated_at;
    try { localStorage.setItem(lsKey, JSON.stringify(byId[id].data)); } catch {}
  }
}

}
async function cloudConflict(){

// Sign-in check, then line this browser up with the online copy.
async function cloudStart(){
  const chk = await cloudFetch('/rest/v1/rpc/canvass_is_allowed', { method: 'POST', body: '{}' });
  if (chk.status === 404) return 'not-set-up';
  if (!chk.ok) throw new Error('check failed ' + chk.status);
  if ((await chk.json()) !== true) return 'not-allowed';
  const rows = await cloudRows();
  const counts = `${localJson(LS_LEADS).length} leads, ${Object.keys(localJson(LS_LOG)).length} sent and ${Object.keys(localJson(LS_REGISTER_DISMISSED)).length} archived`;
  const localHasData = Object.keys(CLOUD_IDS).some(k => { const v = localStorage.getItem(k); return v && v !== '[]' && v !== '{}'; });
  if (!rows.length) {
    cloud.on = true;
    if (localHasData && confirm(`First time online: save this computer's list (${counts}) as the online copy?\n\nChoose Cancel if you have a more up-to-date list on another computer.`)) {
      Object.keys(CLOUD_IDS).forEach(k => cloud.pending.add(k));
      await cloudFlush();
    }
    return 'ok';
  }
  const differs = rows.some(x => { const k = Object.keys(CLOUD_IDS).find(k => CLOUD_IDS[k] === x.id); return k && JSON.stringify(x.data) !== JSON.stringify(localJson(k)); });
  if (localHasData && differs) keepLocalCopy('before_online');   // this browser's old copy is kept, just in case
  writeLocalFromRows(rows);
  cloud.on = true;
  return 'ok';
}
async function cloudRefreshIfNewer(){
  if (!cloud.on || cloud.pending.size || cloud.busy) return;

    const rows = await cloudRows('id,updated_at');

    writeLocalFromRows(await cloudRows());

}

// ---- Parsing a pasted table ----
// Expects tab-separated (straight copy from a spreadsheet or the
// PDF's extracted table) with columns roughly: No / Reference / Site
// Address / Applicant / Developer / Type of Development / Local
// Authority. Column order is detected from the header row where
// possible; falls back to positional guessing otherwise.
// Matches a planning reference like "26/00465/B" or "25/91215/B".
function looksLikeRef(s){ return /^\d{2}\/\d{3,6}\/[A-Za-z]$/.test((s || '').trim()); }

// ---- Local businesses (architects, engineers, etc.) ----
// A second, independent lead source alongside the planning-register pull.
// These are appended to the same working `leads` array (not a wholesale
// replace, since the business list is built up over time rather than
// refreshed weekly) so they share Review/Print/Edit/Archive and the same
// processed-log dedup as planning leads, per Ash's ask that it "be
// handled the same" and never send the same letter twice.
function parseCsvLine(line){
  const fields = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQuotes) {
      if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQuotes = false; }
      else cur += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { fields.push(cur); cur = ''; }
      else cur += c;
    }
  }
  fields.push(cur);
  return fields.map(f => f.trim());
}
function slugify(s){ return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }

function parseBusinessCSV(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if (!lines.length) return [];
  const header = parseCsvLine(lines[0]).map(h => h.toLowerCase());
  const col = name => header.indexOf(name);
  const iName = col('name'), iPractice = col('practice name'), iAddr1 = col('address line 1'),
        iAddr2 = col('address line 2'), iTown = col('town'), iPostcode = col('postcode'), iReg = col('iom reg number'), iTrade = col('trade');
  const out = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCsvLine(lines[i]);
    if (!cols.some(c => c && c.trim())) continue;
    const name = iName >= 0 ? cols[iName] || '' : '';
    if (!name) continue;
    const practice = iPractice >= 0 ? cols[iPractice] || '' : '';
    const addr1 = iAddr1 >= 0 ? cols[iAddr1] || '' : '';
    const addr2 = iAddr2 >= 0 ? cols[iAddr2] || '' : '';
    const town = iTown >= 0 ? cols[iTown] || '' : '';
    const postcode = iPostcode >= 0 ? cols[iPostcode] || '' : '';
    const reg = iReg >= 0 ? cols[iReg] || '' : '';
    const firstName = name.split(' ')[0];
    out.push({
      ref: 'ARCH-' + (reg || slugify(name + '-' + practice)),
      applicant: name,
      site: practice + (town ? ', ' + town : ''),
      recipientLines: [name, practice, addr1, addr2, town, postcode].map(s => s.trim()).filter(Boolean),
      salutation: `Dear ${firstName},`,
      edited: true,    // protects our clean CSV-built address/salutation from classify()'s auto-rebuild
      include: false,  // opt-in — Ash picks which businesses to actually approach in Review
      hasAddress: !!(addr1 && addr1.toLowerCase() !== 'redacted' && postcode),
      trade: (iTrade >= 0 && cols[iTrade] ? cols[iTrade].trim() : '') || (iReg >= 0 ? 'Architect' : '')   // an IoM reg number means the architects register
    });
  }
  return out;
}

// One letter per practice: a new business sharing a practice name or
// office address with someone already sent (or already waiting) is
// flagged Check rather than queued as a second letter to the same firm.
function practiceKeys(lines){
  if (!lines || lines.length < 3) return [];
  const norm = t => (t || '').toLowerCase().replace(/\b(ltd|limited)\b\.?/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
  return [norm(lines[1]), norm(lines[2]) + '|' + norm(lines[lines.length - 1])].filter(k => k && k !== '|');
}
function flagSamePractice(newLeads){
  const seen = new Map();
  const note = (lines, label) => practiceKeys(lines).forEach(k => { if (!seen.has(k)) seen.set(k, label); });
  Object.values(getLog()).forEach(e => { if (e.source === 'business') note(e.recipientLines, `${e.name} (sent ${prettyDate(e.date)})`); });
  leads.filter(l => leadFolder(l) === 'business' && !newLeads.includes(l)).forEach(l => note(l.recipientLines, l.applicant));
  newLeads.forEach(l => {
    if (l.alreadyProcessed || l.excludedReason) return;
    const match = practiceKeys(l.recipientLines).map(k => seen.get(k)).find(Boolean);
    if (match) {
      l.extraReviewNote = l.extraReviewNote || `Same practice as ${match} — one letter per practice is usually enough.`;
      l.needsReview = true;
      l.reviewNote = l.reviewNote || l.extraReviewNote;
    } else note(l.recipientLines, l.applicant);
  });
}

    const added = [];
    // Nobody is ever silently re-added or re-sent — anyone already in a
    // folder, already sent, or archived is counted and reported instead.
    let inFolder = 0, inArchive = 0;

      lead.source = 'business';

        lead.needsReview = true;

      }
      added.push(lead);

      if (inFolder) parts.push(`${inFolder} already in the Businesses folder, skipped.`);
      if (inArchive) parts.push(`${inArchive} archived before, skipped.`);
      msg.textContent = parts.join(' ');
    }
    updateNavCounts();
  });
}

function parseInput(text){
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];
  const rows = lines.map(l => l.split('\t').map(c => c.trim()));
  const header = rows[0].map(c => c.toLowerCase());
  const findCol = names => header.findIndex(h => names.some(n => h.includes(n)));
  let cRef = findCol(['reference']), cSite = findCol(['site address', 'address']),
      cApplicant = findCol(['applicant', 'developer']), cType = findCol(['type']),
      cAuth = findCol(['authority']);
  let start = (cRef >= 0 || cSite >= 0 || cApplicant >= 0) ? 1 : 0;

  if (cRef < 0) {
    // No header keywords found — locate the reference column by what its
    // values actually look like (across every row) rather than assuming
    // a fixed position, since a pasted table may or may not have a
    // leading row-number column or a header row at all.
    const width = Math.max(...rows.map(r => r.length));
    let best = -1, bestCount = 0;
    for (let c = 0; c < width; c++) {
      const count = rows.filter(r => looksLikeRef(r[c])).length;
      if (count > bestCount) { bestCount = count; best = c; }
    }
    if (best >= 0) {
      cRef = best;
      start = looksLikeRef(rows[0][cRef]) ? 0 : 1;
    } else {
      cRef = 1; start = 0; // total fallback: assume a leading "No." column
    }
    if (cSite < 0) cSite = cRef + 1;
    if (cApplicant < 0) cApplicant = cRef + 2;
    if (cType < 0) cType = cRef + 3;
    if (cAuth < 0) cAuth = cRef + 4;
  } else {
    if (cSite < 0) cSite = cRef + 1;
    if (cApplicant < 0) cApplicant = cRef + 2;
    if (cType < 0) cType = cRef + 3;
    if (cAuth < 0) cAuth = cRef + 4;
  }

  const out = [];
  for (let i = start; i < rows.length; i++) {
    const r = rows[i];
    if (r.length < 2) continue;
    const ref = (r[cRef] || '').trim();
    const site = (r[cSite] || '').trim();
    const applicant = (r[cApplicant] || '').trim();
    if (!ref && !site && !applicant) continue;
    out.push(classify({
      ref, site, applicant,
      type: (r[cType] || '').trim(),
      authority: (r[cAuth] || '').trim()
    }));
  }
  return out;
}

const COMPANY_WORDS = /\b(ltd|limited|llp|plc|commissioners|council|enterprises|group|homes|developments|hire|innovation|advocates|solicitors)\b/i;
const TITLE_RE = /^(mr|mrs|miss|ms|dr)\b/i;

function classify(lead){
  const log = getLog();
  const applicantLower = lead.applicant.toLowerCase();

  lead.excludedReason = null;
  const screened = `${applicantLower} ${lead.site.toLowerCase()} ${(lead.agentText || '').toLowerCase()}`;
  for (const name of STANDING_EXCLUDE) {
    if (screened.includes(name)) { lead.excludedReason = 'Standing never-contact: ' + name; break; }
  }
  lead.alreadyProcessed = !!log[lead.ref];

  lead.needsReview = false;
  lead.reviewNote = '';
  if (/not legible|illegible|acting for|not stated/i.test(lead.applicant)) {
    lead.needsReview = true; lead.reviewNote = 'Applicant unclear on the form — check before sending.';
  }
  // Flags set when the lead was added (no applicant on the register, no
  // postal address, government body) must survive every reload.
  if (lead.extraReviewNote) { lead.needsReview = true; lead.reviewNote = lead.reviewNote || lead.extraReviewNote; }

  // Checked on the name with any bracketed aside removed first, so an
  // individual like "Mr Wesley Roussouw (H&B Developments)" isn't
  // misclassified as a company just because of what's in brackets. A
  // leading personal title always wins (individual); otherwise Company
  // is the positive signal (Ltd/Limited/Commissioners/etc.), Homeowner
  // is the safe default.
  const mainText = lead.applicant.replace(/\([^)]*\)/g, '').trim();
  lead.type = TITLE_RE.test(mainText) ? 'Homeowner' : (COMPANY_WORDS.test(mainText) ? 'Company' : 'Homeowner');

  // Skip recomputing these if the recipient/salutation were hand-edited
  // via the "Edit this one" facility on the Print tabs — otherwise the
  // next reload (which re-runs classify() on every stored lead) would
  // silently overwrite the correction with the auto-generated version.
  if (!lead.edited) {
    lead.recipientLines = buildAddressBlock(lead);
    lead.salutation = buildSalutation(lead);
    if (lead.salutation === 'Dear Sir/Madam,' && lead.type === 'Homeowner') {
      lead.needsReview = true;
      lead.reviewNote = lead.reviewNote || 'Joint applicants with different surnames — check the salutation before sending.';
    }
  }

  // Send by default — homeowners and businesses alike — unless it's on
  // the standing never-contact list or flagged for a manual look
  // (illegible/agent-only/genuinely unresolved name). "Already sent" is
  // shown as a warning tag, not an automatic exclude — saving/archiving
  // a batch must never silently make leads disappear from Print/Review.
  // Only set on first classification of a lead — classify() re-runs on
  // every stored lead on every reload, so once a value exists here it
  // must be left alone, or a manual Send/Don't-send toggle in Review
  // would get silently reverted the next time the page loads.
  if (lead.include === undefined) {
    lead.include = !lead.excludedReason && !lead.needsReview;
  }
  // The standing never-contact list is a hard business rule, not a
  // suggestion — always enforced, even over a manual toggle.
  if (lead.excludedReason) lead.include = false;
  return lead;
}

function buildAddressBlock(lead){
  const name = lead.applicant.replace(/\s*\([^)]*\)\s*/g, ' ').trim();
  let addrParts = lead.site.split(',').map(s => s.trim()).filter(Boolean);
  // Site address sometimes repeats the company name as its own first
  // segment (e.g. "Mann Crane Hire Ltd, Balthane Industrial Estate...")
  // — drop it there so it isn't printed twice.
  if (addrParts.length && addrParts[0].toLowerCase() === name.toLowerCase()) addrParts = addrParts.slice(1);
  return [name || '(Name unclear — check)'].concat(addrParts);
}

// Strips a trailing "&"/"and" connector before taking the last word, so
// "Martyn Lester &" (mid-string, before the next title) correctly
// yields the surname "Lester" rather than the ampersand itself.
function lastWord(s){
  const t = (s || '').trim().replace(/\s*(?:&|and)\s*$/i, '').trim();
  if (!t) return '';
  return (t.split(/\s+/).pop() || '').replace(/[.,]/g, '');
}
function cap(s){ return s ? s[0].toUpperCase() + s.slice(1).toLowerCase() : s; }

function buildSalutation(lead){
  // Illegible/agent-only/unstated applicants aren't real names to parse —
  // trying just produces garbled output. Already flagged for a manual
  // look in classify(); default cleanly instead of guessing.
  if (/not legible|illegible|acting for|not stated/i.test(lead.applicant)) return 'Dear Sir/Madam,';
  if (lead.type === 'Company') {
    // Prefer an actual company name in brackets over the named individual
    // in front of it — "Mr Allan & Dave Kinrade (YOKBROS LTD)" should
    // address YOKBROS, not garble the two directors' first names together.
    const bracket = lead.applicant.match(/\(([^)]*)\)/);
    let name = (bracket && COMPANY_WORDS.test(bracket[1])) ? bracket[1] : lead.applicant.replace(/\s*\([^)]*\)\s*/g, '').trim();
    name = name.replace(/\b(ltd|limited|llp|plc)\b\.?/gi, '').trim();
    if (!name || /commissioners|council|advocates|solicitors/i.test(lead.applicant)) return 'Dear Sir/Madam,';
    return `Dear ${name} Team,`;
  }

  const core = lead.applicant.replace(/\s*\([^)]*\)\s*/g, ' ').replace(/\s+/g, ' ').trim();
  if (!core) return 'Dear Sir/Madam,';

  // "Mr & Mrs <given names> <Surname>" / "Mr and Mrs ..." — a single
  // shared surname is the norm here (the first person's own surname is
  // conventionally omitted, not actually different), so this is checked
  // as one atomic unit before any general title-splitting below —
  // otherwise the combined title's own "&" gets mistaken for a second,
  // differently-surnamed person.
  const combined = core.match(/^(Mr)\s*(?:&|and)\s*(Mrs)\b\s*(.*)$/i);
  if (combined) {
    const remainder = combined[3];
    // Exactly one connector ("A & B Surname") reads as one shared
    // surname — including a slash-joined surname like "Emmerson/Gledhill",
    // which is how this couple's own name is written, not a sign of
    // trouble. Two connectors ("David & Jan Brooks & Cooil") genuinely
    // could be two different surnames — not safe to guess which.
    const connectorCount = (remainder.match(/\s(?:&|and)\s/gi) || []).length;
    const surname = lastWord(remainder);
    if (connectorCount > 1 || !surname) return 'Dear Sir/Madam,';
    return `Dear Mr & Mrs ${surname},`;
  }

  // General case: split on every title mention (Mr/Mrs/Miss/Ms/Dr) and
  // compare the surname attached to each segment, including any
  // untitled text before the first title (e.g. "Mark Patrick O'Meara &
  // Miss Kathryn Newton" — "O'Meara" has no title of its own).
  const TITLE_G = /\b(Mr|Mrs|Miss|Ms|Dr)\b/gi;
  const titles = [...core.matchAll(TITLE_G)];
  // No title anywhere (e.g. the source just wrote "Vincent Hesketh") —
  // address by full name rather than falling back to Sir/Madam, since
  // we do at least have a real, unambiguous single name to use.
  if (!titles.length) return core.includes('&') || / and /i.test(core) ? 'Dear Sir/Madam,' : `Dear ${core},`;

  const namedParts = [];
  const preText = core.slice(0, titles[0].index).trim();
  const preSurname = lastWord(preText);
  const preFull = preText.replace(/\s*(?:&|and)\s*$/i, '').trim();
  if (preSurname) namedParts.push({ title: null, surname: preSurname, full: preFull });
  titles.forEach((t, i) => {
    const end = i + 1 < titles.length ? titles[i + 1].index : core.length;
    const text = core.slice(t.index + t[0].length, end);
    const surname = lastWord(text);
    if (surname) namedParts.push({ title: t[1], surname, full: null });
  });

  if (namedParts.length === 1) {
    const only = namedParts[0];
    return only.title ? `Dear ${cap(only.title)} ${only.surname},` : `Dear ${only.full},`;
  }
  const allSurnames = namedParts.map(p => p.surname.toLowerCase());
  const allSame = allSurnames.every(s => s === allSurnames[0]);
  if (allSame) {
    const titleWords = namedParts.map(p => p.title).filter(Boolean);
    const prefix = titleWords.length ? titleWords.map(cap).join(' & ') : 'Mr & Mrs';
    return `Dear ${prefix} ${namedParts[namedParts.length - 1].surname},`;
  }
  // Two clearly-named people, genuinely different surnames (e.g. "Mr
  // Martyn Lester & Mrs Cornelia Dahlgren") — the data isn't unclear,
  // there just isn't one shared surname, so address both by name
  // rather than falling back to a generic greeting.
  if (namedParts.length === 2) {
    const label = p => p.title ? `${cap(p.title)} ${p.surname}` : p.full;
    return `Dear ${label(namedParts[0])} and ${label(namedParts[1])},`;
  }
  return 'Dear Sir/Madam,';
}

// ---- Rendering ----
function render(){
  if (!timings) loadTimings().then(() => { if (state.tab !== 'import') render(); });
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  updateNavCounts();
  const main = document.getElementById('mainArea');
  if (state.tab === 'fApproved') return renderFolder(main, 'approved');
  if (state.tab === 'fPending') return renderFolder(main, 'pending');
  if (state.tab === 'fBusiness') return renderFolder(main, 'business');
  if (state.tab === 'fPersonal') return renderFolder(main, 'personal');
  if (state.tab === 'archive') return renderArchive(main);
  if (state.tab === 'market') return renderMarket(main);
  if (state.tab === 'letters') return renderPrint(main, 'letter');
  if (state.tab === 'envelopes') return renderPrint(main, 'envelope');
  if (state.tab === 'log') { state.tab = 'archive'; return render(); }

  renderImport(main);
}

    const existingRefs = new Set(leads.map(l => l.ref).filter(Boolean));
    const archived = getDismissed();
    const log = getLog();
    const fresh = parsed.filter(l => !(l.ref && (existingRefs.has(l.ref) || archived[l.ref] || log[l.ref])));
    fresh.forEach(l => { l.folder = 'approved'; l.include = false; l.addedAt = todayISO(); });

    updateNavCounts();
  });
  renderRegisterPull(main);
}

// ---- Planning decision times ----
// Built from 5 years of register decisions (scripts/planning_history.py).
// "Typical" = the median days from received to decision issued, for the
// most specific group with at least 10 decisions in the last two years —
// the same rule the weekly pull uses when it locks in a forecast.
const TIMINGS_URL = 'register-data/timings.json';
const PREDICTIONS_URL = 'register-data/predictions.json';
const ADMIN_WORK = ['Conditions / information', 'Minor change', 'Certificate of lawfulness'];
const DAY_MS = 86400000;
let timings = null;
let predictions = {};

function isoToDate(s){ return s ? new Date(s + 'T12:00:00') : null; }
function regDate(s){ if (!s) return null; const d = new Date(String(s).replace(/^\w{3}\s+/, '') + ' 12:00'); return isNaN(d) ? null : d; }
function daysBetween(a, b){ return a && b ? Math.round((b - a) / DAY_MS) : null; }
function fmtWeeks(days){ if (days == null) return ''; const w = Math.round(days / 7 * 10) / 10; return `${w} ${w === 1 ? 'week' : 'weeks'}`; }
function fmtDay(d){ return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); }

let timingsPromise = null;
function loadTimings(){
  if (timingsPromise) return timingsPromise;
  return timingsPromise = Promise.all([
    privateJson(TIMINGS_URL, TIMINGS_URL).catch(() => null),
    privateJson(PREDICTIONS_URL, PREDICTIONS_URL).catch(() => ({}))
  ]).then(([t, p]) => {
    predictions = p || {};
    const rows = [], byRef = new Map();
    if (t) t.rows.forEach(r => {
      const o = { ref: r[0], work: t.works[r[1]], type: t.types[r[2]], level: t.levels[r[3]], outcome: t.outcomes[r[4]],
                  received: isoToDate(r[5]), validated: isoToDate(r[6]), decided: isoToDate(r[7]), complexity: r[8] || null,
                  agent: (t.agents || [])[r[9]] || '', applicant: (t.applicants || [])[r[10]] || '', applicantKey: r[11] || '',
                  original: r[12] === 1 };   // an old original looked up for a paperwork row, not part of the 5-year history
      o.days = daysBetween(o.received, o.decided);
      if (o.days != null && o.days < 0) o.days = null;
      o.vdays = daysBetween(o.validated, o.decided);
      if (o.vdays != null && o.vdays < 0) o.vdays = null;
      rows.push(o); byRef.set(o.ref, o);
    });
    timings = { rows, byRef, generated: t && t.generated };
    return timings;
  });
}

function summarise(days){
  if (!days.length) return null;
  const s = days.slice().sort((a, b) => a - b);
  const q = p => { const i = (s.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i); return s[lo] + (s[hi] - s[lo]) * (i - lo); };
  const counts = new Map();
  s.forEach(d => { const w = Math.round(d / 7); counts.set(w, (counts.get(w) || 0) + 1); });
  let modeWeeks = null, best = 0;
  counts.forEach((c, w) => { if (c > best || (c === best && w < modeWeeks)) { best = c; modeWeeks = w; } });
  return { n: s.length, mean: s.reduce((a, b) => a + b, 0) / s.length, median: q(0.5), p25: q(0.25), p75: q(0.75), modeWeeks };
}

function typicalFor(work, type, asOf, field){
  if (!timings) return null;
  const f = field || 'days';
  const now = asOf || new Date();
  const since = new Date(now - 730 * DAY_MS);
  const pool = timings.rows.filter(r => r[f] != null && r.decided >= since && r.decided < now);
  for (const [basis, pick] of [[work, r => r.work === work], [type, r => r.type === type], ['all applications', () => true]]) {
    if (!basis) continue;
    const ds = pool.filter(pick).map(r => r[f]);
    if (ds.length >= 10) return { days: summarise(ds).median, n: ds.length, basis };
  }
  return null;
}

// The forecast shown for a pending application: the one locked in by the
// weekly pull if there is one, otherwise worked out live the same way.
function forecastFor(ref, received, validated, work, type){
  const p = predictions[ref];
  if (p && regDate(p.predictedDate)) return { date: regDate(p.predictedDate), days: p.typicalDays, n: p.basedOn, basis: p.basis, lockedOn: p.madeOn, fromValidated: p.from === 'validated' };
  const start = validated || received;
  const typ = start && typicalFor(work, type, null, validated ? 'vdays' : 'days');
  if (!typ) return null;
  const date = new Date(start.getTime() + Math.round(typ.days) * DAY_MS);
  const dow = date.getDay();
  if (dow === 6 || dow === 0) date.setDate(date.getDate() + (dow === 6 ? 2 : 1));
  return { date, days: typ.days, n: typ.n, basis: typ.basis, fromValidated: !!validated };
}

function timingHtml(ref, receivedStr, decidedStr){
  const t = timings && timings.byRef.get(ref);
  const received = regDate(receivedStr) || (t && t.received);
  const decided = regDate(decidedStr) || (t && t.decided);
  if (!received) return '';
  const chips = t && t.work ? ` <span class="tag tag-dupe" title="What the application is for">${esc(t.work)}</span>${t.level ? ` <span class="tag tag-dupe" title="Who makes the decision">${esc(t.level)}</span>` : ''}` : '';
  if (decided) {
    const typ = typicalFor(t && t.work, t && t.type);
    return `<span class="timing">&#9201; ${fmtWeeks(daysBetween(received, decided))} to decide</span>${typ ? ` <span class="hint" style="margin:0">(typical ${fmtWeeks(typ.days)} for ${esc(typ.basis)})</span>` : ''}${chips}`;
  }
  const f = forecastFor(ref, received, t && t.validated, t && t.work, t && t.type);
  const overdue = f && f.date < new Date();
  return `<span class="timing">&#9201; waiting ${fmtWeeks(daysBetween(received, new Date()))}</span>`
    + (f ? ` &middot; <b style="color:var(--text)">expected &asymp; ${fmtDay(f.date)}</b> <span class="hint" style="margin:0">(${fmtWeeks(f.days)} ${f.fromValidated ? 'from validation ' : ''}typical for ${esc(f.basis)}, ${f.n} decisions${f.lockedOn ? `, forecast locked ${esc(prettyDate(f.lockedOn))}` : ''})</span>${overdue ? ' <span class="tag tag-review">past expected date</span>' : ''}` : '')
    + chips;
}

// These reference a condition number and an earlier permission, with
// nothing in the register's own wording restating what the project
// actually is — unlike a full application's description, which usually
// reads fine on its own. A short gloss goes ahead of the raw wording
// only for these.
const PAPERWORK = ['Conditions / information', 'Minor change', 'Variation of conditions', 'Certificate of lawfulness'];
const PAPERWORK_GLOSS = {
  'Conditions / information': 'Follow-up paperwork on an already-approved project',
  'Minor change': 'A small change to an already-approved project',
  'Variation of conditions': 'Changing the conditions on an already-approved permission',
  'Certificate of lawfulness': 'Confirming something is lawful — not new building work'
};
// The prominent "Applying for" text on a register row. For an ordinary
// full application the register's own wording is clear enough on its
// own. For paperwork types it isn't (see PAPERWORK above), so a plain
// one-line gloss — the market estimate's own description where one
// exists, else a generic fallback — goes ahead of it, with the raw
// wording kept but demoted to secondary weight rather than dropped.
function whatThisIsHtml(a){
  const t = timings && timings.byRef.get(a.ref);
  const work = t && t.work;
  const raw = esc(a.description || 'No description on the register');
  if (!PAPERWORK.includes(work)) return raw;
  const est = typeof MARKET !== 'undefined' ? MARKET.estimates.get(a.ref) : null;
  const gloss = (est && est.what) || PAPERWORK_GLOSS[work];
  return `<div class="reg-work-gloss">${esc(gloss)}</div><div class="reg-work-raw">${raw}</div>`;
}
function outcomeStats(work, type){
  if (!timings) return null;
  const since = new Date(Date.now() - 730 * DAY_MS);
  const pool = timings.rows.filter(r => r.decided && r.decided >= since && r.outcome);
  for (const [basis, pick] of [[work, r => r.work === work], [type, r => r.type === type]]) {

}
// ---- Further details: the same job's other applications ----

const REL_REF_RE = /(?<!\d)\d{2}\/\d{5}\/[A-Z]{1,4}\b/g;

    const F = d.fields || [], at = n => F.indexOf(n), idx = { rec: new Map(), site: new Map(), applicant: new Map(), mentions: new Map() };
    const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };

function relatedFor(a){

    const up = relIdx.rec.get(parents[i]);

  }
  parents.forEach(m => add(m, 'mentioned'));
  (relIdx.mentions.get(a.ref) || []).forEach(c => add(c, 'follow-on'));
  parents.forEach(m => (relIdx.mentions.get(m) || []).forEach(c => add(c, 'sibling')));
  (relIdx.site.get(relSiteKey(a.address)) || []).forEach(s => add(s, 'same site'));
  const t = timings && timings.byRef.get(a.ref);

function relatedListHtml(a){

      <div>${esc(rec.description)}</div>${rec.keyVal ? `<div class="reg-links">${drawingsLinkHtml(rec.keyVal)}</div>` : ''}</li>`).join('')}

function relatedHtml(a){

// Paperwork on an earlier permission (conditions, minor changes) names the original application;
// its estimate is the one that matters, so rows and letters use that.
// Follow-ons left unpriced because their value is counted under the original ("valued under

function parentRefOf(a){
  const t = timings && timings.byRef.get(a.ref);

  if (work === 'Certificate of lawfulness') return null;
  const named = ((a.description || '').match(REL_REF_RE) || []).filter(r => r !== a.ref);
  if (work && PAPERWORK.includes(work)) return named[0] || null;
  const own = typeof MARKET !== 'undefined' ? MARKET.estimates.get(a.ref) : null;
  if (!own || own.total) return null;
  const under = (own.why || '').match(/valued under (\d{2}\/\d{5}\/[A-Z]{1,4})/i);

// "Original application 19/01234/B: applied 3 Mar 2019, approved 10 Jun 2019."
// `row` is the paperwork itself (register app or folder lead): recent paperwork on a permission
// says more about whether the build has started than the age of the permission does.
function originalLineHtml(ref, row){
  if (!ref) return '';
  const t = timings && timings.byRef.get(ref);
  const rec = relIdx && relIdx.rec.get(ref);
  const day = d => d ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
  if (!t) return `<div class="est-orig">Original application <b>${esc(ref)}</b> is older than the history held; the Monday run looks it up on the register.</div>`;
  const verb = { approved: 'approved', refused: 'refused', withdrawn: 'withdrawn' }[t.outcome] || 'decided';
  const months = t.decided ? Math.round((Date.now() - t.decided) / (30.44 * 86400000)) : null;
  const ago = months == null ? '' : months < 1 ? ' (this month)' : months < 24 ? ` (${months} month${months === 1 ? '' : 's'} ago)` : ` (${Math.round(months / 12)} years ago)`;
  const decided = t.decided ? `${verb} ${day(t.decided)}${ago}` : 'not decided yet';
  const own = row ? (regDate(row.decisionDate || row.decidedDate) || regDate(row.received || row.appliedDate)) : null;
  const ownRecent = own && (Date.now() - own) < 183 * DAY_MS;
  const ownWork = row && timings && timings.byRef.get(row.ref) ? timings.byRef.get(row.ref).work : '';
  // How long after the approval this paperwork came in. Conditions cleared soon after approval
  // usually come before a start; changes or conditions a long while after often mean the job is
  // already going and the design is being adjusted as it goes (Ash, 26 Sep 2026).
  const gapMonths = own && t.decided ? Math.round((own - t.decided) / (30.44 * DAY_MS)) : null;
  const isChange = ['Minor change', 'Variation of conditions'].includes(ownWork);
  const hint = !t.decided ? 'The original is still waiting for a decision, so nothing has started.'
    : t.outcome !== 'approved' ? ''
    : isChange ? `This is a change to the approved scheme${gapMonths != null ? `, ${gapMonths} months after approval` : ''}. Designs often change once a job is going, so it is <b>probably already under way</b> and they may have a builder.`
    : ownWork === 'Conditions / information' && gapMonths != null && gapMonths <= 6 ? `Conditions being cleared ${gapMonths <= 1 ? 'straight after' : gapMonths + ' months after'} approval. Many have to be cleared before work starts, so it is <b>probably just before the build starts</b>: a good time to write.`
    : ownWork === 'Conditions / information' && gapMonths != null ? `Conditions still being cleared ${gapMonths} months after approval. It <b>may already be under way</b> (some conditions are cleared during the build), or it has been slow to start. Worth a check.`
    : months <= 9 ? 'Approved recently, so the build <b>may be about to start</b>: a good time to write.'
    : 'Approved a while ago, so the work <b>may already be under way or done</b>, and they may already have a builder. Worth a check before writing.';
  return `<div class="est-orig"><b style="color:var(--text)">Original application ${esc(ref)} started ${day(t.received) || '(date not known)'}</b>, ${decided}.${rec && rec.description ? ` ${esc(rec.description)}.` : ''} ${hint}</div>`;
}

// Who's behind it, in one line (Ash, 26 Sep 2026): who it's for (the original applicant for

function plainEnglishHtml(a){

// How good the forecasts are. Back-test: re-run the method as it would
// have stood on each application's received date, over applications
// received 6-12 months ago. Live: forecasts locked in by the weekly pull

let accuracyCache = null;

}
function computeForecastAccuracy(){
  const score = errs => errs.length ? { n: errs.length, within14: Math.round(100 * errs.filter(e => Math.abs(e) <= 14).length / errs.length), medianMiss: Math.round(summarise(errs.map(Math.abs)).median) } : null;

  let back = null;

    const now = Date.now();
    const test = timings.rows.filter(r => r.vdays != null && r.received && now - r.received >= 183 * DAY_MS && now - r.received < 365 * DAY_MS && !ADMIN_WORK.includes(r.work));
    const cache = new Map(), errs = [];
    test.forEach(r => {
      const key = `${r.work}|${r.type}|${r.received.toISOString().slice(0, 7)}`;
      if (!cache.has(key)) cache.set(key, typicalFor(r.work, r.type, r.received, 'vdays'));
      const typ = cache.get(key);
      if (typ) errs.push(r.vdays - Math.round(typ.days));

// Where the pulled 5-year history really starts: the first month with a proper number of
// decisions. Old originals looked up one by one for paperwork rows (some from 2005) sit in the
// same history and must not stretch "everything pulled" or skew the averages.
function historyStart(){
  if (!timings) return null;
  if (timings.start !== undefined) return timings.start;
  const perMonth = new Map();
  timings.rows.forEach(r => { if (r.decided && !r.original) { const k = r.decided.getFullYear() * 12 + r.decided.getMonth(); perMonth.set(k, (perMonth.get(k) || 0) + 1); } });
  const k = [...perMonth].filter(([, n]) => n >= 20).map(([m]) => m).sort((a, b) => a - b)[0];
  return timings.start = k == null ? null : new Date(Math.floor(k / 12), k % 12, 1);

function renderTimingPanel(el){
  if (!timings || !timings.rows.length) {

    return;
  }
  const range = state.timingRange || '365';
  const withAdmin = !!state.timingAdmin;
  const since = range === 'all' ? historyStart() : new Date(Date.now() - Number(range) * DAY_MS);
  const rows = timings.rows.filter(r => r.days != null && !r.original && (!since || r.decided >= since) && (withAdmin || !ADMIN_WORK.includes(r.work)));
  const all = summarise(rows.map(r => r.days));
  const first = rows.reduce((m, r) => !m || r.decided < m ? r.decided : m, null);
  const ranges = [['365', 'last 12 months'], ['730', 'last 2 years'], ['1095', 'last 3 years'], ['1826', 'last 5 years'], ['all', 'everything pulled']];
  // Click a heading to sort by it; click again to reverse (Ash, 26 Sep 2026).
  const tsort = state.tsort || { key: 'n', dir: -1 };
  const TSORT = { name: x => x[0], n: x => x[1].n, median: x => x[1].median, mean: x => x[1].mean, mode: x => x[1].modeWeeks, spread: x => x[1].p75 - x[1].p25 };
  const th = (key, label) => `<th><button type="button" class="srt${tsort.key === key ? ' on' : ''}" data-tsort="${key}">${label}${tsort.key === key ? (tsort.dir > 0 ? ' &#9650;' : ' &#9660;') : ''}</button></th>`;
  const table = (title, keyFn) => {
    const groups = new Map();
    rows.forEach(r => { const k = keyFn(r) || 'Not stated'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r.days); });
    const val = TSORT[tsort.key];
    const list = [...groups].map(([k, ds]) => [k, summarise(ds)]).filter(([, st]) => st.n >= 3)
      .sort((a, b) => { const x = val(a), y = val(b); return (typeof x === 'string' ? x.localeCompare(y) : x - y) * tsort.dir; });
    const line = (k, st, cls) => `<tr${cls ? ` class="${cls}"` : ''}><td>${k}</td><td>${st.n.toLocaleString('en-GB')}</td><td><b>${fmtWeeks(st.median)}</b></td><td>${fmtWeeks(st.mean)}</td><td>${st.modeWeeks} wks</td><td>${fmtWeeks(st.p25)} &ndash; ${fmtWeeks(st.p75)}</td></tr>`;
    const hidden = [...groups.values()].filter(ds => ds.length < 3).reduce((n, ds) => n + ds.length, 0);
    return `<h4 class="tstats-h">${title}</h4><table class="leads tstats"><thead><tr>${th('name', 'Type')}${th('n', 'Decisions')}${th('median', 'Median (typical)')}${th('mean', 'Mean (average)')}${th('mode', 'Mode (most common)')}${th('spread', 'Middle half (normal range)')}</tr></thead>
      <tbody>${list.map(([k, st]) => line(esc(k), st)).join('')}${all ? line(`All types together${hidden ? ` <span class="hint" style="margin:0">(incl. ${hidden} in groups too small to list)</span>` : ''}`, all, 'total') : ''}</tbody></table>`;
  };
  const acc = state.timingOpen ? forecastAccuracy() : null;
  const whoHtml = state.timingOpen ? whoAppliesHtml() : '';
  const accLine = s => s ? `<b>${s.within14}%</b> within 2 weeks of the forecast &middot; typical miss ${s.medianMiss} days &middot; ${s.n} applications` : '';
  const oldest = historyStart();
  el.innerHTML = `
    <div class="tp-head">

      <select id="tRange" class="f-move" title="Everything pulled = every decision we hold, back to ${oldest ? esc(fmtDay(oldest)) : 'the start of the history'}">${ranges.map(([v, t]) => `<option value="${v}" ${v === range ? 'selected' : ''}>${t}</option>`).join('')}</select>
      ${all ? `<span class="tp-sum">Typical <b>${fmtWeeks(all.median)}</b> &middot; average ${fmtWeeks(all.mean)} &middot; most common ${all.modeWeeks} wks &middot; normal range ${fmtWeeks(all.p25)} to ${fmtWeeks(all.p75)} &middot; <b>${all.n.toLocaleString('en-GB')}</b> decisions</span>` : '<span class="hint" style="margin:0">No decisions in this range.</span>'}
    </div>
    ${!state.timingOpen ? '<div class="hint" style="margin:6px 0 0">Click the button for the breakdown by type of work, and who gets approved most and fastest.</div>' : ''}
    ${state.timingOpen ? `
    <div class="tstats-body">
      <label class="hint" style="margin:8px 0 0;display:block"><input type="checkbox" id="tAdmin" ${withAdmin ? 'checked' : ''}> Include condition discharges, minor changes &amp; lawfulness certificates (quick admin decisions, left out by default)</label>
      <div class="tp-explain">
        <b>What period this covers:</b> ${all ? all.n.toLocaleString('en-GB') : 0} decisions from the public planning register${first ? `, decided ${fmtDay(first)} to now` : ''}. "Everything pulled" is all the history we hold, which goes back 5 years, to ${oldest ? esc(oldest.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })) : 'the start'}. The register itself goes back further (applications from 2008 are on it), so older years can be added if wanted; each 5 years takes a few hours to pull.<br>
        <b>How it's measured:</b> from the day the application was received to the day the decision was issued.<br><br>
        <b>The averages, simply.</b> Imagine lining up every decision from quickest to slowest.<br>
        &bull; <b>Median = the typical one.</b> The one standing in the middle of the line: half were quicker, half were slower. <i>This is the one to use.</i><br>
        &bull; <b>Mean = the ordinary average.</b> Add all the times up and divide by how many there are. A few applications take years, and they drag this number up, so it's usually higher than the median.<br>

        &bull; <b>Middle half = the normal range.</b> Take away the quickest quarter and the slowest quarter of the line. What's left is the normal range: "7 to 15 weeks" means most ordinary applications land in there, 1 in 4 is quicker and 1 in 4 is slower.<br>

        Click any column heading in the tables to sort by it; click again to flip the order.<br>
      </div>
      <div class="hint" style="margin:10px 0">
        <b>Forecasts:</b> each pending application gets the median time <i>from validation</i> (the day the register accepted it as complete) for its kind of work over the last 2 years &mdash; or its official application type, then all applications, if fewer than 10 decisions. The weekly pull locks each forecast in on the day it's made, so it can be scored honestly when the decision lands. Planning decisions vary a lot, so treat a forecast date as the middle of a range, not a promise.<br>
        <b>Worth knowing:</b> who decides matters more than anything &mdash; Planning Committee decisions take about twice as long as officer decisions &mdash; but the register only says who decides once it's decided, so forecasts can't use it.
      </div>
      <div class="hint" style="margin:0 0 6px"><b>Forecast accuracy</b><br>
        Back-test (the method re-run as it would have stood at the time, on applications received 6&ndash;12 months ago): ${acc && acc.back ? accLine(acc.back) : 'not enough data yet'}<br>
        Live score (forecasts locked in by the weekly pull, now decided): ${acc && acc.live ? accLine(acc.live) : 'none come due yet &mdash; this fills in week by week'}
      </div>
      ${table('By kind of work (read from the description)', r => r.work)}
      ${table('By official application type', r => r.type)}
      ${table('By who decided it', r => r.level)}
      ${table('By outcome', r => r.outcome)}
      ${whoHtml}
      ${rows.some(r => r.complexity) ? table("By complexity (Claude's reading: 1 trivial &ndash; 5 major)", r => r.complexity ? `${r.complexity} — ${['', 'trivial', 'minor', 'substantial', 'significant', 'major'][r.complexity]}` : null) : ''}
    </div>` : ''}`;
  el.querySelector('#tRange').addEventListener('change', e => { state.timingRange = e.target.value; renderTimingPanel(el); });
  el.querySelector('#tToggle').addEventListener('click', () => { state.timingOpen = !state.timingOpen; renderTimingPanel(el); });
  const adm = el.querySelector('#tAdmin');
  if (adm) adm.addEventListener('change', e => { state.timingAdmin = e.target.checked; renderTimingPanel(el); });
  el.querySelectorAll('[data-tsort]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.tsort, cur = state.tsort || { key: 'n', dir: -1 };
    state.tsort = cur.key === k ? { key: k, dir: -cur.dir } : { key: k, dir: k === 'name' ? 1 : k === 'n' ? -1 : 1 };
    renderTimingPanel(el);
  }));
  wireWhoApplies(el);
}

// ---- Who applies most: agents (architects, designers) and developers ----
const DETAILS_URL = 'register-data/details.json';
let detailsPromise = null;
function loadDetails(){
  if (!detailsPromise) detailsPromise = privateJson(DETAILS_URL, DETAILS_URL).catch(() => ({ apps: {} }));
  return detailsPromise;
}
const whoKey = (kind, r) => kind === 'agents'
  ? (r.agent || '').toLowerCase().replace(/\b(ltd|limited|llp|plc)\b\.?/g, '').replace(/[^a-z0-9]+/g, '')
  : (r.applicant ? r.applicantKey : '');
const neverContact = name => STANDING_EXCLUDE.find(n => (name || '').toLowerCase().includes(n));
const whoName = (kind, r) => kind === 'agents' ? r.agent : r.applicant;

// Lower bound of the 95% confidence range for an approval rate (Wilson score): 3 out of 3 is
// "at least 44%", 270 out of 300 is "at least 86%", so small samples can't top the table by luck.
function wilsonLow(k, n){
  if (!n) return null;
  const z = 1.96, p = k / n, z2 = z * z;
  return (p + z2 / (2 * n) - z * Math.sqrt(p * (1 - p) / n + z2 / (4 * n * n))) / (1 + z2 / n);
}
const medianOf = xs => { if (!xs.length) return null; const s = xs.slice().sort((a, b) => a - b), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
let whoDetails = null;
const WHO_WORDS = ['window', 'door', 'extension', 'alteration', 'dormer', 'garage', 'change of use', 'dwelling', 'conversion', 'demolition'];

// Who applies most, scored like an analyst would (Ash, 26 Sep 2026): volume, approval rate, how
// sure we can be of it, speed against the normal time for the same kind of work, one overall
// score, and a flag when one freak application skews someone's figures. Filter by kind of work
// or by a word in the description (e.g. "window"), so the best person for that job rises to the top.
function whoAppliesHtml(){
  const kind = state.whoKind || 'agents';
  const q = (state.whoSearch || '').trim().toLowerCase();
  const repeatOnly = state.whoRepeat !== false;
  const workSel = state.whoWork || 'all';
  const kw = (state.whoKw || '').trim().toLowerCase();
  if (kw && !whoDetails) loadDetails().then(d => { whoDetails = d; const el = document.getElementById('timingPanel'); if (el) renderTimingPanel(el); });
  const desc = ref => whoDetails ? (((whoDetails.apps || {})[ref] || [])[0] || '').toLowerCase() : '';
  // Every application in the range counts, pending ones included.
  const since = state.timingRange === 'all' ? historyStart() : new Date(Date.now() - Number(state.timingRange || '365') * DAY_MS);
  const inRange = timings.rows.filter(r => !r.original && (!since || (r.decided || r.received) >= since));
  const works = [...new Set(inRange.map(r => r.work).filter(Boolean))].sort();
  const pool = inRange.filter(r => (workSel === 'all' || r.work === workSel) && (!kw || (whoDetails && desc(r.ref).includes(kw))));

  // The normal time for each kind of work, so someone doing big schemes isn't marked slow.
  const byWork = new Map();
  pool.forEach(r => { if (r.days != null) { if (!byWork.has(r.work)) byWork.set(r.work, []); byWork.get(r.work).push(r.days); } });
  const normal = new Map([...byWork].map(([w, ds]) => [w, medianOf(ds)]));

  const measure = apps => {
    const approved = apps.filter(a => a.outcome === 'approved').length;
    const refused = apps.filter(a => a.outcome === 'refused').length;
    const withdrawn = apps.filter(a => a.outcome === 'withdrawn').length;
    const judged = approved + refused;
    const decided = apps.filter(a => a.days != null);
    const ratios = decided.filter(a => normal.get(a.work)).map(a => ({ a, r: a.days / normal.get(a.work) }));
    const ratioMed = medianOf(ratios.map(x => x.r));
    // Pulled towards "normal speed" when there are only a few decisions to go on.
    const speed = ratioMed == null ? null : (ratios.length * ratioMed + 5) / (ratios.length + 5);
    const low = wilsonLow(approved, judged);
    const speedPts = speed == null ? 50 : Math.max(0, Math.min(100, (1.5 - speed) * 100));
    const workCount = new Map();
    apps.forEach(a => workCount.set(a.work, (workCount.get(a.work) || 0) + 1));
    const main = [...workCount].sort((x, y) => y[1] - x[1])[0];
    return {
      n: apps.length, approved, refused, withdrawn, judged,
      rate: judged ? approved / judged : null, low,
      median: decided.length ? medianOf(decided.map(a => a.days)) : null,
      speed, outliers: ratios.filter(x => x.r > 3).map(x => x.a),
      score: judged >= 5 && low != null ? Math.round(0.7 * low * 100 + 0.3 * speedPts) : null,
      latest: apps.reduce((m, a) => !m || a.received > m ? a.received : m, null),
      main: main ? { work: main[0], share: Math.round(100 * main[1] / apps.length) } : null
    };
  };

  const groups = new Map();
  pool.forEach(r => {
    const k = whoKey(kind, r);
    if (!k) return;
    if (!groups.has(k)) groups.set(k, { key: k, name: whoName(kind, r), apps: [] });
    groups.get(k).apps.push(r);
  });
  let list = [...groups.values()];
  const total = list.length;
  if (repeatOnly) list = list.filter(g => g.apps.length >= 2);
  if (q) list = list.filter(g => g.name.toLowerCase().includes(q));
  list.forEach(g => { g.m = measure(g.apps); });
  const base = measure(pool);

  const sort = state.whoSort || { key: 'n', dir: -1 };
  const SORT = { name: g => g.name.toLowerCase(), n: g => g.m.n, latest: g => g.m.latest ? +g.m.latest : 0, rate: g => g.m.rate, low: g => g.m.low,
                 median: g => g.m.median, speed: g => g.m.speed, score: g => g.m.score };
  const val = SORT[sort.key] || SORT.n;
  list.sort((a, b) => {
    const x = val(a), y = val(b);
    if (x == null && y == null) return b.m.n - a.m.n;
    if (x == null) return 1;
    if (y == null) return -1;
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * sort.dir || b.m.n - a.m.n;
  });

  const pct = x => x == null ? '&ndash;' : Math.round(x * 100) + '%';
  const speedTxt = sp => sp == null ? '&ndash;' : Math.abs(sp - 1) < 0.05 ? 'about normal'
    : sp < 1 ? `<span class="who-good">${Math.round((1 - sp) * 100)}% quicker</span>` : `<span class="who-bad">${Math.round((sp - 1) * 100)}% slower</span>`;
  const day = d => d ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: '2-digit' }) : '';
  const th = (key, label, title) => `<th title="${title || ''}"><button type="button" class="srt${sort.key === key ? ' on' : ''}" data-wsort="${key}">${label}${sort.key === key ? (sort.dir > 0 ? ' &#9650;' : ' &#9660;') : ''}</button></th>`;
  const limit = state.whoLimit || 40;
  const cells = (m, nameCell) => `<td>${nameCell}</td>
      <td><b>${m.n}</b><div class="hint" style="margin:0">latest ${day(m.latest)}</div></td>
      <td>${m.approved} &#10003; &middot; ${m.refused} &#10007;${m.withdrawn ? ` &middot; ${m.withdrawn} withdrawn` : ''}</td>
      <td><b>${pct(m.rate)}</b></td>
      <td>${m.low == null ? '&ndash;' : `at least ${pct(m.low)}`}</td>
      <td>${m.median != null ? fmtWeeks(m.median) : '&ndash;'}</td>
      <td>${speedTxt(m.speed)}</td>
      <td>${m.score == null ? '<span class="hint" style="margin:0" title="Fewer than 5 decided">too few</span>' : `<span class="who-score">${m.score}</span>`}${m.outliers.length ? ` <span class="tag tag-review" title="${esc(m.outliers.map(a => `${a.ref}: ${fmtWeeks(a.days)}`).join('; '))}. Typical time uses the middle value, so one freak case doesn't drag it.">&#9888; ${m.outliers.length} unusually slow</span>` : ''}</td>`;
  const bodyRows = list.slice(0, limit).map(g => {
    const open = state.whoOpen === g.key;
    return `<tr class="who-row" data-key="${esc(g.key)}">${cells(g.m, `<button type="button" class="link-btn who-name" data-key="${esc(g.key)}">${open ? '&#9662;' : '&#9656;'} ${esc(g.name)}</button>${neverContact(g.name) ? ' <span class="tag tag-excl">never contact</span>' : ''}${g.m.main ? `<div class="hint" style="margin:0">mostly ${esc(g.m.main.work)} (${g.m.main.share}%)</div>` : ''}`)}</tr>`
      + (open ? `<tr><td colspan="8"><div id="whoDetail" class="f-edit-panel"><span class="hint" style="margin:0">Loading their applications&hellip;</span></div></td></tr>` : '');
  }).join('');
  return `
    <h4 class="tstats-h">Who applies most, and who gets approved</h4>
    <div class="row-actions" style="margin-bottom:8px">
      <select id="whoKind" class="f-move">
        <option value="agents" ${kind === 'agents' ? 'selected' : ''}>Agents (architects, designers, planning consultants)</option>
        <option value="applicants" ${kind === 'applicants' ? 'selected' : ''}>Applicants (developers &amp; repeat applicants)</option>
      </select>
      <select id="whoWork" class="f-move" title="Only count this kind of work">
        <option value="all">All kinds of work</option>
        ${works.map(w => `<option value="${esc(w)}" ${workSel === w ? 'selected' : ''}>${esc(w)}</option>`).join('')}
      </select>
      <input type="text" id="whoSearch" class="f-move" placeholder="Search a name&hellip;" value="${esc(state.whoSearch || '')}" style="min-width:160px">
      <label class="hint" style="margin:0"><input type="checkbox" id="whoRepeat" ${repeatOnly ? 'checked' : ''}> only those with 2 or more</label>
    </div>
    <div class="who-chips"><span class="hint" style="margin:0">Only applications mentioning:</span>
      ${WHO_WORDS.map(w => `<button type="button" data-wkw="${esc(w)}" class="${kw === w ? 'on' : ''}">${esc(w)}</button>`).join('')}
      <input type="text" id="whoKw" class="f-move" placeholder="or type a word&hellip;" value="${esc(state.whoKw || '')}" style="min-width:130px">
      ${kw ? '<button type="button" data-wkw="">clear</button>' : ''}
      ${kw && !whoDetails ? '<span class="hint" style="margin:0">loading descriptions&hellip;</span>' : ''}
    </div>
    <details class="hint" style="margin:0 0 8px"><summary style="cursor:pointer">How to read this table</summary>
      <div class="tp-explain">
        <b>Approved</b>: approved &divide; (approved + refused). Withdrawn ones are shown but don't count against them.<br>
        <b>Likely success</b>: how sure we can be of that rate. Someone with 3 out of 3 approved is 100%, but it could be luck; we can only say they'd get <i>at least 44%</i>. Someone with 270 out of 300 is <i>at least 86%</i>. So this column stops a handful of lucky applications beating a proven track record.<br>
        <b>Typical time</b>: the middle time to a decision (median), in weeks.<br>
        <b>Speed</b>: their times compared with the normal time for the <i>same kind of work</i>, so an architect doing big schemes isn't marked slow next to someone doing porches. With only a few decisions it's pulled towards "normal".<br>
        <b>Score (0 to 100)</b>: 70% likely success + 30% speed. Needs at least 5 decided applications. It's the quickest way to find who's most likely to get a job through, and quickly.<br>
        <b>&#9888; unusually slow</b>: applications that took over 3 times the normal time. Hover to see which. The typical time uses the middle value, so one freak case doesn't drag it down.<br>
        Filter by kind of work or a word (e.g. "change of use", "window") and every figure is worked out for just those applications, so you see who's best at that particular job.
      </div>
    </details>
    <p class="hint" style="margin:0 0 6px">${list.length.toLocaleString('en-GB')} shown of ${total.toLocaleString('en-GB')} ${kind === 'agents' ? 'agents' : 'named applicants'}${workSel !== 'all' ? ` for ${esc(workSel)}` : ''}${kw ? ` mentioning "${esc(kw)}"` : ''} in this date range. Click a heading to sort, again to flip. Click a name for everything they've been involved in.${kind === 'applicants' ? ' Private individuals are only named once they have applied more than once.' : ''}</p>
    <table class="leads tstats"><thead><tr>
      ${th('name', 'Name')}${th('n', 'Applications', 'Click Latest to sort by date instead')}
      <th>Decisions</th>${th('rate', 'Approved')}${th('low', 'Likely success', 'The approval rate we can be 95% sure of, given how many they have done')}
      ${th('median', 'Typical time')}${th('speed', 'Speed vs normal')}${th('score', 'Score')}
    </tr>
    <tr><th></th><th><button type="button" class="srt${sort.key === 'latest' ? ' on' : ''}" data-wsort="latest" style="font-size:0.72rem">sort by latest${sort.key === 'latest' ? (sort.dir > 0 ? ' &#9650;' : ' &#9660;') : ''}</button></th><th colspan="6"></th></tr></thead>
    <tbody>${pool.length ? `<tr class="base">${cells(base, 'Everyone together (for comparison)')}</tr>` : ''}${bodyRows}</tbody></table>
    ${list.length > limit ? `<button type="button" class="link-btn" id="whoMore">show ${Math.min(40, list.length - limit)} more</button>` : ''}`;
}

function addBusinessLead(o){
  const log = getLog(), archived = getDismissed();
  if (leads.some(l => l.ref === o.ref) || log[o.ref] || archived[o.ref]) return false;
  const site = [o.name && o.company && o.name !== o.company ? o.company : '', o.address || ''].filter(Boolean).join(', ');
  const lead = classify({ ref: o.ref, applicant: o.name || o.company, site });
  Object.assign(lead, { type: 'Company', source: 'business', folder: 'business', include: false, addedAt: todayISO(), description: o.description || '' });
  flagSamePractice([lead]);
  leads.push(lead);
  saveLeadsToStorage();
  updateNavCounts();
  return true;
}

function renderWhoDetail(el){
  const box = el.querySelector('#whoDetail');
  if (!box) return;
  const kind = state.whoKind || 'agents';
  const apps = timings.rows.filter(r => !r.original && whoKey(kind, r) === state.whoOpen).sort((a, b) => (b.received || 0) - (a.received || 0));
  // A value on every application (Ash, 26 Sep 2026): the estimate where it's been priced, otherwise
  // the typical value for that kind of work (marked ≈), paperwork left out; totals by year below.
  const PAPER = ['Conditions / information', 'Minor change', 'Certificate of lawfulness', 'Variation of conditions'];
  const typ = typeof typicalValues === 'function' ? typicalValues() : new Map();
  const valueOf = a => {
    if (PAPER.includes(a.work)) return { kind: 'paper' };
    const e = typeof MARKET !== 'undefined' ? MARKET.estimates.get(a.ref) : null;
    if (e && e.total) return { kind: 'priced', job: midOf(e.total), gw: e.groundworks ? midOf(e.groundworks) : 0, e };
    if (e) return { kind: 'none', why: e.why || 'not priced' };
    const t = typ.get(a.work);
    return t ? { kind: 'typical', job: t.job, gw: t.gw || 0 } : { kind: 'unknown' };
  };
  const valueCell = a => {
    const v = valueOf(a);
    return v.kind === 'priced' ? `<button type="button" class="prof-name" data-profile="${esc(a.ref)}">${moneyRange(v.e.total)}</button>${v.e.groundworks ? `<div class="hint" style="margin:0">groundworks ${moneyRange(v.e.groundworks)}</div>` : ''}`
      : v.kind === 'typical' ? `<span class="hint" style="margin:0" title="Not priced individually: the typical value for ${esc(a.work || '')}">&asymp; ${money(v.job)} typical</span>`
      : v.kind === 'paper' ? '<span class="hint" style="margin:0" title="Paperwork on an earlier permission: its value is counted under the original">paperwork</span>'
      : v.kind === 'none' ? `<span class="hint" style="margin:0" title="${esc(v.why)}">not priced</span>` : '';
  };
  const pipeline = () => {
    const vals = apps.map(a => ({ a, v: valueOf(a) }));
    const counted = vals.filter(x => x.v.kind === 'priced' || x.v.kind === 'typical');
    if (!counted.length) return '';
    const sum = xs => xs.reduce((n, x) => n + x.v.job, 0), sumGw = xs => xs.reduce((n, x) => n + (x.v.gw || 0), 0);
    const byYear = new Map();
    counted.forEach(x => { const y = x.a.received ? x.a.received.getFullYear() : 'date unknown'; if (!byYear.has(y)) byYear.set(y, []); byYear.get(y).push(x); });
    const dated = counted.filter(x => x.a.received).map(x => +x.a.received);
    const years = dated.length ? Math.max(1, Math.round((Math.max(...dated) - Math.min(...dated)) / (365.25 * DAY_MS) * 10) / 10) : 1;
    const priced = counted.filter(x => x.v.kind === 'priced').length, typical = counted.length - priced;
    const paper = vals.filter(x => x.v.kind === 'paper').length;
    const toPrice = vals.filter(x => x.v.kind === 'typical' || x.v.kind === 'unknown').map(x => x.a.ref);
    return `<div class="tp-explain" style="margin-top:10px">
      <b>Their pipeline: roughly ${money(sum(counted))} of building work across ${counted.length} projects</b> in ${years} year${years === 1 ? '' : 's'}, about <b>${money(sum(counted) / years)} a year</b>; the groundworks and drainage part roughly ${money(sumGw(counted))}.<br>
      By year: ${[...byYear].sort((x, y) => String(y[0]).localeCompare(String(x[0]))).map(([y, xs]) => `<b>${y}</b> ${money(sum(xs))} (${xs.length})`).join(' &middot; ')}<br>
      <span class="hint" style="margin:0">${priced} priced individually; ${typical} at the typical value for that kind of work (marked &asymp;, a rough guide only)${paper ? `; ${paper} paperwork left out (counted under the original)` : ''}. Pending applications are included. Click a value or reference for the full profile.</span>
      ${toPrice.length ? `<div style="margin-top:8px"><button type="button" class="btn-secondary" id="whoPriceBtn">Price the other ${toPrice.length} properly (about &pound;${Math.max(1, Math.round(toPrice.length * 0.04))})</button> <span id="whoPriceMsg" class="hint" style="margin:0"></span></div>` : ''}
    </div>`;
  };
  loadDetails().then(d => {
    const det = ref => (d.apps || {})[ref] || [];
    const latestDet = det(apps[0] && apps[0].ref);
    const name = whoName(kind, apps[0] || {}) || '';
    const people = [...new Set(apps.map(a => det(a.ref)[3]).filter(Boolean))];
    const company = latestDet[4] || '';
    const person = latestDet[3] || company || name;
    const bizRef = 'ARCH-' + slugify(person + '-' + company);
    const log = getLog(), archived = getDismissed();
    const status = log[bizRef] ? `Letter sent ${esc(prettyDate(log[bizRef].date))}` : leads.some(l => l.ref === bizRef) ? 'Already in Businesses' : archived[bizRef] ? 'Archived' : '';
    const q = encodeURIComponent(`${name} Isle of Man`);
    box.innerHTML = `
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
        <b style="color:var(--text)">${esc(name)}</b>
        <a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener" class="btn-secondary" style="padding:2px 8px;font-size:0.72rem;text-decoration:none">&#128269; Google them</a>
        ${neverContact(name) || neverContact(company) ? `<span class="tag tag-excl">On the never-contact list</span>` : status ? `<span class="tag tag-dupe">${status}</span>` : `<button type="button" class="btn-secondary" id="whoAddBiz" style="padding:2px 8px;font-size:0.72rem">+ Add as business</button>`}
        <span id="whoMsg" class="hint" style="margin:0"></span>
      </div>
      ${kind === 'agents' && people.length ? `<div class="hint" style="margin:0 0 4px">People: ${people.map(esc).join(', ')}</div>` : ''}
      ${latestDet[5] ? `<div class="hint" style="margin:0 0 8px">Address: ${esc(latestDet[5])}</div>` : ''}
      <table class="leads tstats"><thead><tr><th>Ref</th><th>Applied</th><th>Decided</th><th>Time</th><th>Outcome</th><th>Estimated value</th><th>What for</th></tr></thead><tbody>
      ${apps.map(a => { const x = det(a.ref); return `<tr>
        <td><button type="button" class="prof-name" data-profile="${esc(a.ref)}" title="Everything about this application">${esc(a.ref)}</button>${x[2] ? ` <a href="https://pbc.gov.im/online-applications/applicationDetails.do?activeTab=summary&amp;keyVal=${encodeURIComponent(x[2])}" target="_blank" rel="noopener" title="Open on the planning register">&#8599;</a>` : ''}</td>
        <td>${a.received ? esc(fmtDay(a.received)) : ''}</td>
        <td>${a.decided ? esc(fmtDay(a.decided)) : predictions[a.ref] ? '<span class="tag tag-review">pending</span>' : '<span class="hint" style="margin:0">date not given</span>'}</td>
        <td>${a.days != null ? fmtWeeks(a.days) : ''}</td>
        <td>${esc(x[7] || a.outcome || '')}</td>
        <td>${valueCell(a)}</td>
        <td><span class="tag tag-dupe">${esc(a.work || '')}</span> ${esc(x[0] || '')}<div class="hint" style="margin:2px 0 0">${esc(x[1] || '')}${kind === 'agents' && x[6] ? ` &middot; applicant: ${esc(x[6])}` : ''}${kind === 'applicants' && (x[4] || x[3]) ? ` &middot; agent: ${esc(x[4] || x[3])}` : ''}</div>${x[2] ? `<div class="hint" style="margin:2px 0 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap">${drawingsLinkHtml(x[2])}${siteExtentHtml(x[8])}</div>` : ''}</td>
      </tr>`; }).join('')}
      </tbody></table>
      ${pipeline()}`;
    const priceBtn = box.querySelector('#whoPriceBtn');
    if (priceBtn) priceBtn.addEventListener('click', async () => {
      const refs = apps.filter(a => { const v = valueOf(a); return v.kind === 'typical' || v.kind === 'unknown'; }).map(a => a.ref);
      priceBtn.disabled = true;
      const ok = await queueForPricing(refs);
      box.querySelector('#whoPriceMsg').textContent = ok ? `Added ${refs.length} to the pricing list. The Monday 7am run prices them (40 a week alongside new applications), or run a catch-up to do them straight away.` : 'Could not save the pricing list, try again.';
    });
    const add = box.querySelector('#whoAddBiz');
    if (add) add.addEventListener('click', () => {
      const ok = addBusinessLead({ ref: bizRef, name: person, company, address: latestDet[5], description: `${apps.length} planning applications on the register (latest ${apps[0] && apps[0].ref})` });
      box.querySelector('#whoMsg').textContent = ok ? `${person} added to the Businesses folder.` : 'Already in a folder, sent or archived.';
      if (ok) add.remove();
    });
  });
}

function wireWhoApplies(el){
  const kindSel = el.querySelector('#whoKind');
  if (!kindSel) return;
  const rerender = () => renderTimingPanel(el);
  kindSel.addEventListener('change', e => { state.whoKind = e.target.value; state.whoOpen = null; state.whoLimit = 40; rerender(); });
  el.querySelector('#whoRepeat').addEventListener('change', e => { state.whoRepeat = e.target.checked; rerender(); });
  const search = el.querySelector('#whoSearch');
  search.addEventListener('change', e => { state.whoSearch = e.target.value; rerender(); });
  const more = el.querySelector('#whoMore');
  if (more) more.addEventListener('click', () => { state.whoLimit = (state.whoLimit || 40) + 40; rerender(); });
  const work = el.querySelector('#whoWork');
  if (work) work.addEventListener('change', e => { state.whoWork = e.target.value; state.whoOpen = null; rerender(); });
  const kwIn = el.querySelector('#whoKw');
  if (kwIn) kwIn.addEventListener('change', e => { state.whoKw = e.target.value; state.whoOpen = null; rerender(); });
  el.querySelectorAll('[data-wkw]').forEach(b => b.addEventListener('click', () => { state.whoKw = state.whoKw === b.dataset.wkw ? '' : b.dataset.wkw; state.whoOpen = null; rerender(); }));
  // Click a heading to sort; click again to flip. Sensible first direction for each.
  const FIRST = { name: 1, n: -1, latest: -1, rate: -1, low: -1, median: 1, speed: 1, score: -1 };
  el.querySelectorAll('[data-wsort]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.wsort, cur = state.whoSort || { key: 'n', dir: -1 };
    state.whoSort = cur.key === k ? { key: k, dir: -cur.dir } : { key: k, dir: FIRST[k] || -1 };
    rerender();
  }));
  el.querySelectorAll('.who-name').forEach(b => b.addEventListener('click', () => {
    state.whoOpen = state.whoOpen === b.dataset.key ? null : b.dataset.key;
    rerender();
  }));
  renderWhoDetail(el);
}

// ---- Pull from the government planning register ----
// The register itself (pbc.gov.im) blocks cross-origin browser requests
// and only exposes the applicant/agent name per-application, so the
// actual scraping runs server-side as a GitHub Action (see
// scripts/pull_register.py + .github/workflows/pull-planning-register.yml)
// on a weekly schedule, or on demand from that workflow's "Run workflow"
// button. It commits register-data/latest.json into this same site, so
// the app just fetches it same-origin — no CORS issue.
const REGISTER_DATA_URL = 'register-data/latest.json';
const REGISTER_ACTIONS_URL = 'https://github.com/dgc-groundworks/dgc-ballasalla/actions/workflows/pull-planning-register.yml';

function renderRegisterPull(main){
  const box = document.createElement('div');
  box.className = 'register-pull';
  box.innerHTML = `<h3 class="lead-section-hdr">Pull from the planning register</h3><p class="hint">Loading the latest pull&hellip;</p>`;
  main.insertBefore(box, document.getElementById('pasteDetails'));

  loadTimings().then(() => { const el = document.getElementById('timingPanel'); if (el) renderTimingPanel(el); });
  Promise.all([privateJson(REGISTER_DATA_URL, REGISTER_DATA_URL), loadTimings()])
    .then(([data]) => renderRegisterPullLoaded(box, data))
    .catch(() => {
      box.innerHTML = `
        <h3 class="lead-section-hdr">Pull from the planning register</h3>
        <p class="hint">No register data has been pulled yet. It pulls automatically once a week, or you can trigger it right now from
