          <a href="${REGISTER_ACTIONS_URL}" target="_blank" rel="noopener">GitHub Actions &rarr; Run workflow</a> (takes a few minutes) — come back here and refresh once it's finished.</p>`;
    });
}

function renderRegisterPullLoaded(box, data){
  const apps = data.applications || [];
  const pulledDate = data.pulledAt ? new Date(data.pulledAt).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'unknown';
  let log = getLog();
  let dismissed = getDismissed();
  let showArchived = false;
  const expandedRefs = new Set();

  // The register just says "Decided" — the actual outcome (Permitted /
  // Refused / Withdrawn / etc.) is a separate field from the detail page.
  function decisionCategory(a){
    if (!a.isDecided) return 'pending';
    const d = (a.decision || '').toLowerCase();
    if (/permit|approv|grant/.test(d)) return 'approved';
    if (/refus|denied|reject/.test(d)) return 'refused';
    return 'other';
  }
  const CATEGORY_TAG = { pending: ['tag-review', 'Pending'], approved: ['tag-approved', 'Approved'], refused: ['tag-excl', 'Refused'], other: ['tag-dupe', null] };
  const CATEGORY_ORDER = { approved: 0, pending: 1, refused: 2, other: 3 };

  // Applicant, site or agent — any of them on the never-contact list.
  function standingHit(a){
    const hay = `${a.applicantName || ''} ${a.address || ''} ${a.agentName || ''} ${a.agentCompanyName || ''}`.toLowerCase();
    return STANDING_EXCLUDE.find(n => hay.includes(n)) || null;
  }

  const byRefApp = new Map(apps.map(a => [a.ref, a]));
  let relWait = false;
  function applyFilters(){
    const status = document.getElementById('regStatus').value;
    const when = document.getElementById('regWhen').value;
    const kind = document.getElementById('regKind').value;
    const whenSince = when === 'all' ? null : new Date(Date.now() - Number(when) * DAY_MS);
    const from = document.getElementById('regFrom').value;
    const to = document.getElementById('regTo').value;
    const q = document.getElementById('regSearch').value.trim().toLowerCase();
    return apps.filter(a => {
      if (!showArchived && dismissed[a.ref]) return false;
      if (status !== 'all' && decisionCategory(a) !== status) return false;
      if (kind !== 'all' && (isFollowUp(a) ? kind === 'new' : kind === 'follow')) return false;
      if (whenSince && !from && !to) { const rd = regDate(a.received); if (rd && rd < whenSince) return false; }
      const d = a.validated || a.received;
      const parsed = d ? new Date(d.replace(/^\w+\s/, '')) : null; // strip leading "Tue " etc
      if (from && parsed && parsed < new Date(from)) return false;
      if (to && parsed && parsed > new Date(to + 'T23:59:59')) return false;
      if (q) {
        const hay = `${a.ref} ${a.address} ${a.description} ${a.applicantName||''} ${a.agentName||''} ${a.agentCompanyName||''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    })
    .sort((x, y) => {
      const sort = document.getElementById('regSort').value;
      if (sort === 'name') return (x.applicantName || x.agentCompanyName || x.agentName || '').localeCompare(y.applicantName || y.agentCompanyName || y.agentName || '');
      if (sort !== 'new' && typeof estimateFor === 'function') {
        const v = a => { const e = estimateFor(a.ref, parentRefOf(a)); return e ? midOf(sort === 'gw' ? e.groundworks : e.total) : -1; };
        const d = v(y) - v(x);
        if (d) return d;
      }
      return CATEGORY_ORDER[decisionCategory(x)] - CATEGORY_ORDER[decisionCategory(y)] || (x.ref < y.ref ? 1 : -1);
    });
  }

  // Same ARCH-<slug> convention as the CSV business import, so one
  // architect reached via either route dedupes to a single record.
  function agentRef(a){
    const person = a.agentName || a.agentCompanyName;
    return person ? 'ARCH-' + slugify(person + '-' + (a.agentCompanyName || '')) : null;
  }
  const known = ref => leads.some(l => l.ref === ref) || !!log[ref] || !!dismissed[ref];

  function addRegisterAppToBatch(a, folder){
    if (known(a.ref)) return false;
    const applicant = a.applicantName || a.agentCompanyName || a.agentName || 'Applicant not available on register';
    const extraReviewNote = !a.applicantName ? 'Applicant name not on the public register — check before sending (agent shown instead).'
      : /\bdepartment\b|government|tynwald|manx care/i.test(applicant) ? 'Government body — DGC may already work with them. Check before sending.'
      : undefined;
    const lead = classify({ ref: a.ref, applicant, site: a.address || '', agentText: `${a.agentName || ''} ${a.agentCompanyName || ''}`, extraReviewNote });
    lead.planningStatus = decisionCategory(a);
    lead.folder = folder;
    lead.parentRef = parentRefOf(a) || '';
    lead.include = false;
    lead.addedAt = todayISO();
    lead.description = a.description || '';
    lead.appliedDate = a.received || '';
    lead.decidedDate = a.isDecided ? (a.decisionDate || '') : '';
    lead.keyVal = a.keyVal || '';
    lead.siteExtent = a.siteExtent || null;
    leads.push(lead);
    return true;
  }

  function addAgentToBatch(a){
    const aRef = agentRef(a);
    const person = a.agentName || a.agentCompanyName;
    if (!aRef || !person || known(aRef)) return false;
    const site = [a.agentName && a.agentCompanyName ? a.agentCompanyName : '', a.agentAddress || ''].filter(Boolean).join(', ');
    const lead = classify({ ref: aRef, applicant: person, site });
    lead.type = 'Company';
    lead.source = 'business';
    lead.folder = 'business';
    lead.include = false;
    lead.addedAt = todayISO();
    lead.description = `Agent on ${a.ref} — ${a.description || ''}`;
    lead.trade = (typeof guessTrade === 'function' && guessTrade(`${person} ${a.agentCompanyName || ''}`)) || 'Planning agent';
    leads.push(lead);
    return true;
  }

  function rowHtml(a, forceFull){
    const sent = log[a.ref];
    const inLead = leads.find(l => l.ref === a.ref);
    const arch = dismissed[a.ref];
    const hit = standingHit(a);
    const cat = decisionCategory(a);
    const person = a.applicantName || a.agentCompanyName || a.agentName || '(applicant not on register)';
    const full = true;   // full application always shown (Ash, 25 Sep 2026)
    const aRef = agentRef(a);
    const agentStatus = !aRef ? '' : log[aRef] ? 'Agent already sent a letter' : leads.some(l => l.ref === aRef) ? 'Agent already in Businesses' : dismissed[aRef] ? 'Agent archived' : '';
    const agentSearchQuery = encodeURIComponent(`${a.agentCompanyName || a.agentName} Isle of Man`);
    const agentLine = aRef ? `
        <div class="hint">Agent: ${esc(a.agentName || '')}${a.agentCompanyName ? ` (${esc(a.agentCompanyName)})` : ''}
          <a href="https://www.google.com/search?q=${agentSearchQuery}" target="_blank" rel="noopener" class="btn-secondary" style="margin-left:6px;padding:1px 7px;font-size:0.7rem;text-decoration:none;display:inline-block">&#128269; Google them</a>
          ${agentStatus
            ? `<span class="tag tag-dupe" style="margin-left:6px">${agentStatus}</span>`
            : `<button type="button" class="btn-secondary reg-add-agent-btn" data-ref="${esc(a.ref)}" style="margin-left:6px;padding:1px 7px;font-size:0.7rem">+ Add agent as business</button>`}
          ${a.agentAddress ? `<br><span style="opacity:.75">${esc(a.agentAddress)}</span>` : ''}
        </div>` : '';

    const before = !sent && typeof priorContacts === 'function'
      ? priorContacts({ ref: a.ref, applicant: person, recipientLines: [person, ...(a.address || '').split(',')], agentText: `${a.agentName || ''} ${a.agentCompanyName || ''}` }).filter(c => c.why !== 'also on the print list')
      : [];
    let actions;
    if (sent) {
      const p = predictions[a.ref];
      const actual = a.isDecided ? regDate(a.decisionDate) : null;
      const forecast = p ? regDate(p.predictedDate) : null;
      const diff = actual && forecast ? daysBetween(forecast, actual) : null;
      const follow = leads.find(l => l.baseRef === a.ref);
      actions = `<span class="tag tag-dupe" title="Already sent a letter — see Archive">Sent ${esc(prettyDate(sent.date))}${sent.copy ? ` &middot; ${FOLDERS[sent.copy] || sent.copy} letter` : ''}</span>`
        + `<div class="reg-actions" style="margin-top:6px">${follow ? `<span class="tag tag-approved">Follow-up in ${FOLDERS[leadFolder(follow)]}</span>`
          : `<button type="button" class="btn-secondary reg-followup" data-ref="${esc(a.ref)}" title="Keeps the first letter on record and puts a personalised follow-up in the Personalised folder">&#9998; Personalised follow-up</button>`}
          <button type="button" class="btn-secondary reg-unsend" data-ref="${esc(a.ref)}" title="Only if the letter never actually went out">&#8617; Undo &ldquo;sent&rdquo;</button></div>`
        + (sent.copy === 'pending' && actual ? `<div class="hint" style="margin:4px 0 0;text-align:right">You sent the pending letter ${esc(prettyDate(sent.date))}.<br>${forecast ? `Forecast &asymp; ${fmtDay(forecast)} &middot; ` : ''}decided ${fmtDay(actual)}${diff != null ? ` (${Math.abs(diff)} days ${diff > 0 ? 'later' : diff < 0 ? 'earlier' : '&mdash; spot on'})` : ''}</div>` : '');
    }
    else if (inLead) actions = `<span class="tag tag-approved">In ${FOLDERS[leadFolder(inLead)]}${inLead.include ? ' &middot; on the print list' : ''}</span>
          <div class="reg-actions" style="margin-top:6px">${leadFolder(inLead) !== 'personal' ? `<button type="button" class="btn-secondary reg-topersonal" data-ref="${esc(a.ref)}">&rarr; Personalised</button>` : ''}
          <button type="button" class="btn-secondary reg-undo" data-ref="${esc(a.ref)}" title="Takes it back out of the folder, so you can send it a different way">&#8617; Undo</button></div>`;
    else if (arch) actions = `<span class="tag tag-dupe">Archived ${esc(prettyDate(arch.date))}</span>
          <button type="button" class="btn-secondary reg-unarchive-btn" data-ref="${esc(a.ref)}">&#8617; Bring back</button>`;
    else {
      const sendBtn = (folder, text) => `<button type="button" class="btn-secondary reg-send-btn${cat === folder ? ' natural' : ''}" data-ref="${esc(a.ref)}" data-folder="${folder}">${text}</button>`;
      actions = hit
        ? `<span class="tag tag-excl" title="On the standing never-contact list">Never contact: ${esc(hit)}</span>
           <button type="button" class="btn-secondary reg-dismiss-btn" data-ref="${esc(a.ref)}">Archive</button>`
        : `<div class="reg-actions">
            ${sendBtn('business', 'Send as Business')}
            ${sendBtn('pending', 'Send as Pending')}
            ${sendBtn('approved', 'Send as Approved')}
            ${sendBtn('personal', 'Send as Personalised')}
            <button type="button" class="btn-secondary reg-dismiss-btn" data-ref="${esc(a.ref)}" title="Looked at it, not chasing it — goes to the Archive tab, where you can bring it back">Archive</button>
          </div>`;
    }
    return `
      <div class="lead-row">
        <div class="lr-main">
          <div class="reg-name">${nameBtn(a.ref, person)}</div>
          <div class="lr-meta">${esc(a.ref)} &middot; ${esc(a.address)}${a.parish ? ` &middot; ${esc(a.parish)}` : ''}</div>
          <div class="reg-work"><span class="lbl">Applying for</span>${whatThisIsHtml(a)}${parentRefOf(a) ? `<div class="orig-banner">${originalLineHtml(parentRefOf(a), a)}</div>` : ''}</div>
          ${whoInvolvedHtml(a)}
          <div class="lr-meta" style="margin:4px 0 2px"><b style="color:var(--text)">Applied ${esc(a.received || '?')}</b>${a.isDecided && a.decisionDate ? ` &middot; Decided ${esc(a.decisionDate)}` : ''} &middot; ${timingHtml(a.ref, a.received, a.isDecided ? a.decisionDate : null)}</div>
          ${plainEnglishHtml(a)}
          ${agentLine}
        </div>
        <div class="lr-side">
          <span class="tag ${CATEGORY_TAG[cat][0]}">${CATEGORY_TAG[cat][1] || a.decision || 'Decided'}</span>
          ${before.length ? `<span class="tag tag-excl" title="${esc(before.map(c => `${c.name}: ${c.why}, ${prettyDate(c.date)}`).join('; '))}">Written to before &middot; ${esc(prettyDate(before[0].date))}</span>` : ''}
          ${actions}
        </div>
      </div>`;
  }

  // Paperwork, changes and follow-ons on an earlier permission (not the start of a paper trail).
  function isFollowUp(a){
    const t = timings && timings.byRef.get(a.ref);
    return !!parentRefOf(a) || (t && PAPERWORK.includes(t.work)) || a.applicationType === 'Condition Discharge' || /Minor Change|Variation/i.test(a.applicationType || '');
  }
  // The project an application belongs to: follow its "PA xx/xxxxx" references back to the first original.
  function projectOf(a){
    let ref = a.ref, desc = a.description || '';
    for (let i = 0; i < 4; i++) {
      const up = (desc.match(REL_REF_RE) || []).find(r => r !== ref);
      if (!up) break;
      ref = up;
      desc = (byRefApp.get(up) || {}).description || (relIdx && relIdx.rec.get(up) ? relIdx.rec.get(up).description : '');
    }
    return ref;
  }
  function groupedHtml(list){
    const groups = new Map();
    list.forEach(a => { const k = projectOf(a); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(a); });
    return [...groups].map(([k, xs]) => {
      if (xs.length < 2) return rowHtml(xs[0], true);
      const root = byRefApp.get(k) || { ref: k, description: relIdx && relIdx.rec.get(k) ? relIdx.rec.get(k).description : '' };
      const est = typeof estimateFor === 'function' ? estimateFor(k, null) : null;
      const who = (root.applicantName || (relIdx && relIdx.rec.get(k) ? relIdx.rec.get(k).applicant : '')) || '';
      const banned = STANDING_EXCLUDE.find(n => who.toLowerCase().includes(n));
      return `<div class="proj-hdr"><b>Project ${esc(k)}</b>${who ? ` &middot; ${esc(who)}` : ''}${banned ? ` <span class="tag tag-excl">Never contact</span>` : ''}${est ? ` &middot; job ${moneyRange(est.total)}` : ''} &middot; ${xs.length} applications on this list${root.description ? `<div class="hint" style="margin:2px 0 0">${esc(root.description.slice(0, 180))}</div>` : ''}</div>`
        + xs.map(a => rowHtml(a, true)).join('');
    }).join('');
  }

  function renderList(){
    log = getLog();
    dismissed = getDismissed();
    const filtered = applyFilters();
    const full = true;
    const archivedCount = apps.filter(a => dismissed[a.ref]).length;
    document.getElementById('regCount').innerHTML = `${filtered.length} of ${apps.length} shown`
      + (archivedCount ? ` &middot; ${archivedCount} archived, ${showArchived ? '<button type="button" class="link-btn" id="regHideArchived">hide them</button>' : '<button type="button" class="link-btn" id="regShowArchived">show them</button>'}` : '');
    document.getElementById('registerList').innerHTML = filtered.length
      ? (document.getElementById('regGroup').checked ? groupedHtml(filtered) : filtered.map(a => rowHtml(a, full)).join(''))
      : '<p class="empty-state">Nothing matches those filters.</p>';
    const showBtn = document.getElementById('regShowArchived');
    if (showBtn) showBtn.addEventListener('click', () => { showArchived = true; renderList(); });
    // Project headers and chains need the 5-year history; redraw once it has loaded.
    if (!relIdx && !relWait) { relWait = true; loadRelatedIndex().then(() => renderList()); }
    const hideBtn = document.getElementById('regHideArchived');
    if (hideBtn) hideBtn.addEventListener('click', () => { showArchived = false; renderList(); });
    updateNavCounts();
  }
  function say(text){ const m = document.getElementById('regAddMsg'); if (m) m.textContent = text; }

  box.innerHTML = `
    <h3 class="lead-section-hdr">Pull from the planning register</h3>
    <p class="hint">Last pulled ${esc(pulledDate)} &middot; ${apps.length} applications on file. Every Monday at 7am the last ${data.monthsRequested || '?'} months are refreshed and new ones added; older ones stay on the list until you deal with them.
      <a href="${REGISTER_ACTIONS_URL}" target="_blank" rel="noopener">Pull fresh data now &rarr;</a></p>
    <p class="hint">On each one: <b>Send as Business / Pending / Approved</b> puts it in that folder (and decides which letter it gets), <b>Send as Personalised</b> puts it in the Personalised folder, where you write a letter for that one job, and <b>Archive</b> means not chasing it. Nothing is printed until you press "Send to print" inside the folder.</p>
    <div class="row-actions" style="flex-wrap:wrap;gap:10px">
      <label>From <input type="date" id="regFrom"></label>
      <label>To <input type="date" id="regTo"></label>
      <label>Received
        <select id="regWhen">
          <option value="30">Last 30 days</option>
          <option value="60" selected>Last 60 days</option>
          <option value="91">Last 3 months</option>
          <option value="365">Last year</option>
          <option value="1826">Last 5 years</option>
          <option value="all">Everything on the list</option>
        </select>
      </label>
      <label>Kind
        <select id="regKind">
          <option value="all">All applications</option>
          <option value="new">New applications only (start of the paper trail)</option>
          <option value="follow">Follow-up paperwork and changes only</option>
        </select>
      </label>
      <label>Status
        <select id="regStatus">
          <option value="all">All</option>
          <option value="pending">Pending only</option>
          <option value="approved">Approved only</option>
          <option value="refused">Refused only</option>
          <option value="other">Other decided (withdrawn etc.)</option>
        </select>
      </label>
      <label>Sort
        <select id="regSort">
          <option value="new">Newest first</option>
          <option value="gw">Biggest groundworks value</option>
          <option value="job">Biggest job value</option>
          <option value="name">Name A to Z</option>
        </select>
      </label>
      <label class="hint" style="margin:0"><input type="checkbox" id="regGroup" checked> Group by project</label>
      <input type="text" id="regSearch" placeholder="Search name, address, description&hellip;" style="min-width:220px">
    </div>
    <div class="row-actions" style="flex-wrap:wrap;gap:10px;margin-bottom:6px">
      <button class="btn-secondary" id="regBulkApprovedBtn">All shown Approved &rarr; Approved folder</button>
      <button class="btn-secondary" id="regBulkPendingBtn">All shown Pending &rarr; Pending folder</button>
      <button class="btn-secondary" id="regBulkAgentsBtn">All shown agents &rarr; Businesses folder</button>
      <span id="regAddMsg" class="hint"></span>
    </div>
    <p class="hint" id="regCount"></p>
    <div id="registerList" class="lead-list"></div>`;

  renderList();
  ['regStatus', 'regSort', 'regFrom', 'regTo', 'regSearch', 'regWhen', 'regKind', 'regGroup'].forEach(id => {
    document.getElementById(id).addEventListener('input', renderList);
  });
  document.getElementById('registerList').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn || !btn.dataset.ref) return;
    const a = apps.find(x => x.ref === btn.dataset.ref);
    if (!a) return;
    const person = a.applicantName || a.agentCompanyName || a.agentName || a.ref;
    if (btn.classList.contains('reg-name-toggle')) {
      if (expandedRefs.has(a.ref)) expandedRefs.delete(a.ref); else expandedRefs.add(a.ref);
    } else if (btn.classList.contains('reg-send-btn')) {
      const folder = btn.dataset.folder;
      if (addRegisterAppToBatch(a, folder)) {
        saveLeadsToStorage();
        const added = leads.find(l => l.ref === a.ref);
        const p = added && typeof priorContacts === 'function' ? priorContacts(added) : [];
        say(`${person} → ${FOLDERS[folder]} folder.${p.length ? ` Careful: ${p[0].name} was already written to (${p[0].why}${p[0].date ? ', ' + prettyDate(p[0].date) : ''}).` : ''}`);
      }
    } else if (btn.classList.contains('reg-add-agent-btn')) {
      if (addAgentToBatch(a)) { saveLeadsToStorage(); say(`${a.agentName || a.agentCompanyName} (agent) → Businesses folder.`); }
    } else if (btn.classList.contains('reg-dismiss-btn')) {
      const d = getDismissed();
      d[a.ref] = { date: todayISO(), name: person, source: 'planning', description: a.description || '', address: a.address || '', appliedDate: a.received || '', decidedDate: a.isDecided ? (a.decisionDate || '') : '', keyVal: a.keyVal || '', siteExtent: a.siteExtent || null };
      saveDismissed(d);
      say(`${person} archived — bring it back any time from here or the Archive tab.`);
    } else if (btn.classList.contains('reg-unarchive-btn')) {
      bringBackFromArchive(a.ref);
      say(`${person} brought back.`);
    } else if (btn.classList.contains('reg-undo')) {
      const i = leads.findIndex(l => l.ref === a.ref);
      if (i < 0) return;
      if (leads[i].include && !confirm(`${person} is on the print list. Take it off and out of the ${FOLDERS[leadFolder(leads[i])]} folder?`)) return;
      const from = FOLDERS[leadFolder(leads[i])];
      leads.splice(i, 1);
      saveLeadsToStorage();
      say(`${person} taken back out of ${from}. Send it whichever way you like.`);
    } else if (btn.classList.contains('reg-topersonal')) {
      const l = leads.find(x => x.ref === a.ref);
      if (!l) return;
      l.folder = 'personal'; l.include = false;
      saveLeadsToStorage();
      say(`${person} moved to Personalised. Write the letter there.`);
    } else if (btn.classList.contains('reg-unsend')) {
      // The sent record is the safety net against double letters, so undoing it says exactly what it knows first.
      const e = getLog()[a.ref];
      if (!e) return;
      const pdf = e.pdfFile ? String(e.pdfFile).split('›').pop().trim() : '';
      if (!confirm(`The record says the ${FOLDERS[e.copy] || ''} letter to ${e.name || person} was printed and sent on ${prettyDate(e.date)}${pdf ? ` (PDF: ${pdf})` : ''}.\n\nOnly undo this if that letter never actually went out. It comes off the sent record and goes to the Personalised folder for you to write.\n\nIf it did go out, press Cancel and use "Personalised follow-up" instead, so the first letter stays on record.`)) return;
      const lg = getLog();
      delete lg[a.ref];
      saveLog(lg);
      const l = leads.find(x => x.ref === a.ref);
      if (l) Object.assign(l, { folder: 'personal', include: false, alreadyProcessed: false });
      else addRegisterAppToBatch(a, 'personal');
      saveLeadsToStorage();
      say(`${person} taken off the sent record and put in Personalised.`);
    } else if (btn.classList.contains('reg-followup')) {
      if (leads.some(l => l.baseRef === a.ref)) return;
      const e = getLog()[a.ref] || {};
      if (!addRegisterAppToBatch({ ...a, ref: a.ref + '~2' }, 'personal')) { say('A follow-up for this one already exists.'); return; }
      const l = leads.find(x => x.ref === a.ref + '~2');
      l.baseRef = a.ref;
      l.extraReviewNote = `Follow-up: the ${FOLDERS[e.copy] || 'first'} letter went out ${prettyDate(e.date)}. Write something that builds on it.`;
      saveLeadsToStorage();
      say(`Personalised follow-up for ${person} added. The first letter stays on record.`);
    } else return;
    renderList();
  });
  function bulk(filterFn, folder, label){
    log = getLog(); dismissed = getDismissed();
    let added = 0;
    applyFilters().filter(filterFn).forEach(a => { if (folder ? addRegisterAppToBatch(a, folder) : addAgentToBatch(a)) added++; });
    saveLeadsToStorage();
    say(`Added ${added} to the ${label} folder (anything already in a folder, sent or archived was skipped).`);
    renderList();
  }
  document.getElementById('regBulkApprovedBtn').addEventListener('click', () => bulk(a => decisionCategory(a) === 'approved' && !standingHit(a), 'approved', 'Approved'));
  document.getElementById('regBulkPendingBtn').addEventListener('click', () => bulk(a => decisionCategory(a) === 'pending' && !standingHit(a), 'pending', 'Pending'));
  document.getElementById('regBulkAgentsBtn').addEventListener('click', () => bulk(a => !standingHit(a), null, 'Businesses'));
}

const COPY_NOTE = {
  approved: 'Everyone here gets the "Congratulations on your recent planning approval" letter.',
  pending: 'Everyone here gets the "we noticed you have recently applied for planning permission" letter.',
  business: 'Everyone here gets the architects &amp; engineers introduction letter.',
  personal: 'Each one here gets its own letter. Press "Write the letter" to open the editor: it starts from a draft that mentions their job, and you change whatever you like. Only letters you have saved can go to print.'
};

function renderFolder(main, folder){
  const label = FOLDERS[folder];
  const inFolder = leads.map((l, i) => ({ l, i })).filter(x => leadFolder(x.l) === folder);
  const activeAll = inFolder.filter(x => !x.l.alreadyProcessed);
  const sentCount = inFolder.length - activeAll.length;

  // Where everyone in this folder stands (Ash, 26 Sep 2026): waiting, on the print list,
  // printed and sent, visited (businesses), not chasing. Businesses also filter by trade.
  const isBiz = folder === 'business';
  const tradeSel = isBiz ? (state.bizTrade || 'all') : 'all';
  const tradeOk = l => tradeSel === 'all' || tradeOf(l) === tradeSel;
  const logAll = getLog(), dismissedAll = getDismissed();
  const asLead = (ref, e) => leads.find(l => l.ref === ref) || { ref, description: e.description || '', applicant: e.name || '', recipientLines: e.recipientLines || [] };
  const sentItems = Object.entries(logAll).filter(([ref, e]) => contactCategory(ref, e) === folder)
    .map(([ref, e]) => ({ ref, e, lead: asLead(ref, e) })).filter(x => tradeOk(x.lead))
    .sort((a, b) => (b.e.date || '').localeCompare(a.e.date || ''));
  const archivedItems = Object.entries(dismissedAll)
    .filter(([ref, e]) => e.lead ? leadFolder(e.lead) === folder : (isBiz && ref.startsWith('ARCH-')))
    .map(([ref, e]) => ({ ref, e })).filter(x => tradeOk(x.e.lead || { ref })).sort((a, b) => (b.e.date || '').localeCompare(a.e.date || ''));
  const waitingAll = activeAll.filter(x => !x.l.include && tradeOk(x.l));
  const printAll = activeAll.filter(x => x.l.include && tradeOk(x.l));
  const visitedItems = !isBiz ? [] : [
    ...leads.filter(l => leadFolder(l) === 'business' && l.visitedAt && tradeOk(l)).map(l => ({ ref: l.ref, name: l.applicant, at: l.visitedAt })),
    ...Object.entries(logAll).filter(([ref, e]) => e.visitedAt && !leads.some(l => l.ref === ref) && contactCategory(ref, e) === 'business')
      .map(([ref, e]) => ({ ref, name: e.name, at: e.visitedAt }))];
  const view = (state.folderView || {})[folder] || 'waiting';
  const viewBar = `<div class="fview-bar">${[['waiting', `Waiting to send (${waitingAll.length})`], ['print', `On the print list (${printAll.length})`],
    ['sent', `Printed &amp; sent (${sentItems.length})`], ...(isBiz ? [['visited', `Visited (${visitedItems.length})`]] : []), ['archived', `Not chasing (${archivedItems.length})`]]
    .map(([k, t]) => `<button type="button" data-fview="${k}" class="${view === k ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  const tradeBar = !isBiz ? '' : (() => {
    const everyone = [...inFolder.map(x => x.l), ...Object.entries(logAll).filter(([r, e]) => contactCategory(r, e) === 'business' && !leads.some(l => l.ref === r)).map(([r, e]) => asLead(r, e))];
    const counts = {};
    everyone.forEach(l => { const t = tradeOf(l) || 'Other'; counts[t] = (counts[t] || 0) + 1; });
    return `<div class="trade-bar"><span class="hint" style="margin:0">Trade:</span>${[['all', `All (${everyone.length})`], ...Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([t, n]) => [t, `${t} (${n})`])]
      .map(([k, t]) => `<button type="button" data-trade="${esc(k)}" class="${tradeSel === k ? 'on' : ''}">${esc(t)}</button>`).join('')}</div>
      <datalist id="bizTrades">${TRADES.map(t => `<option value="${esc(t)}">`).join('')}</datalist>`;
  })();
  const addBiz = !isBiz || view !== 'waiting' ? '' : `<details class="biz-add"><summary>+ Add a business, or find a trade on Google</summary>
    <div class="grid">
      <label>Trade <input id="bizTrade" list="bizTrades" placeholder="e.g. Builder, Advocate"></label>
      <label>Person's name <input id="bizName" placeholder="e.g. John Smith"></label>
      <label>Business name <input id="bizCompany" placeholder="e.g. Smith Builders Ltd"></label>
    </div>
    <label style="display:block;margin-top:8px">Address, one line each, postcode last<textarea id="bizAddr" rows="3"></textarea></label>
    <div class="row-actions" style="margin-top:8px"><button class="btn" id="bizAddBtn">Add to Businesses</button>
      <button class="btn-secondary" id="bizFindBtn">Find this trade on Google</button><span id="bizAddMsg" class="hint" style="margin:0"></span></div>
    <p class="hint">For a long list, paste a spreadsheet on Import &mdash; Businesses (a Trade column is picked up). Agents from planning applications come in with "+ Add agent as business". The Businesses letter is written for architects and engineers; other trades may need their own letter.</p>
  </details>`;
  const visitBtn = (ref, at) => `<button type="button" class="btn-secondary f-visit" data-ref="${esc(ref)}">${at ? `&#10003; Visited ${esc(prettyDate(at))} (undo)` : 'Mark visited'}</button>`;
  const compactRow = (ref, name, sub, side) => `<div class="lead-row"><div class="lr-main">${nameBtn(ref, name)}<div class="lr-meta">${sub}</div></div>
    <div class="lr-side" style="flex-direction:column;align-items:flex-end;gap:6px">${side}</div></div>`;
  function wireChrome(){
    main.querySelectorAll('[data-fview]').forEach(b => b.addEventListener('click', () => { state.folderView = { ...(state.folderView || {}), [folder]: b.dataset.fview }; render(); }));
    main.querySelectorAll('[data-trade]').forEach(b => b.addEventListener('click', () => { state.bizTrade = b.dataset.trade; render(); }));
    main.querySelectorAll('.f-visit').forEach(b => b.addEventListener('click', () => {
      const l = leads.find(x => x.ref === b.dataset.ref);
      if (l) { l.visitedAt = l.visitedAt ? '' : todayISO(); saveLeadsToStorage(); }
      else { const lg = getLog(); if (lg[b.dataset.ref]) { lg[b.dataset.ref].visitedAt = lg[b.dataset.ref].visitedAt ? '' : todayISO(); saveLog(lg); } }
      render();
    }));
    main.querySelectorAll('.f-bringback').forEach(b => b.addEventListener('click', () => { bringBackFromArchive(b.dataset.ref); render(); }));
    const find = document.getElementById('bizFindBtn');
    if (find) find.addEventListener('click', () => {
      const trade = document.getElementById('bizTrade').value.trim() || 'builders';
      window.open(`https://www.google.com/search?q=${encodeURIComponent(trade + ' Isle of Man')}`, '_blank', 'noopener');
      window.open(`https://www.google.com/maps/search/${encodeURIComponent(trade + ' Isle of Man')}`, '_blank', 'noopener');
    });
    const add = document.getElementById('bizAddBtn');
    if (add) add.addEventListener('click', () => {
      const trade = document.getElementById('bizTrade').value.trim();
      const person = document.getElementById('bizName').value.trim();
      const company = document.getElementById('bizCompany').value.trim();
      const addr = document.getElementById('bizAddr').value.split('\n').map(x => x.trim()).filter(Boolean);
      const msg = document.getElementById('bizAddMsg');
      const name = person || company;
      if (!name || !addr.length) { msg.textContent = 'A name and an address are needed.'; return; }
      const ref = 'ARCH-' + slugify(name + '-' + company);
      if (leads.some(l => l.ref === ref) || getLog()[ref] || getDismissed()[ref]) { msg.textContent = 'Already in Businesses, sent or not chasing.'; return; }
      const lead = classify({ ref, applicant: name, site: [company, addr[addr.length - 1]].filter(Boolean).join(', '),
        recipientLines: [name, ...(person && company ? [company] : []), ...addr], salutation: person ? `Dear ${person.split(' ')[0]},` : 'Dear Sir/Madam,',
        edited: true, include: false });
      Object.assign(lead, { type: 'Company', source: 'business', folder: 'business', addedAt: todayISO(), trade: trade || guessTrade(company) || 'Other' });
      leads.push(lead);
      saveLeadsToStorage();
      const p = priorContacts(lead).filter(c => c.why !== 'this application');
      state.folderMsg = `${name} added${p.length ? `. Careful: ${p[0].name} was already written to (${p[0].why}, ${prettyDate(p[0].date)}).` : '.'}`;
      render();
    });
  }

  if (['sent', 'visited', 'archived'].includes(view)) {
    const rows = view === 'sent'
      ? sentItems.map(x => compactRow(x.ref, x.e.name || (x.e.recipientLines || [])[0] || x.ref,
          `${isBiz ? esc(tradeOf(x.lead)) : esc(x.ref)}${x.e.description ? ' &middot; ' + esc(x.e.description.slice(0, 140)) : ''}`,
          `<span class="status-tag sent">Printed &amp; sent ${esc(prettyDate(x.e.date))}</span>${x.e.pdfFile ? `<div class="hint" style="margin:0;text-align:right">PDF: ${esc(String(x.e.pdfFile).split('›').pop().trim())}</div>` : ''}${isBiz ? visitBtn(x.ref, x.lead.visitedAt || x.e.visitedAt) : ''}`))
      : view === 'visited'
      ? visitedItems.map(v => compactRow(v.ref, v.name, statusTagHtml(v.ref), visitBtn(v.ref, v.at)))
      : archivedItems.map(x => compactRow(x.ref, x.e.name || x.ref, x.e.lead && x.e.lead.description ? esc(x.e.lead.description.slice(0, 140)) : esc(x.ref),
          `<span class="status-tag archived">Not chasing since ${esc(prettyDate(x.e.date))}</span><button type="button" class="btn-secondary f-bringback" data-ref="${esc(x.ref)}">&#8617; Bring back</button>`));
    const note = view === 'sent' ? 'Printed and sent. The date is the day the PDF was made and the letters were marked as sent. Click a name for everything about them, including the letter.'
      : view === 'visited' ? 'Businesses you have been to see in person.' : 'Looked at and not chasing. Bring any back to send another day.';
    main.innerHTML = `${viewBar}${tradeBar}<p class="hint">${note}</p>${rows.length ? `<div class="lead-list">${rows.join('')}</div>` : '<p class="empty-state">None here.</p>'}`;
    wireChrome();
    return;
  }
  const active = view === 'print' ? printAll : waitingAll;
  if (!active.length) {
    main.innerHTML = `${viewBar}${tradeBar}${addBiz}<p class="empty-state">${view === 'print' ? `Nothing from ${label} on the print list.` : `Nothing waiting in ${label}.`}<br><br>${view === 'print' ? '' : isBiz
      ? 'Add businesses above, on Import — Businesses, or with "+ Add agent as business" on the planning register list (Import — Planning).'
      : `Press "Send as ${label}" on the planning register list (Import — Planning) to put applications here.`}</p>`
      + (state.folderMsg ? `<p class="hint" style="text-align:center">${esc(state.folderMsg)}</p>` : '');
    state.folderMsg = '';
    wireChrome();
    return;
  }
  const onPrint = printAll.length;
  const personal = folder === 'personal';
  // Personalised letters only go to print once written and saved.
  const sendable = active.filter(x => !x.l.include && !x.l.excludedReason && !x.l.needsReview && (!personal || x.l.personalDone));
  const unwritten = personal ? active.filter(x => !x.l.personalDone).length : 0;
  const repeat = x => typeof priorContacts === 'function' && priorContacts(x.l).length > 0;
  const repeatsWaiting = sendable.filter(repeat);
  const sendableClean = sendable.filter(x => !repeat(x));
  const flaggedWaiting = active.filter(x => !x.l.include && !x.l.excludedReason && x.l.needsReview).length;

  const groups = new Map();
  active.slice().sort((a, b) => (b.l.addedAt || '').localeCompare(a.l.addedAt || '')).forEach(x => {
    const k = x.l.addedAt || '';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(x);
  });
  const today = todayISO();
  const groupTitle = k => !k ? 'Added earlier' : k === today ? `Added today &middot; ${prettyDate(k)}` : `Added ${prettyDate(k)}`;

  function row(l, i){
    const flag = l.excludedReason ? { cls: 'tag-excl', label: 'Never contact', title: l.excludedReason }
      : l.needsReview ? { cls: 'tag-review', label: 'Check', title: l.reviewNote }
      : null;
    const editing = state.editRef === l.ref;
    const writing = personal && state.letterRef === l.ref;
    const needsWriting = personal && !l.personalDone;
    const moveOpts = Object.entries(FOLDERS).map(([k, v]) => `<option value="${k}" ${k === folder ? 'selected' : ''}>${v}</option>`).join('');
    return `
      <div class="lead-row ${flag ? 'flagged' : ''}" data-i="${i}">
        <div class="lr-main">
          <div class="lr-applicant">${nameBtn(l.baseRef || l.ref, l.applicant)}${l.baseRef ? ' <span class="tag tag-review">Follow-up</span>' : ''}${isBiz ? `<span class="trade-tag">${esc(tradeOf(l))}</span>` : ''}</div>
          <div class="lr-meta">${esc(l.ref)}${l.appliedDate ? ` &middot; <b style="color:var(--text)">Applied ${esc(l.appliedDate)}</b>` : ''}${l.decidedDate ? ` &middot; Decided ${esc(l.decidedDate)}` : ''}${l.description ? ' &middot; ' + esc(l.description) : ''}</div>
          ${l.appliedDate ? `<div class="lr-meta">${timingHtml(l.ref, l.appliedDate, l.decidedDate)}</div>` : ''}
          ${typeof contactFlagHtml === 'function' ? contactFlagHtml(l) : ''}
          ${l.keyVal ? `<div class="hint" style="margin:2px 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${drawingsLinkHtml(l.keyVal)}${siteExtentHtml(l.siteExtent)}</div>` : ''}
          ${flag && flag.title ? `<div class="hint" style="margin:0 0 4px;color:var(--accent)">${esc(flag.title)}</div>` : ''}
          ${personal && typeof estimateRowHtml === 'function' ? estimateRowHtml(l.baseRef || l.ref, l.parentRef || null, originalLineHtml(l.parentRef || null, l)) : ''}
          <input type="text" class="sal-input" value="${esc(l.salutation)}" title="Salutation — click to change">
          <div class="f-addr">${l.recipientLines.map(esc).join(' &middot; ')}</div>
          ${editing ? `
          <div class="f-edit-panel">
            <div class="hint" style="margin:0 0 6px">Name &amp; address exactly as it prints — one line each</div>
            <textarea class="f-edit-lines">${esc(l.recipientLines.join('\n'))}</textarea>
            <div class="row-actions" style="margin:8px 0 0"><button class="btn f-edit-save">Save</button><button class="btn-secondary f-edit-cancel">Cancel</button></div>
          </div>` : ''}
          ${writing ? `
          <div class="f-edit-panel pl-editor">
            <div class="hint" style="margin:0 0 4px">Starts "${esc(l.salutation)}" (change it above). Write the letter below with a blank line between paragraphs; "Kind regards" and the signature are added underneath. The estimate above is for you, so leave prices out of the letter.</div>
            <textarea class="pl-text">${esc(parasToText(letterParas(l)))}</textarea>
            <div class="row-actions" style="margin:8px 0 0">
              <button class="btn pl-save">Save letter</button>
              <button class="btn-secondary pl-reset" title="Throws away your changes and goes back to the draft for this job">Start again from the draft</button>
              <button class="btn-secondary pl-close">Close</button>
            </div>
            <div class="letter-preview">${letterHtml(l)}</div>
          </div>` : ''}
        </div>
        <div class="lr-side" style="flex-direction:column;align-items:flex-end;gap:8px">
          <div style="display:flex;gap:8px;align-items:center">
            ${flag ? `<span class="tag ${flag.cls}" title="${esc(flag.title)}">${flag.label}</span>` : ''}
            ${personal ? `<span class="tag ${l.personalDone ? 'tag-approved' : 'tag-review'}">${l.personalDone ? 'Letter written' : 'Not written yet'}</span>` : ''}
            <button class="send-toggle ${l.include ? 'on' : 'off'}" ${l.excludedReason || needsWriting ? 'disabled' : ''} ${needsWriting ? 'title="Write and save the letter first"' : ''}>${l.include ? '&#10003; On print list' : 'Send to print'}</button>
          </div>
          <div class="f-actions">
            ${personal ? `<button class="btn f-letter-btn">&#9998; ${writing ? 'Close the letter' : l.personalDone ? 'Edit the letter' : 'Write the letter'}</button>` : ''}
            <button class="btn-secondary f-edit-btn">&#9998; Edit name / address</button>
            ${isBiz ? `<label class="hint" style="margin:0">Trade <input class="f-trade" list="bizTrades" value="${esc(tradeOf(l))}" style="width:140px"></label>${visitBtn(l.ref, l.visitedAt)}` : ''}
            <label class="hint" style="margin:0">Move to <select class="f-move">${moveOpts}</select></label>
            <button class="btn-secondary f-archive-btn" title="Not chasing — goes to the Archive tab, where you can bring it back">Archive</button>
            <button class="btn-danger f-remove-btn">Delete</button>
          </div>
        </div>
      </div>`;
  }

  main.innerHTML = `
    <div class="row-actions">
      <button class="btn" id="fSendAllBtn" ${sendableClean.length ? '' : 'disabled'}>Send all ${sendableClean.length} to print</button>
      ${onPrint ? `<button class="btn-secondary" id="fUnsendAllBtn">Take all ${onPrint} off the print list</button>` : ''}
      <button class="btn-secondary" id="fGoPrintBtn">Go to Print &rarr;</button>
      <span id="fMsg" class="hint" style="margin:0">${state.folderMsg ? esc(state.folderMsg) : ''}</span>
    </div>
    ${viewBar}${tradeBar}${addBiz}
    <div class="stat-bar">
      <span><b>${active.length}</b> waiting in ${label}</span>
      <span style="color:var(--accent)"><b>${onPrint}</b> on the print list</span>
      ${flaggedWaiting ? `<span><b>${flaggedWaiting}</b> marked Check — send those one at a time once you've looked</span>` : ''}
      ${unwritten ? `<span><b>${unwritten}</b> letters still to write</span>` : ''}
      ${repeatsWaiting.length ? `<span style="color:#ef4444"><b>${repeatsWaiting.length}</b> already written to: left out of "Send all", send them one at a time if you really mean to</span>` : ''}
      ${sentCount ? `<span><b>${sentCount}</b> already sent (see Archive)</span>` : ''}
    </div>
    <p class="hint">${COPY_NOTE[folder]}</p>
    ${[...groups].map(([k, xs]) => `<h3 class="lead-section-hdr">${groupTitle(k)} &middot; ${xs.length}</h3><div class="lead-list">${xs.map(x => row(x.l, x.i)).join('')}</div>`).join('')}
  `;

  state.folderMsg = '';
  const done = () => { saveLeadsToStorage(); render(); };
  const sendAll = document.getElementById('fSendAllBtn');
  sendAll.addEventListener('click', () => {
    sendableClean.forEach(x => { x.l.include = true; x.l.sentToPrintAt = todayISO(); });
    if (repeatsWaiting.length) state.folderMsg = `${repeatsWaiting.length} already written to were left off the print list.`;
    done();
  });
  const unsendAll = document.getElementById('fUnsendAllBtn');
  if (unsendAll) unsendAll.addEventListener('click', () => { printAll.forEach(x => { x.l.include = false; }); done(); });
  wireChrome();
  document.getElementById('fGoPrintBtn').addEventListener('click', () => { state.tab = 'letters'; render(); });

  main.querySelectorAll('.lead-row[data-i]').forEach(rowEl => {
    const i = +rowEl.dataset.i;
    const l = leads[i];
    const toggle = rowEl.querySelector('.send-toggle');
    if (!toggle.disabled) toggle.addEventListener('click', () => {
      if (!l.include && typeof confirmRepeats === 'function' && !confirmRepeats([l], 'Put this letter on the print list')) return;
      l.include = !l.include;
      if (l.include) l.sentToPrintAt = todayISO();
      done();
    });
    rowEl.querySelector('.sal-input').addEventListener('change', e => { l.salutation = e.target.value; l.edited = true; saveLeadsToStorage(); });
    rowEl.querySelector('.f-edit-btn').addEventListener('click', () => { state.editRef = l.ref; render(); });
    const save = rowEl.querySelector('.f-edit-save');
    if (save) save.addEventListener('click', () => {
      const lines = rowEl.querySelector('.f-edit-lines').value.split('\n').map(s => s.trim()).filter(Boolean);
      if (lines.length) { l.recipientLines = lines; l.applicant = lines[0]; l.edited = true; }
      state.editRef = null;
      done();
    });
    const cancel = rowEl.querySelector('.f-edit-cancel');
    if (cancel) cancel.addEventListener('click', () => { state.editRef = null; render(); });
    rowEl.querySelector('.f-move').addEventListener('change', e => { l.folder = e.target.value; done(); });
    const tradeIn = rowEl.querySelector('.f-trade');
    if (tradeIn) tradeIn.addEventListener('change', e => { l.trade = e.target.value.trim(); done(); });
    const letterBtn = rowEl.querySelector('.f-letter-btn');
    if (letterBtn) letterBtn.addEventListener('click', () => { state.letterRef = state.letterRef === l.ref ? null : l.ref; render(); });
    const text = rowEl.querySelector('.pl-text');
    if (text) {
      const preview = rowEl.querySelector('.pl-editor .letter-preview');
      text.addEventListener('input', () => { preview.innerHTML = letterHtml({ ...l, personalParas: textToParas(text.value) }); });
      rowEl.querySelector('.pl-save').addEventListener('click', () => {
        const paras = textToParas(text.value);
        if (!paras.length) { alert('The letter is empty.'); return; }
        l.personalParas = paras; l.personalDone = true; l.edited = true;
        state.letterRef = null;
        done();
      });
      rowEl.querySelector('.pl-reset').addEventListener('click', () => {
        if (!confirm('Throw away your changes to this letter and start again from the draft?')) return;
        delete l.personalParas; l.personalDone = false;
        done();
      });
      rowEl.querySelector('.pl-close').addEventListener('click', () => { state.letterRef = null; render(); });
    }
    rowEl.querySelector('.f-archive-btn').addEventListener('click', () => { archiveLead(i); render(); });
    rowEl.querySelector('.f-remove-btn').addEventListener('click', () => {
      if (!confirm(`Delete "${l.applicant}" from ${label}? (Use Archive instead if you want a record that you looked at it.)`)) return;
      leads.splice(i, 1);
      done();
    });
  });
}

// One place for the whole history: everyone who was SENT a letter (the
// sent log) and everyone ARCHIVED as not chasing — homeowners/planning
// first, then businesses — each expandable to show exactly what went out.
function renderArchive(main){
  const log = getLog();
  const archived = getDismissed();
  const isBizRef = (ref, source) => source === 'business' || ref.startsWith('ARCH-');
  const entries = [];
  Object.entries(log).forEach(([ref, e]) => entries.push({ kind: 'sent', ref, e, biz: isBizRef(ref, e.source) }));
  Object.entries(archived).forEach(([ref, e]) => entries.push({ kind: 'archived', ref, e, biz: e.lead ? leadFolder(e.lead) === 'business' : isBizRef(ref, e.source) }));
  const filter = state.archiveFilter || 'all';
  const shown = entries.filter(x => filter === 'all' || x.kind === filter)
    .sort((a, b) => (b.e.date || '').localeCompare(a.e.date || '') || (a.e.name || '').localeCompare(b.e.name || ''));
  const open = state.archiveOpen || (state.archiveOpen = new Set());
  const letterOpen = state.letterOpen || (state.letterOpen = new Set());
  const COPY_LABEL = { approved: '"Congratulations on your planning approval" letter', pending: '"Applied for planning" letter', business: 'Architects &amp; engineers introduction letter', personal: 'Personalised letter' };

  function letterSnapshot(x){
    const e = x.e;
    const lead = leads.find(l => l.ref === x.ref);
    const recipientLines = e.recipientLines || (lead && lead.recipientLines);
    if (!recipientLines) return null;
    return {
      recipientLines,
      salutation: e.salutation || (lead && lead.salutation) || '',
      folder: e.copy || (lead ? leadFolder(lead) : (x.biz ? 'business' : 'approved')),
      letterDate: e.letterDate || null,
      bodyParas: e.bodyParas || null,
      rebuilt: !e.recipientLines || !e.bodyParas
    };
  }

  function entryHtml(x){
    const e = x.e;
    const key = x.kind + ':' + x.ref;
    const isOpen = open.has(key);
    const statusTag = x.kind === 'sent'
      ? `<span class="tag tag-approved">Sent ${esc(prettyDate(e.date))}</span>`
      : `<span class="tag tag-dupe">Archived ${esc(prettyDate(e.date))} &middot; not chasing</span>`;
    let detail = '';
    if (isOpen) {
      const snap = x.kind === 'sent' ? letterSnapshot(x) : null;
      const archivedLead = x.kind === 'archived' ? e.lead : null;
      const lines = snap ? snap.recipientLines : archivedLead ? archivedLead.recipientLines : null;
      const keyVal = e.keyVal || (archivedLead && archivedLead.keyVal) || '';
      const siteExtent = e.siteExtent || (archivedLead && archivedLead.siteExtent) || null;
      detail = `
        <div class="f-edit-panel">
          ${lines ? `<div class="f-addr" style="margin:0 0 6px;color:var(--text)">${lines.map(esc).join('<br>')}</div>` : ''}
          ${e.description || (archivedLead && archivedLead.description) ? `<div class="hint" style="margin:0 0 6px">${esc(e.description || archivedLead.description)}</div>` : ''}
          ${e.address ? `<div class="hint" style="margin:0 0 6px">Site: ${esc(e.address)}</div>` : ''}
          ${(e.appliedDate || (archivedLead && archivedLead.appliedDate)) ? `<div class="hint" style="margin:0 0 6px"><b style="color:var(--text)">Applied ${esc(e.appliedDate || archivedLead.appliedDate)}</b>${(e.decidedDate || (archivedLead && archivedLead.decidedDate)) ? ` &middot; Decided ${esc(e.decidedDate || archivedLead.decidedDate)}` : ''}</div>` : ''}
          ${(e.appliedDate || (archivedLead && archivedLead.appliedDate)) ? `<div class="hint" style="margin:0 0 6px">${timingHtml(x.ref, e.appliedDate || archivedLead.appliedDate, e.decidedDate || (archivedLead && archivedLead.decidedDate))}</div>` : ''}
          ${e.note ? `<div class="hint" style="margin:0 0 6px">${esc(e.note)}</div>` : ''}
          ${keyVal ? `<div class="hint" style="margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${drawingsLinkHtml(keyVal)}${siteExtentHtml(siteExtent)}</div>` : ''}
          ${snap ? `<div class="hint" style="margin:0 0 6px">Letter: <b>${COPY_LABEL[snap.folder]}</b>${e.copyNote ? ' — ' + esc(e.copyNote) : ''}</div>` : ''}
          ${e.pdfFile ? `<div class="hint" style="margin:0 0 6px">Original PDF: <b>${esc(e.pdfFile)}</b>${e.pdfPage ? `, page ${e.pdfPage}` : ''}</div>` : ''}
          <div class="row-actions" style="margin:6px 0 0">
            ${snap ? `<button class="btn-secondary ar-letter-btn" data-key="${esc(key)}">${letterOpen.has(key) ? 'Hide letter' : '&#128196; See the letter that was sent'}</button>` : ''}
            ${x.kind === 'sent'
              ? `<button class="btn-secondary ar-restore-btn" data-ref="${esc(x.ref)}" title="Takes it off the sent record, so it can be sent again">&#8617; Un-mark as sent</button>`
              : `<button class="btn-secondary ar-bringback-btn" data-ref="${esc(x.ref)}">&#8617; Bring back</button>`}
          </div>
          ${snap && letterOpen.has(key) ? `
            ${snap.rebuilt ? '<p class="hint">Rebuilt from the saved record — the wording and address shown are what this app would have printed.</p>' : ''}
            <div class="letter-preview">${letterHtml(snap)}</div>` : ''}
        </div>`;
    }
    return `
      <div class="lead-row" style="display:block">
        <button type="button" class="reg-name-toggle ar-toggle" data-key="${esc(key)}" style="width:100%">
          <span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <span style="flex:1;min-width:200px">${esc(e.name || x.ref)} <span class="hint">${isOpen ? '&#9662;' : '&#9656;'} ${esc(x.ref)}</span></span>
            ${statusTag}
          </span>
        </button>
        ${detail}
      </div>`;
  }

  const planning = shown.filter(x => !x.biz);
  const business = shown.filter(x => x.biz);
  const section = (title, xs) => `<h3 class="lead-section-hdr">${title} &middot; ${xs.length}</h3>`
    + (xs.length ? `<div class="lead-list">${xs.map(entryHtml).join('')}</div>` : '<p class="empty-state">Nothing here.</p>');
  const count = k => entries.filter(x => x.kind === k).length;

  main.innerHTML = `
    <div class="row-actions">
      <label class="hint" style="margin:0">Show
        <select id="arFilter" class="f-move">
          <option value="all" ${filter === 'all' ? 'selected' : ''}>Everything (${entries.length})</option>
          <option value="sent" ${filter === 'sent' ? 'selected' : ''}>Sent a letter (${count('sent')})</option>
          <option value="archived" ${filter === 'archived' ? 'selected' : ''}>Archived — not chasing (${count('archived')})</option>
        </select>
      </label>
      <span class="hint" style="margin:0">Click any name to see what it was and the letter that went out.</span>
    </div>
    ${section('Homeowners &amp; planning applicants', planning)}
    ${section('Businesses &mdash; architects &amp; engineers', business)}
    <details style="margin-top:28px">
      <summary class="hint" style="cursor:pointer">Sent letters outside this app? Add them to the sent record</summary>
      <div class="bulk-add-log" style="margin-top:10px">
        <p class="hint">One per line — <code>Reference&#9;Name</code> (tab-separated) or just the reference — logged as sent today, so they're flagged if they ever come up again.</p>
        <textarea id="bulkLogBox" rows="4" placeholder="26/00465/B&#9;Mr &amp; Mrs W. Philip &amp; Norma Richards"></textarea>
        <div class="row-actions" style="margin-top:10px">
          <button class="btn" id="bulkLogBtn">Add to sent record</button>
          <span id="bulkLogMsg" class="hint" style="margin:0"></span>
        </div>
      </div>
    </details>`;

  document.getElementById('arFilter').addEventListener('change', e => { state.archiveFilter = e.target.value; render(); });
  main.querySelectorAll('.ar-toggle').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.key;
    if (open.has(k)) open.delete(k); else open.add(k);
    render();
  }));
  main.querySelectorAll('.ar-letter-btn').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.key;
    if (letterOpen.has(k)) letterOpen.delete(k); else letterOpen.add(k);
    render();
  }));
  main.querySelectorAll('.ar-bringback-btn').forEach(b => b.addEventListener('click', () => { bringBackFromArchive(b.dataset.ref); render(); }));
  main.querySelectorAll('.ar-restore-btn').forEach(b => b.addEventListener('click', () => {
    const ref = b.dataset.ref;
    if (!confirm('Take this off the sent record? It will then be allowed to be sent again.')) return;
    const lg = getLog();
    delete lg[ref];
    saveLog(lg);
    leads = leads.map(classify);
    saveLeadsToStorage();
    render();
  }));
  document.getElementById('bulkLogBtn').addEventListener('click', () => {
    const lines = document.getElementById('bulkLogBox').value.split('\n').map(s => s.trim()).filter(Boolean);
    if (!lines.length) return;
    const lg = getLog();
    let n = 0;
    lines.forEach(line => {
      const [ref, name] = line.split('\t').map(s => (s || '').trim());
      if (!ref) return;
      lg[ref] = { date: todayISO(), name: name || '', source: ref.startsWith('ARCH-') ? 'business' : 'planning' };
      n++;
    });
    saveLog(lg);
    leads = leads.map(classify);
    saveLeadsToStorage();
    render();
    const msg = document.getElementById('bulkLogMsg');
    if (msg) msg.textContent = `Added ${n} to the sent record.`;
  });
}

function renderPrint(main, kind){
  // Already-sent leads never belong in Print, even if `include` is
  // somehow still true (e.g. a fresh re-import of the same list sets
  // its own default before knowing it's a repeat) — this is the same
  // filter Review uses to hide them, applied here so an archived lead
  // can never silently get printed/sent again.
  const batch = leads.filter(l => l.include && !l.alreadyProcessed);
  if (!batch.length) {
    main.innerHTML = `<p class="empty-state">Nothing on the print list yet — open Approved, Pending, Businesses or Personalised and press "Send to print" (one at a time, or "Send all to print").</p>`;
    return;
  }
  const byFolder = { approved: 0, pending: 0, business: 0, personal: 0 };
  batch.forEach(l => byFolder[leadFolder(l)]++);
  const mix = Object.entries(byFolder).filter(([, n]) => n).map(([k, n]) => `${n} ${FOLDERS[k]}`).join(' &middot; ');

  const align = getEnvAlign();
  const alignToggleHtml = kind === 'envelope' ? `
      <span class="align-toggle">
        <button class="btn-secondary${align === 'center' ? ' active' : ''}" id="alignCenterBtn">Centered</button>
        <button class="btn-secondary${align === 'left' ? ' active' : ''}" id="alignLeftBtn">Left-aligned</button>
      </span>` : '';

  main.innerHTML = `
    <div class="row-actions">
      <button class="btn" id="printBtn">&#128438; Print (${batch.length} ${kind === 'letter' ? 'letters' : 'envelopes'})</button>
      <button class="btn" id="savePdfBtn">&#11015; Save as PDF&hellip;</button>
      <button class="btn" id="saveArchiveBtn">&#128190; Save PDF &amp; mark as sent&hellip;</button>
      <button class="btn-secondary" id="markSentBtn">&#10003; Mark these ${batch.length} as sent</button>
      ${alignToggleHtml}
      <span id="printMsg" style="color:var(--muted);font-size:0.82rem"></span>
    </div>
    <div class="stat-bar"><span>${mix}</span><span>Each ${kind === 'letter' ? 'letter uses' : 'envelope matches'} the copy for its folder — letters and envelopes are in the same order.</span>
    </div>
    ${typeof contactedBarHtml === 'function' ? contactedBarHtml(batch) : ''}
    <div id="pdfArea">${batch.map((l, i) => docWrapHtml(l, i, kind)).join('')}</div>
  `;
  const okToSend = action => typeof confirmRepeats !== 'function' || confirmRepeats(batch, action);
  document.getElementById('printBtn').addEventListener('click', () => { if (okToSend('Print these')) window.print(); });
  document.getElementById('pdfArea').addEventListener('click', (e) => {
    const wrap = e.target.closest('.doc-wrap');
    if (!wrap) return;
    const lead = batch[Number(wrap.dataset.idx)];
    const panel = wrap.querySelector('.doc-edit-panel');
    if (e.target.classList.contains('doc-remove-btn')) {
      lead.include = false;
      saveLeadsToStorage();
      render();
    } else if (e.target.classList.contains('doc-edit-btn')) {
      panel.hidden = !panel.hidden;
    } else if (e.target.classList.contains('edit-cancel-btn')) {
      panel.hidden = true;
    } else if (e.target.classList.contains('edit-save-btn')) {
      const lines = wrap.querySelector('.edit-recipient').value.split('\n').map(s => s.trim()).filter(Boolean);
      if (lines.length) lead.recipientLines = lines;
      const salInput = wrap.querySelector('.edit-salutation');
      if (salInput) lead.salutation = salInput.value.trim();
      lead.edited = true;
      saveLeadsToStorage();
      wrap.outerHTML = docWrapHtml(lead, Number(wrap.dataset.idx), kind);
    }
  });
  if (kind === 'envelope') {
    document.getElementById('alignCenterBtn').addEventListener('click', () => { setEnvAlign('center'); render(); });
    document.getElementById('alignLeftBtn').addEventListener('click', () => { setEnvAlign('left'); render(); });
  }
  async function buildAndSavePdf(btn){
    const msg = document.getElementById('printMsg');
    const area = document.getElementById('pdfArea');
    btn.disabled = true; const original = btn.innerHTML;
    const dateStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    const filename = `Silverdale ${kind === 'letter' ? 'Letters' : 'Envelopes'} - ${dateStr}.pdf`;
    const format = kind === 'letter' ? 'a4' : [220, 110];
    const orientation = kind === 'letter' ? 'portrait' : 'landscape';

    area.classList.add('pdf-exporting');
    const pages = Array.from(area.querySelectorAll('.print-doc'));
    let ok = null;
    try {
      let pdf = null;
      for (let i = 0; i < pages.length; i++) {
        btn.innerHTML = `Building PDF&hellip; (${i + 1}/${pages.length})`;
        const pageEl = pages[i];
        const rect = pageEl.getBoundingClientRect();
        // Capture very slightly short of the page's true height: at the
        // exact page-height boundary, sub-pixel rounding between
        // html2canvas's px measurement and jsPDF's mm page size can tip
        // a single row of pixels onto a spurious, near-blank extra page.
        const safeHeight = rect.height - 3;
        const opt = {
          margin: 0,
          html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', height: safeHeight },
          jsPDF: { unit: 'mm', format, orientation }
        };
        if (i === 0) {
          pdf = await html2pdf().set(opt).from(pageEl).toPdf().get('pdf');
        } else {
          const canvas = await html2pdf().set(opt).from(pageEl).toCanvas().get('canvas');
          pdf.addPage(format, orientation);
          const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
          pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, pw, ph);
        }
      }
      pdf.save(filename);
      if (msg) msg.textContent = `Saved — check your Downloads (or wherever your browser saves files) for "${filename}".`;
      ok = filename;
    } catch (err) {
      if (msg) msg.textContent = 'Could not build the PDF: ' + err.message;
    } finally {
      area.classList.remove('pdf-exporting');
      btn.disabled = false; btn.innerHTML = original;
    }
    return ok;
  }
  // Records each lead as sent, with a snapshot of exactly what was
  // printed (address, salutation, which letter, date, PDF file + page),
  // so the Archive can show the actual letter that went out later.
  function archiveBatch(hide, pdfFile){
    const log = getLog();
    const today = todayISO();
    const letterDate = todayOrdinal();
    batch.forEach((l, i) => {
      if (l.ref) log[l.ref] = {
        date: today, name: l.applicant, source: leadFolder(l) === 'business' ? 'business' : 'planning',
        copy: leadFolder(l), recipientLines: l.recipientLines, salutation: l.salutation, letterDate, bodyParas: letterParas(l),
        description: l.description || '', appliedDate: l.appliedDate || '', decidedDate: l.decidedDate || '',
        keyVal: l.keyVal || '', siteExtent: l.siteExtent || null, sentToPrintAt: l.sentToPrintAt || '',
        ...(pdfFile ? (kind === 'letter' ? { pdfFile, pdfPage: i + 1 } : { envelopePdfFile: pdfFile, envelopePdfPage: i + 1 }) : {})
      };
      l.alreadyProcessed = true;
      if (hide) l.include = false;
    });
    saveLog(log);
    saveLeadsToStorage();
  }
  document.getElementById('savePdfBtn').addEventListener('click', () => { if (okToSend('Make the PDF')) buildAndSavePdf(document.getElementById('savePdfBtn')); });
  document.getElementById('saveArchiveBtn').addEventListener('click', async () => {
    if (!okToSend('Save and mark them as sent')) return;
    const btn = document.getElementById('saveArchiveBtn');
    const filename = await buildAndSavePdf(btn);
    if (!filename) return;
    archiveBatch(true, filename);
    render();
  });
  document.getElementById('markSentBtn').addEventListener('click', () => {
    if (!okToSend('Mark them as sent')) return;
    archiveBatch(false);
    document.getElementById('markSentBtn').textContent = '✓ Logged';
    document.getElementById('markSentBtn').disabled = true;
  });
}

function docWrapHtml(l, idx, kind){
  const docHtml = kind === 'letter' ? letterHtml(l) : envelopeHtml(l);
  const salutationField = kind === 'letter'
    ? `<label>Salutation</label><input class="edit-salutation" type="text" value="${esc(l.salutation)}">`
    : '';
  return `<div class="doc-wrap" data-idx="${idx}">
    <div class="doc-toolbar no-print">
      <span class="doc-copy-label">${FOLDERS[leadFolder(l)]} letter</span>
      <button class="doc-edit-btn" type="button">&#9998; Edit this one</button>
      <button class="doc-edit-btn doc-remove-btn" type="button">&#10005; Take off print list</button>
    </div>
    ${kind === 'letter' && typeof contactFlagHtml === 'function' ? `<div class="no-print">${contactFlagHtml(l)}</div>` : ''}
    ${docHtml}
    <div class="doc-edit-panel no-print" hidden>
      <label>Recipient name &amp; address (one line each)</label>
      <textarea class="edit-recipient" rows="5">${esc(l.recipientLines.join('\n'))}</textarea>
      ${salutationField}
      <div class="doc-edit-actions">
        <button class="edit-save-btn" type="button">Save changes</button>
        <button class="edit-cancel-btn" type="button">Cancel</button>
      </div>
    </div>
  </div>`;
}
function letterParas(l){
  const folder = leadFolder(l);
  if (folder === 'personal') return l.personalParas || personalDraft(l);
  return ({ approved: letterBody, pending: pendingLetterBody, business: businessLetterBody }[folder])();
}
// Which standard letter a personalised one starts from.
function baseCopy(l){ return l.source === 'business' ? 'business' : l.planningStatus === 'pending' ? 'pending' : 'approved'; }
// "the erection of a detached dwelling" from the register description, or null when the wording
// is paperwork that wouldn't read well in a letter.
function jobPhrase(l){
  let d = (l.description || '').replace(/\s+/g, ' ').trim().replace(/\.$/, '');
  if (!d || /condition|information in relation|approval of details|non-material|minor change/i.test(d)) return null;
  if (d.length > 140) d = d.slice(0, 140).replace(/\s+\S*$/, '');
  d = d.charAt(0).toLowerCase() + d.slice(1);
  return /^(erection|construction|demolition|installation|alterations?|conversion|change|creation|extension|replacement|formation|provision|refurbishment|redevelopment|use)\b/.test(d) ? 'the ' + d : d;
}
function personalDraft(l){
  const base = baseCopy(l);
  const paras = ({ approved: letterBody, pending: pendingLetterBody, business: businessLetterBody }[base])().slice();
  const job = jobPhrase(l);
  if (job && base === 'approved') paras[0] = paras[0].replace('on your recent planning approval.', `on your recent planning approval for ${esc(job)}.`);
  if (job && base === 'pending') paras[0] = paras[0].replace('for your project.', `for ${esc(job)}.`);
  return paras;
}
// Stored paragraphs are HTML (the standard letters use &amp; etc.); the editor works in plain text.
function parasToText(paras){ const t = document.createElement('textarea'); return paras.map(p => { t.innerHTML = p; return t.value; }).join('\n\n'); }
function textToParas(text){ return text.split(/\n\s*\n/).map(p => p.replace(/\s*\n\s*/g, ' ').trim()).filter(Boolean).map(esc); }
function letterHtml(l){
  return `<div class="print-doc letter-page">
    <div class="letter-head">
      <div class="letter-logo"><img src="${IMG.logo}" alt="Silverdale"></div>
      <div class="letter-sender">
        <div class="name">Silverdale Limited</div>
        <div class="addr">23 Circular Road, Douglas, Isle of Man, IM1 1AF<br>01624 614845 &nbsp;|&nbsp; info@silverdale.im &nbsp;|&nbsp; silverdale.im</div>
      </div>
    </div>
    <div class="letter-date">${esc(l.letterDate || todayOrdinal())}</div>
    <div class="letter-addr">${l.recipientLines.map(esc).join('<br>')}</div>
    <div class="letter-body">
      <p>${esc(l.salutation)}</p>
      ${(l.bodyParas || letterParas(l)).map(p => `<p>${p}</p>`).join('')}
      <p>Kind regards,</p>
      <div class="letter-sign"><img src="${IMG.sig}" alt="Signature"></div>
      <p style="margin-top:0">Andrew Harrison<br>Director, Silverdale Limited</p>
    </div>
  </div>`;
}
function envelopeHtml(l){
  const [name, ...addr] = l.recipientLines;
  const alignClass = getEnvAlign() === 'left' ? ' align-left' : '';
  return `<div class="print-doc env-page${alignClass}">
    <div class="env-logo"><img src="${IMG.logo}" alt="Silverdale"></div>
    <div class="env-recipient">
      <div class="er-block">
        <div class="er-name">${esc(name)}</div>
        ${addr.map(line => `<div class="er-line">${esc(line)}</div>`).join('')}
      </div>
    </div>
  </div>`;
}

document.querySelectorAll('.navbtn').forEach(btn => btn.addEventListener('click', () => { state.tab = btn.dataset.tab; render(); }));
document.getElementById('downloadBackupBtn').addEventListener('click', downloadBackup);
document.getElementById('restoreBackupBtn').addEventListener('click', () => document.getElementById('restoreBackupInput').click());
document.getElementById('restoreBackupInput').addEventListener('change', e => restoreBackupFile(e.target.files[0]));

document.getElementById('signOutBtn').addEventListener('click', () => {
  if (confirm('Sign out of Silverdale Canvassing on this browser? This also signs you out of the Job Planner here.')) logout();
});

function gateMessage(text, kind){ const m = document.getElementById('gateMsg'); m.textContent = text || ''; m.className = 'gate-msg' + (kind ? ' ' + kind : ''); }
function showGate(){
  document.body.classList.add('locked');
  document.getElementById('gateChecking').style.display = 'none';
  document.getElementById('gateForms').style.display = '';
}
document.getElementById('gateLinkForm').addEventListener('submit', async e => {
  e.preventDefault();
  gateMessage('Sending…');
  try { await sendMagicLink(document.getElementById('gateEmail').value.trim()); gateMessage('Check your email and click the link. This page signs in on its own once you do.', 'ok'); }
  catch (err) { gateMessage(err.message, 'err'); }
});
document.getElementById('gatePwForm').addEventListener('submit', async e => {
  e.preventDefault();
  gateMessage('Signing in…');
  try { await login(document.getElementById('gatePwEmail').value.trim(), document.getElementById('gatePwPass').value); gateMessage(''); boot(); }
  catch (err) { gateMessage(err.message, 'err'); }
});

async function boot(){
  const session = await ensureLoggedIn();
  if (!session) { showGate(); return; }
  try { const u = await cloudFetch('/auth/v1/user'); if (u.ok) cloud.email = (await u.json()).email || ''; } catch {}
  let mode;
  try { mode = await cloudStart(); } catch { mode = 'offline'; }
  if (mode === 'not-allowed') {
    showGate();
    document.getElementById('gateForms').style.display = 'none';
    gateMessage(`${cloud.email || 'This login'} doesn't have access to Silverdale Canvassing. Sign out and use a director's email.`, 'err');
    const b = document.createElement('button'); b.className = 'btn-secondary'; b.textContent = 'Sign out'; b.style.marginTop = '12px';
    b.onclick = logout; document.querySelector('.gate-card').appendChild(b);
    return;
  }
  document.body.classList.remove('locked');
  if (mode === 'ok') cloudStatus('ok', 'Saved online');
  else if (mode === 'not-set-up') cloudStatus('warn', 'Online saving not set up yet (saved on this computer)');
  else cloudStatus('warn', "Can't reach online storage (saved on this computer)");
  await Promise.all([loadLetterImages(), loadEstimatesCache()]);
  leads = loadLeadsFromStorage().map(classify);
  render();
}
boot();

// Two tabs of this app open at once used to be a silent data-loss trap:
// the stale tab would later save its old in-memory list over the other's
// work. Picking up the other tab's changes as they happen closes that.
window.addEventListener('storage', e => {
  if (e.key === LS_LEADS) leads = loadLeadsFromStorage().map(classify);
  else if (e.key === LS_LOG || e.key === LS_REGISTER_DISMISSED) leads = leads.map(classify);
  else return;
  render();
});
</script>
</body>
</html>
