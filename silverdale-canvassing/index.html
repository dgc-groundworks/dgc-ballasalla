<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silverdale Canvassing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#0f1117;--surf:#1a1d27;--surf2:#222636;--bord:#2e3347;--accent:#f59e0b;--text:#e2e8f0;--muted:#64748b;--green:#22c55e;--red:#ef4444}
[data-theme="light"]{--bg:#f0f4f8;--surf:#ffffff;--surf2:#e4ecf4;--bord:#b8ccd8;--accent:#c26a00;--text:#1a2b3c;--muted:#5c7a94;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}
.topbar{background:var(--surf);border-bottom:1px solid var(--bord);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.topbar h1{font-size:1.05rem;font-weight:800;color:var(--accent)}
.topbar .sub{font-size:0.78rem;color:var(--muted);margin-left:auto}
.theme-toggle-btn{background:none;border:1px solid var(--bord);border-radius:6px;color:var(--muted);font-size:11px;font-weight:700;padding:5px 10px;cursor:pointer;font-family:inherit;letter-spacing:.02em;white-space:nowrap}
.theme-toggle-btn:hover{border-color:var(--accent);color:var(--accent)}
.nav{background:var(--surf);border-bottom:1px solid var(--bord);padding:0 20px;display:flex;gap:4px;position:sticky;top:49px;z-index:9}
.navbtn{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:0.85rem;font-weight:700;padding:10px 14px;cursor:pointer;font-family:inherit}
.navbtn:hover{color:var(--text)}
.navbtn.active{color:var(--accent);border-bottom-color:var(--accent)}
.main{padding:22px;max-width:1200px;margin:0 auto}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted)}
textarea{width:100%;min-height:220px;background:var(--surf);border:1px solid var(--bord);border-radius:8px;color:var(--text);padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:0.8rem;resize:vertical}
.hint{font-size:0.8rem;color:var(--muted);margin:10px 0 16px}
.drop-zone.dragover textarea{border-color:var(--accent);border-style:dashed}
.drop-hint{font-size:0.78rem;color:var(--muted);margin-top:6px}
.link-btn{background:none;border:none;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.bulk-add-log{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--bord)}
.bulk-add-log textarea{min-height:90px}
.btn{background:var(--accent);color:#1a1d27;border:none;padding:10px 20px;border-radius:6px;font-size:0.88rem;font-weight:800;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.4;cursor:default}
.btn-secondary{background:var(--surf2);color:var(--text);border:1px solid var(--bord);padding:9px 18px;border-radius:6px;font-size:0.85rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn-danger{background:none;border:1px solid rgba(239,68,68,.4);color:var(--red);padding:6px 12px;border-radius:6px;font-size:0.76rem;cursor:pointer;font-family:inherit}
.row-actions{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.stat-bar{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px;font-size:0.82rem;color:var(--muted)}
.stat-bar b{color:var(--text)}
table.leads{width:100%;border-collapse:collapse;font-size:0.8rem}
table.leads th{text-align:left;padding:8px 10px;background:var(--surf2);border-bottom:1px solid var(--bord);white-space:nowrap;position:sticky;top:94px}
table.leads td{padding:8px 10px;border-bottom:1px solid var(--bord);vertical-align:top}

.lead-section-hdr{font-size:0.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--bord)}
.lead-section-hdr:first-of-type{margin-top:4px}
.lead-list{display:flex;flex-direction:column;background:var(--surf);border:1px solid var(--bord);border-radius:10px;overflow:hidden}
.lead-row{display:flex;align-items:center;gap:16px;padding:14px 18px;border-bottom:1px solid var(--bord)}
.lead-list .lead-row:last-child{border-bottom:none}
.lead-row.flagged{background:rgba(245,158,11,.06)}
.lr-main{flex:1;min-width:0}
.lr-applicant{font-size:0.98rem;font-weight:700;margin-bottom:3px}
.reg-name-toggle{background:none;border:none;padding:0;margin-bottom:3px;font:inherit;font-size:0.98rem;font-weight:700;color:var(--text);cursor:pointer;text-align:left;display:block}
.reg-name-toggle:hover{color:var(--accent)}
.lr-meta{font-size:0.78rem;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lr-meta select{background:var(--bg);border:1px solid var(--bord);border-radius:5px;color:var(--muted);padding:3px 6px;font-size:0.74rem;font-family:inherit}
.sal-input{width:100%;max-width:420px;background:transparent;border:1px solid transparent;border-radius:6px;color:var(--text);padding:6px 8px;margin-left:-8px;font-size:0.92rem;font-family:inherit}
.register-pull{margin-top:32px;padding-top:22px;border-top:1px solid var(--bord)}
.register-pull input[type=date],.register-pull input[type=text],.register-pull select{background:var(--surf);border:1px solid var(--bord);border-radius:6px;color:var(--text);padding:6px 8px;font-size:0.85rem;font-family:inherit}
.register-pull label{font-size:0.85rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sal-input:hover{border-color:var(--bord)}
.sal-input:focus{background:var(--bg);border-color:var(--accent);outline:none}
.lr-side{display:flex;align-items:center;gap:12px;flex-shrink:0}
.send-toggle{border:none;border-radius:20px;padding:9px 20px;font-size:0.82rem;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;min-width:104px}
.send-toggle.on{background:var(--green);color:#08210f}
.send-toggle.off{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.f-move{background:var(--bg);border:1px solid var(--bord);border-radius:5px;color:var(--text);padding:4px 6px;font-size:0.76rem;font-family:inherit}
.send-toggle:disabled{opacity:.4;cursor:default}
.tag{display:inline-block;font-size:0.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:4px}
.tag-excl{background:rgba(239,68,68,.15);color:var(--red)}
.tag-dupe{background:rgba(100,116,139,.2);color:var(--muted)}
.tag-review{background:rgba(245,158,11,.18);color:var(--accent)}
.tag-approved{background:rgba(34,197,94,.15);color:var(--green)}
.nav{overflow-x:auto}
.navbtn{white-space:nowrap}
.nav-count:not(:empty){display:inline-block;min-width:18px;padding:0 6px;margin-left:5px;border-radius:9px;background:var(--surf2);color:var(--text);font-size:0.7rem;line-height:1.5}
.reg-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.reg-actions button{padding:6px 10px;font-size:0.76rem;white-space:nowrap}
.reg-actions button.natural{border-color:var(--accent);color:var(--accent)}
.f-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.f-actions .btn-secondary{padding:6px 10px;font-size:0.76rem}
.f-addr{font-size:0.78rem;color:var(--muted);margin-top:4px}
.f-edit-panel{margin-top:10px;padding:10px 12px;border:1px solid var(--bord);border-radius:8px;background:var(--bg)}
.f-edit-panel textarea{min-height:110px;font-family:inherit;font-size:0.85rem}
.doc-copy-label{font-size:0.75rem;color:var(--muted);margin-right:auto;align-self:center}
.doc-toolbar{gap:8px}
.letter-preview{zoom:.62;margin-top:12px;overflow:hidden}
@media (max-width:760px){.lead-row{flex-wrap:wrap}.lr-side{flex-wrap:wrap;width:100%}.main{padding:16px}}
.print-doc{background:#fff;color:#000;box-shadow:0 4px 32px rgba(0,0,0,.4);margin:0 auto 28px;font-family:'Cormorant Garamond',Garamond,'Times New Roman',serif;font-variant-numeric:lining-nums proportional-nums;font-feature-settings:"lnum" 1,"pnum" 1}
/* Page-to-page gap is for on-screen viewing only -- html2canvas
   captures the full margin box, so it must collapse to 0 during a
   PDF export or every captured page gains extra blank height and the
   envelope's aspect ratio comes out wrong. */
.pdf-exporting .print-doc{margin:0;box-shadow:none}
.letter-page{width:210mm;min-height:297mm;padding:14mm 20mm;position:relative}
.letter-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:10mm}
.letter-logo img{height:16mm;width:auto;display:block}
.letter-sender{text-align:right}
.letter-sender .name{font-weight:600;font-size:16pt;letter-spacing:.01em;color:#000}
.letter-sender .addr{font-size:11.5pt;color:#000;margin-top:6px;line-height:1.6}
.letter-date{font-size:13.5pt;text-align:right;color:#000;margin-top:0}
.letter-addr{font-size:13.5pt;line-height:1.6;color:#000;margin-top:56px}
.letter-body p{font-size:12.5pt;line-height:1.35;margin-top:9px;color:#000}
.letter-body p:first-of-type{margin-top:45px}
.letter-sign{margin-top:14px}
.letter-sign img{height:59px}
.letter-body p:last-of-type{margin-top:0}
.env-page{width:220mm;height:110mm;padding:14mm 16mm;position:relative;background:#fff}
.env-logo{position:absolute;left:16mm;top:13mm}
.env-logo img{height:11mm;width:auto;display:block}
.env-recipient{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Garamond,'Times New Roman',serif;line-height:1.48}
.env-recipient .er-block{text-align:center}
.env-recipient .er-name{font-size:13.5pt;font-weight:600;letter-spacing:.01em;color:#000;margin-bottom:3pt}
.env-recipient .er-line{font-size:11pt;font-weight:400;color:#000}
.env-page.align-left .env-recipient{left:70mm;right:16mm;top:46mm;bottom:15mm;align-items:flex-start;justify-content:flex-start}
.env-page.align-left .env-recipient .er-block{text-align:left}
.align-toggle{display:inline-flex;gap:6px;margin-left:10px}
.align-toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.doc-wrap{max-width:820px;margin:0 auto}
.doc-toolbar{display:flex;justify-content:flex-end;max-width:210mm;margin:0 auto}
.doc-edit-btn{font-size:0.78rem;padding:5px 10px;border-radius:5px;border:1px solid var(--bord);background:var(--surf2);color:var(--text);cursor:pointer;font-family:inherit}
.doc-edit-panel{max-width:210mm;margin:8px auto 20px;padding:12px 16px;border:1px solid var(--bord);border-radius:8px;background:var(--surf)}
.doc-edit-panel label{display:block;font-size:0.78rem;color:var(--muted);margin:8px 0 3px;font-weight:700}
.doc-edit-panel textarea,.doc-edit-panel input{width:100%;box-sizing:border-box;font-family:inherit;font-size:0.85rem;padding:6px 8px;border:1px solid var(--bord);border-radius:5px;background:var(--bg);color:var(--text)}
.doc-edit-actions{display:flex;gap:8px;margin-top:10px}
@media print{
  .topbar,.nav,.row-actions,.stat-bar,.doc-toolbar,.doc-edit-panel{display:none!important}
  body{background:#fff}
  .main{padding:0;max-width:100%}
  .print-doc{box-shadow:none;margin:0}
  .letter-page,.env-page{page-break-after:always}
  @page{margin:0}
}
</style>
</head>
<body>
<header class="topbar">
  <h1>Silverdale Canvassing</h1>
  <span class="sub">Planning-leads intake &rarr; letters &amp; envelopes, ready to print</span>
  <button class="btn-secondary" id="downloadBackupBtn" title="Save all leads and the processed log to a file, so you can load it on any device">&#128190; Backup</button>
  <button class="btn-secondary" id="restoreBackupBtn" title="Load a previously saved backup file">&#8593; Restore</button>
  <input type="file" id="restoreBackupInput" accept=".json,application/json" style="display:none">
  <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">Light Mode</button>
</header>
<nav class="nav">
  <button class="navbtn active" data-tab="import">Import &mdash; Planning</button>
  <button class="navbtn" data-tab="importBiz">Import &mdash; Businesses</button>
  <button class="navbtn" data-tab="fApproved">Approved<span class="nav-count" data-count="approved"></span></button>
  <button class="navbtn" data-tab="fPending">Pending<span class="nav-count" data-count="pending"></span></button>
  <button class="navbtn" data-tab="fBusiness">Businesses<span class="nav-count" data-count="business"></span></button>
  <button class="navbtn" data-tab="letters">Print — Letters<span class="nav-count" data-count="print"></span></button>
  <button class="navbtn" data-tab="envelopes">Print — Envelopes</button>
  <button class="navbtn" data-tab="archive">Archive &mdash; Sent &amp; Not chasing</button>
</nav>
<main class="main" id="mainArea"><p class="empty-state">Loading…</p></main>

<script>
// ---------------------------------------------------------------
// Silverdale Canvassing — pulls a pasted table of IoM planning
// applications, classifies each lead, applies the standing
// never-contact list and a dedup log (both persisted in
// localStorage — no backend yet, this is v1), then generates
// print-ready branded letters and DL envelopes from the templates
// agreed 8 Sep 2026.
//
// v1 intake is paste-based, not a live pull from pbc.gov.im: a
// browser page can't cross-origin-scrape a .gov site directly, and
// building a real scraper needs a server-side piece (a Supabase
// Edge Function, same pattern as Dayworks' AI extraction) — that's
// a deliberate next phase, not skipped by accident. For now: copy
// the table from the Weekly List export (or the PDF) and paste it
// in on the Import tab.
// ---------------------------------------------------------------

// ---- Theme (dark default, light optional, remembered per browser) ----
const LS_THEME = 'silverdale_canvassing_theme';
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggleBtn');
  if (btn) btn.textContent = theme === 'light' ? 'Dark Mode' : 'Light Mode';
}
function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  applyTheme(next);
  try { localStorage.setItem(LS_THEME, next); } catch {}
}
(function initTheme(){
  let saved = 'dark';
  try { saved = localStorage.getItem(LS_THEME) || 'dark'; } catch {}
  applyTheme(saved);
})();

const STANDING_EXCLUDE = ['manx utilities', 'hartford homes', 'dandara', 'excel'];
const LS_LOG = 'silverdale_canvassing_processed';   // { ref: { date, name } }
const LS_LEADS = 'silverdale_canvassing_leads';     // last-parsed batch, so a refresh doesn't lose work
const LS_ENV_ALIGN = 'silverdale_canvassing_env_align';  // 'center' | 'left' — envelope address alignment
const LS_REGISTER_DISMISSED = 'silverdale_canvassing_register_dismissed'; // { ref: { date, name } } — "looked at it, not chasing this one" from a register pull, distinct from the sent log


let leads = [];      // working batch
let state = { tab: 'import' };

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Lets a paste box also accept a dropped or picked file — reads it as
// text and fills the textarea, since dropping a file onto a plain
// <textarea> just inserts its filename, not its contents.
function wireFileDrop(dropZoneId, fileInputId, fileBtnId, textareaId){
  const dropZone = document.getElementById(dropZoneId);
  const fileInput = document.getElementById(fileInputId);
  const textarea = document.getElementById(textareaId);
  const readFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { textarea.value = reader.result; };
    reader.readAsText(file);
  };
  document.getElementById(fileBtnId).addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => readFile(fileInput.files[0]));
  ['dragover', 'dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, e => e.preventDefault()));
  dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    dropZone.classList.remove('dragover');
    readFile(e.dataTransfer.files[0]);
  });
}
function todayOrdinal(){
  const d = new Date();
  const day = d.getDate();
  const suf = (day % 10 === 1 && day !== 11) ? 'st' : (day % 10 === 2 && day !== 12) ? 'nd' : (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
  return day + suf + ' ' + d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
}

function getEnvAlign(){ try { return localStorage.getItem(LS_ENV_ALIGN) || 'center'; } catch { return 'center'; } }
function setEnvAlign(v){ try { localStorage.setItem(LS_ENV_ALIGN, v); } catch {} }
function getLog(){ try { return JSON.parse(localStorage.getItem(LS_LOG) || '{}'); } catch { return {}; } }
function saveLog(log){ try { localStorage.setItem(LS_LOG, JSON.stringify(log)); } catch {} }
function getDismissed(){ try { return JSON.parse(localStorage.getItem(LS_REGISTER_DISMISSED) || '{}'); } catch { return {}; } }
function saveDismissed(d){ try { localStorage.setItem(LS_REGISTER_DISMISSED, JSON.stringify(d)); } catch {} }
function saveLeadsToStorage(){ try { localStorage.setItem(LS_LEADS, JSON.stringify(leads)); } catch {} }
function loadLeadsFromStorage(){ try { return JSON.parse(localStorage.getItem(LS_LEADS) || '[]'); } catch { return []; } }

// The folder a lead sits in decides which letter it gets. Leads saved
// before folders existed have no `folder`, so fall back to what they are.
const FOLDERS = { approved: 'Approved', pending: 'Pending', business: 'Businesses' };
function leadFolder(l){ return l.folder || (l.source === 'business' ? 'business' : l.planningStatus === 'pending' ? 'pending' : 'approved'); }
function todayISO(){ return new Date().toLocaleDateString('en-CA'); }
function prettyDate(iso){ return iso ? new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : ''; }

// Archive = "looked at it, not chasing it". Kept in its own list (never
// deleted), so anything archived by mistake can be brought straight back.
// An archived folder lead keeps its whole record, so it returns intact.
function bringBackFromArchive(ref){
  const d = getDismissed();
  const entry = d[ref];
  if (!entry) return;
  if (entry.lead && !leads.some(l => l.ref === ref)) leads.push(classify(entry.lead));
  delete d[ref];
  saveDismissed(d);
  saveLeadsToStorage();
}
function archiveLead(i){
  const l = leads[i];
  const d = getDismissed();
  d[l.ref] = { date: todayISO(), name: l.applicant, lead: l };
  saveDismissed(d);
  leads.splice(i, 1);
  saveLeadsToStorage();
}
function updateNavCounts(){
  const active = leads.filter(l => !l.alreadyProcessed);
  const counts = { approved: 0, pending: 0, business: 0 };
  active.forEach(l => counts[leadFolder(l)]++);
  counts.print = active.filter(l => l.include).length;
  counts.archive = Object.keys(getDismissed()).length;
  document.querySelectorAll('.nav-count').forEach(el => { el.textContent = counts[el.dataset.count] || ''; });
}

// Everything here lives only in this one browser's local storage — there's
// no server behind it. Backup/Restore is the safety net: a real file you
// can move between devices/browsers, or recover from if site data ever
// gets cleared.
function downloadBackup(){
  const data = {
    leads: loadLeadsFromStorage(),
    log: getLog(),
    archive: getDismissed(),
    envAlign: getEnvAlign(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Silverdale Canvassing Backup - ${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function restoreBackupFile(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch {
      alert('Could not read that file — is it a Silverdale Canvassing backup?');
      return;
    }
    const leadCount = Array.isArray(data.leads) ? data.leads.length : 0;
    const logCount = data.log && typeof data.log === 'object' ? Object.keys(data.log).length : 0;
    const archiveCount = data.archive && typeof data.archive === 'object' ? Object.keys(data.archive).length : 0;
    if (!confirm(`Restore this backup? It has ${leadCount} leads, ${logCount} logged as sent and ${archiveCount} archived. This replaces everything currently loaded in this browser.`)) return;
    saveLog(data.log && typeof data.log === 'object' ? data.log : {});
    if (data.archive && typeof data.archive === 'object') saveDismissed(data.archive);
    leads = (Array.isArray(data.leads) ? data.leads : []).map(classify);
    saveLeadsToStorage();
    if (data.envAlign) setEnvAlign(data.envAlign);
    state.tab = 'fApproved';
    render();
    alert('Backup restored.');
  };
  reader.readAsText(file);
}

// ---- Parsing a pasted table ----
// Expects tab-separated (straight copy from a spreadsheet or the
// PDF's extracted table) with columns roughly: No / Reference / Site
// Address / Applicant / Developer / Type of Development / Local
// Authority. Column order is detected from the header row where
// possible; falls back to positional guessing otherwise.
// Matches a planning reference like "26/00465/B" or "25/91215/B".
function looksLikeRef(s){ return /^\d{2}\/\d{3,6}\/[A-Za-z]$/.test((s || '').trim()); }

// ---- Local businesses (architects, engineers, etc.) ----
// A second, independent lead source alongside the planning-register pull.
// These are appended to the same working `leads` array (not a wholesale
// replace, since the business list is built up over time rather than
// refreshed weekly) so they share Review/Print/Edit/Archive and the same
// processed-log dedup as planning leads, per Ash's ask that it "be
// handled the same" and never send the same letter twice.
function parseCsvLine(line){
  const fields = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQuotes) {
      if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQuotes = false; }
      else cur += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { fields.push(cur); cur = ''; }
      else cur += c;
    }
  }
  fields.push(cur);
  return fields.map(f => f.trim());
}
function slugify(s){ return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }

function parseBusinessCSV(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if (!lines.length) return [];
  const header = parseCsvLine(lines[0]).map(h => h.toLowerCase());
  const col = name => header.indexOf(name);
  const iName = col('name'), iPractice = col('practice name'), iAddr1 = col('address line 1'),
        iAddr2 = col('address line 2'), iTown = col('town'), iPostcode = col('postcode'), iReg = col('iom reg number');
  const out = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCsvLine(lines[i]);
    if (!cols.some(c => c && c.trim())) continue;
    const name = iName >= 0 ? cols[iName] || '' : '';
    if (!name) continue;
    const practice = iPractice >= 0 ? cols[iPractice] || '' : '';
    const addr1 = iAddr1 >= 0 ? cols[iAddr1] || '' : '';
    const addr2 = iAddr2 >= 0 ? cols[iAddr2] || '' : '';
    const town = iTown >= 0 ? cols[iTown] || '' : '';
    const postcode = iPostcode >= 0 ? cols[iPostcode] || '' : '';
    const reg = iReg >= 0 ? cols[iReg] || '' : '';
    const firstName = name.split(' ')[0];
    out.push({
      ref: 'ARCH-' + (reg || slugify(name + '-' + practice)),
      applicant: name,
      site: practice + (town ? ', ' + town : ''),
      recipientLines: [name, practice, addr1, addr2, town, postcode].map(s => s.trim()).filter(Boolean),
      salutation: `Dear ${firstName},`,
      edited: true,    // protects our clean CSV-built address/salutation from classify()'s auto-rebuild
      include: false,  // opt-in — Ash picks which businesses to actually approach in Review
      hasAddress: !!(addr1 && addr1.toLowerCase() !== 'redacted' && postcode)
    });
  }
  return out;
}

// One letter per practice: a new business sharing a practice name or
// office address with someone already sent (or already waiting) is
// flagged Check rather than queued as a second letter to the same firm.
function practiceKeys(lines){
  if (!lines || lines.length < 3) return [];
  const norm = t => (t || '').toLowerCase().replace(/\b(ltd|limited)\b\.?/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
  return [norm(lines[1]), norm(lines[2]) + '|' + norm(lines[lines.length - 1])].filter(k => k && k !== '|');
}
function flagSamePractice(newLeads){
  const seen = new Map();
  const note = (lines, label) => practiceKeys(lines).forEach(k => { if (!seen.has(k)) seen.set(k, label); });
  Object.values(getLog()).forEach(e => { if (e.source === 'business') note(e.recipientLines, `${e.name} (sent ${prettyDate(e.date)})`); });
  leads.filter(l => leadFolder(l) === 'business' && !newLeads.includes(l)).forEach(l => note(l.recipientLines, l.applicant));
  newLeads.forEach(l => {
    if (l.alreadyProcessed || l.excludedReason) return;
    const match = practiceKeys(l.recipientLines).map(k => seen.get(k)).find(Boolean);
    if (match) {
      l.extraReviewNote = l.extraReviewNote || `Same practice as ${match} — one letter per practice is usually enough.`;
      l.needsReview = true;
      l.reviewNote = l.reviewNote || l.extraReviewNote;
    } else note(l.recipientLines, l.applicant);
  });
}

function parseInput(text){
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];
  const rows = lines.map(l => l.split('\t').map(c => c.trim()));
  const header = rows[0].map(c => c.toLowerCase());
  const findCol = names => header.findIndex(h => names.some(n => h.includes(n)));
  let cRef = findCol(['reference']), cSite = findCol(['site address', 'address']),
      cApplicant = findCol(['applicant', 'developer']), cType = findCol(['type']),
      cAuth = findCol(['authority']);
  let start = (cRef >= 0 || cSite >= 0 || cApplicant >= 0) ? 1 : 0;

  if (cRef < 0) {
    // No header keywords found — locate the reference column by what its
    // values actually look like (across every row) rather than assuming
    // a fixed position, since a pasted table may or may not have a
    // leading row-number column or a header row at all.
    const width = Math.max(...rows.map(r => r.length));
    let best = -1, bestCount = 0;
    for (let c = 0; c < width; c++) {
      const count = rows.filter(r => looksLikeRef(r[c])).length;
      if (count > bestCount) { bestCount = count; best = c; }
    }
    if (best >= 0) {
      cRef = best;
      start = looksLikeRef(rows[0][cRef]) ? 0 : 1;
    } else {
      cRef = 1; start = 0; // total fallback: assume a leading "No." column
    }
    if (cSite < 0) cSite = cRef + 1;
    if (cApplicant < 0) cApplicant = cRef + 2;
    if (cType < 0) cType = cRef + 3;
    if (cAuth < 0) cAuth = cRef + 4;
  } else {
    if (cSite < 0) cSite = cRef + 1;
    if (cApplicant < 0) cApplicant = cRef + 2;
    if (cType < 0) cType = cRef + 3;
    if (cAuth < 0) cAuth = cRef + 4;
  }

  const out = [];
  for (let i = start; i < rows.length; i++) {
    const r = rows[i];
    if (r.length < 2) continue;
    const ref = (r[cRef] || '').trim();
    const site = (r[cSite] || '').trim();
    const applicant = (r[cApplicant] || '').trim();
    if (!ref && !site && !applicant) continue;
    out.push(classify({
      ref, site, applicant,
      type: (r[cType] || '').trim(),
      authority: (r[cAuth] || '').trim()
    }));
  }
  return out;
}

const COMPANY_WORDS = /\b(ltd|limited|llp|plc|commissioners|council|enterprises|group|homes|developments|hire|innovation|advocates|solicitors)\b/i;
const TITLE_RE = /^(mr|mrs|miss|ms|dr)\b/i;

function classify(lead){
  const log = getLog();
  const applicantLower = lead.applicant.toLowerCase();

  lead.excludedReason = null;
  const screened = `${applicantLower} ${lead.site.toLowerCase()} ${(lead.agentText || '').toLowerCase()}`;
  for (const name of STANDING_EXCLUDE) {
    if (screened.includes(name)) { lead.excludedReason = 'Standing never-contact: ' + name; break; }
  }
  lead.alreadyProcessed = !!log[lead.ref];

  lead.needsReview = false;
  lead.reviewNote = '';
  if (/not legible|illegible|acting for|not stated/i.test(lead.applicant)) {
    lead.needsReview = true; lead.reviewNote = 'Applicant unclear on the form — check before sending.';
  }
  // Flags set when the lead was added (no applicant on the register, no
  // postal address, government body) must survive every reload.
  if (lead.extraReviewNote) { lead.needsReview = true; lead.reviewNote = lead.reviewNote || lead.extraReviewNote; }

  // Checked on the name with any bracketed aside removed first, so an
  // individual like "Mr Wesley Roussouw (H&B Developments)" isn't
  // misclassified as a company just because of what's in brackets. A
  // leading personal title always wins (individual); otherwise Company
  // is the positive signal (Ltd/Limited/Commissioners/etc.), Homeowner
  // is the safe default.
  const mainText = lead.applicant.replace(/\([^)]*\)/g, '').trim();
  lead.type = TITLE_RE.test(mainText) ? 'Homeowner' : (COMPANY_WORDS.test(mainText) ? 'Company' : 'Homeowner');

  // Skip recomputing these if the recipient/salutation were hand-edited
  // via the "Edit this one" facility on the Print tabs — otherwise the
  // next reload (which re-runs classify() on every stored lead) would
  // silently overwrite the correction with the auto-generated version.
  if (!lead.edited) {
    lead.recipientLines = buildAddressBlock(lead);
    lead.salutation = buildSalutation(lead);
    if (lead.salutation === 'Dear Sir/Madam,' && lead.type === 'Homeowner') {
      lead.needsReview = true;
      lead.reviewNote = lead.reviewNote || 'Joint applicants with different surnames — check the salutation before sending.';
    }
  }

  // Send by default — homeowners and businesses alike — unless it's on
  // the standing never-contact list or flagged for a manual look
  // (illegible/agent-only/genuinely unresolved name). "Already sent" is
  // shown as a warning tag, not an automatic exclude — saving/archiving
  // a batch must never silently make leads disappear from Print/Review.
  // Only set on first classification of a lead — classify() re-runs on
  // every stored lead on every reload, so once a value exists here it
  // must be left alone, or a manual Send/Don't-send toggle in Review
  // would get silently reverted the next time the page loads.
  if (lead.include === undefined) {
    lead.include = !lead.excludedReason && !lead.needsReview;
  }
  // The standing never-contact list is a hard business rule, not a
  // suggestion — always enforced, even over a manual toggle.
  if (lead.excludedReason) lead.include = false;
  return lead;
}

function buildAddressBlock(lead){
  const name = lead.applicant.replace(/\s*\([^)]*\)\s*/g, ' ').trim();
  let addrParts = lead.site.split(',').map(s => s.trim()).filter(Boolean);
  // Site address sometimes repeats the company name as its own first
  // segment (e.g. "Mann Crane Hire Ltd, Balthane Industrial Estate...")
  // — drop it there so it isn't printed twice.
  if (addrParts.length && addrParts[0].toLowerCase() === name.toLowerCase()) addrParts = addrParts.slice(1);
  return [name || '(Name unclear — check)'].concat(addrParts);
}

// Strips a trailing "&"/"and" connector before taking the last word, so
// "Martyn Lester &" (mid-string, before the next title) correctly
// yields the surname "Lester" rather than the ampersand itself.
function lastWord(s){
  const t = (s || '').trim().replace(/\s*(?:&|and)\s*$/i, '').trim();
  if (!t) return '';
  return (t.split(/\s+/).pop() || '').replace(/[.,]/g, '');
}
function cap(s){ return s ? s[0].toUpperCase() + s.slice(1).toLowerCase() : s; }

function buildSalutation(lead){
  // Illegible/agent-only/unstated applicants aren't real names to parse —
  // trying just produces garbled output. Already flagged for a manual
  // look in classify(); default cleanly instead of guessing.
  if (/not legible|illegible|acting for|not stated/i.test(lead.applicant)) return 'Dear Sir/Madam,';
  if (lead.type === 'Company') {
    // Prefer an actual company name in brackets over the named individual
    // in front of it — "Mr Allan & Dave Kinrade (YOKBROS LTD)" should
    // address YOKBROS, not garble the two directors' first names together.
    const bracket = lead.applicant.match(/\(([^)]*)\)/);
    let name = (bracket && COMPANY_WORDS.test(bracket[1])) ? bracket[1] : lead.applicant.replace(/\s*\([^)]*\)\s*/g, '').trim();
    name = name.replace(/\b(ltd|limited|llp|plc)\b\.?/gi, '').trim();
    if (!name || /commissioners|council|advocates|solicitors/i.test(lead.applicant)) return 'Dear Sir/Madam,';
    return `Dear ${name} Team,`;
  }

  const core = lead.applicant.replace(/\s*\([^)]*\)\s*/g, ' ').replace(/\s+/g, ' ').trim();
  if (!core) return 'Dear Sir/Madam,';

  // "Mr & Mrs <given names> <Surname>" / "Mr and Mrs ..." — a single
  // shared surname is the norm here (the first person's own surname is
  // conventionally omitted, not actually different), so this is checked
  // as one atomic unit before any general title-splitting below —
  // otherwise the combined title's own "&" gets mistaken for a second,
  // differently-surnamed person.
  const combined = core.match(/^(Mr)\s*(?:&|and)\s*(Mrs)\b\s*(.*)$/i);
  if (combined) {
    const remainder = combined[3];
    // Exactly one connector ("A & B Surname") reads as one shared
    // surname — including a slash-joined surname like "Emmerson/Gledhill",
    // which is how this couple's own name is written, not a sign of
    // trouble. Two connectors ("David & Jan Brooks & Cooil") genuinely
    // could be two different surnames — not safe to guess which.
    const connectorCount = (remainder.match(/\s(?:&|and)\s/gi) || []).length;
    const surname = lastWord(remainder);
    if (connectorCount > 1 || !surname) return 'Dear Sir/Madam,';
    return `Dear Mr & Mrs ${surname},`;
  }

  // General case: split on every title mention (Mr/Mrs/Miss/Ms/Dr) and
  // compare the surname attached to each segment, including any
  // untitled text before the first title (e.g. "Mark Patrick O'Meara &
  // Miss Kathryn Newton" — "O'Meara" has no title of its own).
  const TITLE_G = /\b(Mr|Mrs|Miss|Ms|Dr)\b/gi;
  const titles = [...core.matchAll(TITLE_G)];
  // No title anywhere (e.g. the source just wrote "Vincent Hesketh") —
  // address by full name rather than falling back to Sir/Madam, since
  // we do at least have a real, unambiguous single name to use.
  if (!titles.length) return core.includes('&') || / and /i.test(core) ? 'Dear Sir/Madam,' : `Dear ${core},`;

  const namedParts = [];
  const preText = core.slice(0, titles[0].index).trim();
  const preSurname = lastWord(preText);
  const preFull = preText.replace(/\s*(?:&|and)\s*$/i, '').trim();
  if (preSurname) namedParts.push({ title: null, surname: preSurname, full: preFull });
  titles.forEach((t, i) => {
    const end = i + 1 < titles.length ? titles[i + 1].index : core.length;
    const text = core.slice(t.index + t[0].length, end);
    const surname = lastWord(text);
    if (surname) namedParts.push({ title: t[1], surname, full: null });
  });

  if (namedParts.length === 1) {
    const only = namedParts[0];
    return only.title ? `Dear ${cap(only.title)} ${only.surname},` : `Dear ${only.full},`;
  }
  const allSurnames = namedParts.map(p => p.surname.toLowerCase());
  const allSame = allSurnames.every(s => s === allSurnames[0]);
  if (allSame) {
    const titleWords = namedParts.map(p => p.title).filter(Boolean);
    const prefix = titleWords.length ? titleWords.map(cap).join(' & ') : 'Mr & Mrs';
    return `Dear ${prefix} ${namedParts[namedParts.length - 1].surname},`;
  }
  // Two clearly-named people, genuinely different surnames (e.g. "Mr
  // Martyn Lester & Mrs Cornelia Dahlgren") — the data isn't unclear,
  // there just isn't one shared surname, so address both by name
  // rather than falling back to a generic greeting.
  if (namedParts.length === 2) {
    const label = p => p.title ? `${cap(p.title)} ${p.surname}` : p.full;
    return `Dear ${label(namedParts[0])} and ${label(namedParts[1])},`;
  }
  return 'Dear Sir/Madam,';
}

// ---- Pull from the government planning register ----
// The register itself (pbc.gov.im) blocks cross-origin browser requests
// and only exposes the applicant/agent name per-application, so the
// actual scraping runs server-side as a GitHub Action (see
// scripts/pull_register.py + .github/workflows/pull-planning-register.yml)
// on a weekly schedule, or on demand from that workflow's "Run workflow"
// button. It commits register-data/latest.json into this same site, so
// the app just fetches it same-origin — no CORS issue.
const REGISTER_DATA_URL = 'register-data/latest.json';
const REGISTER_ACTIONS_URL = 'https://github.com/dgc-groundworks/dgc-ballasalla/actions/workflows/pull-planning-register.yml';

function renderRegisterPull(main){
  const box = document.createElement('div');
  box.className = 'register-pull';
  box.innerHTML = `<h3 class="lead-section-hdr">Pull from the planning register</h3><p class="hint">Loading the latest pull&hellip;</p>`;
  main.appendChild(box);

  fetch(REGISTER_DATA_URL).then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(data => renderRegisterPullLoaded(box, data))
    .catch(() => {
      box.innerHTML = `
        <h3 class="lead-section-hdr">Pull from the planning register</h3>
        <p class="hint">No register data has been pulled yet. It pulls automatically once a week, or you can trigger it right now from
          <a href="${REGISTER_ACTIONS_URL}" target="_blank" rel="noopener">GitHub Actions &rarr; Run workflow</a> (takes a few minutes) — come back here and refresh once it's finished.</p>`;
    });
}

function renderRegisterPullLoaded(box, data){
  const apps = data.applications || [];
  const pulledDate = data.pulledAt ? new Date(data.pulledAt).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'unknown';
  let log = getLog();
  let dismissed = getDismissed();
  let showArchived = false;
  const expandedRefs = new Set();

  // The register just says "Decided" — the actual outcome (Permitted /
  // Refused / Withdrawn / etc.) is a separate field from the detail page.
  function decisionCategory(a){
    if (!a.isDecided) return 'pending';
    const d = (a.decision || '').toLowerCase();
    if (/permit|approv|grant/.test(d)) return 'approved';
    if (/refus|denied|reject/.test(d)) return 'refused';
    return 'other';
  }
  const CATEGORY_TAG = { pending: ['tag-review', 'Pending'], approved: ['tag-approved', 'Approved'], refused: ['tag-excl', 'Refused'], other: ['tag-dupe', null] };
  const CATEGORY_ORDER = { approved: 0, pending: 1, refused: 2, other: 3 };

  // Applicant, site or agent — any of them on the never-contact list.
  function standingHit(a){
    const hay = `${a.applicantName || ''} ${a.address || ''} ${a.agentName || ''} ${a.agentCompanyName || ''}`.toLowerCase();
    return STANDING_EXCLUDE.find(n => hay.includes(n)) || null;
  }

  function applyFilters(){
    const status = document.getElementById('regStatus').value;
    const from = document.getElementById('regFrom').value;
    const to = document.getElementById('regTo').value;
    const q = document.getElementById('regSearch').value.trim().toLowerCase();
    return apps.filter(a => {
      if (!showArchived && dismissed[a.ref]) return false;
      if (status !== 'all' && decisionCategory(a) !== status) return false;
      const d = a.validated || a.received;
      const parsed = d ? new Date(d.replace(/^\w+\s/, '')) : null; // strip leading "Tue " etc
      if (from && parsed && parsed < new Date(from)) return false;
      if (to && parsed && parsed > new Date(to + 'T23:59:59')) return false;
      if (q) {
        const hay = `${a.ref} ${a.address} ${a.description} ${a.applicantName||''} ${a.agentName||''} ${a.agentCompanyName||''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    })
    .sort((x, y) => CATEGORY_ORDER[decisionCategory(x)] - CATEGORY_ORDER[decisionCategory(y)] || (x.ref < y.ref ? 1 : -1));
  }

  // Same ARCH-<slug> convention as the CSV business import, so one
  // architect reached via either route dedupes to a single record.
  function agentRef(a){
    const person = a.agentName || a.agentCompanyName;
    return person ? 'ARCH-' + slugify(person + '-' + (a.agentCompanyName || '')) : null;
  }
  const known = ref => leads.some(l => l.ref === ref) || !!log[ref] || !!dismissed[ref];

  function addRegisterAppToBatch(a, folder){
    if (known(a.ref)) return false;
    const applicant = a.applicantName || a.agentCompanyName || a.agentName || 'Applicant not available on register';
    const extraReviewNote = !a.applicantName ? 'Applicant name not on the public register — check before sending (agent shown instead).'
      : /\bdepartment\b|government|tynwald|manx care/i.test(applicant) ? 'Government body — DGC may already work with them. Check before sending.'
      : undefined;
    const lead = classify({ ref: a.ref, applicant, site: a.address || '', agentText: `${a.agentName || ''} ${a.agentCompanyName || ''}`, extraReviewNote });
    lead.planningStatus = decisionCategory(a);
    lead.folder = folder;
    lead.include = false;
    lead.addedAt = todayISO();
    lead.description = a.description || '';
    leads.push(lead);
    return true;
  }

  function addAgentToBatch(a){
    const aRef = agentRef(a);
    const person = a.agentName || a.agentCompanyName;
    if (!aRef || !person || known(aRef)) return false;
    const site = [a.agentName && a.agentCompanyName ? a.agentCompanyName : '', a.agentAddress || ''].filter(Boolean).join(', ');
    const lead = classify({ ref: aRef, applicant: person, site });
    lead.type = 'Company';
    lead.source = 'business';
    lead.folder = 'business';
    lead.include = false;
    lead.addedAt = todayISO();
    lead.description = `Agent on ${a.ref} — ${a.description || ''}`;
    leads.push(lead);
    return true;
  }

  function rowHtml(a, forceFull){
    const sent = log[a.ref];
    const inLead = leads.find(l => l.ref === a.ref);
    const arch = dismissed[a.ref];
    const hit = standingHit(a);
    const cat = decisionCategory(a);
    const person = a.applicantName || a.agentCompanyName || a.agentName || '(applicant not on register)';
    const full = forceFull || expandedRefs.has(a.ref);
    const aRef = agentRef(a);
    const agentStatus = !aRef ? '' : log[aRef] ? 'Agent already sent a letter' : leads.some(l => l.ref === aRef) ? 'Agent already in Businesses' : dismissed[aRef] ? 'Agent archived' : '';
    const agentSearchQuery = encodeURIComponent(`${a.agentCompanyName || a.agentName} Isle of Man`);
    const agentLine = aRef ? `
        <div class="hint">Agent: ${esc(a.agentName || '')}${a.agentCompanyName ? ` (${esc(a.agentCompanyName)})` : ''}
          <a href="https://www.google.com/search?q=${agentSearchQuery}" target="_blank" rel="noopener" class="btn-secondary" style="margin-left:6px;padding:1px 7px;font-size:0.7rem;text-decoration:none;display:inline-block">&#128269; Google them</a>
          ${agentStatus
            ? `<span class="tag tag-dupe" style="margin-left:6px">${agentStatus}</span>`
            : `<button type="button" class="btn-secondary reg-add-agent-btn" data-ref="${esc(a.ref)}" style="margin-left:6px;padding:1px 7px;font-size:0.7rem">+ Add agent as business</button>`}
        </div>` : '';
    const detailLine = full ? `
        <div class="hint">${a.agentAddress ? esc(a.agentAddress) : ''}</div>
        <div class="hint">${a.parish ? `Parish: ${esc(a.parish)}` : ''} &middot; Received ${esc(a.received||'?')} &middot; ${a.isDecided ? (a.decisionDate ? `Decided ${esc(a.decisionDate)}` : 'Decided') : `Validated ${esc(a.validated || '?')}`}</div>` : '';

    let actions;
    if (sent) actions = `<span class="tag tag-dupe" title="Already sent a letter — see Archive">Sent ${esc(prettyDate(sent.date))}</span>`;
    else if (inLead) actions = `<span class="tag tag-approved">In ${FOLDERS[leadFolder(inLead)]}</span>`;
    else if (arch) actions = `<span class="tag tag-dupe">Archived ${esc(prettyDate(arch.date))}</span>
          <button type="button" class="btn-secondary reg-unarchive-btn" data-ref="${esc(a.ref)}">&#8617; Bring back</button>`;
    else {
      const sendBtn = (folder, text) => `<button type="button" class="btn-secondary reg-send-btn${cat === folder ? ' natural' : ''}" data-ref="${esc(a.ref)}" data-folder="${folder}">${text}</button>`;
      actions = hit
        ? `<span class="tag tag-excl" title="On the standing never-contact list">Never contact: ${esc(hit)}</span>
           <button type="button" class="btn-secondary reg-dismiss-btn" data-ref="${esc(a.ref)}">Archive</button>`
        : `<div class="reg-actions">
            ${sendBtn('business', 'Send as Business')}
            ${sendBtn('pending', 'Send as Pending')}
            ${sendBtn('approved', 'Send as Approved')}
            <button type="button" class="btn-secondary reg-dismiss-btn" data-ref="${esc(a.ref)}" title="Looked at it, not chasing it — goes to the Archive tab, where you can bring it back">Archive</button>
          </div>`;
    }
    return `
      <div class="lead-row">
        <div class="lr-main">
          <button type="button" class="reg-name-toggle" data-ref="${esc(a.ref)}" title="${full ? 'Click to collapse' : 'Click to see the full application'}">
            ${esc(person)} <span class="hint">${full ? '&#9662; hide full application' : '&#9656; show full application'}</span>
          </button>
          <div class="lr-meta">${esc(a.ref)} &middot; ${esc(a.address)}</div>
          <div class="hint" style="margin:2px 0">${esc(a.description || '')}</div>
          ${agentLine}
          ${detailLine}
        </div>
        <div class="lr-side">
          <span class="tag ${CATEGORY_TAG[cat][0]}">${CATEGORY_TAG[cat][1] || a.decision || 'Decided'}</span>
          ${actions}
        </div>
      </div>`;
  }

  function renderList(){
    log = getLog();
    dismissed = getDismissed();
    const filtered = applyFilters();
    const full = document.getElementById('regDetailToggle').checked;
    const archivedCount = apps.filter(a => dismissed[a.ref]).length;
    document.getElementById('regCount').innerHTML = `${filtered.length} of ${apps.length} shown`
      + (archivedCount ? ` &middot; ${archivedCount} archived, ${showArchived ? '<button type="button" class="link-btn" id="regHideArchived">hide them</button>' : '<button type="button" class="link-btn" id="regShowArchived">show them</button>'}` : '');
    document.getElementById('registerList').innerHTML = filtered.length
      ? filtered.map(a => rowHtml(a, full)).join('')
      : '<p class="empty-state">Nothing matches those filters.</p>';
    const showBtn = document.getElementById('regShowArchived');
    if (showBtn) showBtn.addEventListener('click', () => { showArchived = true; renderList(); });
    const hideBtn = document.getElementById('regHideArchived');
    if (hideBtn) hideBtn.addEventListener('click', () => { showArchived = false; renderList(); });
    updateNavCounts();
  }
  function say(text){ const m = document.getElementById('regAddMsg'); if (m) m.textContent = text; }

  box.innerHTML = `
    <h3 class="lead-section-hdr">Pull from the planning register</h3>
    <p class="hint">Last pulled ${esc(pulledDate)} &middot; ${apps.length} applications on file (up to ${data.monthsRequested || '?'} months back).
      <a href="${REGISTER_ACTIONS_URL}" target="_blank" rel="noopener">Pull fresh data now &rarr;</a></p>
    <p class="hint">On each one: <b>Send as Business / Pending / Approved</b> puts it in that folder (and decides which letter it gets), <b>Archive</b> means not chasing it. Nothing is printed until you press "Send to print" inside the folder.</p>
    <div class="row-actions" style="flex-wrap:wrap;gap:10px">
      <label>From <input type="date" id="regFrom"></label>
      <label>To <input type="date" id="regTo"></label>
      <label>Status
        <select id="regStatus">
          <option value="all">All</option>
          <option value="pending">Pending only</option>
          <option value="approved">Approved only</option>
          <option value="refused">Refused only</option>
          <option value="other">Other decided (withdrawn etc.)</option>
        </select>
      </label>
      <label><input type="checkbox" id="regDetailToggle"> Full detail</label>
      <input type="text" id="regSearch" placeholder="Search name, address, description&hellip;" style="min-width:220px">
    </div>
    <div class="row-actions" style="flex-wrap:wrap;gap:10px;margin-bottom:6px">
      <button class="btn-secondary" id="regBulkApprovedBtn">All shown Approved &rarr; Approved folder</button>
      <button class="btn-secondary" id="regBulkPendingBtn">All shown Pending &rarr; Pending folder</button>
      <button class="btn-secondary" id="regBulkAgentsBtn">All shown agents &rarr; Businesses folder</button>
      <span id="regAddMsg" class="hint"></span>
    </div>
    <p class="hint" id="regCount"></p>
    <div id="registerList" class="lead-list"></div>`;

  renderList();
  ['regStatus', 'regFrom', 'regTo', 'regSearch', 'regDetailToggle'].forEach(id => {
    document.getElementById(id).addEventListener('input', renderList);
  });
  document.getElementById('registerList').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn || !btn.dataset.ref) return;
    const a = apps.find(x => x.ref === btn.dataset.ref);
    if (!a) return;
    const person = a.applicantName || a.agentCompanyName || a.agentName || a.ref;
    if (btn.classList.contains('reg-name-toggle')) {
      if (expandedRefs.has(a.ref)) expandedRefs.delete(a.ref); else expandedRefs.add(a.ref);
    } else if (btn.classList.contains('reg-send-btn')) {
      const folder = btn.dataset.folder;
      if (addRegisterAppToBatch(a, folder)) { saveLeadsToStorage(); say(`${person} → ${FOLDERS[folder]} folder.`); }
    } else if (btn.classList.contains('reg-add-agent-btn')) {
      if (addAgentToBatch(a)) { saveLeadsToStorage(); say(`${a.agentName || a.agentCompanyName} (agent) → Businesses folder.`); }
    } else if (btn.classList.contains('reg-dismiss-btn')) {
      const d = getDismissed();
      d[a.ref] = { date: todayISO(), name: person, source: 'planning', description: a.description || '', address: a.address || '' };
      saveDismissed(d);
      say(`${person} archived — bring it back any time from here or the Archive tab.`);
    } else if (btn.classList.contains('reg-unarchive-btn')) {
      bringBackFromArchive(a.ref);
      say(`${person} brought back.`);
    } else return;
    renderList();
  });
  function bulk(filterFn, folder, label){
    log = getLog(); dismissed = getDismissed();
    let added = 0;
    applyFilters().filter(filterFn).forEach(a => { if (folder ? addRegisterAppToBatch(a, folder) : addAgentToBatch(a)) added++; });
    saveLeadsToStorage();
    say(`Added ${added} to the ${label} folder (anything already in a folder, sent or archived was skipped).`);
    renderList();
  }
  document.getElementById('regBulkApprovedBtn').addEventListener('click', () => bulk(a => decisionCategory(a) === 'approved' && !standingHit(a), 'approved', 'Approved'));
  document.getElementById('regBulkPendingBtn').addEventListener('click', () => bulk(a => decisionCategory(a) === 'pending' && !standingHit(a), 'pending', 'Pending'));
  document.getElementById('regBulkAgentsBtn').addEventListener('click', () => bulk(a => !standingHit(a), null, 'Businesses'));
}

const COPY_NOTE = {
  approved: 'Everyone here gets the "Congratulations on your recent planning approval" letter.',
  pending: 'Everyone here gets the "we noticed you have recently applied for planning permission" letter.',
  business: 'Everyone here gets the architects &amp; engineers introduction letter.'
};

function renderFolder(main, folder){
  const label = FOLDERS[folder];
  const inFolder = leads.map((l, i) => ({ l, i })).filter(x => leadFolder(x.l) === folder);
  const active = inFolder.filter(x => !x.l.alreadyProcessed);
  const sentCount = inFolder.length - active.length;
  if (!active.length) {
    main.innerHTML = `<p class="empty-state">Nothing waiting in ${label}.<br><br>${folder === 'business'
      ? 'Add businesses on Import — Businesses, or press "Send as Business" / "+ Add agent as business" on the planning register list (Import — Planning).'
      : `Press "Send as ${label}" on the planning register list (Import — Planning) to put applications here.`}</p>`
      + (sentCount ? `<p class="hint" style="text-align:center">${sentCount} from this folder already sent — see Archive.</p>` : '');
    return;
  }
  const onPrint = active.filter(x => x.l.include).length;
  const sendable = active.filter(x => !x.l.include && !x.l.excludedReason && !x.l.needsReview);
  const flaggedWaiting = active.filter(x => !x.l.include && !x.l.excludedReason && x.l.needsReview).length;

  const groups = new Map();
  active.slice().sort((a, b) => (b.l.addedAt || '').localeCompare(a.l.addedAt || '')).forEach(x => {
    const k = x.l.addedAt || '';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(x);
  });
  const today = todayISO();
  const groupTitle = k => !k ? 'Added earlier' : k === today ? `Added today &middot; ${prettyDate(k)}` : `Added ${prettyDate(k)}`;

  function row(l, i){
    const flag = l.excludedReason ? { cls: 'tag-excl', label: 'Never contact', title: l.excludedReason }
      : l.needsReview ? { cls: 'tag-review', label: 'Check', title: l.reviewNote }
      : null;
    const editing = state.editRef === l.ref;
    const moveOpts = Object.entries(FOLDERS).map(([k, v]) => `<option value="${k}" ${k === folder ? 'selected' : ''}>${v}</option>`).join('');
    return `
      <div class="lead-row ${flag ? 'flagged' : ''}" data-i="${i}">
        <div class="lr-main">
          <div class="lr-applicant">${esc(l.applicant)}</div>
          <div class="lr-meta">${esc(l.ref)}${l.description ? ' &middot; ' + esc(l.description) : ''}</div>
          ${flag && flag.title ? `<div class="hint" style="margin:0 0 4px;color:var(--accent)">${esc(flag.title)}</div>` : ''}
          <input type="text" class="sal-input" value="${esc(l.salutation)}" title="Salutation — click to change">
          <div class="f-addr">${l.recipientLines.map(esc).join(' &middot; ')}</div>
          ${editing ? `
          <div class="f-edit-panel">
            <div class="hint" style="margin:0 0 6px">Name &amp; address exactly as it prints — one line each</div>
            <textarea class="f-edit-lines">${esc(l.recipientLines.join('\n'))}</textarea>
            <div class="row-actions" style="margin:8px 0 0"><button class="btn f-edit-save">Save</button><button class="btn-secondary f-edit-cancel">Cancel</button></div>
          </div>` : ''}
        </div>
        <div class="lr-side" style="flex-direction:column;align-items:flex-end;gap:8px">
          <div style="display:flex;gap:8px;align-items:center">
            ${flag ? `<span class="tag ${flag.cls}" title="${esc(flag.title)}">${flag.label}</span>` : ''}
            <button class="send-toggle ${l.include ? 'on' : 'off'}" ${l.excludedReason ? 'disabled' : ''}>${l.include ? '&#10003; On print list' : 'Send to print'}</button>
          </div>
          <div class="f-actions">
            <button class="btn-secondary f-edit-btn">&#9998; Edit name / address</button>
            <label class="hint" style="margin:0">Move to <select class="f-move">${moveOpts}</select></label>
            <button class="btn-secondary f-archive-btn" title="Not chasing — goes to the Archive tab, where you can bring it back">Archive</button>
            <button class="btn-danger f-remove-btn">Delete</button>
          </div>
        </div>
      </div>`;
  }

  main.innerHTML = `
    <div class="row-actions">
      <button class="btn" id="fSendAllBtn" ${sendable.length ? '' : 'disabled'}>Send all ${sendable.length} to print</button>
      ${onPrint ? `<button class="btn-secondary" id="fUnsendAllBtn">Take all ${onPrint} off the print list</button>` : ''}
      <button class="btn-secondary" id="fGoPrintBtn">Go to Print &rarr;</button>
      <span id="fMsg" class="hint" style="margin:0"></span>
    </div>
    <div class="stat-bar">
      <span><b>${active.length}</b> waiting in ${label}</span>
      <span style="color:var(--accent)"><b>${onPrint}</b> on the print list</span>
      ${flaggedWaiting ? `<span><b>${flaggedWaiting}</b> marked Check — send those one at a time once you've looked</span>` : ''}
      ${sentCount ? `<span><b>${sentCount}</b> already sent (see Archive)</span>` : ''}
    </div>
    <p class="hint">${COPY_NOTE[folder]}</p>
    ${[...groups].map(([k, xs]) => `<h3 class="lead-section-hdr">${groupTitle(k)} &middot; ${xs.length}</h3><div class="lead-list">${xs.map(x => row(x.l, x.i)).join('')}</div>`).join('')}
  `;

  const done = () => { saveLeadsToStorage(); render(); };
  const sendAll = document.getElementById('fSendAllBtn');
  sendAll.addEventListener('click', () => { sendable.forEach(x => { x.l.include = true; }); done(); });
  const unsendAll = document.getElementById('fUnsendAllBtn');
  if (unsendAll) unsendAll.addEventListener('click', () => { active.forEach(x => { x.l.include = false; }); done(); });
  document.getElementById('fGoPrintBtn').addEventListener('click', () => { state.tab = 'letters'; render(); });

  main.querySelectorAll('.lead-row[data-i]').forEach(rowEl => {
    const i = +rowEl.dataset.i;
    const l = leads[i];
    const toggle = rowEl.querySelector('.send-toggle');
    if (!toggle.disabled) toggle.addEventListener('click', () => { l.include = !l.include; done(); });
    rowEl.querySelector('.sal-input').addEventListener('change', e => { l.salutation = e.target.value; l.edited = true; saveLeadsToStorage(); });
    rowEl.querySelector('.f-edit-btn').addEventListener('click', () => { state.editRef = l.ref; render(); });
    const save = rowEl.querySelector('.f-edit-save');
    if (save) save.addEventListener('click', () => {
      const lines = rowEl.querySelector('.f-edit-lines').value.split('\n').map(s => s.trim()).filter(Boolean);
      if (lines.length) { l.recipientLines = lines; l.applicant = lines[0]; l.edited = true; }
      state.editRef = null;
      done();
    });
    const cancel = rowEl.querySelector('.f-edit-cancel');
    if (cancel) cancel.addEventListener('click', () => { state.editRef = null; render(); });
    rowEl.querySelector('.f-move').addEventListener('change', e => { l.folder = e.target.value; done(); });
    rowEl.querySelector('.f-archive-btn').addEventListener('click', () => { archiveLead(i); render(); });
    rowEl.querySelector('.f-remove-btn').addEventListener('click', () => {
      if (!confirm(`Delete "${l.applicant}" from ${label}? (Use Archive instead if you want a record that you looked at it.)`)) return;
      leads.splice(i, 1);
      done();
    });
  });
}

// One place for the whole history: everyone who was SENT a letter (the
// sent log) and everyone ARCHIVED as not chasing — homeowners/planning
// first, then businesses — each expandable to show exactly what went out.
function renderArchive(main){
  const log = getLog();
  const archived = getDismissed();
  const isBizRef = (ref, source) => source === 'business' || ref.startsWith('ARCH-');
  const entries = [];
  Object.entries(log).forEach(([ref, e]) => entries.push({ kind: 'sent', ref, e, biz: isBizRef(ref, e.source) }));
  Object.entries(archived).forEach(([ref, e]) => entries.push({ kind: 'archived', ref, e, biz: e.lead ? leadFolder(e.lead) === 'business' : isBizRef(ref, e.source) }));
  const filter = state.archiveFilter || 'all';
  const shown = entries.filter(x => filter === 'all' || x.kind === filter)
    .sort((a, b) => (b.e.date || '').localeCompare(a.e.date || '') || (a.e.name || '').localeCompare(b.e.name || ''));
  const open = state.archiveOpen || (state.archiveOpen = new Set());
  const letterOpen = state.letterOpen || (state.letterOpen = new Set());
  const COPY_LABEL = { approved: '"Congratulations on your planning approval" letter', pending: '"Applied for planning" letter', business: 'Architects &amp; engineers introduction letter' };

  function letterSnapshot(x){
    const e = x.e;
    const lead = leads.find(l => l.ref === x.ref);
    const recipientLines = e.recipientLines || (lead && lead.recipientLines);
    if (!recipientLines) return null;
    return {
      recipientLines,
      salutation: e.salutation || (lead && lead.salutation) || '',
      folder: e.copy || (lead ? leadFolder(lead) : (x.biz ? 'business' : 'approved')),
      letterDate: e.letterDate || null,
      rebuilt: !e.recipientLines
    };
  }

  function entryHtml(x){
    const e = x.e;
    const key = x.kind + ':' + x.ref;
    const isOpen = open.has(key);
    const statusTag = x.kind === 'sent'
      ? `<span class="tag tag-approved">Sent ${esc(prettyDate(e.date))}</span>`
      : `<span class="tag tag-dupe">Archived ${esc(prettyDate(e.date))} &middot; not chasing</span>`;
    let detail = '';
    if (isOpen) {
      const snap = x.kind === 'sent' ? letterSnapshot(x) : null;
      const archivedLead = x.kind === 'archived' ? e.lead : null;
      const lines = snap ? snap.recipientLines : archivedLead ? archivedLead.recipientLines : null;
      detail = `
        <div class="f-edit-panel">
          ${lines ? `<div class="f-addr" style="margin:0 0 6px;color:var(--text)">${lines.map(esc).join('<br>')}</div>` : ''}
          ${e.description || (archivedLead && archivedLead.description) ? `<div class="hint" style="margin:0 0 6px">${esc(e.description || archivedLead.description)}</div>` : ''}
          ${e.address ? `<div class="hint" style="margin:0 0 6px">Site: ${esc(e.address)}</div>` : ''}
          ${e.note ? `<div class="hint" style="margin:0 0 6px">${esc(e.note)}</div>` : ''}
          ${snap ? `<div class="hint" style="margin:0 0 6px">Letter: <b>${COPY_LABEL[snap.folder]}</b>${e.copyNote ? ' — ' + esc(e.copyNote) : ''}</div>` : ''}
          ${e.pdfFile ? `<div class="hint" style="margin:0 0 6px">Original PDF: <b>${esc(e.pdfFile)}</b>${e.pdfPage ? `, page ${e.pdfPage}` : ''}</div>` : ''}
          <div class="row-actions" style="margin:6px 0 0">
            ${snap ? `<button class="btn-secondary ar-letter-btn" data-key="${esc(key)}">${letterOpen.has(key) ? 'Hide letter' : '&#128196; See the letter that was sent'}</button>` : ''}
            ${x.kind === 'sent'
              ? `<button class="btn-secondary ar-restore-btn" data-ref="${esc(x.ref)}" title="Takes it off the sent record, so it can be sent again">&#8617; Un-mark as sent</button>`
              : `<button class="btn-secondary ar-bringback-btn" data-ref="${esc(x.ref)}">&#8617; Bring back</button>`}
          </div>
          ${snap && letterOpen.has(key) ? `
            ${snap.rebuilt ? '<p class="hint">Rebuilt from the saved record — the wording and address shown are what this app would have printed.</p>' : ''}
            <div class="letter-preview">${letterHtml(snap)}</div>` : ''}
        </div>`;
    }
    return `
      <div class="lead-row" style="display:block">
        <button type="button" class="reg-name-toggle ar-toggle" data-key="${esc(key)}" style="width:100%">
          <span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <span style="flex:1;min-width:200px">${esc(e.name || x.ref)} <span class="hint">${isOpen ? '&#9662;' : '&#9656;'} ${esc(x.ref)}</span></span>
            ${statusTag}
          </span>
        </button>
        ${detail}
      </div>`;
  }

  const planning = shown.filter(x => !x.biz);
  const business = shown.filter(x => x.biz);
  const section = (title, xs) => `<h3 class="lead-section-hdr">${title} &middot; ${xs.length}</h3>`
    + (xs.length ? `<div class="lead-list">${xs.map(entryHtml).join('')}</div>` : '<p class="empty-state">Nothing here.</p>');
  const count = k => entries.filter(x => x.kind === k).length;

  main.innerHTML = `
    <div class="row-actions">
      <label class="hint" style="margin:0">Show
        <select id="arFilter" class="f-move">
          <option value="all" ${filter === 'all' ? 'selected' : ''}>Everything (${entries.length})</option>
          <option value="sent" ${filter === 'sent' ? 'selected' : ''}>Sent a letter (${count('sent')})</option>
          <option value="archived" ${filter === 'archived' ? 'selected' : ''}>Archived — not chasing (${count('archived')})</option>
        </select>
      </label>
      <span class="hint" style="margin:0">Click any name to see what it was and the letter that went out.</span>
    </div>
    ${section('Homeowners &amp; planning applicants', planning)}
    ${section('Businesses &mdash; architects &amp; engineers', business)}
    <details style="margin-top:28px">
      <summary class="hint" style="cursor:pointer">Sent letters outside this app? Add them to the sent record</summary>
      <div class="bulk-add-log" style="margin-top:10px">
        <p class="hint">One per line — <code>Reference&#9;Name</code> (tab-separated) or just the reference — logged as sent today, so they're flagged if they ever come up again.</p>
        <textarea id="bulkLogBox" rows="4" placeholder="26/00465/B&#9;Mr &amp; Mrs W. Philip &amp; Norma Richards"></textarea>
        <div class="row-actions" style="margin-top:10px">
          <button class="btn" id="bulkLogBtn">Add to sent record</button>
          <span id="bulkLogMsg" class="hint" style="margin:0"></span>
        </div>
      </div>
    </details>`;

  document.getElementById('arFilter').addEventListener('change', e => { state.archiveFilter = e.target.value; render(); });
  main.querySelectorAll('.ar-toggle').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.key;
    if (open.has(k)) open.delete(k); else open.add(k);
    render();
  }));
  main.querySelectorAll('.ar-letter-btn').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.key;
    if (letterOpen.has(k)) letterOpen.delete(k); else letterOpen.add(k);
    render();
  }));
  main.querySelectorAll('.ar-bringback-btn').forEach(b => b.addEventListener('click', () => { bringBackFromArchive(b.dataset.ref); render(); }));
  main.querySelectorAll('.ar-restore-btn').forEach(b => b.addEventListener('click', () => {
    const ref = b.dataset.ref;
    if (!confirm('Take this off the sent record? It will then be allowed to be sent again.')) return;
    const lg = getLog();
    delete lg[ref];
    saveLog(lg);
    leads = leads.map(classify);
    saveLeadsToStorage();
    render();
  }));
  document.getElementById('bulkLogBtn').addEventListener('click', () => {
    const lines = document.getElementById('bulkLogBox').value.split('\n').map(s => s.trim()).filter(Boolean);
    if (!lines.length) return;
    const lg = getLog();
    let n = 0;
    lines.forEach(line => {
      const [ref, name] = line.split('\t').map(s => (s || '').trim());
      if (!ref) return;
      lg[ref] = { date: todayISO(), name: name || '', source: ref.startsWith('ARCH-') ? 'business' : 'planning' };
      n++;
    });
    saveLog(lg);
    leads = leads.map(classify);
    saveLeadsToStorage();
    render();
    const msg = document.getElementById('bulkLogMsg');
    if (msg) msg.textContent = `Added ${n} to the sent record.`;
  });
}

function renderPrint(main, kind){
  // Already-sent leads never belong in Print, even if `include` is
  // somehow still true (e.g. a fresh re-import of the same list sets
  // its own default before knowing it's a repeat) — this is the same
  // filter Review uses to hide them, applied here so an archived lead
  // can never silently get printed/sent again.
  const batch = leads.filter(l => l.include && !l.alreadyProcessed);
  if (!batch.length) {
    main.innerHTML = `<p class="empty-state">Nothing on the print list yet — open Approved, Pending or Businesses and press "Send to print" (one at a time, or "Send all to print").</p>`;
    return;
  }
  const byFolder = { approved: 0, pending: 0, business: 0 };
  batch.forEach(l => byFolder[leadFolder(l)]++);
  const mix = Object.entries(byFolder).filter(([, n]) => n).map(([k, n]) => `${n} ${FOLDERS[k]}`).join(' &middot; ');

  const align = getEnvAlign();
  const alignToggleHtml = kind === 'envelope' ? `
      <span class="align-toggle">
        <button class="btn-secondary${align === 'center' ? ' active' : ''}" id="alignCenterBtn">Centered</button>
        <button class="btn-secondary${align === 'left' ? ' active' : ''}" id="alignLeftBtn">Left-aligned</button>
      </span>` : '';

  main.innerHTML = `
    <div class="row-actions">
      <button class="btn" id="printBtn">&#128438; Print (${batch.length} ${kind === 'letter' ? 'letters' : 'envelopes'})</button>
      <button class="btn" id="savePdfBtn">&#11015; Save as PDF&hellip;</button>
      <button class="btn" id="saveArchiveBtn">&#128190; Save PDF &amp; mark as sent&hellip;</button>
      <button class="btn-secondary" id="markSentBtn">&#10003; Mark these ${batch.length} as sent</button>
      ${alignToggleHtml}
      <span id="printMsg" style="color:var(--muted);font-size:0.82rem"></span>
    </div>
    <div class="stat-bar"><span>${mix}</span><span>Each ${kind === 'letter' ? 'letter uses' : 'envelope matches'} the copy for its folder — letters and envelopes are in the same order.</span>
    </div>
    <div id="pdfArea">${batch.map((l, i) => docWrapHtml(l, i, kind)).join('')}</div>
  `;
  document.getElementById('printBtn').addEventListener('click', () => window.print());
  document.getElementById('pdfArea').addEventListener('click', (e) => {
    const wrap = e.target.closest('.doc-wrap');
    if (!wrap) return;
    const lead = batch[Number(wrap.dataset.idx)];
    const panel = wrap.querySelector('.doc-edit-panel');
    if (e.target.classList.contains('doc-remove-btn')) {
      lead.include = false;
      saveLeadsToStorage();
      render();
    } else if (e.target.classList.contains('doc-edit-btn')) {
      panel.hidden = !panel.hidden;
    } else if (e.target.classList.contains('edit-cancel-btn')) {
      panel.hidden = true;
    } else if (e.target.classList.contains('edit-save-btn')) {
      const lines = wrap.querySelector('.edit-recipient').value.split('\n').map(s => s.trim()).filter(Boolean);
      if (lines.length) lead.recipientLines = lines;
      const salInput = wrap.querySelector('.edit-salutation');
      if (salInput) lead.salutation = salInput.value.trim();
      lead.edited = true;
      saveLeadsToStorage();
      wrap.outerHTML = docWrapHtml(lead, Number(wrap.dataset.idx), kind);
    }
  });
  if (kind === 'envelope') {
    document.getElementById('alignCenterBtn').addEventListener('click', () => { setEnvAlign('center'); render(); });
    document.getElementById('alignLeftBtn').addEventListener('click', () => { setEnvAlign('left'); render(); });
  }
  async function buildAndSavePdf(btn){
    const msg = document.getElementById('printMsg');
    const area = document.getElementById('pdfArea');
    btn.disabled = true; const original = btn.innerHTML;
    const dateStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    const filename = `Silverdale ${kind === 'letter' ? 'Letters' : 'Envelopes'} - ${dateStr}.pdf`;
    const format = kind === 'letter' ? 'a4' : [220, 110];
    const orientation = kind === 'letter' ? 'portrait' : 'landscape';

    area.classList.add('pdf-exporting');
    const pages = Array.from(area.querySelectorAll('.print-doc'));
    let ok = null;
    try {
      let pdf = null;
      for (let i = 0; i < pages.length; i++) {
        btn.innerHTML = `Building PDF&hellip; (${i + 1}/${pages.length})`;
        const pageEl = pages[i];
        const rect = pageEl.getBoundingClientRect();
        // Capture very slightly short of the page's true height: at the
        // exact page-height boundary, sub-pixel rounding between
        // html2canvas's px measurement and jsPDF's mm page size can tip
        // a single row of pixels onto a spurious, near-blank extra page.
        const safeHeight = rect.height - 3;
        const opt = {
          margin: 0,
          html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', height: safeHeight },
          jsPDF: { unit: 'mm', format, orientation }
        };
        if (i === 0) {
          pdf = await html2pdf().set(opt).from(pageEl).toPdf().get('pdf');
        } else {
          const canvas = await html2pdf().set(opt).from(pageEl).toCanvas().get('canvas');
          pdf.addPage(format, orientation);
          const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
          pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, pw, ph);
        }
      }
      pdf.save(filename);
      if (msg) msg.textContent = `Saved — check your Downloads (or wherever your browser saves files) for "${filename}".`;
      ok = filename;
    } catch (err) {
      if (msg) msg.textContent = 'Could not build the PDF: ' + err.message;
    } finally {
      area.classList.remove('pdf-exporting');
      btn.disabled = false; btn.innerHTML = original;
    }
    return ok;
  }
  // Records each lead as sent, with a snapshot of exactly what was
  // printed (address, salutation, which letter, date, PDF file + page),
  // so the Archive can show the actual letter that went out later.
  function archiveBatch(hide, pdfFile){
    const log = getLog();
    const today = todayISO();
    const letterDate = todayOrdinal();
    batch.forEach((l, i) => {
      if (l.ref) log[l.ref] = {
        date: today, name: l.applicant, source: leadFolder(l) === 'business' ? 'business' : 'planning',
        copy: leadFolder(l), recipientLines: l.recipientLines, salutation: l.salutation, letterDate,
        description: l.description || '',
        ...(pdfFile ? (kind === 'letter' ? { pdfFile, pdfPage: i + 1 } : { envelopePdfFile: pdfFile, envelopePdfPage: i + 1 }) : {})
      };
      l.alreadyProcessed = true;
      if (hide) l.include = false;
    });
    saveLog(log);
    saveLeadsToStorage();
  }
  document.getElementById('savePdfBtn').addEventListener('click', () => buildAndSavePdf(document.getElementById('savePdfBtn')));
  document.getElementById('saveArchiveBtn').addEventListener('click', async () => {
    const btn = document.getElementById('saveArchiveBtn');
    const filename = await buildAndSavePdf(btn);
    if (!filename) return;
    archiveBatch(true, filename);
    render();
  });
  document.getElementById('markSentBtn').addEventListener('click', () => {
    archiveBatch(false);
    document.getElementById('markSentBtn').textContent = '✓ Logged';
    document.getElementById('markSentBtn').disabled = true;
  });
}

function docWrapHtml(l, idx, kind){
  const docHtml = kind === 'letter' ? letterHtml(l) : envelopeHtml(l);
  const salutationField = kind === 'letter'
    ? `<label>Salutation</label><input class="edit-salutation" type="text" value="${esc(l.salutation)}">`
    : '';
  return `<div class="doc-wrap" data-idx="${idx}">
    <div class="doc-toolbar no-print">
      <span class="doc-copy-label">${FOLDERS[leadFolder(l)]} letter</span>
      <button class="doc-edit-btn" type="button">&#9998; Edit this one</button>
      <button class="doc-edit-btn doc-remove-btn" type="button">&#10005; Take off print list</button>
    </div>
    ${docHtml}
    <div class="doc-edit-panel no-print" hidden>
      <label>Recipient name &amp; address (one line each)</label>
      <textarea class="edit-recipient" rows="5">${esc(l.recipientLines.join('\n'))}</textarea>
      ${salutationField}
      <div class="doc-edit-actions">
        <button class="edit-save-btn" type="button">Save changes</button>
        <button class="edit-cancel-btn" type="button">Cancel</button>
      </div>
    </div>
  </div>`;
}
function letterHtml(l){
  return `<div class="print-doc letter-page">
    <div class="letter-head">
      <div class="letter-logo"><img src="assets/silverdale-logo.jpg" alt="Silverdale"></div>
      <div class="letter-sender">
        <div class="name">Silverdale Limited</div>
        <div class="addr">23 Circular Road, Douglas, Isle of Man, IM1 1AF<br>01624 614845 &nbsp;|&nbsp; info@silverdale.im &nbsp;|&nbsp; silverdale.im</div>
      </div>
    </div>
    <div class="letter-date">${esc(l.letterDate || todayOrdinal())}</div>
    <div class="letter-addr">${l.recipientLines.map(esc).join('<br>')}</div>
    <div class="letter-body">
      <p>${esc(l.salutation)}</p>
      ${({ approved: letterBody, pending: pendingLetterBody, business: businessLetterBody }[leadFolder(l)])().map(p => `<p>${p}</p>`).join('')}
      <p>Kind regards,</p>
      <div class="letter-sign"><img src="assets/harry-signature.jpeg" alt="Signature"></div>
      <p style="margin-top:0">Andrew Harrison<br>Director, Silverdale Limited</p>
    </div>
  </div>`;
}
function envelopeHtml(l){
  const [name, ...addr] = l.recipientLines;
  const alignClass = getEnvAlign() === 'left' ? ' align-left' : '';
  return `<div class="print-doc env-page${alignClass}">
    <div class="env-logo"><img src="assets/silverdale-logo.jpg" alt="Silverdale"></div>
    <div class="env-recipient">
      <div class="er-block">
        <div class="er-name">${esc(name)}</div>
        ${addr.map(line => `<div class="er-line">${esc(line)}</div>`).join('')}
      </div>
    </div>
  </div>`;
}

document.querySelectorAll('.navbtn').forEach(btn => btn.addEventListener('click', () => { state.tab = btn.dataset.tab; render(); }));
document.getElementById('downloadBackupBtn').addEventListener('click', downloadBackup);
document.getElementById('restoreBackupBtn').addEventListener('click', () => document.getElementById('restoreBackupInput').click());
document.getElementById('restoreBackupInput').addEventListener('change', e => restoreBackupFile(e.target.files[0]));

leads = loadLeadsFromStorage().map(classify);
render();

// Two tabs of this app open at once used to be a silent data-loss trap:
// the stale tab would later save its old in-memory list over the other's
// work. Picking up the other tab's changes as they happen closes that.
window.addEventListener('storage', e => {
  if (e.key === LS_LEADS) leads = loadLeadsFromStorage().map(classify);
  else if (e.key === LS_LOG || e.key === LS_REGISTER_DISMISSED) leads = leads.map(classify);
  else return;
  render();
});
</script>
